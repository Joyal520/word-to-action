const CT={"fear":["I choose courage. God's promise in {r} is true, and I will not be afraid.","நான் தைரியமாயிருப்பேன். {r} இல் தேவனுடைய வாக்குத்தத்தம் உண்மை; நான் பயப்படமாட்டேன்.","Father, I bring my fears to You. Thank You for Your promise in {r}. Fill me with courage and trust. Amen.","பிதாவே, என் பயங்களை உம்மிடம் கொண்டுவருகிறேன். {r} இல் உள்ள உமது வாக்குத்தத்தத்திற்கு நன்றி. தைரியத்தாலும் நம்பிக்கையாலும் என்னை நிரப்பும். ஆமென்."],"peace":["God's peace guards my heart. I receive the promise of {r} and I rest in Him.","தேவனுடைய சமாதானம் என் இருதயத்தைக் காக்கிறது. {r} இல் உள்ள வாக்குத்தத்தத்தைப் பெற்றுக்கொண்டு அவரில் இளைப்பாறுகிறேன்.","Lord, calm my heart today. Thank You for Your word in {r}. Give me Your peace. Amen.","ஆண்டவரே, இன்று என் இருதயத்தை அமைதிப்படுத்தும். {r} இல் உள்ள உமது வார்த்தைக்கு நன்றி. உமது சமாதானத்தைத் தாரும். ஆமென்."],"healing":["I believe God cares for my body, mind and heart. I receive the promise of {r} by faith.","என் சரீரத்தையும் மனதையும் இருதயத்தையும் தேவன் கவனிக்கிறார் என்று நம்புகிறேன். {r} இல் உள்ள வாக்குத்தத்தத்தை விசுவாசத்தால் பெற்றுக்கொள்கிறேன்.","Lord, You are my healer and comforter. I hold on to Your promise in {r}. Bring healing and strength. Amen.","ஆண்டவரே, நீரே என் சுகம் தருபவர், தேற்றுபவர். {r} இல் உள்ள உமது வாக்குத்தத்தத்தைப் பற்றிக்கொள்கிறேன். சுகத்தையும் பெலனையும் தாரும். ஆமென்."],"protection":["God protects me and my family. I rest in the promise of {r}.","தேவன் என்னையும் என் குடும்பத்தையும் காக்கிறார். {r} இல் உள்ள வாக்குத்தத்தத்தில் இளைப்பாறுகிறேன்.","Lord, thank You for keeping me safe. I trust Your promise in {r}. Guard me and my loved ones today. Amen.","ஆண்டவரே, என்னைக் காத்துக்கொள்வதற்கு நன்றி. {r} இல் உள்ள உமது வாக்குத்தத்தத்தை நம்புகிறேன். இன்று என்னையும் என் அன்பானவர்களையும் காத்தருளும். ஆமென்."],"strength":["God gives me strength. I stand on the promise of {r} and I will not give up.","தேவன் எனக்குப் பெலன் தருகிறார். {r} இல் உள்ள வாக்குத்தத்தத்தில் நிலைத்து நிற்கிறேன்; நான் விட்டுவிடமாட்டேன்.","Father, I am weak but You are strong. Thank You for Your promise in {r}. Renew my strength today. Amen.","பிதாவே, நான் பலவீனமாயிருக்கிறேன்; நீர் பெலமுள்ளவர். {r} இல் உள்ள உமது வாக்குத்தத்தத்திற்கு நன்றி. இன்று என் பெலனைப் புதுப்பியும். ஆமென்."],"provision":["God knows my needs and provides. I trust the promise of {r}.","என் தேவைகளை தேவன் அறிவார், அவர் வழங்குவார். {r} இல் உள்ள வாக்குத்தத்தத்தை நம்புகிறேன்.","Lord, thank You for caring for me. I trust Your promise in {r}. Provide what I need and give me a thankful heart. Amen.","ஆண்டவரே, என்னைக் கவனிப்பதற்கு நன்றி. {r} இல் உள்ள உமது வாக்குத்தத்தத்தை நம்புகிறேன். என் தேவைகளைச் சந்தித்து நன்றியுள்ள இருதயத்தைத் தாரும். ஆமென்."],"wisdom":["God gives me wisdom. I receive the promise of {r} and I will walk in understanding.","தேவன் எனக்கு ஞானம் தருகிறார். {r} இல் உள்ள வாக்குத்தத்தத்தைப் பெற்று, புத்தியுடன் நடப்பேன்.","Father, I need Your wisdom. Thank You for Your word in {r}. Guide my thoughts and decisions today. Amen.","பிதாவே, எனக்கு உமது ஞானம் தேவை. {r} இல் உள்ள உமது வார்த்தைக்கு நன்றி. இன்று என் சிந்தனைகளையும் முடிவுகளையும் வழிநடத்தும். ஆமென்."],"faith":["I believe God's Word. I receive the promise of {r} by faith today.","தேவனுடைய வார்த்தையை நம்புகிறேன். {r} இல் தேவன் வாக்குப்பண்ணியதை இன்று விசுவாசத்தால் பெற்றுக்கொள்கிறேன்.","Father, increase my faith. Thank You for Your promise in {r}. Help me trust You fully. Amen.","பிதாவே, என் விசுவாசத்தை அதிகரியும். {r} இல் உள்ள உமது வாக்குத்தத்தத்திற்கு நன்றி. முழுமையாக உம்மை நம்ப உதவும். ஆமென்."],"hope":["I have hope in God. The promise of {r} lifts my heart today.","எனக்கு தேவனில் நம்பிக்கை உண்டு. {r} இல் உள்ள வாக்குத்தத்தம் இன்று என் இருதயத்தை உயர்த்துகிறது.","Lord, You are my hope. Thank You for Your promise in {r}. Fill me with hope and joy. Amen.","ஆண்டவரே, நீரே என் நம்பிக்கை. {r} இல் உள்ள உமது வாக்குத்தத்தத்திற்கு நன்றி. நம்பிக்கையாலும் மகிழ்ச்சியாலும் என்னை நிரப்பும். ஆமென்."],"love":["God loves me. I rest in the promise of {r} and I walk in His love.","தேவன் என்னை நேசிக்கிறார். {r} இல் உள்ள வாக்குத்தத்தத்தில் இளைப்பாறி, அவர் அன்பில் நடக்கிறேன்.","Father, thank You for Your love. I treasure Your promise in {r}. Help me love others as You love me. Amen.","பிதாவே, உமது அன்புக்கு நன்றி. {r} இல் உள்ள உமது வாக்குத்தத்தத்தைப் பொக்கிஷமாகக் கருதுகிறேன். நீர் என்னை நேசிப்பதுபோல பிறரை நேசிக்க உதவும். ஆமென்."],"forgiveness":["God has forgiven me. I receive the promise of {r} and I forgive others.","தேவன் என்னை மன்னித்தார். {r} இல் உள்ள வாக்குத்தத்தத்தைப் பெற்று, நானும் பிறரை மன்னிக்கிறேன்.","Lord, thank You for Your mercy. I trust Your promise in {r}. Cleanse my heart and help me forgive. Amen.","ஆண்டவரே, உமது இரக்கத்திற்கு நன்றி. {r} இல் உள்ள உமது வாக்குத்தத்தத்தை நம்புகிறேன். என் இருதயத்தைச் சுத்திகரித்து, மன்னிக்க உதவும். ஆமென்."],"lonely":["I am never alone. God is near, and I hold on to the promise of {r}.","நான் ஒருபோதும் தனியாக இல்லை. தேவன் அருகில் இருக்கிறார்; {r} இல் உள்ள வாக்குத்தத்தத்தைப் பற்றிக்கொள்கிறேன்.","Father, thank You for being near. I trust Your promise in {r}. Fill my heart with Your presence. Amen.","பிதாவே, அருகில் இருப்பதற்கு நன்றி. {r} இல் உள்ள உமது வாக்குத்தத்தத்தை நம்புகிறேன். உமது பிரசன்னத்தால் என் இருதயத்தை நிரப்பும். ஆமென்."],"family":["God blesses my family. I stand on the promise of {r} for my home.","தேவன் என் குடும்பத்தை ஆசீர்வதிக்கிறார். என் வீட்டிற்காக {r} இல் உள்ள வாக்குத்தத்தத்தில் நிற்கிறேன்.","Lord, bless my family. Thank You for Your promise in {r}. Fill our home with love and peace. Amen.","ஆண்டவரே, என் குடும்பத்தை ஆசீர்வதியும். {r} இல் உள்ள உமது வாக்குத்தத்தத்திற்கு நன்றி. எங்கள் வீட்டை அன்பாலும் சமாதானத்தாலும் நிரப்பும். ஆமென்."],"guidance":["God guides my steps. I trust the promise of {r} and I follow His way.","தேவன் என் அடிகளை நடத்துகிறார். {r} இல் உள்ள வாக்குத்தத்தத்தை நம்பி அவர் வழியில் செல்கிறேன்.","Lord, show me the way. Thank You for Your promise in {r}. Lead me in each decision today. Amen.","ஆண்டவரே, வழியைக் காட்டும். {r} இல் உள்ள உமது வாக்குத்தத்தத்திற்கு நன்றி. இன்று ஒவ்வொரு முடிவிலும் என்னை நடத்தும். ஆமென்."],"future":["My future is in God's hands. I receive the promise of {r} with hope.","என் எதிர்காலம் தேவன் கையில் இருக்கிறது. {r} இல் உள்ள வாக்குத்தத்தத்தை நம்பிக்கையுடன் பெற்றுக்கொள்கிறேன்.","Father, I trust You with my tomorrow. Thank You for Your promise in {r}. Lead me into Your good plans. Amen.","பிதாவே, என் நாளையை உம்மிடம் ஒப்படைக்கிறேன். {r} இல் உள்ள உமது வாக்குத்தத்தத்திற்கு நன்றி. உமது நல்ல திட்டங்களுக்குள் என்னை நடத்தும். ஆமென்."],"hard":["God is with me in hard times. I hold on to the promise of {r} and I will not lose heart.","கடினமான நேரத்திலும் தேவன் என்னுடன் இருக்கிறார். {r} இல் உள்ள வாக்குத்தத்தத்தைப் பற்றிக்கொண்டு சோர்ந்துபோகமாட்டேன்.","Lord, this season is hard, but You are faithful. Thank You for Your promise in {r}. Carry me through. Amen.","ஆண்டவரே, இந்தக் காலம் கடினம்; ஆனால் நீர் உண்மையுள்ளவர். {r} இல் உள்ள உமது வாக்குத்தத்தத்திற்கு நன்றி. என்னைத் தாங்கி நடத்தும். ஆமென்."],"success":["God prospers the work of my hands. I receive the promise of {r} and I will work faithfully.","என் கைகளின் பிரயாசத்தை தேவன் செழிக்கப்பண்ணுகிறார். {r} இல் உள்ள வாக்குத்தத்தத்தைப் பெற்று உண்மையுடன் உழைப்பேன்.","Father, bless my work and my plans. Thank You for Your promise in {r}. Help me to walk with integrity. Amen.","பிதாவே, என் பணியையும் திட்டங்களையும் ஆசீர்வதியும். {r} இல் உள்ள உமது வாக்குத்தத்தத்திற்கு நன்றி. உத்தமமாய் நடக்க உதவும். ஆமென்."]};

const CP={"ISA.41.10.10":["I will not fear because God is with me. I am not alone in the challenges I face. God is my strength and my help. Even when I feel weak, He will uphold me. I will trust Him because He is with me.","தேவன் என்னோடு இருக்கிறார், ஆகையால் நான் பயப்படமாட்டேன். நான் சந்திக்கும் சவால்களில் நான் தனியாக இல்லை. தேவனே என் பெலனும் என் துணையும். நான் பலவீனமாக உணரும்போதும் அவர் என்னைத் தாங்குவார். அவர் என்னோடிருப்பதால் அவரை நம்புவேன்.","Heavenly Father, You have told me not to fear because You are with me. When I feel weak, please strengthen me. When I feel afraid, remind me of Your presence. Help me trust Your Word and depend on You today. Thank You for holding me up. Amen.","பரலோகப் பிதாவே, நீர் என்னோடு இருப்பதால் பயப்படாதே என்று சொன்னீர். நான் பலவீனமாயிருக்கும்போது என்னைப் பெலப்படுத்தும். பயப்படும்போது உமது பிரசன்னத்தை நினைவுபடுத்தும். உமது வார்த்தையை நம்பி இன்று உம்மைச் சார்ந்திருக்க உதவும். என்னைத் தாங்குவதற்கு நன்றி. ஆமென்."],"PHP.4.6.7":["I will not be anxious about anything. I will bring my worries to God and thank Him as I pray. His peace, which I cannot fully understand, will guard my heart and my mind today. I choose to rest in Christ.","நான் எதைக்குறித்தும் கவலைப்படமாட்டேன். என் கவலைகளை நன்றியுடன் ஜெபத்தில் தேவனிடம் சொல்வேன். நான் முழுமையாகப் புரிந்துகொள்ள முடியாத அவருடைய சமாதானம் இன்று என் இருதயத்தையும் சிந்தையையும் காக்கும். நான் கிறிஸ்துவில் இளைப்பாறுவேன்.","Father, I bring You my worries right now. Thank You that I can pray about everything. Please replace my anxious thoughts with Your peace, and guard my heart and mind in Christ Jesus. Help me trust You today. Amen.","பிதாவே, என் கவலைகளை இப்போது உம்மிடம் கொண்டுவருகிறேன். எல்லாவற்றையும் குறித்து ஜெபிக்க முடிவதற்கு நன்றி. என் கலக்கமான சிந்தனைகளை உமது சமாதானத்தால் மாற்றி, கிறிஸ்து இயேசுவில் என் இருதயத்தையும் சிந்தையையும் காத்தருளும். இன்று உம்மை நம்ப உதவும். ஆமென்."],"PHP.4.13.13":["Christ gives me strength, so I will not give up. Whatever I face today, I am not facing it alone. When I feel tired or weak, I will lean on Him. I can keep going because He strengthens me.","கிறிஸ்து எனக்குப் பெலன் தருகிறார்; ஆகையால் நான் விட்டுவிடமாட்டேன். இன்று எதை எதிர்கொண்டாலும் நான் தனியாக இல்லை. நான் சோர்ந்துபோகும்போது அவர்மேல் சாய்ந்துகொள்வேன். அவர் என்னைப் பெலப்படுத்துவதால் தொடர்ந்து செல்ல முடியும்.","Lord Jesus, I am tired and need Your strength. You have promised to strengthen me, so I come to You now. Help me face today's work with courage and patience. Thank You for standing with me. Amen.","ஆண்டவராகிய இயேசுவே, நான் களைத்திருக்கிறேன்; உமது பெலன் எனக்குத் தேவை. என்னைப் பெலப்படுத்துவீர் என்று நம்பி உம்மிடம் வருகிறேன். இன்றைய பணிகளைத் தைரியத்தோடும் பொறுமையோடும் சந்திக்க உதவும். என்னோடு நிற்பதற்கு நன்றி. ஆமென்."],"PSA.91.1.2":["I will live close to God, my place of safety. I rest in the shelter of the Almighty. The Lord is my refuge and my fortress, and I trust Him. I will not carry my fears alone today.","நான் என் அடைக்கலமாகிய தேவனுக்கு அருகில் வாழ்வேன். சர்வவல்லவரின் நிழலில் இளைப்பாறுகிறேன். கர்த்தர் என் புகலிடமும் என் கோட்டையுமாயிருக்கிறார்; நான் அவரை நம்புகிறேன். இன்று என் பயங்களை நான் தனியாகச் சுமக்கமாட்டேன்.","Lord, You are my refuge and my fortress. I choose to stay close to You. When fear or pressure surrounds me, help me run to You and rest in Your care. I trust You, my God. Thank You for being my shelter. Amen.","ஆண்டவரே, நீரே என் புகலிடமும் என் கோட்டையும். உமக்கு அருகில் இருக்கத் தீர்மானிக்கிறேன். பயமும் அழுத்தமும் என்னைச் சூழும்போது உம்மிடம் ஓடி வந்து உமது பாதுகாப்பில் இளைப்பாற உதவும். என் தேவனே, உம்மை நம்புகிறேன். என் அடைக்கலமாயிருப்பதற்கு நன்றி. ஆமென்."],"PHP.4.19.19":["I trust God to provide for my needs. I will not lose hope when I face financial difficulties. I believe God knows what I need, and I will seek Him faithfully. I will remain grateful and trust His care for my life.","என் தேவைகளுக்கு தேவன் வழங்குவார் என்று நம்புகிறேன். பணத்தட்டுப்பாடு வரும்போதும் நம்பிக்கையை இழக்கமாட்டேன். எனக்கு என்ன தேவை என்பதை தேவன் அறிவார் என்று விசுவாசிக்கிறேன்; அவரை உண்மையாய்த் தேடுவேன். நன்றியோடு இருந்து அவருடைய அக்கறையை நம்புவேன்.","Father, You know all my needs. Your Word reminds me that You care for me. Please provide what I need and give me wisdom to manage what I have. Help me remain faithful and grateful, even during difficult times. I trust You. Amen.","பிதாவே, என் தேவைகளை எல்லாம் நீர் அறிவீர். நீர் என்னைக் குறித்து அக்கறை கொள்கிறீர் என்று உமது வார்த்தை நினைவூட்டுகிறது. எனக்குத் தேவையானதைத் தாரும்; என்னிடம் இருப்பதை நிர்வகிக்க ஞானம் தாரும். கடினமான காலத்திலும் உண்மையோடும் நன்றியோடும் இருக்க உதவும். உம்மை நம்புகிறேன். ஆமென்."],"PRO.3.5.6":["I will trust the Lord with all my heart. I will not depend only on my own understanding. In every decision, I will turn to Him first, and I believe He will direct my path.","நான் முழு இருதயத்தோடு கர்த்தரை நம்புவேன். என் சொந்த புத்தியை மட்டும் சார்ந்திருக்கமாட்டேன். ஒவ்வொரு முடிவிலும் முதலில் அவரிடம் திரும்புவேன்; அவர் என் பாதையை நேராக்குவார் என்று விசுவாசிக்கிறேன்.","Lord, I want to trust You with all my heart. When I do not understand, help me not to lean on my own thinking. I place my decisions in Your hands. Please direct my steps today. Thank You for guiding me. Amen.","ஆண்டவரே, முழு இருதயத்தோடு உம்மை நம்ப விரும்புகிறேன். எனக்குப் புரியாதபோது என் சொந்த எண்ணத்தில் சாய்ந்துவிடாமல் இருக்க உதவும். என் முடிவுகளை உம் கரத்தில் ஒப்படைக்கிறேன். இன்று என் அடிகளை நடத்தும். வழிநடத்துவதற்கு நன்றி. ஆமென்."],"JER.29.11.11":["God knows the plans He has for me, plans for peace and not for harm. My future is in His hands. Even when the road is unclear, I will hold on to hope and keep trusting Him.","தேவன் எனக்காக வைத்திருக்கும் நினைவுகளை அறிவார்; அவை தீமைக்கல்ல, சமாதானத்துக்கேதுவானவை. என் எதிர்காலம் அவர் கையில் இருக்கிறது. பாதை தெளிவாக இல்லாதபோதும் நம்பிக்கையைப் பற்றிக்கொண்டு அவரை நம்புவேன்.","Father, You know the plans You have for me, and they are good. When I feel uncertain about tomorrow, help me hope in You. Teach me to wait patiently and trust Your way. Thank You for holding my future. Amen.","பிதாவே, எனக்காக நீர் வைத்திருக்கும் நினைவுகளை நீர் அறிவீர்; அவை நல்லவை. நாளையைக்குறித்து நிச்சயமில்லாதபோது உம்மில் நம்பிக்கை வைக்க உதவும். பொறுமையுடன் காத்திருந்து உமது வழியை நம்ப கற்றுத்தாரும். என் எதிர்காலத்தைக் கையில் வைத்திருப்பதற்கு நன்றி. ஆமென்."],"ROM.8.38.39":["Nothing can separate me from God's love in Christ Jesus. Not my fears, my failures, or my hardest days. I am loved, and I am held. I will live today knowing that His love never lets go.","கிறிஸ்து இயேசுவிலுள்ள தேவனுடைய அன்பிலிருந்து எதுவும் என்னைப் பிரிக்க முடியாது. என் பயங்களோ, தவறுகளோ, கடினமான நாட்களோ அதைத் தடுக்க முடியாது. நான் நேசிக்கப்படுகிறேன்; தாங்கப்படுகிறேன். அவர் அன்பு என்னை ஒருபோதும் கைவிடாது.","Lord, thank You that Your love in Christ will never leave me. When I feel unworthy or afraid, remind me that You hold me. Help me rest in Your love today and share it with others. Amen.","ஆண்டவரே, கிறிஸ்துவிலுள்ள உமது அன்பு என்னை ஒருபோதும் விட்டு விலகாது என்பதற்கு நன்றி. நான் எனக்குத் தகுதியில்லை என்று நினைக்கும்போதும் பயப்படும்போதும் நீர் என்னைத் தாங்குகிறீர் என்பதை நினைவூட்டும். இன்று உமது அன்பில் இளைப்பாறி அதை பிறருக்குக் காட்ட உதவும். ஆமென்."],"COL.3.13.13":["Christ has forgiven me, and I will walk in forgiveness. I will not allow anger or bitterness to control my heart. With God's help, I will forgive those who hurt me, just as Christ forgave me. I choose mercy and peace.","கிறிஸ்து என்னை மன்னித்தார்; நானும் மன்னிப்பில் நடப்பேன். கோபமும் கசப்பும் என் இருதயத்தை ஆளவிடமாட்டேன். தேவனின் உதவியால் கிறிஸ்து என்னை மன்னித்ததுபோல, எனக்குத் துன்பம் செய்தவர்களையும் மன்னிப்பேன். நான் இரக்கத்தையும் சமாதானத்தையும் தெரிந்துகொள்கிறேன்.","Lord, You have taught me to forgive others as Christ has forgiven me. You know the pain I carry. Please help me release my bitterness and forgive those who hurt me. Give me a heart filled with mercy. Thank You for forgiving me. Amen.","ஆண்டவரே, கிறிஸ்து என்னை மன்னித்ததுபோல பிறரை மன்னிக்க எனக்குக் கற்றுத்தந்தீர். நான் சுமக்கும் வேதனையை நீர் அறிவீர். என் கசப்பை விட்டுவிடவும், எனக்குத் தீங்கு செய்தவர்களை மன்னிக்கவும் உதவும். இரக்கம் நிறைந்த இருதயத்தைத் தாரும். என்னை மன்னித்ததற்கு நன்றி. ஆமென்."],"PSA.23.1.1":["The Lord is my Shepherd, and I am not abandoned. He cares for me and guides my life. I will trust Him instead of allowing worry to control me. I believe He knows my needs and will lead me faithfully.","கர்த்தர் என் மேய்ப்பர்; நான் கைவிடப்படவில்லை. அவர் என்னைக் கவனித்து என் வாழ்க்கையை நடத்துகிறார். கவலை என்னை ஆளவிடாமல் அவரை நம்புவேன். என் தேவைகளை அவர் அறிவார், உண்மையாய் என்னை வழிநடத்துவார் என்று விசுவாசிக்கிறேன்.","Lord, You are my Shepherd, and I trust Your care. Please guide my steps and help me follow Your direction. When I worry about my needs, remind me that You are with me. Thank You for leading and caring for me. Amen.","ஆண்டவரே, நீர் என் மேய்ப்பர்; உமது பராமரிப்பை நம்புகிறேன். என் அடிகளை நடத்தி, உமது வழியைப் பின்பற்ற உதவும். என் தேவைகளைக்குறித்து கவலைப்படும்போது நீர் என்னோடிருக்கிறீர் என்பதை நினைவூட்டும். என்னை நடத்தி பராமரிப்பதற்கு நன்றி. ஆமென்."],"JOS.1.9.9":["I will be strong and courageous. I will not be afraid or discouraged, because the Lord my God is with me wherever I go. I will step into this day with confidence in His presence.","நான் பெலப்பட்டுத் தைரியமாயிருப்பேன். நான் எங்கே போனாலும் என் தேவனாகிய கர்த்தர் என்னோடு இருக்கிறார்; ஆகையால் பயப்படமாட்டேன், கலங்கமாட்டேன். அவருடைய பிரசன்னத்தில் நம்பிக்கையோடு இந்த நாளில் அடியெடுத்து வைப்பேன்.","Lord my God, You have told me to be strong and courageous. Where I feel afraid or unsure, remind me that You are with me wherever I go. Give me courage for the steps ahead. Thank You for staying with me. Amen.","என் தேவனாகிய ஆண்டவரே, பெலப்பட்டுத் தைரியமாயிருக்கும்படி சொன்னீர். நான் பயப்படும்போதும் நிச்சயமில்லாதபோதும், நான் எங்கே போனாலும் நீர் என்னோடிருக்கிறீர் என்பதை நினைவூட்டும். முன்னே செல்லத் தைரியம் தாரும். என்னோடிருப்பதற்கு நன்றி. ஆமென்."],"ISA.40.31.31":["I will wait on the Lord, and He will renew my strength. When I am tired, I will not give up. I believe He will lift me up, and I will keep walking forward without losing heart.","நான் கர்த்தருக்குக் காத்திருப்பேன்; அவர் என் பெலனைப் புதுப்பிப்பார். நான் களைத்துப்போகும்போதும் விட்டுவிடமாட்டேன். அவர் என்னை உயர்த்துவார் என்று விசுவாசிக்கிறேன்; சோர்ந்துபோகாமல் தொடர்ந்து முன்னேறுவேன்.","Lord, I am weary and need Your strength. Teach me to wait on You with patience and faith. Renew my strength, lift my spirit, and help me keep walking without losing heart. Thank You for being my strength. Amen.","ஆண்டவரே, நான் களைத்திருக்கிறேன்; உமது பெலன் எனக்குத் தேவை. பொறுமையோடும் விசுவாசத்தோடும் உமக்குக் காத்திருக்கக் கற்றுத்தாரும். என் பெலனைப் புதுப்பித்து, என் ஆவியை உயர்த்தி, சோர்ந்துபோகாமல் நடக்க உதவும். என் பெலனாயிருப்பதற்கு நன்றி. ஆமென்."],"JHN.14.27.27":["Jesus gives me His peace, and it is different from the peace the world offers. I will not let my heart be troubled or afraid. Today I choose to rest in His peace and trust Him.","இயேசு தம்முடைய சமாதானத்தை எனக்குத் தருகிறார்; அது உலகம் தரும் சமாதானத்தைப் போன்றதல்ல. என் இருதயம் கலங்கவோ பயப்படவோ விடமாட்டேன். இன்று அவருடைய சமாதானத்தில் இளைப்பாறி அவரை நம்புவேன்.","Lord Jesus, thank You for leaving Your peace with me. My heart feels troubled, so please calm it. Take away my fear and help me trust You with what I cannot control. I receive Your peace today. Amen.","ஆண்டவராகிய இயேசுவே, உமது சமாதானத்தை எனக்கு அருளியதற்கு நன்றி. என் இருதயம் கலங்குகிறது; அதை அமைதிப்படுத்தும். என் பயத்தை நீக்கி, என்னால் கட்டுப்படுத்த முடியாதவற்றை உம்மிடம் ஒப்படைக்க உதவும். இன்று உமது சமாதானத்தைப் பெற்றுக்கொள்கிறேன். ஆமென்."],"PSA.46.1.1":["God is my refuge and my strength. He is a help that is always near when trouble comes. I will not face today alone, and I will run to Him when my heart is heavy.","தேவன் என் அடைக்கலமும் என் பெலனுமாயிருக்கிறார். துன்பத்தில் உடனிருந்து உதவும் துணை அவரே. இன்றை நாளை நான் தனியாகச் சந்திக்கமாட்டேன்; என் இருதயம் பாரமாயிருக்கும்போது அவரிடம் ஓடுவேன்.","Father, You are my refuge and strength. When trouble comes, help me run to You first. Thank You that You are always near and ready to help me. Hold me steady and give me courage today. Amen.","பிதாவே, நீரே என் அடைக்கலமும் பெலனுமானவர். துன்பம் வரும்போது முதலில் உம்மிடம் ஓடிவர உதவும். எப்போதும் அருகில் இருந்து உதவ ஆயத்தமாயிருப்பதற்கு நன்றி. என்னை நிலைநிறுத்தி இன்று தைரியம் தாரும். ஆமென்."],"1PE.5.7.7":["I will cast all my worries on God because He cares for me. I do not have to carry every burden alone. Today I place my concerns in His hands and trust His loving care.","தேவன் என்னைக் குறித்து கரிசனையாயிருக்கிறார்; ஆகையால் என் கவலைகளையெல்லாம் அவர்மேல் வைப்பேன். ஒவ்வொரு பாரத்தையும் நான் தனியாகச் சுமக்கத் தேவையில்லை. இன்று என் கவலைகளை அவர் கரத்தில் ஒப்படைத்து அவருடைய அன்பான பராமரிப்பை நம்புவேன்.","Father, I give You my worries and burdens today. Thank You that You care for me. Help me stop carrying what is too heavy for me, and trust that You are watching over me. Amen.","பிதாவே, என் கவலைகளையும் பாரங்களையும் இன்று உம்மிடம் ஒப்படைக்கிறேன். என்னைக் குறித்து அக்கறையாயிருப்பதற்கு நன்றி. எனக்கு மிகவும் கனமானதைச் சுமப்பதை நிறுத்தி, நீர் என்னைக் கண்காணிக்கிறீர் என்று நம்ப உதவும். ஆமென்."],"1JN.1.9.9":["I will be honest with God about my sins. He is faithful and just to forgive me and cleanse me from all wrong. I do not have to hide. I walk forward today forgiven and free.","என் பாவங்களைக்குறித்து தேவனிடம் உண்மையாயிருப்பேன். அவர் உண்மையும் நீதியுமுள்ளவர்; என்னை மன்னித்து எல்லா அநியாயத்திலிருந்தும் சுத்திகரிப்பார். நான் மறைக்கத் தேவையில்லை. இன்று மன்னிப்பைப் பெற்று, விடுதலையோடு முன்செல்வேன்.","Lord, I confess my sins to You. Thank You that You are faithful to forgive me and cleanse me. Please wash away my guilt, and help me turn from what is wrong. Make my heart clean today. Amen.","ஆண்டவரே, என் பாவங்களை உம்மிடம் அறிக்கையிடுகிறேன். என்னை மன்னித்துச் சுத்திகரிக்க நீர் உண்மையுள்ளவர் என்பதற்கு நன்றி. என் குற்றவுணர்வை நீக்கி, தவறானதை விட்டுத் திரும்ப உதவும். இன்று என் இருதயத்தைச் சுத்தமாக்கும். ஆமென்."],"JAS.1.5.5":["I need wisdom, and God invites me to ask. He gives generously and does not scold me for asking. I will ask Him with faith, and I will listen for His direction in my decisions today.","எனக்கு ஞானம் தேவை; கேட்கும்படி தேவன் என்னை அழைக்கிறார். அவர் தாராளமாய்க் கொடுக்கிறார்; கேட்பதற்காக என்னைக் கடிந்துகொள்வதில்லை. நான் விசுவாசத்தோடு கேட்பேன்; இன்று என் முடிவுகளில் அவர் வழிநடத்துதலுக்குச் செவிகொடுப்பேன்.","Father, I lack wisdom and I am asking You for it. Thank You that You give generously and do not shame me. Show me the right choice, help me listen carefully, and give me courage to follow. Amen.","பிதாவே, எனக்கு ஞானம் குறைவாயிருக்கிறது; அதை உம்மிடம் கேட்கிறேன். தாராளமாய்க் கொடுக்கிறவர், என்னை வெட்கப்படுத்தாதவர் நீர் என்பதற்கு நன்றி. சரியான தேர்வைக் காட்டி, கவனமாய்க் கேட்கவும் அதைப் பின்பற்றவும் தைரியம் தாரும். ஆமென்."],"ROM.8.28.28":["I love God, and I trust that He is working in all things for my good. I may not understand everything I face, but I will not lose hope. God is at work, and I will trust Him.","நான் தேவனை நேசிக்கிறேன்; எல்லாவற்றிலும் அவர் என் நன்மைக்காகவே கிரியை செய்கிறார் என்று நம்புகிறேன். நான் சந்திக்கும் எல்லாவற்றையும் புரிந்துகொள்ளாவிட்டாலும் நம்பிக்கையை இழக்கமாட்டேன். தேவன் கிரியை செய்கிறார்; நான் அவரை நம்புவேன்.","Lord, I love You, and I trust that You are working in everything for good. When life is confusing or painful, help me not lose hope. Teach me to trust Your purpose even when I cannot see it. Thank You, Father. Amen.","ஆண்டவரே, நான் உம்மை நேசிக்கிறேன்; எல்லாவற்றிலும் நீர் நன்மையையே கிரியை செய்கிறீர் என்று நம்புகிறேன். வாழ்க்கை குழப்பமாகவோ வேதனையாகவோ இருக்கும்போது நம்பிக்கையை இழக்காதிருக்க உதவும். உமது நோக்கம் எனக்குத் தெரியாவிட்டாலும் நம்ப கற்றுத்தாரும். நன்றி, பிதாவே. ஆமென்."],"PSA.34.18.18":["The Lord is close to me when my heart is broken. I am not forgotten in my pain. He sees me, He is near, and He will comfort me and save me when my spirit is crushed.","என் இருதயம் நொறுங்கியிருக்கும்போது கர்த்தர் எனக்கு அருகில் இருக்கிறார். என் வேதனையில் நான் மறக்கப்படவில்லை. அவர் என்னைக் காண்கிறார், அருகில் இருக்கிறார்; என் ஆவி நருங்குண்டபோது என்னைத் தேற்றி இரட்சிப்பார்.","Lord, my heart is heavy and hurting. Thank You that You are close to the brokenhearted. Please come near to me, comfort me, and lift my crushed spirit. Help me feel Your presence and hold on to hope. Amen.","ஆண்டவரே, என் இருதயம் பாரமாகவும் வேதனையாகவும் இருக்கிறது. உடைந்த இருதயமுள்ளவர்களுக்கு அருகில் இருப்பதற்கு நன்றி. என் அருகில் வந்து என்னைத் தேற்றி, நொறுங்கிய என் ஆவியை உயர்த்தும். உமது பிரசன்னத்தை உணரவும் நம்பிக்கையைப் பற்றிக்கொள்ளவும் உதவும். ஆமென்."],"2TI.1.7.7":["God has not given me a spirit of fear. He has given me power, love, and a sound mind. I will not let fear control my thoughts today. I will face life with courage, love, and a clear heart.","தேவன் எனக்குப் பயத்தின் ஆவியைத் தரவில்லை; வல்லமையும் அன்பும் தெளிந்த புத்தியும் தந்திருக்கிறார். இன்று பயம் என் சிந்தனைகளை ஆளவிடமாட்டேன். தைரியத்தோடும் அன்போடும் தெளிந்த இருதயத்தோடும் வாழ்க்கையைச் சந்திப்பேன்.","Father, thank You that Your Spirit in me is not fear, but power, love, and a clear mind. When fear speaks loudly, help me remember who You have made me. Give me courage and self-control today. Amen.","பிதாவே, பயத்தின் ஆவியை அல்ல, வல்லமையும் அன்பும் தெளிந்த புத்தியுமுள்ள ஆவியை எனக்குத் தந்ததற்கு நன்றி. பயம் சத்தமாகப் பேசும்போது நீர் என்னை யாராக்கினீர் என்பதை நினைவூட்டும். இன்று தைரியத்தையும் தன்னடக்கத்தையும் தாரும். ஆமென்."],"DEU.31.6.6":["I will be strong and of good courage. I will not fear or be afraid, because the Lord my God goes with me. He will not fail me, and He will never forsake me. I walk forward with Him.","நான் பெலங்கொண்டு திடமனதாயிருப்பேன். என் தேவனாகிய கர்த்தர் என்னோடு வருகிறபடியால் பயப்படமாட்டேன், திகைக்கமாட்டேன். அவர் என்னைக் கைவிடமாட்டார், விட்டு விலகமாட்டார். நான் அவரோடு முன்செல்வேன்.","Lord my God, You go with me, so help me be strong and courageous. When I am afraid of what is ahead, remind me that You will not fail me or forsake me. Thank You for walking with me. Amen.","என் தேவனாகிய ஆண்டவரே, நீர் என்னோடு வருகிறபடியால் பெலங்கொண்டு திடமனதாயிருக்க உதவும். வரப்போகிறவற்றை நினைத்துப் பயப்படும்போது, நீர் என்னைக் கைவிடமாட்டீர் என்பதை நினைவூட்டும். என்னோடு நடப்பதற்கு நன்றி. ஆமென்."],"PSA.27.1.1":["The Lord is my light and my salvation, so I will not be afraid. He is the strength of my life. When darkness or fear surrounds me, I will look to Him and stand firm.","கர்த்தர் என் வெளிச்சமும் என் இரட்சிப்புமானவர்; ஆகையால் நான் பயப்படமாட்டேன். அவரே என் ஜீவனின் பெலன். இருளோ பயமோ என்னைச் சூழும்போது அவரை நோக்கிப் பார்த்து உறுதியாய் நிற்பேன்.","Lord, You are my light and my salvation. When I feel afraid, shine Your light on my path and steady my heart. Remind me that You are the strength of my life. Thank You for being near. Amen.","ஆண்டவரே, நீரே என் வெளிச்சமும் என் இரட்சிப்பும். நான் பயப்படும்போது உமது வெளிச்சத்தை என் பாதையில் வீசி, என் இருதயத்தை நிலைநிறுத்தும். நீரே என் ஜீவனின் பெலன் என்பதை நினைவூட்டும். அருகில் இருப்பதற்கு நன்றி. ஆமென்."],"PSA.37.4.4":["I will find my joy in the Lord. As I grow closer to Him, I trust Him to shape my heart and care for what matters to me. I will not chase empty things. My delight is in Him.","நான் கர்த்தரில் மகிழ்ச்சியாயிருப்பேன். அவருக்கு நெருங்கி வளரும்போது என் இருதயத்தை வடிவமைத்து எனக்கு முக்கியமானவற்றைக் கவனிப்பார் என்று நம்புகிறேன். வெறுமையானவற்றைத் தேடமாட்டேன். என் மனமகிழ்ச்சி அவரிடத்திலேயே.","Lord, teach me to delight in You more than anything else. Shape my desires so they match Your heart. I trust You with the hopes I carry. Thank You for caring about my heart. Amen.","ஆண்டவரே, மற்ற எல்லாவற்றையும்விட உம்மில் மகிழ்ச்சியாயிருக்கக் கற்றுத்தாரும். என் ஆசைகள் உமது இருதயத்தோடு இணங்கும்படி அவற்றை வடிவமைத்தருளும். நான் சுமக்கும் நம்பிக்கைகளை உம்மிடம் ஒப்படைக்கிறேன். என் இருதயத்தைக் குறித்து அக்கறையாயிருப்பதற்கு நன்றி. ஆமென்."],"PSA.56.3.3":["When I am afraid, I will trust in God. I will not pretend that I am never afraid, but I will bring my fear to Him. Fear does not have the last word. My trust is in Him.","நான் பயப்படும் நாளில் தேவனை நம்புவேன். பயமே இல்லாததுபோல் நடிக்கமாட்டேன்; என் பயத்தை அவரிடம் கொண்டுவருவேன். பயத்துக்கு இறுதி வார்த்தை இல்லை. என் நம்பிக்கை அவரிடத்திலேயே.","Lord, there are times when I feel afraid. Today I choose to trust You. Take my fear and replace it with Your peace. Help me remember that You are bigger than anything I face. Thank You for hearing me. Amen.","ஆண்டவரே, சில நேரங்களில் நான் பயப்படுகிறேன். இன்று உம்மை நம்பத் தீர்மானிக்கிறேன். என் பயத்தை எடுத்துக்கொண்டு உமது சமாதானத்தால் அதை மாற்றும். நான் சந்திக்கும் எதையும்விட நீர் பெரியவர் என்பதை நினைவூட்டும். என் குரலைக் கேட்பதற்கு நன்றி. ஆமென்."],"MAT.6.33.33":["I will seek God's kingdom and His righteousness first. I will put Him before my worries and plans. I trust that He knows what I need, and I will follow Him with a faithful heart.","நான் முதலாவது தேவனுடைய ராஜ்யத்தையும் அவருடைய நீதியையும் தேடுவேன். என் கவலைகளுக்கும் திட்டங்களுக்கும் முன்பாக அவரை வைப்பேன். எனக்குத் தேவையானதை அவர் அறிவார் என்று நம்பி உண்மையான இருதயத்தோடு அவரைப் பின்பற்றுவேன்.","Father, help me put You first today, before my plans and my worries. Teach me to seek Your kingdom and Your way. I trust You to care for what I need. Thank You for being faithful. Amen.","பிதாவே, இன்று என் திட்டங்களுக்கும் கவலைகளுக்கும் முன்பாக உம்மை வைக்க உதவும். உமது ராஜ்யத்தையும் உமது வழியையும் தேடக் கற்றுத்தாரும். எனக்குத் தேவையானதைக் கவனிப்பீர் என்று நம்புகிறேன். உண்மையுள்ளவராயிருப்பதற்கு நன்றி. ஆமென்."],"JHN.16.33.33":["In Christ I have peace, even though I face trouble in this world. I will take heart because Jesus has overcome the world. My hardships are not stronger than Him. I will rest in His victory today.","கிறிஸ்துவில் எனக்குச் சமாதானம் உண்டு; இந்த உலகத்தில் எனக்கு உபத்திரவம் இருந்தாலும் நான் திடன்கொள்வேன். இயேசு உலகத்தை ஜெயித்தார். என் கஷ்டங்கள் அவரைவிட வலிமையானவை அல்ல. இன்று அவருடைய ஜெயத்தில் இளைப்பாறுவேன்.","Lord Jesus, You said I would have trouble in this world, but I can have peace in You. Help me take heart today. Thank You for overcoming the world. Strengthen me to trust You through every difficulty. Amen.","ஆண்டவராகிய இயேசுவே, உலகத்தில் எனக்கு உபத்திரவம் உண்டு என்றும், உம்மில் சமாதானம் உண்டு என்றும் சொன்னீர். இன்று திடன்கொள்ள உதவும். உலகத்தை ஜெயித்ததற்கு நன்றி. ஒவ்வொரு சிரமத்திலும் உம்மை நம்ப என்னைப் பெலப்படுத்தும். ஆமென்."],"ROM.5.8.8":["God loved me even when I was far from Him. Christ died for me while I was still a sinner. I do not have to earn His love. I will live today knowing that I am deeply loved.","நான் தேவனை விட்டுத் தூரத்திலிருந்தபோதும் அவர் என்னை நேசித்தார். நான் பாவியாயிருக்கையில் கிறிஸ்து எனக்காக மரித்தார். அவருடைய அன்பைச் சம்பாதிக்க வேண்டியதில்லை. நான் ஆழமாக நேசிக்கப்படுகிறேன் என்று அறிந்து இன்று வாழ்வேன்.","Father, thank You for loving me before I deserved it. Thank You that Christ died for me while I was still a sinner. Help me never doubt Your love. Teach me to love others with the same grace. Amen.","பிதாவே, நான் தகுதியாவதற்கு முன்பே என்னை நேசித்ததற்கு நன்றி. நான் பாவியாயிருக்கையில் கிறிஸ்து எனக்காக மரித்ததற்கு நன்றி. உமது அன்பை நான் ஒருபோதும் சந்தேகிக்காதிருக்க உதவும். அதே கிருபையோடு பிறரை நேசிக்கக் கற்றுத்தாரும். ஆமென்."],"ROM.8.31.31":["God is on my side, so I will not live in fear of what others may do. Whatever opposition I face, I am not facing it alone. I will stand with confidence because God is for me.","தேவன் என் பட்சத்தில் இருக்கிறார்; ஆகையால் மனிதர் என்ன செய்வார்களோ என்று பயந்து வாழமாட்டேன். எந்த எதிர்ப்பைச் சந்தித்தாலும் நான் தனியாக இல்லை. தேவன் எனக்காக இருப்பதால் நம்பிக்கையோடு நிற்பேன்.","Lord, thank You that You are for me. When people or problems rise against me, help me remember that You stand with me. Give me courage to stay faithful and not be afraid. I trust You. Amen.","ஆண்டவரே, நீர் என் பட்சத்தில் இருப்பதற்கு நன்றி. மனிதர்களோ பிரச்சினைகளோ எனக்கு விரோதமாக எழும்பும்போது நீர் என்னோடு நிற்கிறீர் என்பதை நினைவூட்டும். உண்மையாய் நிலைத்திருக்கவும் பயப்படாதிருக்கவும் தைரியம் தாரும். உம்மை நம்புகிறேன். ஆமென்."],"2CO.12.9.9":["God's grace is enough for me. When I feel weak, His strength shows up in my life. I will not be ashamed of my weakness. I will lean on Christ, and His power will rest on me.","தேவனுடைய கிருபை எனக்குப் போதும். நான் பலவீனமாயிருக்கும்போது அவருடைய பலம் என் வாழ்வில் விளங்குகிறது. என் பலவீனத்தைக்குறித்து வெட்கப்படமாட்டேன். கிறிஸ்துவின்மேல் சாய்ந்துகொள்வேன்; அவருடைய வல்லமை என்மேல் தங்கும்.","Lord, You know where I feel weak today. Thank You that Your grace is enough for me. Let Your strength work through my weakness. Help me depend on You instead of my own strength. Amen.","ஆண்டவரே, இன்று நான் எங்கே பலவீனமாயிருக்கிறேன் என்பதை நீர் அறிவீர். உமது கிருபை எனக்குப் போதும் என்பதற்கு நன்றி. என் பலவீனத்தின் மூலம் உமது பலம் கிரியை செய்யட்டும். என் சொந்த பெலனுக்குப் பதிலாக உம்மைச் சார்ந்திருக்க உதவும். ஆமென்."],"GAL.6.9.9":["I will not grow weary of doing good. Even when it feels unseen or unrewarded, I will keep going. In God's right time, I believe there will be a harvest. I will not give up.","நன்மை செய்வதில் நான் சோர்ந்துபோகமாட்டேன். அது யாருக்கும் தெரியாவிட்டாலும் பலன் தெரியாவிட்டாலும் தொடர்ந்து செய்வேன். தேவனுடைய ஏற்ற காலத்தில் அறுப்பு உண்டு என்று நம்புகிறேன். நான் விட்டுவிடமாட்டேன்.","Father, I get tired of doing good when no one notices. Please renew my strength and keep my heart faithful. Help me trust Your timing for the harvest. Thank You for seeing everything I do for You. Amen.","பிதாவே, யாரும் கவனிக்காதபோது நன்மை செய்வதில் நான் களைத்துப்போகிறேன். என் பெலனைப் புதுப்பித்து, என் இருதயத்தை உண்மையுள்ளதாக்கும். அறுப்பிற்கான உமது காலத்தை நம்ப உதவும். உமக்காக நான் செய்வதையெல்லாம் காண்பதற்கு நன்றி. ஆமென்."],"HEB.11.6.6":["I will come to God with faith. I believe that He is real and that He rewards those who sincerely seek Him. I will keep seeking Him with my whole heart, trusting that He hears me.","நான் விசுவாசத்தோடு தேவனிடம் சேருவேன். அவர் உண்டென்றும், தம்மைத் தேடுகிறவர்களுக்குப் பலன் அளிப்பவர் என்றும் நம்புகிறேன். முழு இருதயத்தோடு அவரைத் தொடர்ந்து தேடுவேன்; அவர் என் குரலைக் கேட்கிறார் என்று நம்புகிறேன்.","Lord, I believe that You are real and that You reward those who seek You. Strengthen my faith when I doubt. Draw me close to You, and help me keep seeking You with all my heart. Amen.","ஆண்டவரே, நீர் உண்டென்றும், உம்மைத் தேடுகிறவர்களுக்குப் பலன் அளிக்கிறவர் என்றும் நம்புகிறேன். நான் சந்தேகப்படும்போது என் விசுவாசத்தைப் பெலப்படுத்தும். என்னை உமக்கு அருகில் இழுத்து, முழு இருதயத்தோடு உம்மைத் தேட உதவும். ஆமென்."],"1PE.5.10.10":["My suffering will not last forever. The God of all grace is with me, and He will restore me, strengthen me, and make me steady. I will hold on to Him through this season.","என் பாடுகள் என்றென்றும் நீடிக்காது. சகல கிருபையும் பொருந்திய தேவன் என்னோடிருக்கிறார்; அவர் என்னைச் சீர்ப்படுத்தி, ஸ்திரப்படுத்தி, பெலப்படுத்துவார். இந்தக் காலத்தில் நான் அவரைப் பற்றிக்கொண்டிருப்பேன்.","God of all grace, I am hurting in this season. Thank You that my suffering is only for a while. Please restore me, strengthen me, and make me steady. Help me hold on to You. Amen.","சகல கிருபையும் பொருந்திய தேவனே, இந்தக் காலத்தில் நான் வேதனைப்படுகிறேன். என் பாடுகள் கொஞ்சக்காலம்தான் என்பதற்கு நன்றி. என்னைச் சீர்ப்படுத்தி, பெலப்படுத்தி, ஸ்திரப்படுத்தும். உம்மைப் பற்றிக்கொள்ள உதவும். ஆமென்."],"ISA.26.3.3":["I will keep my mind on God and trust in Him. He keeps those who trust Him in perfect peace. When my thoughts race, I will turn them back to Him and rest in His peace.","நான் என் மனதைத் தேவன்மேல் வைத்து அவரை நம்புவேன். தம்மை நம்புகிறவர்களை அவர் பூரண சமாதானத்துடன் காக்கிறார். என் எண்ணங்கள் ஓடும்போது அவற்றை அவரிடம் திருப்பி அவருடைய சமாதானத்தில் இளைப்பாறுவேன்.","Lord, my mind is restless. Help me fix my thoughts on You and trust You completely. Thank You that You keep those who trust You in perfect peace. Quiet my heart today. Amen.","ஆண்டவரே, என் மனம் அமைதியற்றிருக்கிறது. என் எண்ணங்களை உம்மேல் நிறுத்தி முழுமையாய் உம்மை நம்ப உதவும். உம்மை நம்புகிறவர்களைப் பூரண சமாதானத்துடன் காப்பதற்கு நன்றி. இன்று என் இருதயத்தை அமைதிப்படுத்தும். ஆமென்."],"JER.33.3.3":["I will call on God, and I believe He will answer me. When I do not know what to do, I will seek Him. I trust Him to show me what I cannot see or understand on my own.","நான் தேவனை நோக்கிக் கூப்பிடுவேன்; அவர் எனக்கு உத்தரவு கொடுப்பார் என்று நம்புகிறேன். என்ன செய்வதென்று தெரியாதபோது அவரைத் தேடுவேன். என்னால் காணவோ புரிந்துகொள்ளவோ முடியாதவற்றை அவர் எனக்குக் காண்பிப்பார் என்று நம்புகிறேன்.","Lord, I am calling out to You. Thank You for inviting me to pray and for promising to answer. Please show me what I cannot see on my own. Give me patience and faith to listen. Amen.","ஆண்டவரே, உம்மை நோக்கிக் கூப்பிடுகிறேன். ஜெபிக்க அழைத்து, உத்தரவு கொடுப்பேன் என்று வாக்குப்பண்ணியதற்கு நன்றி. என்னால் காண முடியாதவற்றை எனக்குக் காண்பியும். செவிகொடுக்கப் பொறுமையும் விசுவாசமும் தாரும். ஆமென்."],"ZEP.3.17.17":["The Lord my God is with me, and He is mighty to save. He delights in me and rejoices over me. I am loved and held by Him. I will rest in His love today.","என் தேவனாகிய கர்த்தர் என் நடுவில் இருக்கிறார்; அவர் இரட்சிக்க வல்லவர். அவர் என்மேல் பிரியமாயிருந்து சந்தோஷமாய் மகிழ்கிறார். நான் அவரால் நேசிக்கப்பட்டுத் தாங்கப்படுகிறேன். இன்று அவருடைய அன்பில் இளைப்பாறுவேன்.","Lord my God, thank You for being with me and mighty to save. It is hard to believe You rejoice over me, but I trust Your Word. Quiet my fears with Your love today. Amen.","என் தேவனாகிய ஆண்டவரே, என்னோடிருந்து இரட்சிக்க வல்லவராயிருப்பதற்கு நன்றி. நீர் என்மேல் மகிழ்கிறீர் என்பதை நம்புவது எனக்குக் கடினம்; ஆனாலும் உமது வார்த்தையை நம்புகிறேன். இன்று உமது அன்பால் என் பயங்களை அமைதிப்படுத்தும். ஆமென்."],"1JN.4.18.18":["God's perfect love is stronger than my fear. I do not have to live afraid. I will rest in His love, and as I trust it more, fear will lose its hold on my heart.","தேவனுடைய பூரண அன்பு என் பயத்தைவிட வலிமையானது. நான் பயத்தில் வாழத் தேவையில்லை. அவருடைய அன்பில் இளைப்பாறுவேன்; அதை அதிகமாக நம்பும்போது பயம் என் இருதயத்தின்மேல் தன் பிடியை இழக்கும்.","Father, thank You that Your love is perfect. Where fear has taken hold of my heart, please fill me with Your love. Teach me to trust that You are for me and hold me close. Amen.","பிதாவே, உமது அன்பு பூரணமானது என்பதற்கு நன்றி. பயம் என் இருதயத்தைப் பிடித்திருக்கும் இடத்தில் உமது அன்பால் என்னை நிரப்பும். நீர் எனக்காக இருக்கிறீர், என்னை அணைத்துக்கொள்கிறீர் என்று நம்பக் கற்றுத்தாரும். ஆமென்."],"PSA.55.22.22":["I will cast my burden on the Lord. He will sustain me and hold me up. I do not have to carry everything by myself. I will place this weight in His hands and trust Him to keep me steady.","என் பாரத்தைக் கர்த்தர்மேல் வைத்துவிடுவேன். அவர் என்னை ஆதரித்துத் தாங்குவார். எல்லாவற்றையும் நான் தனியாகச் சுமக்கத் தேவையில்லை. இந்தப் பாரத்தை அவர் கரத்தில் வைத்து, என்னை உறுதியாய் நிறுத்துவார் என்று நம்புவேன்.","Lord, this burden is heavy, and I am tired. I give it to You now. Thank You that You sustain me. Hold me up, keep me steady, and give me rest in Your care. Amen.","ஆண்டவரே, இந்தப் பாரம் கனமானது; நான் களைத்திருக்கிறேன். இப்போதே அதை உம்மிடம் ஒப்படைக்கிறேன். என்னை ஆதரிப்பதற்கு நன்றி. என்னைத் தாங்கி, உறுதியாய் நிறுத்தி, உமது பராமரிப்பில் இளைப்பாறுதல் தாரும். ஆமென்."],"PSA.30.5.5":["My weeping will not last forever. God's favor lasts a lifetime. Even in the night of my sadness, I believe joy will come with the morning. I will hold on and keep trusting Him.","என் அழுகை என்றென்றும் தொடராது. தேவனுடைய தயவு நீடிய வாழ்வு. என் துக்கத்தின் இரவிலும் விடியற்காலத்தில் களிப்பு வரும் என்று நம்புகிறேன். நான் அவரைப் பற்றிக்கொண்டு தொடர்ந்து நம்புவேன்.","Lord, I have cried through hard nights. Thank You that sorrow does not have the final word. Hold me through this night, and help me believe that joy will come. Be near to me. Amen.","ஆண்டவரே, கடினமான இரவுகளில் அழுதிருக்கிறேன். துக்கத்துக்கு இறுதி வார்த்தை இல்லை என்பதற்கு நன்றி. இந்த இரவில் என்னைத் தாங்கி, களிப்பு வரும் என்று நம்ப உதவும். என் அருகில் இருப்பீராக. ஆமென்."],"JHN.14.1.1":["I will not let my heart be troubled. I believe in God, and I believe in Jesus. When worry rises, I will turn my eyes to Him. I choose to trust Him with what I cannot control.","என் இருதயம் கலங்க நான் விடமாட்டேன். நான் தேவனிடத்தில் விசுவாசமாயிருக்கிறேன்; இயேசுவிடத்திலும் விசுவாசமாயிருக்கிறேன். கவலை எழும்போது என் கண்களை அவர்மேல் திருப்புவேன். என்னால் கட்டுப்படுத்த முடியாதவற்றை அவரிடம் ஒப்படைக்கிறேன்.","Lord Jesus, my heart feels troubled. You tell me not to be afraid, so I trust You. Help me believe in You more deeply. Calm my thoughts and keep me close to You. Amen.","ஆண்டவராகிய இயேசுவே, என் இருதயம் கலங்குகிறது. கலங்காதிருக்கச் சொன்னீர்; உம்மை நம்புகிறேன். இன்னும் ஆழமாக உம்மில் விசுவாசம் வைக்க உதவும். என் எண்ணங்களை அமைதிப்படுத்தி, என்னை உமக்கு அருகில் வைத்திரும். ஆமென்."],"PSA.37.5.5":["I commit my way to the Lord. I place my plans and my worries in His hands, and I trust Him. I believe He will act in His wisdom and in His time, and I will walk with Him.","என் வழியைக் கர்த்தருக்கு ஒப்புவிக்கிறேன். என் திட்டங்களையும் கவலைகளையும் அவர் கரத்தில் வைத்து அவரை நம்புகிறேன். அவர் தமது ஞானத்தின்படியும் தமது காலத்திலும் கிரியை செய்வார் என்று விசுவாசித்து அவரோடு நடப்பேன்.","Lord, I give You my way today, with my plans and my worries. Help me trust You instead of trying to control everything. Please act in Your wisdom and in Your time. Thank You for caring. Amen.","ஆண்டவரே, இன்று என் வழியை, என் திட்டங்களையும் கவலைகளையும் உம்மிடம் ஒப்புவிக்கிறேன். எல்லாவற்றையும் கட்டுப்படுத்த முயலாமல் உம்மை நம்ப உதவும். உமது ஞானத்தின்படியும் உமது காலத்திலும் கிரியை செய்யும். அக்கறையாயிருப்பதற்கு நன்றி. ஆமென்."],"LUK.12.32.32":["I will not be afraid, because my Father is good. He cares for me as His own. He delights in giving His people His kingdom. I will rest in His care and walk without fear today.","என் பிதா நல்லவர்; ஆகையால் நான் பயப்படமாட்டேன். அவர் என்னைத் தம் பிள்ளையாகப் பராமரிக்கிறார். தம் மக்களுக்கு ராஜ்யத்தைக் கொடுக்க அவர் பிரியமாயிருக்கிறார். அவர் பராமரிப்பில் இளைப்பாறி இன்று பயமின்றி நடப்பேன்.","Father, thank You for caring for me like Your own child. You tell me not to be afraid, so I trust You. Quiet my fears and help me rest in Your goodness today. Amen.","பிதாவே, உம் பிள்ளையாக என்னைப் பராமரிப்பதற்கு நன்றி. பயப்படாதே என்று சொன்னீர்; உம்மை நம்புகிறேன். என் பயங்களை அமைதிப்படுத்தி, இன்று உமது நன்மையில் இளைப்பாற உதவும். ஆமென்."],"EPH.3.20.20":["God is able to do more than I can ask or imagine. His power is at work in me. I will not limit Him with my doubts. I will bring my needs and hopes to Him and trust His power.","நான் கேட்பதற்கும் நினைப்பதற்கும் மிகவும் அதிகமாய்ச் செய்ய தேவன் வல்லவர். அவருடைய வல்லமை என்னுள் கிரியை செய்கிறது. என் சந்தேகங்களால் அவரைக் கட்டுப்படுத்தமாட்டேன். என் தேவைகளையும் நம்பிக்கைகளையும் அவரிடம் கொண்டுவந்து அவர் வல்லமையை நம்புவேன்.","Father, You are able to do far more than I ask or imagine. I bring You my needs and my hopes today. Let Your power work in me, and help me trust You when I cannot see the way. Amen.","பிதாவே, நான் கேட்பதற்கும் நினைப்பதற்கும் மிகவும் அதிகமாய்ச் செய்ய நீர் வல்லவர். என் தேவைகளையும் நம்பிக்கைகளையும் இன்று உம்மிடம் கொண்டுவருகிறேன். உமது வல்லமை என்னுள் கிரியை செய்யட்டும்; வழி தெரியாதபோதும் உம்மை நம்ப உதவும். ஆமென்."],"ROM.15.13.13":["The God of hope fills me with joy and peace as I trust in Him. I will not let discouragement shape my heart. By the power of the Holy Spirit, my hope will grow stronger each day.","நம்பிக்கையின் தேவன் நான் அவரை நம்பும்போது சந்தோஷத்தாலும் சமாதானத்தாலும் என்னை நிரப்புகிறார். சோர்வு என் இருதயத்தை ஆளவிடமாட்டேன். பரிசுத்த ஆவியின் பலத்தினாலே என் நம்பிக்கை நாளுக்கு நாள் பெருகும்.","God of hope, fill me with joy and peace as I trust in You. When I feel discouraged, let Your Holy Spirit strengthen my hope. Help me believe more deeply today. Thank You for never leaving me. Amen.","நம்பிக்கையின் தேவனே, நான் உம்மை நம்பும்போது சந்தோஷத்தாலும் சமாதானத்தாலும் என்னை நிரப்பும். நான் சோர்வடையும்போது உமது பரிசுத்த ஆவி என் நம்பிக்கையைப் பெலப்படுத்தட்டும். இன்று இன்னும் ஆழமாக நம்ப உதவும். என்னை விட்டு விலகாததற்கு நன்றி. ஆமென்."],"ISA.41.13.13":["The Lord my God holds my right hand. He tells me not to fear, and He promises to help me. I will walk through today with my hand in His. I do not have to face anything alone.","என் தேவனாகிய கர்த்தர் என் வலதுகையைப் பிடித்திருக்கிறார். பயப்படாதே என்றும், துணைநிற்பேன் என்றும் அவர் சொல்கிறார். இன்றைய நாளை அவர் கரத்தைப் பிடித்தபடி கடப்பேன். நான் எதையும் தனியாகச் சந்திக்கத் தேவையில்லை.","Lord my God, thank You for holding my hand. When fear grips me, remind me that You are right beside me and You will help me. Give me courage to take the next step with You. Amen.","என் தேவனாகிய ஆண்டவரே, என் கையைப் பிடித்திருப்பதற்கு நன்றி. பயம் என்னைப் பிடிக்கும்போது நீர் அருகில் இருந்து உதவுகிறீர் என்பதை நினைவூட்டும். உம்மோடு அடுத்த அடியை எடுத்துவைக்கத் தைரியம் தாரும். ஆமென்."],"EXO.15.26.26":["I will listen carefully to the voice of the Lord my God and walk in His ways. He is the Lord who heals me. I trust Him as my healer in body, mind, and heart, and I turn to Him in every need.","என் தேவனாகிய கர்த்தரின் சத்தத்தைக் கவனமாய்க் கேட்டு அவர் வழிகளில் நடப்பேன். அவரே என்னைக் குணமாக்குகிற கர்த்தர். சரீரத்திலும் மனதிலும் இருதயத்திலும் அவரை என் குணமாக்குபவராக நம்பி, ஒவ்வொரு தேவையிலும் அவரிடம் திரும்புவேன்.","Lord, You say that You are the One who heals me. Help me listen to Your voice and follow Your ways. Please bring healing and strength where I need it most. I trust Your care. Amen.","ஆண்டவரே, நீரே என்னைக் குணமாக்குகிற கர்த்தர் என்று சொன்னீர். உமது சத்தத்தைக் கேட்கவும் உமது வழிகளில் நடக்கவும் உதவும். எனக்கு மிகவும் தேவையான இடத்தில் சுகத்தையும் பெலனையும் தாரும். உமது பராமரிப்பை நம்புகிறேன். ஆமென்."],"PSA.91.3.4":["God covers me with His feathers, and under His wings I find refuge. His truth is my shield. I trust Him to deliver me from the traps and dangers around me. I will rest in His care.","தேவன் தம் சிறகுகளால் என்னை மூடுகிறார்; அவர் செட்டைகளின்கீழ் நான் அடைக்கலம் காண்கிறேன். அவருடைய சத்தியம் என் கேடகம். என்னைச் சூழ்ந்த கண்ணிகளிலிருந்தும் ஆபத்துகளிலிருந்தும் அவர் தப்புவிப்பார் என்று நம்புகிறேன். அவர் பராமரிப்பில் இளைப்பாறுவேன்.","Father, I come under the cover of Your wings. Thank You for being my shield and my refuge. Protect me from the dangers I can see and the ones I cannot. Help me rest in Your faithfulness. Amen.","பிதாவே, உமது சிறகுகளின் மறைவுக்குள் வருகிறேன். என் கேடகமும் அடைக்கலமுமாயிருப்பதற்கு நன்றி. நான் காணும் ஆபத்துகளிலிருந்தும் காணாதவற்றிலிருந்தும் என்னைக் காத்தருளும். உமது உண்மையில் இளைப்பாற உதவும். ஆமென்."],"HEB.11.1.1":["My faith is confidence in what I hope for and assurance about what I cannot see. I will trust God even when I cannot see the outcome. I choose to walk by faith and not by sight today.","என் விசுவாசம் நான் நம்புகிறவற்றின் உறுதியும் காணப்படாதவற்றின் நிச்சயமுமாயிருக்கிறது. முடிவைக் காண முடியாதபோதும் தேவனை நம்புவேன். இன்று காட்சியால் அல்ல, விசுவாசத்தால் நடக்கத் தீர்மானிக்கிறேன்.","Lord, strengthen my faith. Help me trust You for what I hope for and for what I cannot yet see. When doubt rises, remind me that You are faithful. Thank You for holding my future. Amen.","ஆண்டவரே, என் விசுவாசத்தைப் பெலப்படுத்தும். நான் நம்புகிறவற்றையும் இன்னும் காணாதவற்றையும் குறித்து உம்மை நம்ப உதவும். சந்தேகம் எழும்போது நீர் உண்மையுள்ளவர் என்பதை நினைவூட்டும். என் எதிர்காலத்தைக் கையில் வைத்திருப்பதற்கு நன்றி. ஆமென்."],"ROM.5.3.5":["I will not lose heart in my troubles. God can use hard times to grow patience in me, and patience to grow hope. This hope will not disappoint me, because God's love fills my heart through His Spirit.","என் உபத்திரவங்களில் நான் சோர்ந்துபோகமாட்டேன். கஷ்டமான காலங்களில் தேவன் என்னில் பொறுமையையும், பொறுமையால் நம்பிக்கையையும் வளர்க்க முடியும். இந்த நம்பிக்கை என்னை ஏமாற்றாது; ஏனெனில் தேவனுடைய அன்பு பரிசுத்த ஆவியின் மூலம் என் இருதயத்தை நிரப்புகிறது.","Father, I do not enjoy hard times, but I trust You are at work in them. Teach me patience and keep my hope alive. Fill my heart with Your love through Your Holy Spirit. Thank You for not leaving me. Amen.","பிதாவே, கடினமான காலங்கள் எனக்குப் பிடிக்கவில்லை; ஆனாலும் அவற்றில் நீர் கிரியை செய்கிறீர் என்று நம்புகிறேன். எனக்குப் பொறுமையைக் கற்றுத்தந்து, என் நம்பிக்கையை உயிரோடு வையும். உமது பரிசுத்த ஆவியால் உமது அன்பை என் இருதயத்தில் நிரப்பும். என்னை விட்டு விலகாததற்கு நன்றி. ஆமென்."],"JHN.3.16.16":["God loved the world so much that He gave His only Son. I believe in Jesus, and I trust Him with my life. I have eternal life in Him. I am loved far more than I know.","தேவன் உலகத்தின்மேல் அவ்வளவாய் அன்புகூர்ந்து தம்முடைய ஒரேபேறான குமாரனைத் தந்தருளினார். நான் இயேசுவை விசுவாசிக்கிறேன்; என் வாழ்க்கையை அவரிடம் ஒப்படைக்கிறேன். அவரில் எனக்கு நித்திய ஜீவன் உண்டு. நான் அறிந்ததைவிட அதிகமாக நேசிக்கப்படுகிறேன்.","Father, thank You for loving the world so much that You gave Jesus for me. I believe in Him and trust Him with my life. Help me live every day knowing I am loved by You. Amen.","பிதாவே, உலகத்தின்மேல் அவ்வளவாய் அன்புகூர்ந்து இயேசுவை எனக்காகத் தந்ததற்கு நன்றி. நான் அவரை விசுவாசிக்கிறேன்; என் வாழ்க்கையை அவரிடம் ஒப்படைக்கிறேன். நீர் என்னை நேசிக்கிறீர் என்று அறிந்து ஒவ்வொரு நாளும் வாழ உதவும். ஆமென்."],"MAT.18.20.20":["Jesus is with me when I gather with others in His name. I am not alone in my faith. I will pray with others, and I will believe that He is in our midst, listening and caring.","என் நாமத்தினாலே கூடிவருகிறவர்கள் நடுவில் இருப்பேன் என்று இயேசு சொன்னார். நான் என் விசுவாசத்தில் தனியாக இல்லை. பிறரோடு ஜெபிப்பேன்; அவர் எங்கள் நடுவில் இருந்து கேட்டு அக்கறைகொள்கிறார் என்று நம்புவேன்.","Lord Jesus, thank You for promising to be with us when we gather in Your name. Bring me people to pray and walk with. Help me feel Your presence, especially when I feel alone. Amen.","ஆண்டவராகிய இயேசுவே, உமது நாமத்தினாலே கூடும்போது எங்கள் நடுவில் இருப்பேன் என்று வாக்குப்பண்ணியதற்கு நன்றி. என்னோடு ஜெபித்து நடக்க மனிதர்களைத் தாரும். நான் தனிமையாக உணரும்போது உமது பிரசன்னத்தை உணர உதவும். ஆமென்."],"JOS.24.15.15":["Today I choose to serve the Lord. As for me and my house, we will follow Him. I will lead my family with love and faithfulness, and I will keep God at the center of our home.","இன்று நான் கர்த்தரைச் சேவிக்கத் தெரிந்துகொள்கிறேன். நானும் என் வீட்டாரும் கர்த்தரையே சேவிப்போம். அன்போடும் உண்மையோடும் என் குடும்பத்தை நடத்துவேன்; தேவனை எங்கள் வீட்டின் மையமாக வைப்பேன்.","Lord, I choose to serve You today, and I ask You to help me and my household follow You. Fill our home with Your peace and love. Give me strength to stay faithful. Amen.","ஆண்டவரே, இன்று உம்மைச் சேவிக்கத் தெரிந்துகொள்கிறேன்; நானும் என் வீட்டாரும் உம்மைப் பின்பற்ற உதவும். எங்கள் வீட்டை உமது சமாதானத்தாலும் அன்பாலும் நிரப்பும். உண்மையாய் நிலைத்திருக்க பெலன் தாரும். ஆமென்."],"PRO.16.9.9":["I will make my plans, but I know the Lord directs my steps. I will hold my plans loosely and listen to Him. When things do not go as I expected, I will trust that He is still guiding me.","நான் என் திட்டங்களை வகுப்பேன்; ஆனால் என் நடைகளை உறுதிப்படுத்துகிறவர் கர்த்தர் என்று அறிவேன். என் திட்டங்களை இறுக்கமாய்ப் பிடிக்காமல் அவருக்குச் செவிகொடுப்பேன். நான் எதிர்பார்த்தபடி நடக்காதபோதும் அவர் என்னை வழிநடத்துகிறார் என்று நம்புவேன்.","Lord, I make my plans, but I need You to direct my steps. Help me hold my plans loosely and follow Your lead. When I am disappointed, remind me that You are still guiding me. Amen.","ஆண்டவரே, நான் திட்டமிடுகிறேன்; ஆனால் என் அடிகளை நடத்த உம்மை நாடுகிறேன். என் திட்டங்களை இறுக்கமாய்ப் பிடிக்காமல் உமது வழிநடத்துதலைப் பின்பற்ற உதவும். நான் ஏமாற்றமடையும்போது நீர் இன்னும் என்னை நடத்துகிறீர் என்பதை நினைவூட்டும். ஆமென்."],"ISA.43.18.19":["I will not stay stuck in the past. God is doing something new in my life. Even in a dry and difficult place, He can make a way. I will look ahead with hope and watch for what He is doing.","நான் கடந்தகாலத்தில் சிக்கிக்கொள்ளமாட்டேன். தேவன் என் வாழ்க்கையில் புதிய காரியத்தைச் செய்கிறார். வறண்ட கடினமான இடத்திலும் அவர் வழியை உண்டாக்க முடியும். நம்பிக்கையோடு முன்னோக்கிப் பார்த்து அவர் செய்வதைக் கவனிப்பேன்.","Father, help me let go of the past and look forward. You say You are doing a new thing, so open my eyes to see it. Make a way where I see none. Thank You for new beginnings. Amen.","பிதாவே, கடந்தகாலத்தை விட்டுவிட்டு முன்னோக்கிப் பார்க்க உதவும். புதிய காரியத்தைச் செய்கிறேன் என்று சொன்னீர்; அதைக் காண என் கண்களைத் திறந்தருளும். நான் வழியைக் காணாத இடத்தில் வழியை உண்டாக்கும். புதிய தொடக்கங்களுக்கு நன்றி. ஆமென்."],"2CO.4.8.9":["I may be pressed on every side, but I am not crushed. I may be confused, but I will not give up. I may be struck down, but I am not destroyed. God is with me, and I will keep going.","நான் எப்பக்கத்திலும் நெருக்கப்படலாம்; ஆனால் ஒடுங்கிப்போகமாட்டேன். குழப்பமடையலாம்; ஆனால் மனமுறிவடையமாட்டேன். வீழ்த்தப்படலாம்; ஆனால் அழிந்துபோகமாட்டேன். தேவன் என்னோடிருக்கிறார்; நான் தொடர்ந்து செல்வேன்.","Lord, I feel pressed and tired, but You have not left me. Keep me from being crushed or losing hope. Help me stand again when I fall. Thank You for holding me through every struggle. Amen.","ஆண்டவரே, நான் நெருக்கப்பட்டுக் களைத்திருக்கிறேன்; ஆனால் நீர் என்னைக் கைவிடவில்லை. நான் ஒடுங்கிப்போகாமலும் நம்பிக்கையை இழக்காமலும் காத்தருளும். நான் விழும்போது மறுபடியும் நிற்க உதவும். ஒவ்வொரு போராட்டத்திலும் என்னைத் தாங்குவதற்கு நன்றி. ஆமென்."],"JOS.1.8.8":["I will keep God's Word on my lips and in my heart. I will think about it day and night and live by what it says. I trust God to lead me in His way, and I will walk faithfully.","தேவனுடைய வார்த்தையை என் வாயிலும் இருதயத்திலும் வைத்திருப்பேன். இரவும் பகலும் அதைத் தியானித்து அது சொல்லுகிறபடி வாழ்வேன். தேவன் தம் வழியில் என்னை நடத்துவார் என்று நம்புகிறேன்; உண்மையாய் நடப்பேன்.","Lord, help me love Your Word and keep it in my heart each day. Teach me to think about it and live by it. Guide my choices and help me walk faithfully in Your way. Amen.","ஆண்டவரே, உமது வார்த்தையை நேசித்து, அதை என் இருதயத்தில் ஒவ்வொரு நாளும் வைத்திருக்க உதவும். அதைத் தியானித்து அதன்படி வாழக் கற்றுத்தாரும். என் தீர்மானங்களை நடத்தி உமது வழியில் உண்மையாய் நடக்க உதவும். ஆமென்."],"ISA.54.17.17":["I will not live in fear of what is said or planned against me. God is my defender. I trust that no attack will have the final word over my life. I stand on His promise with peace in my heart.","எனக்கு விரோதமாகச் சொல்லப்படுவதையோ திட்டமிடப்படுவதையோ குறித்து நான் பயந்து வாழமாட்டேன். தேவனே என் பாதுகாவலர். எந்தத் தாக்குதலும் என் வாழ்க்கையின்மேல் இறுதி வார்த்தை பெறாது என்று நம்புகிறேன். மனதில் சமாதானத்தோடு அவர் வாக்கில் நிற்பேன்.","Lord, You know who and what is against me. I place it in Your hands. Be my defender and give me peace in my heart. Help me respond with grace and trust You for the outcome. Amen.","ஆண்டவரே, யார் என்ன எனக்கு விரோதமாயிருக்கிறார்கள் என்பதை நீர் அறிவீர். அதை உம் கையில் ஒப்படைக்கிறேன். என் பாதுகாவலராயிருந்து என் இருதயத்தில் சமாதானம் தாரும். கிருபையோடு பதிலளிக்கவும் முடிவை உம்மிடம் விட்டுவிடவும் உதவும். ஆமென்."],"EXO.23.25.25":["I will serve the Lord my God with a faithful heart. I trust Him to bless the daily things I need and to care for my health. I will rely on Him each day for what I need.","என் தேவனாகிய கர்த்தரை உண்மையான இருதயத்தோடு சேவிப்பேன். என் அன்றாடத் தேவைகளை அவர் ஆசீர்வதித்து என் ஆரோக்கியத்தைக் கவனிப்பார் என்று நம்புகிறேன். ஒவ்வொரு நாளும் எனக்குத் தேவையானவற்றிற்கு அவரையே சார்ந்திருப்பேன்.","Lord my God, I want to serve You faithfully. Thank You for blessing my daily bread. Please care for my health and strengthen my body. Help me trust You for what I need each day. Amen.","என் தேவனாகிய ஆண்டவரே, உம்மை உண்மையாய்ச் சேவிக்க விரும்புகிறேன். என் அன்றாட ஆகாரத்தை ஆசீர்வதிப்பதற்கு நன்றி. என் ஆரோக்கியத்தைக் கவனித்து என் சரீரத்தைப் பெலப்படுத்தும். ஒவ்வொரு நாளும் எனக்குத் தேவையானதற்கு உம்மை நம்ப உதவும். ஆமென்."],"PSA.91.7.7":["Even when trouble is all around me, I will trust God to keep me. I will not let fear take over, even when many are falling. I stand in His protection and rest in His care.","என்னைச் சுற்றிலும் துன்பம் இருந்தாலும் தேவன் என்னைக் காப்பார் என்று நம்புவேன். பலர் விழுந்தாலும் பயம் என்னை ஆளவிடமாட்டேன். அவருடைய பாதுகாப்பில் நின்று அவர் பராமரிப்பில் இளைப்பாறுவேன்.","Lord, when danger and trouble surround me, help me keep my eyes on You. Thank You for being my protector. Keep me safe, steady my heart, and help me trust You, whatever happens. Amen.","ஆண்டவரே, ஆபத்தும் துன்பமும் என்னைச் சூழும்போது என் கண்களை உம்மேல் வைத்திருக்க உதவும். என் பாதுகாவலராயிருப்பதற்கு நன்றி. என்னைக் காத்து, என் இருதயத்தை நிலைநிறுத்தி, என்ன நடந்தாலும் உம்மை நம்ப உதவும். ஆமென்."],"ISA.12.2.2":["God is my salvation, so I will trust Him and not be afraid. The Lord is my strength and my song. When I feel weak, I will sing of His goodness and lean on Him.","தேவனே என் இரட்சிப்பு; நான் பயப்படாமல் அவரை நம்புவேன். கர்த்தரே என் பெலனும் என் கீதமுமானவர். நான் பலவீனமாயிருக்கும்போது அவருடைய நன்மையைப் பாடி அவர்மேல் சாய்ந்துகொள்வேன்.","Lord, You are my salvation, my strength, and my song. I choose to trust You instead of being afraid. Fill my heart with a song of thanks today, and be my strength when I am weak. Amen.","ஆண்டவரே, நீரே என் இரட்சிப்பும் என் பெலனும் என் கீதமும். பயப்படாமல் உம்மை நம்பத் தீர்மானிக்கிறேன். இன்று நன்றியின் பாடலால் என் இருதயத்தை நிரப்பி, நான் பலவீனமாயிருக்கும்போது என் பெலனாயிரும். ஆமென்."],"PSA.34.10.10":["I will seek the Lord with all my heart. I believe He will not leave me without the good things I truly need. I will trust Him even when I feel I am lacking, and I will stay close to Him.","நான் முழு இருதயத்தோடு கர்த்தரைத் தேடுவேன். எனக்கு உண்மையாகத் தேவையான நன்மைகளை அவர் குறைவுபடவிடமாட்டார் என்று நம்புகிறேன். எனக்குக் குறைவு போலத் தோன்றும்போதும் அவரை நம்பி அவருக்கு நெருக்கமாயிருப்பேன்.","Lord, I seek You today. When I feel I am lacking, help me trust that You know what is good for me. Provide what I truly need, and keep my heart close to You. Thank You for caring. Amen.","ஆண்டவரே, இன்று உம்மைத் தேடுகிறேன். எனக்குக் குறைவு இருப்பதுபோலத் தோன்றும்போது எனக்கு நன்மையானதை நீர் அறிவீர் என்று நம்ப உதவும். எனக்கு உண்மையாகத் தேவையானதைத் தந்து, என் இருதயத்தை உமக்கு நெருக்கமாய் வைத்திரும். அக்கறையாயிருப்பதற்கு நன்றி. ஆமென்."],"PRO.2.6.6":["The Lord gives wisdom, and knowledge and understanding come from Him. I do not have to figure everything out alone. I will ask Him for wisdom and listen to His Word before I decide.","கர்த்தர் ஞானத்தைத் தருகிறார்; அவர் வாயினின்று அறிவும் புத்தியும் வரும். நான் எல்லாவற்றையும் தனியாகக் கண்டுபிடிக்கத் தேவையில்லை. முடிவெடுக்கும் முன் அவரிடம் ஞானம் கேட்டு அவர் வார்த்தைக்குச் செவிகொடுப்பேன்.","Lord, You are the source of all wisdom. I need understanding for the choices before me. Teach me through Your Word and give me a humble heart that listens. Thank You for guiding me. Amen.","ஆண்டவரே, நீரே எல்லா ஞானத்தின் ஊற்று. என் முன் இருக்கும் தீர்மானங்களுக்கு எனக்குப் புத்தி தேவை. உமது வார்த்தையின் மூலம் எனக்குக் கற்றுத்தந்து, கேட்கும் தாழ்மையான இருதயத்தைத் தாரும். வழிநடத்துவதற்கு நன்றி. ஆமென்."],"ROM.8.24.25":["I have been saved in hope. I do not hope for what I already see, but for what God has promised. I will wait with patience and keep trusting Him, even when the answer is not yet here.","நான் நம்பிக்கையினால் இரட்சிக்கப்பட்டிருக்கிறேன். ஏற்கெனவே காண்பதை அல்ல, தேவன் வாக்குப்பண்ணியதை நம்பிக்கொண்டிருக்கிறேன். பதில் இன்னும் வராதபோதும் பொறுமையோடு காத்திருந்து அவரை நம்புவேன்.","Father, thank You for the hope You have given me. Teach me to wait with patience for what I cannot yet see. Strengthen my heart while I wait, and help me trust Your timing. Amen.","பிதாவே, நீர் எனக்குத் தந்த நம்பிக்கைக்கு நன்றி. நான் இன்னும் காணாததற்குப் பொறுமையோடு காத்திருக்கக் கற்றுத்தாரும். காத்திருக்கும் நாட்களில் என் இருதயத்தைப் பெலப்படுத்தி உமது காலத்தை நம்ப உதவும். ஆமென்."],"JHN.15.9.9":["Jesus loves me with the same love the Father has for Him. I will stay in His love and not wander from it. When I feel unseen, I will remember that I am deeply loved and remain close to Him.","பிதா இயேசுவில் அன்பாயிருக்கிறதுபோல இயேசு என்னில் அன்பாயிருக்கிறார். நான் அவருடைய அன்பிலே நிலைத்திருப்பேன்; அதை விட்டு அலையமாட்டேன். நான் கவனிக்கப்படவில்லை என்று உணரும்போது ஆழமாக நேசிக்கப்படுகிறேன் என்பதை நினைத்து அவருக்கு நெருக்கமாயிருப்பேன்.","Lord Jesus, thank You for loving me as the Father loves You. Help me stay close to You and live in Your love today. When I feel distant, draw me back to You. Amen.","ஆண்டவராகிய இயேசுவே, பிதா உம்மை நேசிப்பதுபோல என்னை நேசிப்பதற்கு நன்றி. இன்று உமக்கு நெருக்கமாயிருந்து உமது அன்பிலே வாழ உதவும். நான் தூரமாக உணரும்போது என்னை உம்மிடம் திரும்ப இழுத்துக்கொள்ளும். ஆமென்."],"PSA.103.12.12":["God has removed my sins from me as far as the east is from the west. I am forgiven. I will not carry guilt that Christ has already taken away. I will walk in freedom and gratitude today.","கிழக்கு மேற்குக்கு எவ்வளவு தூரமோ அவ்வளவு தூரமாய் தேவன் என் பாவங்களை என்னை விட்டு விலக்கினார். நான் மன்னிக்கப்பட்டிருக்கிறேன். கிறிஸ்து எடுத்துப்போட்ட குற்றவுணர்வைச் சுமக்கமாட்டேன். இன்று விடுதலையோடும் நன்றியோடும் நடப்பேன்.","Lord, thank You that You have removed my sins as far as the east is from the west. Help me believe that I am truly forgiven. Free me from guilt and help me live with a thankful heart. Amen.","ஆண்டவரே, மேற்குக்கும் கிழக்குக்கும் உள்ள தூரமாய் என் பாவங்களை விலக்கியதற்கு நன்றி. நான் உண்மையாய் மன்னிக்கப்பட்டிருக்கிறேன் என்று நம்ப உதவும். குற்றவுணர்விலிருந்து என்னை விடுவித்து நன்றியுள்ள இருதயத்தோடு வாழ உதவும். ஆமென்."],"JHN.14.16.18":["I am not left alone. Jesus has given me the Holy Spirit to be with me forever. He is my Comforter and my Helper. When I feel lonely, I will remember that God's Spirit is with me.","நான் தனியாக விடப்படவில்லை. இயேசு பரிசுத்த ஆவியை என்றென்றும் என்னோடு இருக்கும்படி தந்திருக்கிறார். அவரே என் தேற்றரவாளன், என் உதவியாளர். நான் தனிமையாக உணரும்போது தேவனுடைய ஆவி என்னோடு இருக்கிறார் என்பதை நினைப்பேன்.","Lord Jesus, thank You for sending Your Spirit to be with me always. When I feel alone, comfort me. Help me know Your presence, and teach me to trust that You have not left me. Amen.","ஆண்டவராகிய இயேசுவே, உமது ஆவியை எப்போதும் என்னோடு இருக்க அனுப்பியதற்கு நன்றி. நான் தனிமையாக உணரும்போது என்னைத் தேற்றும். உமது பிரசன்னத்தை அறிந்துகொள்ளவும், நீர் என்னை விட்டுவிடவில்லை என்று நம்பவும் உதவும். ஆமென்."],"PSA.127.3.3":["Children are a gift from the Lord. I thank God for the children in my life and I will love them, teach them, and pray for them. I trust Him to help me care for them with patience and love.","பிள்ளைகள் கர்த்தரால் வரும் சுதந்தரம். என் வாழ்க்கையிலுள்ள பிள்ளைகளுக்காக தேவனுக்கு நன்றி சொல்கிறேன்; அவர்களை நேசித்து, கற்றுக்கொடுத்து, அவர்களுக்காக ஜெபிப்பேன். பொறுமையோடும் அன்போடும் அவர்களைக் கவனிக்க தேவன் உதவுவார் என்று நம்புகிறேன்.","Lord, thank You for the gift of children. Help me love and guide them with patience and wisdom. Protect them, and draw their hearts to You. Give me strength to be faithful in caring for them. Amen.","ஆண்டவரே, பிள்ளைகள் என்ற ஈவுக்கு நன்றி. அவர்களைப் பொறுமையோடும் ஞானத்தோடும் நேசித்து நடத்த உதவும். அவர்களைப் பாதுகாத்து அவர்கள் இருதயங்களை உம்மிடம் இழுத்துக்கொள்ளும். அவர்களைக் கவனிப்பதில் உண்மையாயிருக்க பெலன் தாரும். ஆமென்."],"PRO.4.18.18":["The path of those who live rightly grows brighter like the morning sun. I will keep walking in God's ways, even when the road is hard. His light will grow stronger in my life, step by step.","நீதிமான்களுடைய பாதை சூரியப்பிரகாசம்போல அதிகமதிகமாய்ப் பிரகாசிக்கும். பாதை கடினமாயிருந்தாலும் தேவனுடைய வழிகளில் தொடர்ந்து நடப்பேன். அவருடைய வெளிச்சம் என் வாழ்க்கையில் அடிக்கு அடி அதிகரிக்கும்.","Lord, I want to walk in Your ways. When my path feels dim or unclear, shine Your light on my next step. Help me keep going with faith, and thank You for guiding me day by day. Amen.","ஆண்டவரே, உமது வழிகளில் நடக்க விரும்புகிறேன். என் பாதை மங்கலாகவோ தெளிவற்றதாகவோ தோன்றும்போது என் அடுத்த அடிக்கு உமது வெளிச்சத்தைத் தாரும். விசுவாசத்தோடு தொடர்ந்து செல்ல உதவும். நாளுக்கு நாள் வழிநடத்துவதற்கு நன்றி. ஆமென்."],"ISA.46.10.10":["God knows the end from the beginning, and His purpose will stand. I do not have to understand every part of my life. I will trust the One who sees it all, and I will rest in His wisdom.","தேவன் ஆதிமுதல் அந்தத்தை அறிவிக்கிறவர்; அவருடைய ஆலோசனை நிலைநிற்கும். என் வாழ்க்கையின் ஒவ்வொரு பகுதியையும் நான் புரிந்துகொள்ளத் தேவையில்லை. எல்லாவற்றையும் காண்கிறவரை நம்பி அவருடைய ஞானத்தில் இளைப்பாறுவேன்.","Father, You know the end from the beginning, and Your purposes do not fail. When my future feels uncertain, help me trust Your plan. Give me peace to rest in Your wisdom today. Amen.","பிதாவே, ஆதிமுதல் அந்தத்தை அறிந்தவர் நீர்; உமது நோக்கங்கள் தவறுவதில்லை. என் எதிர்காலம் நிச்சயமற்றதாகத் தோன்றும்போது உமது திட்டத்தை நம்ப உதவும். இன்று உமது ஞானத்தில் இளைப்பாற சமாதானம் தாரும். ஆமென்."],"2CO.1.3.4":["God is the Father of mercies and the God of all comfort. He comforts me in my troubles, and I will not carry my pain alone. One day I will be able to comfort others with the comfort I received.","தேவன் இரக்கங்களின் பிதாவும் சகல ஆறுதலின் தேவனுமாயிருக்கிறார். என் துன்பங்களில் அவர் என்னைத் தேற்றுகிறார்; என் வேதனையை நான் தனியாகச் சுமக்கமாட்டேன். நான் பெற்ற ஆறுதலால் ஒரு நாள் பிறரையும் தேற்றுவேன்.","Father of mercies, thank You for being the God of all comfort. I bring You my pain today. Please comfort me, strengthen me, and heal what is hurting. Help me share Your comfort with others one day. Amen.","இரக்கங்களின் பிதாவே, சகல ஆறுதலின் தேவனாயிருப்பதற்கு நன்றி. என் வேதனையை இன்று உம்மிடம் கொண்டுவருகிறேன். என்னைத் தேற்றி, பெலப்படுத்தி, வலிக்கிறதைக் குணமாக்கும். நீர் தந்த ஆறுதலை ஒரு நாள் பிறருக்கும் தர உதவும். ஆமென்."],"PRO.10.4.4":["I will work with diligence and honesty. Lazy hands lead to need, but careful work is wise. I will do my part faithfully and trust God with the results. I will not be idle, and I will not be anxious.","நான் சுறுசுறுப்போடும் உண்மையோடும் உழைப்பேன். சோம்பேறித்தனம் குறைவுக்கு வழிநடத்தும்; கவனமான உழைப்பு ஞானம். என் பங்கை உண்மையாய்ச் செய்து, பலனை தேவனிடம் ஒப்படைப்பேன். சோம்பியிருக்கமாட்டேன், கவலைப்படவுமாட்டேன்.","Lord, help me work with diligence and integrity. Give me energy for today's tasks and wisdom to use my time well. I trust You with the results. Thank You for giving me work to do. Amen.","ஆண்டவரே, சுறுசுறுப்போடும் உத்தமத்தோடும் உழைக்க உதவும். இன்றைய பணிகளுக்கு எனக்குப் பெலனும் என் நேரத்தை நன்றாகப் பயன்படுத்த ஞானமும் தாரும். பலனை உம்மிடம் ஒப்படைக்கிறேன். எனக்குச் செய்ய வேலை தந்ததற்கு நன்றி. ஆமென்."],"ISA.35.4.4":["I will be strong and not afraid, even when my heart is anxious. My God will come and save me. I will lift my head, hold on to hope, and trust that He will help me.","என் மனம் பதறினாலும் நான் திடன்கொண்டு பயப்படாதிருப்பேன். என் தேவன் வந்து என்னை இரட்சிப்பார். நான் என் தலையை உயர்த்தி, நம்பிக்கையைப் பற்றிக்கொண்டு அவர் உதவுவார் என்று நம்புவேன்.","Lord, my heart feels anxious. You tell me to be strong and not to fear, because You will come and save me. Steady my heart today and help me hold on to hope. Amen.","ஆண்டவரே, என் மனம் பதறுகிறது. திடன்கொள்ளவும் பயப்படாதிருக்கவும் சொல்கிறீர்; நீர் வந்து என்னை இரட்சிப்பீர். இன்று என் இருதயத்தை நிலைநிறுத்தி நம்பிக்கையைப் பற்றிக்கொள்ள உதவும். ஆமென்."],"ISA.26.12.12":["The Lord establishes peace for me, and He is at work in all I do. I will not be driven by worry about my work. I will do what is in front of me and rest in His peace.","கர்த்தர் எனக்குச் சமாதானத்தை நிலைநிறுத்துகிறார்; நான் செய்யும் எல்லாவற்றிலும் அவர் கிரியை செய்கிறார். என் பணியைக்குறித்த கவலை என்னை ஓட்டாது. எனக்கு முன் இருப்பதைச் செய்து அவருடைய சமாதானத்தில் இளைப்பாறுவேன்.","Lord, thank You for the peace You give and for working in all that I do. Calm my restless mind. Help me do my work with a quiet heart and trust that You are with me. Amen.","ஆண்டவரே, நீர் தரும் சமாதானத்துக்கும், நான் செய்யும் எல்லாவற்றிலும் கிரியை செய்வதற்கும் நன்றி. என் அமைதியற்ற மனதை அமைதிப்படுத்தும். அமைதியான இருதயத்தோடு என் பணியைச் செய்யவும், நீர் என்னோடிருக்கிறீர் என்று நம்பவும் உதவும். ஆமென்."],"PSA.103.2.3":["I will bless the Lord with all my heart and not forget His goodness to me. He forgives my sins and cares for my wounds. I will remember His kindness and thank Him today.","என் ஆத்துமாவே, கர்த்தரை ஸ்தோத்திரிப்பேன்; அவர் எனக்குச் செய்த நன்மைகளை மறக்கமாட்டேன். அவர் என் பாவங்களை மன்னிக்கிறார், என் காயங்களைக் கவனிக்கிறார். அவருடைய தயவை நினைத்து இன்று நன்றி சொல்வேன்.","Lord, I praise You with all that I am. Help me never forget Your goodness. Thank You for forgiving me and caring for my wounds. Please bring healing and strength where I need it most. Amen.","ஆண்டவரே, என் முழு உள்ளத்தோடு உம்மை ஸ்தோத்திரிக்கிறேன். உமது நன்மைகளை நான் ஒருபோதும் மறவாதிருக்க உதவும். என்னை மன்னித்து என் காயங்களைக் கவனிப்பதற்கு நன்றி. எனக்கு மிகவும் தேவையான இடத்தில் சுகத்தையும் பெலனையும் தாரும். ஆமென்."],"PSA.91.9.11":["I have made the Lord my refuge and my dwelling place. I trust Him to watch over me and to guard me in all my ways. I will not live in fear. I rest in His care.","கர்த்தரை நான் என் அடைக்கலமும் என் தாபரமுமாகக் கொண்டிருக்கிறேன். அவர் என்மேல் கவனமாயிருந்து என் வழிகளிலெல்லாம் என்னைக் காப்பார் என்று நம்புகிறேன். பயத்தில் வாழமாட்டேன். அவர் பராமரிப்பில் இளைப்பாறுவேன்.","Lord, You are my refuge and my dwelling place. I trust You to watch over me and guard my steps. Help me walk without fear today, and keep my heart close to You. Thank You for Your care. Amen.","ஆண்டவரே, நீரே என் அடைக்கலமும் என் தாபரமும். நீர் என்மேல் கவனமாயிருந்து என் அடிகளைக் காப்பீர் என்று நம்புகிறேன். இன்று பயமின்றி நடக்க உதவி, என் இருதயத்தை உமக்கு நெருக்கமாய் வைத்திரும். உமது பராமரிப்புக்கு நன்றி. ஆமென்."],"PSA.18.32.32":["God clothes me with strength and makes my way secure. I do not have to depend on my own power. He prepares me for what is ahead, and He will keep my steps steady as I follow Him.","தேவன் பலத்தால் என்னை இடைகட்டி என் வழியைச் செவ்வைப்படுத்துகிறார். என் சொந்த பலத்தை நான் சார்ந்திருக்கத் தேவையில்லை. வரப்போகிறவற்றுக்கு அவர் என்னை ஆயத்தப்படுத்துகிறார்; நான் அவரைப் பின்பற்றும்போது என் அடிகளை உறுதியாய் வைப்பார்.","Lord, thank You for being the One who gives me strength and makes my way secure. Prepare me for what lies ahead. Keep my steps steady and help me depend on You instead of myself. Amen.","ஆண்டவரே, எனக்குப் பெலன் தந்து என் வழியைச் செவ்வைப்படுத்துகிறவராயிருப்பதற்கு நன்றி. வரப்போகிறவற்றுக்கு என்னை ஆயத்தப்படுத்தும். என் அடிகளை உறுதியாய் வைத்து, என்னைச் சார்ந்திராமல் உம்மைச் சார்ந்திருக்க உதவும். ஆமென்."],"PSA.37.25.25":["I have seen that God does not abandon those who follow Him. I will keep trusting Him, even when money feels tight. I believe He cares for me and my family, and I will remain faithful and generous.","தேவன் தம்மைப் பின்பற்றுகிறவர்களைக் கைவிடுகிறதில்லை. பணம் இறுக்கமாயிருக்கும்போதும் அவரை நம்புவேன். அவர் என்னையும் என் குடும்பத்தையும் கவனிக்கிறார் என்று நம்புகிறேன்; உண்மையுடனும் தாராளத்துடனும் நிலைத்திருப்பேன்.","Father, thank You that You do not abandon those who trust You. When I worry about my needs, help me remember Your faithfulness. Provide for me and my family, and keep us grateful. Amen.","பிதாவே, உம்மை நம்புகிறவர்களைக் கைவிடாததற்கு நன்றி. என் தேவைகளைக்குறித்துக் கவலைப்படும்போது உமது உண்மையை நினைவூட்டும். எனக்கும் என் குடும்பத்துக்கும் தேவையானதைத் தந்து, எங்களை நன்றியுள்ளவர்களாக வைத்திரும். ஆமென்."],"PRO.4.7.7":["Wisdom is the most important thing, so I will pursue it. I will ask God for understanding and learn from His Word. I choose wisdom over quick decisions, and I will let it guide my choices today.","ஞானமே முக்கியம்; அதைத் தேடுவேன். புத்தியைத் தேவனிடம் கேட்டு அவர் வார்த்தையிலிருந்து கற்றுக்கொள்வேன். அவசர முடிவுகளைவிட ஞானத்தைத் தெரிந்துகொள்கிறேன்; இன்று என் தீர்மானங்களை அது நடத்தட்டும்.","Lord, give me a heart that values wisdom above everything else. Teach me through Your Word and help me slow down before I decide. Guide my choices today so they honor You. Amen.","ஆண்டவரே, மற்ற எல்லாவற்றையும்விட ஞானத்தை மதிக்கும் இருதயத்தைத் தாரும். உமது வார்த்தையின் மூலம் எனக்குக் கற்றுத்தாரும்; தீர்மானிக்கும் முன் நிதானிக்க உதவும். இன்று என் தேர்வுகள் உம்மை மகிமைப்படுத்தும்படி வழிநடத்தும். ஆமென்."],"HEB.12.2.2":["I will keep my eyes on Jesus, who began my faith and will complete it. He endured the cross for joy, so I can endure my struggles. I will not give up, because Jesus is with me.","என் விசுவாசத்தைத் தொடங்கி முடிப்பவராகிய இயேசுவை நோக்கிப் பார்ப்பேன். அவர் சந்தோஷத்தின்பொருட்டு சிலுவையைச் சகித்தார்; என் போராட்டங்களையும் நான் சகிக்க முடியும். நான் விட்டுவிடமாட்டேன், ஏனெனில் இயேசு என்னோடிருக்கிறார்.","Lord Jesus, I fix my eyes on You. You began my faith and You will complete it. When I feel like giving up, remind me of what You endured for me. Give me strength to keep going. Amen.","ஆண்டவராகிய இயேசுவே, என் கண்களை உம்மேல் நிறுத்துகிறேன். என் விசுவாசத்தைத் தொடங்கினவர் நீர்; அதை முடிப்பவரும் நீரே. நான் விட்டுவிட நினைக்கும்போது எனக்காக நீர் சகித்ததை நினைவூட்டும். தொடர்ந்து செல்ல பெலன் தாரும். ஆமென்."],"ROM.12.12.12":["I will rejoice in hope, be patient in trouble, and stay faithful in prayer. Even when life is hard, I will keep praying and keep hoping. God hears me, and I will not give up.","நான் நம்பிக்கையிலே சந்தோஷமாயிருப்பேன், உபத்திரவத்திலே பொறுமையாயிருப்பேன், ஜெபத்திலே உறுதியாய்த் தரித்திருப்பேன். வாழ்க்கை கடினமாயிருந்தாலும் தொடர்ந்து ஜெபித்து நம்பிக்கை கொள்வேன். தேவன் என்னைக் கேட்கிறார்; நான் விட்டுவிடமாட்டேன்.","Father, help me rejoice in hope today, even when things are hard. Give me patience in my struggles and a heart that keeps praying. Thank You for always listening to me. Amen.","பிதாவே, காரியங்கள் கடினமாயிருந்தாலும் இன்று நம்பிக்கையில் சந்தோஷமாயிருக்க உதவும். என் போராட்டங்களில் பொறுமையையும், தொடர்ந்து ஜெபிக்கும் இருதயத்தையும் தாரும். எப்போதும் என்னைக் கேட்பதற்கு நன்றி. ஆமென்."],"JHN.15.13.13":["Jesus showed the greatest love by giving His life for His friends. I am loved with that kind of love. I will remember His sacrifice, and I will love the people around me with a willing, giving heart.","தம் சிநேகிதருக்காகத் தம் ஜீவனைக் கொடுப்பதே மிகப்பெரிய அன்பு; இயேசு அந்த அன்பைக் காட்டினார். நான் அத்தகைய அன்பால் நேசிக்கப்படுகிறேன். அவர் தியாகத்தை நினைத்து, என்னைச் சுற்றியுள்ளவர்களை மனப்பூர்வமாய்க் கொடுக்கும் இருதயத்தோடு நேசிப்பேன்.","Lord Jesus, thank You for loving me enough to give Your life for me. Help me never take Your love for granted. Teach me to love others with a giving heart, just as You love me. Amen.","ஆண்டவராகிய இயேசுவே, எனக்காக உம் ஜீவனைக் கொடுக்குமளவுக்கு என்னை நேசித்ததற்கு நன்றி. உமது அன்பை நான் சாதாரணமாக எண்ணாதிருக்க உதவும். நீர் என்னை நேசிப்பதுபோல பிறரைக் கொடுக்கும் இருதயத்தோடு நேசிக்கக் கற்றுத்தாரும். ஆமென்."],"PSA.103.8.10":["The Lord is merciful and gracious, slow to anger, and full of kindness. He does not treat me as my sins deserve. I will rest in His mercy and show mercy to others.","கர்த்தர் உருக்கமும் இரக்கமும் நீடிய சாந்தமும் மிகுந்த கிருபையுமுள்ளவர். என் பாவங்களுக்குத் தக்கதாக அவர் எனக்குச் செய்யவில்லை. அவருடைய இரக்கத்தில் இளைப்பாறி, நானும் பிறருக்கு இரக்கம் காட்டுவேன்.","Lord, thank You that You are merciful, slow to anger, and full of love. You have not treated me as my sins deserve. Help me live in Your mercy and show that same mercy to others. Amen.","ஆண்டவரே, நீர் இரக்கமும் நீடிய சாந்தமும் அன்பும் நிறைந்தவர் என்பதற்கு நன்றி. என் பாவங்களுக்குத் தக்கதாக நீர் எனக்குச் செய்யவில்லை. உமது இரக்கத்தில் வாழவும் அதே இரக்கத்தைப் பிறருக்குக் காட்டவும் உதவும். ஆமென்."],"JHN.16.32.32":["Even when others leave me, I am not alone, because the Father is with me. When I feel abandoned, I will remember that God stays beside me. I will trust His presence more than my feelings today.","மற்றவர்கள் என்னை விட்டுப் போனாலும் நான் தனியாக இல்லை, ஏனெனில் பிதா என்னோடிருக்கிறார். கைவிடப்பட்டதாக உணரும்போது தேவன் என் அருகில் இருக்கிறார் என்பதை நினைப்பேன். இன்று என் உணர்வுகளைவிட அவருடைய பிரசன்னத்தை நம்புவேன்.","Father, thank You that I am never truly alone because You are with me. When people let me down or leave, comfort me. Help me trust Your presence more than my feelings. Amen.","பிதாவே, நீர் என்னோடிருப்பதால் நான் உண்மையில் தனியாக இல்லை என்பதற்கு நன்றி. மனிதர்கள் என்னைக் கைவிடும்போது என்னைத் தேற்றும். என் உணர்வுகளைவிட உமது பிரசன்னத்தை நம்ப உதவும். ஆமென்."],"PSA.127.1.1":["Unless the Lord builds my home, my work is empty. I invite God into my family, my plans, and my daily work. I will not depend only on my own effort. I trust Him to build and guard what matters.","கர்த்தர் வீட்டைக் கட்டாவிட்டால் கட்டுகிறவர்களின் பிரயாசம் வீண். என் குடும்பத்திலும் திட்டங்களிலும் அன்றாடப் பணியிலும் தேவனை அழைக்கிறேன். என் சொந்த முயற்சியை மட்டும் சார்ந்திருக்கமாட்டேன். முக்கியமானவற்றைக் கட்டிக் காக்க அவரை நம்புகிறேன்.","Lord, I invite You into my home and my work. Build what matters and protect it. Help me not depend only on my own effort. Teach my family to put You first in everything. Amen.","ஆண்டவரே, என் வீட்டிற்கும் என் பணிக்கும் உம்மை அழைக்கிறேன். முக்கியமானவற்றைக் கட்டி அவற்றைக் காத்தருளும். என் சொந்த முயற்சியை மட்டும் சார்ந்திராதிருக்க உதவும். எல்லாவற்றிலும் உம்மை முதலாக வைக்க என் குடும்பத்துக்குக் கற்றுத்தாரும். ஆமென்."],"PSA.25.4.5":["I ask the Lord to show me His ways and teach me His paths. I will follow His truth and wait on Him all day. I do not have to guess my way. I trust Him to lead me.","கர்த்தர் தமது வழிகளை எனக்குத் தெரிவித்து தமது பாதைகளை எனக்குப் போதிக்கும்படி கேட்கிறேன். அவருடைய சத்தியத்தில் நடந்து நாள் முழுவதும் அவருக்குக் காத்திருப்பேன். நான் என் வழியை ஊகிக்கத் தேவையில்லை. அவர் என்னை நடத்துவார் என்று நம்புகிறேன்.","Lord, show me Your ways and teach me Your paths. Lead me in Your truth and help me wait on You patiently. When I am unsure which way to go, give me clear direction. I trust You. Amen.","ஆண்டவரே, உமது வழிகளை எனக்குத் தெரிவித்து உமது பாதைகளை எனக்குப் போதியும். உமது சத்தியத்தில் என்னை நடத்தி, பொறுமையோடு உமக்குக் காத்திருக்க உதவும். எந்த வழி செல்வதென்று தெரியாதபோது தெளிவான வழிகாட்டுதல் தாரும். உம்மை நம்புகிறேன். ஆமென்."],"ISA.60.1.1":["I will rise and shine, because God's light has come to me. I will not hide in darkness or discouragement. His glory is upon my life, and I will walk in that light with hope and courage.","நான் எழும்பிப் பிரகாசிப்பேன், ஏனெனில் தேவனுடைய ஒளி எனக்கு வந்திருக்கிறது. இருளிலோ சோர்விலோ ஒளிந்துகொள்ளமாட்டேன். அவருடைய மகிமை என் வாழ்வின்மேல் உதித்திருக்கிறது; அந்த ஒளியில் நம்பிக்கையோடும் தைரியத்தோடும் நடப்பேன்.","Lord, thank You for Your light that shines on me. Lift me up when I feel low. Help me rise with hope and walk in Your light today, so others may see Your goodness in me. Amen.","ஆண்டவரே, என்மேல் பிரகாசிக்கும் உமது ஒளிக்கு நன்றி. நான் சோர்ந்திருக்கும்போது என்னை உயர்த்தும். இன்று நம்பிக்கையோடு எழும்பி உமது ஒளியில் நடக்க உதவும்; அதனால் பிறர் என்னில் உமது நன்மையைக் காணட்டும். ஆமென்."],"JAS.1.2.4":["I will face my trials with a steady heart. God can use testing to build patience in me. I will let patience finish its work, so that I grow strong and complete in Him.","நான் என் சோதனைகளை உறுதியான இருதயத்தோடு சந்திப்பேன். தேவன் சோதனையைப் பயன்படுத்தி என்னில் பொறுமையை வளர்க்க முடியும். பொறுமை தன் கிரியையை முடிக்கட்டும்; அப்பொழுது நான் அவரில் பெலனும் நிறைவும் அடைந்து வளர்வேன்.","Father, I do not enjoy trials, but I trust You are at work in them. Give me patience when I want to quit. Help me grow stronger and more complete in You through this season. Amen.","பிதாவே, சோதனைகள் எனக்குப் பிடிக்கவில்லை; ஆனாலும் அவற்றில் நீர் கிரியை செய்கிறீர் என்று நம்புகிறேன். நான் விட்டுவிட நினைக்கும்போது பொறுமை தாரும். இந்தக் காலத்தின் மூலம் உம்மில் அதிக பெலனும் நிறைவுமாய் வளர உதவும். ஆமென்."],"PRO.21.5.5":["I will plan carefully and work diligently instead of rushing in worry. Careful thought and steady effort are wise. I will ask God for wisdom, do my part faithfully, and trust Him with the outcome.","நான் அவசரமும் பதற்றமுமின்றி கவனமாய்த் திட்டமிட்டு ஜாக்கிரதையாய் உழைப்பேன். கவனமான சிந்தனையும் நிலையான முயற்சியும் ஞானம். தேவனிடம் ஞானம் கேட்டு என் பங்கை உண்மையாய்ச் செய்து, முடிவை அவரிடம் ஒப்படைப்பேன்.","Lord, give me wisdom to plan well and patience to work steadily. Keep me from rushing and worrying. Help me do my part faithfully today, and I trust You with the results. Amen.","ஆண்டவரே, நன்றாகத் திட்டமிட ஞானமும் நிலையாய் உழைக்கப் பொறுமையும் தாரும். அவசரத்திலிருந்தும் கவலையிலிருந்தும் என்னைக் காத்தருளும். இன்று என் பங்கை உண்மையாய்ச் செய்ய உதவும்; முடிவை உம்மிடம் ஒப்படைக்கிறேன். ஆமென்."],"ISA.32.17.17":["Living rightly brings peace to my heart. I will choose what is right, even when it is hard. I believe that doing what is right leads to quietness and trust, and I will walk in that peace today.","நீதியாய் வாழ்வது என் இருதயத்துக்குச் சமாதானத்தைத் தரும். கடினமாயிருந்தாலும் சரியானதையே தெரிந்துகொள்வேன். சரியானதைச் செய்வது அமரிக்கையையும் நம்பிக்கையையும் த
