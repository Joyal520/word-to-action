ரும் என்று விசுவாசிக்கிறேன்; இன்று அந்தச் சமாதானத்தில் நடப்பேன்.","Lord, help me choose what is right today, even when it is difficult. Thank You for the peace that comes from living in Your ways. Keep my heart quiet and confident in You. Amen.","ஆண்டவரே, கடினமாயிருந்தாலும் இன்று சரியானதைத் தெரிந்துகொள்ள உதவும். உமது வழிகளில் வாழ்வதால் வரும் சமாதானத்துக்கு நன்றி. என் இருதயத்தை அமைதியாகவும் உம்மில் நம்பிக்கையுள்ளதாகவும் வைத்திரும். ஆமென்."],"PSA.107.20.20":["God sends out His word and brings healing. I will turn to His Word for comfort and hope. I trust Him to rescue me and to care for me, in body, mind, and heart.","தேவன் தமது வசனத்தை அனுப்பி குணமாக்குகிறார். ஆறுதலுக்கும் நம்பிக்கைக்கும் அவருடைய வார்த்தையை நாடுவேன். சரீரத்திலும் மனதிலும் இருதயத்திலும் அவர் என்னை விடுவித்துக் கவனிப்பார் என்று நம்புகிறேன்.","Lord, You sent Your word and healed Your people. I come to You with my needs today. Speak Your word over me, bring healing and comfort, and keep me close to You. Thank You for caring for me. Amen.","ஆண்டவரே, நீர் உமது வசனத்தை அனுப்பி உம் மக்களைக் குணமாக்கினீர். என் தேவைகளுடன் இன்று உம்மிடம் வருகிறேன். உமது வார்த்தையை என்மேல் பேசி, சுகத்தையும் ஆறுதலையும் தந்து, என்னை உமக்கு நெருக்கமாய் வைத்திரும். என்னைக் கவனிப்பதற்கு நன்றி. ஆமென்."],"PSA.91.14.16":["Because I love the Lord and call on Him, I trust Him to answer and to be with me in trouble. He will rescue me and satisfy me with life. I will hold on to Him and know His salvation.","நான் கர்த்தரில் வாஞ்சையாயிருந்து அவரைக் கூப்பிடுவதால் அவர் எனக்கு உத்தரவு கொடுத்து துன்பத்தில் என்னோடிருப்பார் என்று நம்புகிறேன். அவர் என்னை விடுவித்து நீடிய வாழ்வால் திருப்தியாக்குவார். நான் அவரைப் பற்றிக்கொண்டு அவருடைய இரட்சிப்பை அறிவேன்.","Lord, I love You and I call on You today. Thank You for promising to answer and to be with me in trouble. Rescue me, satisfy my heart, and help me know Your salvation more deeply. Amen.","ஆண்டவரே, நான் உம்மில் அன்புகூர்ந்து இன்று உம்மைக் கூப்பிடுகிறேன். எனக்கு உத்தரவு கொடுப்பதாகவும் துன்பத்தில் என்னோடிருப்பதாகவும் வாக்குப்பண்ணியதற்கு நன்றி. என்னை விடுவித்து என் இருதயத்தைத் திருப்தியாக்கி, உமது இரட்சிப்பை ஆழமாய் அறிய உதவும். ஆமென்."],"PSA.73.26.26":["My body and my heart may grow weak, but God is the strength of my heart. He is my portion forever. When I have nothing left in myself, I will lean on Him and He will carry me.","என் சரீரமும் என் இருதயமும் மாண்டுபோகலாம்; ஆனாலும் தேவன் என் இருதயத்தின் கன்மலையும் என்றென்றைக்கும் என் பங்குமாயிருக்கிறார். என்னில் எதுவும் மீதியில்லாதபோதும் அவர்மேல் சாய்ந்துகொள்வேன்; அவர் என்னைச் சுமப்பார்.","Lord, my strength is gone and my heart feels weak. Thank You that You are the strength of my heart and my portion forever. Hold me up today and be my rock when I cannot stand. Amen.","ஆண்டவரே, என் பெலன் போய்விட்டது; என் இருதயம் பலவீனமாயிருக்கிறது. நீரே என் இருதயத்தின் கன்மலையும் என்றென்றைக்கும் என் பங்குமானவர் என்பதற்கு நன்றி. இன்று என்னைத் தாங்கி, என்னால் நிற்க முடியாதபோது என் கன்மலையாயிரும். ஆமென்."],"PRO.9.10.10":["Respect for the Lord is where wisdom begins. I will honor God in my thoughts, words, and choices. I want to know Him more, because knowing Him gives me understanding for every part of my life.","கர்த்தருக்குப் பயப்படுதலே ஞானத்தின் ஆரம்பம். என் எண்ணங்களிலும் வார்த்தைகளிலும் தீர்மானங்களிலும் தேவனை மதிப்பேன். அவரை அதிகமாய் அறிய விரும்புகிறேன்; ஏனெனில் அவரை அறிவது என் வாழ்வின் ஒவ்வொரு பகுதிக்கும் புத்தியைத் தருகிறது.","Lord, I want to honor You with my whole life. Teach me to respect You and walk humbly with You. Give me wisdom for my decisions, and help me know You more each day. Amen.","ஆண்டவரே, என் முழு வாழ்வினாலும் உம்மை மகிமைப்படுத்த விரும்புகிறேன். உம்மைக் கனப்படுத்தி தாழ்மையோடு உம்மோடு நடக்கக் கற்றுத்தாரும். என் தீர்மானங்களுக்கு ஞானம் தந்து, நாளுக்கு நாள் உம்மை அதிகமாய் அறிய உதவும். ஆமென்."],"HEB.10.23.23":["I will hold on to my hope without wavering, because God is faithful to His promises. When doubt tries to shake me, I will stand firm. I trust the One who promised, and I will not let go.","என் நம்பிக்கையை அசைவில்லாமல் உறுதியாய்ப் பற்றிக்கொள்வேன்; ஏனெனில் வாக்குத்தத்தம்பண்ணினவர் உண்மையுள்ளவர். சந்தேகம் என்னை அசைக்க முயலும்போது உறுதியாய் நிற்பேன். வாக்குப்பண்ணினவரை நம்புகிறேன்; நான் விட்டுவிடமாட்டேன்.","Faithful God, thank You for keeping Your promises. When doubt tries to shake me, help me stand firm. Strengthen my hope and remind me that You can be trusted in every situation. Amen.","உண்மையுள்ள தேவனே, உமது வாக்குத்தத்தங்களைக் காப்பதற்கு நன்றி. சந்தேகம் என்னை அசைக்க முயலும்போது உறுதியாய் நிற்க உதவும். என் நம்பிக்கையைப் பெலப்படுத்தி, ஒவ்வொரு சூழ்நிலையிலும் நீர் நம்பத்தக்கவர் என்பதை நினைவூட்டும். ஆமென்."],"ROM.8.18.18":["The sufferings of this present time are not worth comparing with the glory God will reveal. I will not let my pain define my future. I will keep hoping, because something better is coming from God.","இக்காலத்துப் பாடுகள் தேவன் வெளிப்படுத்தப்போகும் மகிமைக்கு ஒப்பிடத்தக்கவை அல்ல. என் வேதனை என் எதிர்காலத்தை நிர்ணயிக்க விடமாட்டேன். தேவனிடமிருந்து சிறந்தது வருகிறது என்பதால் நம்பிக்கையோடு இருப்பேன்.","Father, my present struggles feel heavy, but I trust Your glory is greater. Help me look beyond today's pain. Give me strength to endure, and keep my heart hopeful in You. Amen.","பிதாவே, என் இன்றைய போராட்டங்கள் கனமாகத் தோன்றுகின்றன; ஆனால் உமது மகிமை பெரியது என்று நம்புகிறேன். இன்றைய வேதனையைத் தாண்டிப் பார்க்க உதவும். சகிக்கப் பெலன் தந்து, என் இருதயத்தை உம்மில் நம்பிக்கையுள்ளதாக வைத்திரும். ஆமென்."],"JHN.13.34.34":["Jesus has loved me, and He calls me to love others the same way. I will show kindness, patience, and care to the people around me. I will love not only with words, but with my actions.","இயேசு என்னை நேசித்தார்; அதே விதமாய் பிறரை நேசிக்க என்னை அழைக்கிறார். என்னைச் சுற்றியுள்ளவர்களுக்கு தயவையும் பொறுமையையும் அக்கறையையும் காட்டுவேன். வார்த்தைகளால் மட்டுமல்ல, என் செயல்களாலும் நேசிப்பேன்.","Lord Jesus, thank You for loving me first. Teach me to love others the way You love me. Give me patience with difficult people and a kind heart in my actions today. Amen.","ஆண்டவராகிய இயேசுவே, முதலில் என்னை நேசித்ததற்கு நன்றி. நீர் என்னை நேசிப்பதுபோல பிறரை நேசிக்கக் கற்றுத்தாரும். கடினமானவர்களிடம் பொறுமையையும் இன்று என் செயல்களில் தயவுள்ள இருதயத்தையும் தாரும். ஆமென்."],"PSA.32.1.2":["I am blessed because God has forgiven me and covered my sin. He does not hold my wrongs against me. I will live honestly before Him, and I will walk with a light and grateful heart.","என் மீறுதல் மன்னிக்கப்பட்டு என் பாவம் மூடப்பட்டதால் நான் ஆசீர்வதிக்கப்பட்டிருக்கிறேன். என் தவறுகளை தேவன் என்மேல் சுமத்துகிறதில்லை. அவர் முன்பாக உண்மையாய் வாழ்வேன்; இலேசான, நன்றியுள்ள இருதயத்தோடு நடப்பேன்.","Lord, thank You that You forgive and cover my sin. I do not want to hide anything from You. Keep my heart honest and free from guilt, and help me walk gratefully in Your mercy. Amen.","ஆண்டவரே, என் பாவத்தை மன்னித்து மூடியதற்கு நன்றி. உம்மிடம் எதையும் மறைக்க விரும்பவில்லை. என் இருதயத்தை உண்மையுள்ளதாகவும் குற்றவுணர்வற்றதாகவும் வைத்து, உமது இரக்கத்தில் நன்றியோடு நடக்க உதவும். ஆமென்."],"JHN.15.15.15":["Jesus calls me His friend. I am not just a servant, because He shares His heart with me. I will spend time with Him, listen to Him, and live as someone who is close to Him and deeply known.","இயேசு என்னைத் தம் சிநேகிதர் என்று அழைக்கிறார். நான் வெறும் ஊழியக்காரர் அல்ல; அவர் தம் இருதயத்தை என்னோடு பகிர்ந்துகொள்கிறார். அவரோடு நேரம் செலவிட்டு, அவருக்குச் செவிகொடுத்து, அவருக்கு நெருக்கமானவராகவும் ஆழமாய் அறியப்பட்டவராகவும் வாழ்வேன்.","Lord Jesus, thank You for calling me Your friend. Help me draw near to You and listen to You. When I feel lonely or unseen, remind me that You know me and love me. Amen.","ஆண்டவராகிய இயேசுவே, என்னை உம் சிநேகிதர் என்று அழைத்ததற்கு நன்றி. உமக்கு அருகில் வந்து உமக்குச் செவிகொடுக்க உதவும். நான் தனிமையாகவோ கவனிக்கப்படாதவராகவோ உணரும்போது நீர் என்னை அறிந்து நேசிக்கிறீர் என்பதை நினைவூட்டும். ஆமென்."],"PSA.128.1.4":["I will honor the Lord and walk in His ways. I believe there is a deep blessing in living that way. I will work faithfully, enjoy the fruit of my labor with gratitude, and keep God at the center of my home.","கர்த்தருக்குப் பயந்து அவர் வழிகளில் நடப்பேன். அப்படி வாழ்வதில் ஆழமான ஆசீர்வாதம் உண்டு என்று நம்புகிறேன். உண்மையாய் உழைத்து, என் பிரயாசத்தின் பலனை நன்றியோடு அனுபவித்து, தேவனை என் வீட்டின் மையமாக வைப்பேன்.","Lord, I want to honor You and walk in Your ways. Bless my home and my work. Help me live faithfully and gratefully each day, and keep my family close to You. Amen.","ஆண்டவரே, உம்மைக் கனப்படுத்தி உமது வழிகளில் நடக்க விரும்புகிறேன். என் வீட்டையும் என் பணியையும் ஆசீர்வதியும். ஒவ்வொரு நாளும் உண்மையோடும் நன்றியோடும் வாழ உதவி, என் குடும்பத்தை உமக்கு நெருக்கமாய் வைத்திரும். ஆமென்."],"PSA.25.9.9":["God guides the humble in what is right and teaches them His way. I will keep a humble heart and ask Him to lead me. I do not need to rely on pride or on my own knowledge to find the way.","தேவன் தாழ்மையுள்ளவர்களை நியாயத்தில் நடத்தித் தமது வழியைப் போதிக்கிறார். தாழ்மையான இருதயத்தோடு அவர் என்னை நடத்தும்படி கேட்பேன். வழியைக் காண என் பெருமையையோ என் சொந்த அறிவையோ சார்ந்திருக்கமாட்டேன்.","Lord, give me a humble heart. Teach me Your way and lead me in what is right. When I am tempted to rely on my own understanding, help me listen to You first. Amen.","ஆண்டவரே, எனக்குத் தாழ்மையான இருதயத்தைத் தாரும். உமது வழியை எனக்குப் போதித்து, சரியானதில் என்னை நடத்தும். என் சொந்த புத்தியில் சாய நான் ஆசைப்படும்போது முதலில் உமக்குச் செவிகொடுக்க உதவும். ஆமென்."],"ISA.61.7.7":["God restores what was lost and turns my shame into joy. I will not live under embarrassment or regret. I trust Him to bring honor and gladness where there has been pain. I will receive His restoration with thanks.","இழந்ததைத் தேவன் மீட்டெடுத்து என் வெட்கத்தை சந்தோஷமாக மாற்றுகிறார். அவமானத்திலோ வருத்தத்திலோ நான் வாழமாட்டேன். வேதனை இருந்த இடத்தில் கனத்தையும் மகிழ்ச்சியையும் அவர் தருவார் என்று நம்புகிறேன். அவருடைய மறுசீரமைப்பை நன்றியோடு ஏற்றுக்கொள்வேன்.","Father, You see the shame and pain I have carried. Thank You for Your promise to restore and to bring joy. Heal what is broken in me, and help me receive Your goodness with a thankful heart. Amen.","பிதாவே, நான் சுமந்த வெட்கத்தையும் வேதனையையும் நீர் காண்கிறீர். மீட்டெடுத்து மகிழ்ச்சி தருவதாக வாக்குப்பண்ணியதற்கு நன்றி. என்னில் உடைந்ததைக் குணமாக்கி, உமது நன்மையை நன்றியுள்ள இருதயத்தோடு ஏற்றுக்கொள்ள உதவும். ஆமென்."],"JAS.1.12.12":["I will stay strong through my trials, because God sees my faithfulness. He promises a reward to those who love Him and stand firm. I will not give up, and I will keep my eyes on His promise.","என் சோதனைகளில் நான் உறுதியாய் நிற்பேன்; ஏனெனில் என் உண்மையை தேவன் காண்கிறார். தம்மில் அன்புகூர்ந்து நிலைத்திருக்கிறவர்களுக்கு அவர் பலன் தருவதாக வாக்குப்பண்ணுகிறார். நான் விட்டுவிடமாட்டேன்; அவர் வாக்குத்தத்தத்தின்மேல் என் கண்களை வைத்திருப்பேன்.","Lord, You know the trial I am facing. Help me stand firm and stay faithful. Give me strength to endure and a heart that keeps loving You. Thank You for seeing me through this. Amen.","ஆண்டவரே, நான் சந்திக்கும் சோதனையை நீர் அறிவீர். உறுதியாய் நின்று உண்மையுள்ளவராயிருக்க உதவும். சகிக்கப் பெலனையும் உம்மை நேசிக்கும் இருதயத்தையும் தாரும். இதிலே என்னைக் காண்பதற்கு நன்றி. ஆமென்."],"PRO.22.29.29":["I will be diligent and skillful in my work. I will do my tasks with excellence and honesty, as if serving the Lord. I trust God to open the right doors in His time, and I will stay faithful.","என் வேலையில் நான் ஜாக்கிரதையும் திறமையுமுள்ளவராயிருப்பேன். கர்த்தருக்குச் செய்வதுபோல என் பணிகளை சிறப்பாகவும் நேர்மையாகவும் செய்வேன். தேவன் தம் காலத்தில் சரியான கதவுகளைத் திறப்பார் என்று நம்புகிறேன்; உண்மையாய் நிலைத்திருப்பேன்.","Lord, help me do my work with skill and honesty. Give me focus and strength for today's tasks. Open the right doors in Your time, and keep me faithful whether people notice or not. Amen.","ஆண்டவரே, என் வேலையைத் திறமையோடும் நேர்மையோடும் செய்ய உதவும். இன்றைய பணிகளுக்குக் கவனத்தையும் பெலனையும் தாரும். உமது காலத்தில் சரியான கதவுகளைத் திறந்து, மனிதர் கவனித்தாலும் கவனிக்காவிட்டாலும் என்னை உண்மையாய் வைத்திரும். ஆமென்."],"DEU.20.4.4":["The Lord my God goes with me, and He fights for His people. I do not have to face my battles alone. I will bring my struggles to Him, stand firm in faith, and trust Him to help me.","என் தேவனாகிய கர்த்தர் என்னோடு வருகிறார்; தம் மக்களுக்காக அவர் யுத்தம் பண்ணுகிறார். என் போராட்டங்களை நான் தனியாகச் சந்திக்கத் தேவையில்லை. என் போராட்டங்களை அவரிடம் கொண்டுவந்து, விசுவாசத்தில் உறுதியாய் நின்று, அவர் உதவுவார் என்று நம்புவேன்.","Lord my God, thank You for going with me into every battle. I bring You my struggles today. Fight for me, strengthen me, and help me stand in faith when I feel outnumbered. Amen.","என் தேவனாகிய ஆண்டவரே, ஒவ்வொரு போராட்டத்திலும் என்னோடு வருவதற்கு நன்றி. என் போராட்டங்களை இன்று உம்மிடம் கொண்டுவருகிறேன். எனக்காக யுத்தம்பண்ணி, என்னைப் பெலப்படுத்தி, நான் தனிமைப்பட்டதுபோல உணரும்போது விசுவாசத்தில் நிற்க உதவும். ஆமென்."],"ISA.48.18.18":["When I listen to God and follow His ways, I can know peace like a river. I will pay attention to His Word and choose what is right. I trust that His guidance leads to a calm, steady heart.","நான் தேவனுக்குச் செவிகொடுத்து அவர் வழிகளில் நடக்கும்போது நதியைப்போன்ற சமாதானத்தை அறியலாம். அவர் வார்த்தைக்குக் கவனம் செலுத்தி சரியானதைத் தெரிந்துகொள்வேன். அவருடைய வழிநடத்துதல் அமைதியான உறுதியான இருதயத்துக்கு வழிநடத்தும் என்று நம்புகிறேன்.","Lord, I want peace that flows like a river. Teach me to listen to You and follow Your ways. Quiet my restless heart and help me choose what is right today. Amen.","ஆண்டவரே, நதியைப்போல் பாயும் சமாதானத்தை விரும்புகிறேன். உமக்குச் செவிகொடுத்து உமது வழிகளைப் பின்பற்றக் கற்றுத்தாரும். என் அமைதியற்ற இருதயத்தை அமைதிப்படுத்தி இன்று சரியானதைத் தெரிந்துகொள்ள உதவும். ஆமென்."],"PSA.147.3.3":["God heals the brokenhearted and binds up their wounds. My pain is not hidden from Him. I will bring my broken places to Him, and I trust Him to bring comfort and healing in His time.","இருதயம் நொறுங்குண்டவர்களைத் தேவன் குணமாக்கி அவர்களுடைய காயங்களைக் கட்டுகிறார். என் வேதனை அவருக்கு மறைவானதல்ல. என் உடைந்த இடங்களை அவரிடம் கொண்டுவருவேன்; அவர் தம் காலத்தில் ஆறுதலையும் சுகத்தையும் தருவார் என்று நம்புகிறேன்.","Lord, You see my broken heart. Thank You for being the One who heals and binds up wounds. Please comfort me and gently heal what hurts. Help me trust Your timing and Your love. Amen.","ஆண்டவரே, என் உடைந்த இருதயத்தை நீர் காண்கிறீர். குணமாக்கி காயங்களைக் கட்டுகிறவராயிருப்பதற்கு நன்றி. என்னைத் தேற்றி வலிக்கிறதை மெதுவாய்க் குணமாக்கும். உமது காலத்தையும் உமது அன்பையும் நம்ப உதவும். ஆமென்."],"PSA.121.2.2":["My help comes from the Lord, who made heaven and earth. I will look to Him when I feel overwhelmed. The One who created everything is able to help me, and I will call on Him today.","வானத்தையும் பூமியையும் உண்டாக்கின கர்த்தரிடத்திலிருந்து எனக்கு ஒத்தாசை வரும். நான் திணறும்போது அவரை நோக்கிப் பார்ப்பேன். எல்லாவற்றையும் சிருஷ்டித்தவர் எனக்கு உதவ வல்லவர்; இன்று அவரைக் கூப்பிடுவேன்.","Lord, You made heaven and earth, and my help comes from You. When I feel overwhelmed, I turn to You. Help me, steady me, and remind me that nothing is too big for You. Amen.","ஆண்டவரே, வானத்தையும் பூமியையும் உண்டாக்கினவர் நீர்; எனக்கு ஒத்தாசை உம்மிடமிருந்து வருகிறது. நான் திணறும்போது உம்மிடம் திரும்புகிறேன். எனக்கு உதவி, என்னை நிலைநிறுத்தி, உமக்கு எதுவும் கடினமல்ல என்பதை நினைவூட்டும். ஆமென்."],"PSA.138.3.3":["When I called, God answered me. He gave me strength and made my heart bold. I will keep calling on Him, because He hears me. He will give me courage again for what is ahead.","நான் கூப்பிட்ட நாளிலே தேவன் எனக்கு உத்தரவு கொடுத்தார்; என் ஆத்துமாவிலே பெலன் தந்து என்னைத் தைரியப்படுத்தினார். தொடர்ந்து அவரைக் கூப்பிடுவேன், ஏனெனில் அவர் என் குரலைக் கேட்கிறார். வரப்போகிறவற்றுக்கு மீண்டும் தைரியம் தருவார்.","Lord, thank You for answering when I call. You have given me strength before, and I ask You to strengthen me again. Make my heart bold and help me face today with courage. Amen.","ஆண்டவரே, நான் கூப்பிடும்போது உத்தரவு கொடுப்பதற்கு நன்றி. நீர் முன்பு எனக்குப் பெலன் தந்தீர்; இப்போதும் என்னைப் பெலப்படுத்தும்படி கேட்கிறேன். என் இருதயத்தைத் தைரியப்படுத்தி இன்றைய நாளைத் தைரியத்தோடு சந்திக்க உதவும். ஆமென்."],"PSA.84.11.11":["The Lord is my sun and my shield. He gives grace and honor, and He does not withhold what is good from those who walk with Him. I will walk with integrity and trust His goodness.","தேவனாகிய கர்த்தர் எனக்குச் சூரியனும் கேடகமுமானவர். அவர் கிருபையையும் மகிமையையும் அருளுகிறார்; தம்மோடு நடக்கிறவர்களுக்கு நன்மையானதை அவர் குறைவுபடவிடார். உத்தமமாய் நடந்து அவருடைய நன்மையை நம்புவேன்.","Lord God, You are my sun and my shield. Thank You for Your grace and for the good You give. Help me walk with integrity and trust that You know what is best for me. Amen.","தேவனாகிய ஆண்டவரே, நீரே என் சூரியனும் என் கேடகமும். உமது கிருபைக்கும் நீர் தரும் நன்மைக்கும் நன்றி. உத்தமமாய் நடக்கவும், எனக்கு எது மேலானது என்பதை நீர் அறிவீர் என்று நம்பவும் உதவும். ஆமென்."],"PRO.11.14.14":["I will not make big decisions on my own. I will seek wise and godly advice, and listen with humility. I believe God often guides me through good counsel, so I will ask, listen, and pray before I act.","பெரிய தீர்மானங்களை நான் தனியாக எடுக்கமாட்டேன். ஞானமும் தேவபக்தியுமுள்ள ஆலோசனையைத் தேடித் தாழ்மையோடு கேட்பேன். நல்ல ஆலோசனையின் மூலம் தேவன் அடிக்கடி வழிநடத்துகிறார் என்று நம்புகிறேன்; ஆகவே செயல்படும் முன் கேட்டு, கவனித்து, ஜெபிப்பேன்.","Lord, give me the humility to ask for advice and the wisdom to recognize good counsel. Place wise people in my life. Guide my decisions through Your Word and Your Spirit today. Amen.","ஆண்டவரே, ஆலோசனை கேட்கும் தாழ்மையையும் நல்ல ஆலோசனையை அறியும் ஞானத்தையும் தாரும். என் வாழ்வில் ஞானமுள்ளவர்களை வையும். இன்று உமது வார்த்தையாலும் உமது ஆவியாலும் என் தீர்மானங்களை நடத்தும். ஆமென்."],"ROM.10.17.17":["Faith comes by hearing God's Word. I will make time to read it and listen to it, so my trust in Him can grow. When doubts come, I will return to Scripture and let it strengthen me.","விசுவாசம் கேள்வியினாலே வரும்; கேள்வி தேவனுடைய வசனத்தினாலே வரும். அவர் மேல் என் நம்பிக்கை வளரும்படி அவர் வார்த்தையை வாசிக்கவும் கேட்கவும் நேரம் ஒதுக்குவேன். சந்தேகம் வரும்போது வேதத்திற்குத் திரும்பி அது என்னைப் பெலப்படுத்த விடுவேன்.","Lord, thank You for Your Word. Please grow my faith as I read and listen. When doubts come, bring Your truth to my mind. Help me trust You more each day. Amen.","ஆண்டவரே, உமது வார்த்தைக்கு நன்றி. நான் வாசித்துக் கேட்கும்போது என் விசுவாசத்தை வளர்த்தும். சந்தேகம் வரும்போது உமது சத்தியத்தை என் நினைவுக்குக் கொண்டுவாரும். நாளுக்கு நாள் அதிகமாய் உம்மை நம்ப உதவும். ஆமென்."],"HEB.6.19.19":["My hope in Christ is an anchor for my soul, strong and secure. When storms of worry or fear come, I will not drift away. I will hold on to the hope that keeps me steady in God.","கிறிஸ்துவிலுள்ள என் நம்பிக்கை என் ஆத்துமாவுக்கு நிலையும் உறுதியுமான நங்கூரம். கவலையின் அல்லது பயத்தின் புயல்கள் வரும்போதும் நான் அலைந்து போகமாட்டேன். தேவனில் என்னை நிலைநிறுத்தும் நம்பிக்கையைப் பற்றிக்கொள்வேன்.","Lord, thank You that my hope in You is an anchor for my soul. When storms come, keep me from drifting. Hold me steady, and help me trust that You are stronger than anything I face. Amen.","ஆண்டவரே, உம்மிலுள்ள என் நம்பிக்கை என் ஆத்துமாவின் நங்கூரம் என்பதற்கு நன்றி. புயல்கள் வரும்போது நான் அலைந்துபோகாமல் காத்தருளும். என்னை நிலைநிறுத்தி, நான் சந்திக்கும் எதையும்விட நீர் பெலமுள்ளவர் என்று நம்ப உதவும். ஆமென்."],"JHN.17.23.23":["God loves me with the same love He has for Jesus. I am deeply loved and fully known. I will live in that love and not in fear or doubt. I will also help others feel they belong and are loved.","இயேசுவில் அன்பாயிருக்கிறதுபோல தேவன் என்னிலும் அன்பாயிருக்கிறார். நான் ஆழமாய் நேசிக்கப்பட்டு முழுமையாய் அறியப்பட்டிருக்கிறேன். பயத்திலோ சந்தேகத்திலோ அல்ல, அந்த அன்பிலே வாழ்வேன். பிறரும் தாங்கள் நேசிக்கப்படுகிறோம் என்று உணர உதவுவேன்.","Father, thank You for loving me as You love Jesus. Help me believe it deeply. Let that love shape how I live today, and help me show Your love to the people around me. Amen.","பிதாவே, இயேசுவை நேசிப்பதுபோல என்னை நேசிப்பதற்கு நன்றி. அதை ஆழமாய் நம்ப உதவும். அந்த அன்பு இன்று நான் வாழும் விதத்தை வடிவமைக்கட்டும்; என்னைச் சுற்றியுள்ளவர்களுக்கு உமது அன்பைக் காட்ட உதவும். ஆமென்."],"PSA.130.3.4":["If God counted every sin, no one could stand, but He offers forgiveness. I am grateful for His mercy. I will come to Him with honesty, receive His forgiveness, and live with respect and love for Him.","தேவன் ஒவ்வொரு அக்கிரமத்தையும் கவனித்திருந்தால் யாரும் நிலைநிற்க முடியாது; ஆனால் அவரிடத்தில் மன்னிப்பு உண்டு. அவருடைய இரக்கத்திற்காக நன்றியுள்ளவராயிருக்கிறேன். உண்மையோடு அவரிடம் வந்து மன்னிப்பைப் பெற்று, மரியாதையோடும் அன்போடும் வாழ்வேன்.","Lord, thank You that You do not keep a record of my sins against me. You offer forgiveness. I come to You honestly. Cleanse my heart and help me live with respect and love for You. Amen.","ஆண்டவரே, என் பாவங்களின் கணக்கை நீர் வைத்துக்கொள்ளாததற்கு நன்றி. நீர் மன்னிப்பை அருளுகிறீர். உண்மையோடு உம்மிடம் வருகிறேன். என் இருதயத்தைச் சுத்திகரித்து உம்மிடம் மரியாதையோடும் அன்போடும் வாழ உதவும். ஆமென்."],"PSA.27.10.10":["Even if my own family or those closest to me fail me, the Lord will take me in. I am not abandoned. God welcomes me, holds me, and cares for me. I will rest in His acceptance today.","என் தகப்பனும் என் தாயும் என்னைக் கைவிட்டாலும் கர்த்தர் என்னைச் சேர்த்துக்கொள்ளுவார். நான் கைவிடப்படவில்லை. தேவன் என்னை வரவேற்று, தாங்கி, கவனிக்கிறார். இன்று அவருடைய ஏற்றுக்கொள்ளுதலில் இளைப்பாறுவேன்.","Lord, thank You that You never turn me away. When people disappoint or leave me, hold me close. Help me feel Your welcome and Your love. I trust You to care for me. Amen.","ஆண்டவரே, என்னை ஒருபோதும் தள்ளிவிடாததற்கு நன்றி. மனிதர்கள் என்னை ஏமாற்றும்போதும் விட்டுப் போகும்போதும் என்னை அணைத்துக்கொள்ளும். உமது வரவேற்பையும் அன்பையும் உணர உதவும். என்னைக் கவனிப்பீர் என்று நம்புகிறேன். ஆமென்."]};

const API='https://bible.helloao.org/api/';
const getJSON=async u=>{const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()};
function parseChapter(d){const ch=d&&(d.chapter||d),arr=ch&&(ch.content||ch.verses);if(!Array.isArray(arr))throw new Error('shape');
  const o={};for(const x of arr){if(x.type&&x.type!=='verse')continue;const n=x.number??x.verse;
    let t=typeof x.text==='string'?x.text:(x.content||[]).map(q=>typeof q==='string'?q:(q&&typeof q.text==='string'?q.text:'')).join(' ');
    t=t.replace(/\s+/g,' ').trim();if(n&&t)o[n]=t}
  if(!Object.keys(o).length)throw new Error('empty');return o}
async function kjvIds(){const ids=[S.kjv,'eng_kjv','KJV'];
  try{const d=await getJSON(API+'available_translations.json');const a=Array.isArray(d)?d:(d.translations||[]);
    const k=a.find(t=>/king james/i.test((t.name||'')+(t.englishName||'')));if(k)ids.unshift(k.id)}catch(e){}
  return [...new Set(ids.filter(Boolean))]}
async function chapter(tr,b,c){const k=`bp.c.${tr}.${b}.${c}`,hit=LS.g(k);if(hit)return hit;let o;
  try{o=parseChapter(await getJSON(`${API}${tr}/${b}/${c}.simple.json`))}catch{o=parseChapter(await getJSON(`${API}${tr}/${b}/${c}.json`))}
  LS.s(k,o);return o}
async function verses(p){
  if(S.lang==='ta')return TV[pk(p)]?[{l:'ta',text:TV[pk(p)],ref:refTxt(p),name:'தமிழ் பரிசுத்த வேதாகமம்'}]:[{l:'ta',err:'miss'}];
  const cached=LS.g('bp.k.'+pk(p));if(cached)return[cached];
  let miss=false;
  for(const tr of S.kjvTried?[S.kjv].filter(Boolean).concat(await kjvIds()):await kjvIds()){
    try{const ch=await chapter(tr,p.b,p.c),t=[];for(let n=p.v1;n<=p.v2;n++)if(ch[n])t.push(ch[n]);
      if(!t.length){miss=true;break}
      if(S.kjv!==tr){S.kjv=tr;S.kjvTried=1;saveS()}
      const v={l:'en',text:t.join(' '),ref:refTxt(p),name:'King James Version (KJV)'};LS.s('bp.k.'+pk(p),v);return[v]}catch(e){}}
  return[{l:'en',err:miss?'miss':'err'}]}
/* ---------- UI ---------- */
const $=s=>document.querySelector(s),t=k=>I[S.lang][k]||k,li=S.lang==='ta'?1:0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L=a=>a[S.lang==='ta'?1:0],cn=k=>L(CATS[k]),day=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
const doy=()=>{const d=new Date();return Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(d.getFullYear(),0,0))/864e5)},daily=()=>P[(doy()-1)%P.length],cur=()=>LIB.find(p=>p.id===ST.pid)||daily();
const refTxt=p=>`${(S.lang==='ta'&&BNT[p.b])||BN[p.b]} ${p.c}:${p.v1}${p.v2>p.v1?'–'+p.v2:''}`;
function go(tab,o={}){Object.assign(ST,{tab,step:0,cat:null,q:'',lim:60},o);render()}
function nav(){$('#nav').innerHTML=[['home','🏠','home'],['promises','📖','promises'],['cats','🗂️','cats'],['mine','♥','mine'],['set','⚙️','set']].map(([k,i,l])=>`<button class="${ST.tab===k?'on':''}" onclick="go('${k}')"><b>${i}</b>${t(l)}</button>`).join('')}
function vhtml(vs){return vs.map(v=>v.err?`<div class="verse mut">${t(v.err==='miss'?'miss':v.err==='none'?'ntr':'err')} <button onclick="render()">${t('retry')}</button></div>`
  :`<div class="verse" lang="${v.l==='ta'?'ta':'en'}">“${esc(v.text)}”<small>${esc(v.ref)} · ${esc(v.name)}</small></div>`).join('')}
function pcard(p){return `<div class="card item" style="${gs(p.cat)}" onclick="go('home',{pid:${p.id}})"><span class="tag">${CATS[p.cat][2]} ${cn(p.cat)}</span><h3>${esc(L(p.t))}</h3><div class="mut">${refTxt(p)}</div></div>`}
function list(arr,empty){if(!arr.length)return `<div class="empty">${empty}</div>`;const n=ST.lim||60;return arr.slice(0,n).map(pcard).join('')+(arr.length>n?`<div class="row"><button class="p" onclick="ST.lim=${n+60};render()">${S.lang==='ta'?'மேலும் காட்டு':'Show more'}</button></div>`:'')}
function home(){
  const p=cur(),s=ST.step;
  const body=s===0?`<div class="brand">${S.lang==='ta'?'தேவனுடைய வார்த்தை':"God's Word"}</div><span class="tag">${CATS[p.cat][2]} ${cn(p.cat)}</span><h1>${esc(L(p.t))}</h1><div class="mut">${refTxt(p)}</div><div id="vs" class="mut">${t('load')}</div>
      <h2>${t('und')}</h2><div>${esc(L(p.x))}</div><div class="note">${t('wr')}</div>`
    :s===1?`<h2>${t('conf')}</h2><div class="big">${esc(L(p.cf))}</div><div class="row"><button onclick="fs(-2)">A−</button><button onclick="fs(2)">A+</button></div><div class="note">${t('wr')}</div>`
    :`<h2>${t('pray')}</h2><div class="big">${esc(L(p.pr))}</div><div class="note">${t('wr')}</div>`;
  const sv=saved.includes(p.id);
  $('#app').innerHTML=`<div class="brand">Bible Promises${ST.pid?'':' · '+t('today')}</div>
  <div class="steps">${[0,1,2].map(i=>`<i class="${i<=s?'on':''}"></i>`).join('')}</div>
  <div class="card hero" style="${gs(p.cat)}">${body}
  <div class="row">${s>0?`<button onclick="ST.step--;render()">‹ ${t('back')}</button>`:''}
  <button onclick="tog(${p.id})">${sv?'♥ '+t('saved'):'♡ '+t('save')}</button><button onclick="share()">⤴ ${t('share')}</button><span class="sp"></span>
  ${s<2?`<button class="p" onclick="ST.step++;render()">${t('next')} ›</button>`:`<button class="p" onclick="amen()">🙏 ${t('amen')}</button>`}</div></div>`;
  if(s===0)verses(p).then(v=>{const e=$('#vs');if(e&&ST.tab==='home'&&ST.step===0){e.className='';e.innerHTML=vhtml(v)}})}
function promises(){const q=ST.q.toLowerCase().trim();
  const hit=LIB.filter(p=>!q||[refTxt(p),p.t.join(' '),p.x.join(' '),p.cf.join(' '),p.pr.join(' '),TV[pk(p)]||'',CATS[p.cat].slice(0,2).join(' '),p.cat].join(' ').toLowerCase().includes(q));
  $('#app').innerHTML=`<h1>${t('promises')}</h1><div class="mut">${hit.length} / ${LIB.length}</div><input type="search" id="q" value="${esc(ST.q)}" placeholder="${t('search')}" oninput="ST.q=this.value;sr()"><div id="res">${list(hit,t('noRes'))}</div>`}
function sr(){const f=$('#q');const pos=f.selectionStart;promises();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)}
function cats(){
  if(ST.cat){$('#app').innerHTML=`<button onclick="go('cats')">‹ ${t('back')}</button><h1>${CATS[ST.cat][2]} ${cn(ST.cat)}</h1>${list(LIB.filter(p=>p.cat===ST.cat),t('noRes'))}`;return}
  $('#app').innerHTML=`<h1>${t('cats')}</h1><div class="grid">${Object.keys(CATS).map(k=>`<button class="cat" style="${gs(k)}" onclick="go('cats',{cat:'${k}'})"><b>${CATS[k][2]}</b>${cn(k)}</button>`).join('')}</div>`}
function mine(){$('#app').innerHTML=`<h1>${t('mine')}</h1>${list(LIB.filter(p=>saved.includes(p.id)),t('noSaved'))}`}
function settings(){
  $('#app').innerHTML=`<h1>${t('set')}</h1>
  <label>${t('lang')}</label><select onchange="S.lang=this.value;saveS();theme();render()"><option value="en" ${S.lang==='en'?'selected':''}>English</option><option value="ta" ${S.lang==='ta'?'selected':''}>தமிழ்</option></select>
  <div class="mut">${S.lang==='ta'?'வேதாகமம்: தமிழ் பரிசுத்த வேதாகமம்':'Bible: King James Version'}</div>
  <label>${t('size')}</label><input type="range" min="16" max="34" value="${S.fs}" oninput="S.fs=+this.value;fs(0)">
  <label><input type="checkbox" ${S.dark?'checked':''} onchange="S.dark=this.checked;saveS();theme()"> ${t('dark')}</label>
  <div class="row"><button onclick="wipe()">🗑 ${t('clear')}</button></div><h2>${t('about')}</h2><div class="mut">${t('abt')}</div>`}
function render(){nav();({home,promises,cats,mine,set:settings})[ST.tab]();window.scrollTo(0,0)}
function fs(d){S.fs=Math.max(16,Math.min(34,S.fs+d));saveS();theme()}
function theme(){const r=document.documentElement;r.style.setProperty('--fs',S.fs+'px');r.dataset.t=S.dark?'dark':'';r.lang=S.lang==='ta'?'ta':'en'}
function tog(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];LS.s('bp.saved',saved);render()}
function amen(){$('#app').innerHTML=`<div class="empty card hero"><h1>🙏</h1><p class="big">${t('done')}</p><button class="p" onclick="go('home')">${t('home')}</button></div>`}
function wipe(){if(!confirm(t('sure')))return;Object.keys(localStorage).filter(k=>k.startsWith('bp.')).forEach(k=>localStorage.removeItem(k));location.reload()}
async function share(){
  const p=cur(),s=ST.step;let txt;
  if(s===0){const v=(await verses(p)).filter(x=>!x.err);txt=`📖 ${L(p.t)}\n\n`+(v.length?v.map(x=>`“${x.text}”\n— ${x.ref} (${x.name})`).join('\n\n'):refTxt(p))}
  else txt=`${s===1?'🗣️ '+t('conf'):'🙏 '+t('pray')} — ${L(p.t)} (${refTxt(p)})\n\n${L(s===1?p.cf:p.pr)}`;
  txt+='\n\n✝️ Bible Promises';
  try{if(navigator.share)await navigator.share({text:txt});else window.open('https://wa.me/?text='+encodeURIComponent(txt))}catch{}}
function net(){const o=$('#off');o.style.display=navigator.onLine?'none':'block';o.textContent=t('off')}
addEventListener('online',()=>{net();render()});addEventListener('offline',net);
(async()=>{theme();net();render();
  try{const m={name:'Bible Promises',short_name:'Promises',display:'standalone',background_color:'#fbf6ea',theme_color:'#14213d',start_url:location.href};const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/json'}));document.head.appendChild(l)}catch{}})();
</script></body></html>
