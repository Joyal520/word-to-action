ாட்டையும் உன் கையில் ஒப்புக்கொடுத்தேன்.","JOS.10.8.8":"கர்த்தர் யோசுவாவை நோக்கி அவர்களுக்குப் பயப்படாயாக. உன் கைகளில் அவர்களை ஒப்புக்கொடுத்தேன். அவர்களில் ஒருவரும் உனக்கு முன்பாக நிற்பதில்லை என்றார்.","JDG.6.23.23":"அதற்கு கர்த்தர் உனக்குச் சமாதானம். பயப்படாதே, நீ சாவதில்லை என்று சொன்னார்.","1SA.12.20.20":"அப்பொழுது சாமுவேல் ஜனங்களை நோக்கி பயப்படாதேயுங்கள். நீங்கள் இந்தப் பெல்லாப்பையெல்லாம் செய்தீர்கள். ஆகிலும் கர்த்தரைவிட்டுப் பின்வாங்காமல் கர்த்தரை உங்கள் முழுஇருதயத்தோடும் சேவியுங்கள்.","2KI.6.16.16":"அதற்கு அவன் பயப்படாதே, அவர்களோடிருக்கிறவர்களைப்பார்கிகலும் நம்மோடிருக்கிறவர்கள் அதிகம் என்றான்.","1CH.28.20.20":"தாவீது தன் குமாரனாகிய சாலொமோனை நோக்கி நீ பலங்கொண்டு தைரியமாயிருந்து, இதை நடப்பி, நீ பயப்படாமலும் கலங்காமலும் இரு, தேவனாகிய கர்த்தர் என்னும் என் தேவன் உன்னோடே இருப்பார், கர்த்தருடைய ஆலயத்தைக் கட்டுகிறதற்கடுத்த சகல கிரியைகளையும் நீ முடித்துத் தீருமட்டும், அவர் உன்னைவிட்டு விலகவுமாட்டார், உன்னைக் கைவிடவுமாட்டார்.","2CH.32.7.7":"நீங்கள் திடன்கொண்டு தைரியமாயிருங்கள், அசீரியா ராஜாவுக்கும் அவனோடிருக்கிற ஏராளமான கூட்டத்திற்கும் பயப்படாமலும் கலங்காமலுமிருங்கள், அவனோடிருக்கிறவர்களைப்பார்க்கிலும் நம்மோடிருக்கிறவர்கள் அதிகம்.","PSA.3.3.3":"ஆனாலும் கர்த்தாவே, நீர் என் கேடகமும், என் மகிமையும், என் தலையை உயர்த்துகிறவருமாயிருக்கிறீர்.","PSA.27.3.3":"எனக்கு விரோதமாக ஒரு பாளயமிறங்கினாலும், என் இருதயம் பயப்படாது: என்மேல் யுத்தம் எழும்பினாலும், இதிலே நான் நம்பிக்கையாயிருப்பேன்.","PSA.49.5.5":"என்னைத் தொடருகிறவர்களுடைய அக்கிரமம் என்னைச் சூழ்ந்துகொள்ளுந் தீங்குநாட்களில், நான் பயப்படவேண்டியதென்ன?","PSA.56.11.11":"தேவனை நம்பியிருக்கிறேன், நான் பயப்படேன், மனுஷன் எனக்கு என்னசெய்வான்?","PSA.91.5.5":"இரவில் உண்டாகும் பயங்கரத்துக்கும், பகலில் பறக்கும் அம்புக்கும்,","PSA.91.6.6":"இருளில் நடமாடும் கொள்ளைநோய்க்கும், மத்தியானத்தில் பாழாக்கும் சங்காரத்துக்கும் பயப்படாதிருப்பாய்.","PSA.3.6.6":"எனக்கு விரோதமாகச் சுற்றிலும் படையெடுத்து வருகிற பதினாயிரம்பேருக்கும் நான் பயப்படேன்.","PRO.3.25.25":"சடிதியான திகிலும், துஷ்டர்களின் பாழ்க்கடிப்பும் வரும்போது நீ அஞ்சவேண்டாம்.","PRO.3.26.26":"கர்த்தர் உன் நம்பிக்கையாயிருந்து, உன் கால் சிக்கிக்கொள்ளாதபடி காப்பார்.","ISA.7.4.4":"நீ அவனை நோக்கி சீரியர் எப்பிராயீமோடும், ரெமலியாவின் மகனோடும் உனக்கு விரோதமாகத் துராலோசனை பண்ணி,","ISA.8.12.12":"இந்த ஜனங்கள் கட்டுப்பாடு என்று சொல்லுகிறதையெல்லாம் நீங்கள் கட்டுப்பாடு என்று சொல்லாமலும், அவர்கள் பயப்படுகிற பயத்தின்படி நீங்கள் பயப்படாமலும், கலங்காமலும்,","ISA.41.14.14":"யாக்கோபு என்னும் பூச்சியே, இஸ்ரவேலின் சிறுகூட்டமே, பயப்படாதே, நான் உனக்குத் துணைநிற்கிறேன் என்று கர்த்தரும் இஸ்ரவேலின் பரிசுத்தருமாகிய உன் மீட்பர் உரைக்கிறார்.","ISA.44.8.8":"நீங்கள் கலங்காமலும் பயப்படாமலும் இருங்கள், அக்காலமுதற்கொண்டு நான் அதை உனக்கு விளங்கப்பண்ணினதும் முன்னறிவித்ததும் இல்லையோ? இதற்கு நீங்களே என் சாட்சிகள், என்னைத்தவிரத் தேவனுண்டோ? வேறொரு கன்மலையும் இல்லையே, ஒருவனையும் அறியேன்.","ISA.51.7.7":"நீதியை அறிந்தவர்களே, என் வேதத்தை இருதயத்தில் பதித்திருக்கிற ஜனங்களே, எனக்குச் செவி கொடுங்கள், மனுஷரின் நிந்தனைக்குப் பயப்படாமலும், அவர்கள் தூஷணங்களால் கலங்காமலும் இருங்கள்.","ISA.54.4.4":"பயப்படாதே, நீ வெட்கப்படுவதில்லை, நாணாதே, நீ இலச்சையடைவதில்லை, உன் வாலிபத்தின் வெட்கத்தை நீ மறந்து, உன் விதவையிருப்பின் நிந்தையை இனி நினையாதிருப்பாய்.","JER.1.8.8":"நீ அவர்களுக்குப் பயப்படவேண்டாம், உன்னைக் காக்கும்படிக்கு நான் உன்னுடனே இருக்கிறேன் என்று கர்த்தர் சொல்லி,","JER.42.11.11":"நீங்கள் பயப்படுகிற பாபிலோன் ராஜாவுக்குப் பயப்படவேண்டாம், அவனுக்குப் பயப்படாதிருப்பீர்களாக என்று கர்த்தர் சொல்லுகிறார், உங்களை இரட்சிக்கும்படிக்கும், உங்களை அவன் கைக்குத் தப்புவிக்கும்படிக்கும் நான் உங்களுடனே இருந்து,","JER.46.27.27":"என் தாசனாகிய யாக்கோபே, நீ பயப்படாதே, இஸ்ரவேலே, நீ கலங்காதே, இதோ, நான் உன்னைத் தூரத்திலும், உன் சந்ததியை அவர்கள் சிறையிருப்பின் தேசத்திலுமிருந்து விடுவித்து இரட்சிப்பேன், அப்பொழுது யாக்கோபு திரும்பிவந்து, அமைதியோடும் சாங்கோபாங்கத்தோடும் இருப்பான், அவனைத் தத்தளிக்கப்பண்ணுவார் இல்லை.","LAM.3.57.57":"நான் உம்மை நோக்கிக் கூப்பிட்ட நாளிலே நீர் அணுகி பயப்படாதே என்றீர்.","DAN.10.12.12":"அப்பொழுது அவன் என்னை நோக்கி தானியேலே, பயப்படாதே. நீ அறிவை அடைகிறதற்கும், உன்னை உன்னுடைய தேவனுக்கு முன்பாகச் சிறுமைப்படுத்துகிறதற்கும், உன் மனதைச் செலுத்தின முதல்நாள் துவக்கி உன் வார்த்தைகள் கேட்கப்பட்டது. உன் வார்த்தைகளினிமித்தம் நான் வந்தேன்.","DAN.10.19.19":"பிரியமான புருஷனே, பயப்படாதே, உனக்குச் சமாதானமுண்டாவதாக, திடங்கொள், திடங்கொள் என்றான். இப்படி அவன் என்னோடே பேசுகையில் நான் திடங்கொண்டு அவனை நோக்கி என் ஆண்டவன் பேசுவாராக. என்னைத் திடப்படுத்தினீரே என்றேன்.","JOL.2.21.21":"தேசமே, பயப்படாதே, மகிழ்ந்து களிகூரு, கர்த்தர் பெரிய காரியங்களைச் செய்வார்.","ZEP.3.16.16":"அந்நாளிலே எருசலேமைப் பார்த்து, பயப்படாதே என்றும், சீயோனைப் பார்த்து, உன் கைகளைத் தளரவிடாதே என்றும் சொல்லப்படும்.","HAG.2.5.5":"நீங்கள் எகிப்திலிருந்து புறப்படுகிறபோது நான் உங்களோடே உடன்படிக்கைபண்ணின வார்த்தையின்படியே, என் ஆவியானவரும் உங்கள் நடுவில் நிலைகொண்டிருப்பார். பயப்படாதேயுங்கள்.","ZEC.8.13.13":"சம்பவிப்பதென்னவென்றால் யூதா வம்சத்தாரே, இஸ்ரவேல் வம்சத்தாரே, நீங்கள் புறஜாதிகளுக்குள்ளே சாபமாயிருந்ததுபோலவே, ஆசீர்வாதமாயிருக்கும்படி நான் உங்களை இரட்சிப்பேன். பயப்படாதேயுங்கள், உங்கள் கைகள் திடப்படக்கடவது.","MAT.14.27.27":"உடனே இயேசு அவர்களோடே பேசி திடன்கொள்ளுங்கள், நான்தான், பயப்படாதிருங்கள் என்றார்.","MAT.28.5.5":"தூதன் அந்த ஸ்திரீகளை நோக்கி நீங்கள் பயப்படாதிருங்கள்: சிலுவையில் அறையப்பட்ட இயேசுவைத் தேடுகிறீர்கள் என்று அறிவேன்.","MAT.28.10.10":"அப்பொழுது இயேசு அவர்களை நோக்கி பயப்படாதிருங்கள்: நீங்கள் போய், என் சகோதரர் கலிலேயாவுக்குப்போகும்படி அவர்களுக்குச் சொல்லுங்கள்: அங்கே அவர்கள் என்னைக் காண்பார்கள் என்றார்.","MRK.5.36.36":"அவர்கள் சொன்ன வார்த்தையை இயேசு கேட்டவுடனே, ஜெபஆலயத்தலைவனை நோக்கி பயப்படாதே, விசுவாசமுள்ளவனாயிரு என்று சொல்லி:","MRK.6.50.50":"அவர்களெல்லாரும் அவரைக் கண்டு கலக்கமடைந்தார்கள். உடனே அவர் அவர்களோடே பேசி திடன்கொள்ளுங்கள், நான் தான், பயப்படாதிருங்கள் என்று சொல்லி.","LUK.1.30.30":"தேவதூதன் அவளை நோக்கி மரியாளே, பயப்படாதே: நீ தேவனிடத்தில் கிருபைபெற்றாய்.","LUK.2.10.10":"தேவதூதன் அவர்களை நோக்கி பயப்படாதிருங்கள்: இதோ, எல்லா ஜனத்துக்கும் மிகுந்த சந்தோஷத்தை உண்டாக்கும் நற்செய்தியை உங்களுக்கு அறிவிக்கிறேன்.","LUK.5.10.10":"சீமோனுக்குக் கூட்டாளிகளான செபெதேயுவின் குமாரராகிய யாக்கோபும் யோவானும் அந்தப்படியே பிரமித்தார்கள். அப்பொழுது இயேசு சீமோனை நோக்கி பயப்படாதே, இதுமுதல் நீ மனுஷரைப் பிடிக்கிறவனாயிருப்பாய் என்றார்.","LUK.8.50.50":"இயேசு அதைக் கேட்டு பயப்படாதே: விசுவாசமுள்ளவனாயிரு, அப்பொழுது அவள் இரட்சிக்கப்படுவாள் என்றார்.","LUK.12.7.7":"உங்கள் தலையிலுள்ள மயிரெல்லாம் எண்ணப்பட்டிருக்கிறது, ஆகையால் பயப்படாதிருங்கள், அநேகம் அடைக்கலான் குருவிகளைப்பார்க்கிலும் நீங்கள் விசேஷித்தவர்களாயிருக்கிறீர்கள்.","JHN.6.20.20":"அவர்களை அவர் நோக்கி நான் தான், பயப்படாதிருங்கள் என்றார்.","JHN.14.1.1":"உங்கள் இருதயம் கலங்காதிருப்பதாக: தேவனிடத்தில் விசுவாசமாயிருங்கள், என்னிடத்திலும் விசுவாசமாயிருங்கள்.","ACT.18.9.9":"இராத்திரியிலே கர்த்தர் பவுலுக்குத் தரிசனமாகி நீ பயப்படாமல் பேசு, மவுனமாயிராதே:","ROM.8.15.15":"அந்தப்படி, திரும்பவும் பயப்படுகிறதற்கு நீங்கள் அடிமைத்தனத்தின் ஆவியைப் பெறாமல், அப்பா பிதாவே, என்று கூப்பிடப்பண்ணுகிற புத்திரசுவிகாரத்தின் ஆவியைப் பெற்றீர்கள்.","ROM.8.31.31":"இவைகளைக்குறித்து நாம் என்ன சொல்லுவோம்? தேவன் நம்முடைய பட்சத்திலிருந்தால் நமக்கு விரோதமாயிருப்பவன் யார்?","REV.2.10.10":"நீ படப்போகிற பாடுகளைக்குறித்து எவ்வளவும் பயப்படாதே: இதோ, நீங்கள் சோதிக்கப்படும்பொருட்டாகப் பிசாசானவன் உங்களில் சிலரைக் காவலில் போடுவான்: பத்துநாள் உபத்திரவப்படுவீர்கள். ஆகிலும் நீ மரணபரியந்தம் உண்மையாயிரு, அப்பொழுது ஜீவகிரீடத்தை உனக்குத் தருவேன்.","PSA.34.14.14":"தீமையை விட்டு விலகி, நன்மை செய்: சமாதானத்தைத் தேடி, அதைத் தொடர்ந்துகொள்.","PSA.72.7.7":"அவருடைய நாட்களில் நீதிமான் செழிப்பான்: சந்திரனுள்ளவரைக்கும் மிகுந்த சமாதானம் இருக்கும்.","PSA.85.10.10":"கிருபையும் சத்தியமும் ஒன்றையொன்று சந்திக்கும், நீதியும் சமாதானமும் ஒன்றையொன்று முத்தஞ்செய்யும்.","PSA.122.6.6":"எருசலேமின் சமாதானத்துக்காக வேண்டிக்கொள்ளுங்கள்: உன்னை நேசிக்கிறவர்கள் சுகித்திருப்பார்களாக.","PSA.147.14.14":"அவர் உன் எல்லைகளைச் சமாதானமுள்ளவைகளாக்கி, உசிதமான கோதுமையினால் உன்னைத் திருப்தியாக்குகிறார்.","PRO.12.20.20":"தீங்கைப் பிணைக்கிறவர்களின் இருதயத்தில் இருக்கிறது கபடம்: சமாதானம் பண்ணுகிற ஆலோசனைக்காரருக்கு உள்ளது சந்தோஷம்.","ISA.9.6.6":"நமக்கு ஒரு பாலகன் பிறந்தார், நமக்கு ஒரு குமாரன் கொடுக்கப்பட்டார், கர்த்தத்துவம் அவர் தோளின்மேலிருக்கும், அவர் நாமம் அதிசயமானவர், ஆலோசனைக்கர்த்தா, வல்லமையுள்ள தேவன், நித்திய பிதா, சமாதானப்பிரபு என்னப்படும்.","ISA.52.7.7":"சமாதானத்தைக் கூறி, நற்காரியங்களைச் சுவிசேஷமாய் அறிவித்து, இரட்சிப்பைப் பிரசித்தப்படுத்தி உன் தேவன் ராஜரிகம் பண்ணுகிறாரென்று சீயோனுக்குச் சொல்லுகிற சுவிசேஷகனுடைய பாதங்கள் மலைகளின்மேல் எவ்வளவு அழகாயிருக்கின்றன.","ISA.57.19.19":"தூரமாயிருக்கிறவர்களுக்கும் சமீபமாயிருக்கிறவர்களுக்கும் சமாதானம் சமாதானம் என்று கூறும் உதடுகளின்பலனைச் சிருஷ்டிக்கிறேன், அவர்களைக் குணமாக்குவேன் என்று கர்த்தர் சொல்லுகிறார்.","ISA.66.12.12":"கர்த்தர் சொல்லுகிறது என்னவென்றால் இதோ, நான் சமாதானத்தை ஒரு நதியைப்போலவும், ஜாதிகளின் மகிமையைப் புரண்டு ஓடுகிற ஆற்றைப்போலவும் அவளிடமாகப் பாயும்படி செய்கிறேன், அப்பொழுது நீங்கள் முலைப்பால் குடிப்பீர்கள் இடுப்பில் வைத்துச் சுமக்கப்படுவீர்கள், முழங்காலில் வைத்துத் தாலாட்டப்படுவீர்கள்.","MAL.2.5.5":"அவனோடே பண்ணின என் உடன்படிக்கை ஜீவனும் சமாதானமுமாக இருந்தது. அவன் எனக்குப் பயப்படும் பயத்தோடே இருக்கவேண்டுமென்று இவைகளை அவனுக்குக் கட்டளையிட்டேன். அப்படியே அவன் என் நாமத்துக்குப் பயந்தும் இருந்தான்.","LUK.2.14.14":"உன்னதத்திலிருக்கிற தேவனுக்கு மகிமையும், பூமியிலே சமாதானமும், மனுஷர்மேல் பிரியமும் உண்டாவதாக என்று சொல்லி, தேவனைத் துதித்தார்கள்.","LUK.7.50.50":"அவர் ஸ்திரீயை நோக்கி உன் விசுவாசம் உன்னை இரட்சித்தது, சமாதானத்தோடே போ என்றார். லூக்கா","LUK.8.48.48":"அவர் அவளைப் பார்த்து மகளே, திடன்கொள், உன் விசுவாசம் உன்னை இரட்சித்தது, சமாதானத்தோடே போ என்றார்.","LUK.24.36.36":"இவைகளைக்குறித்து அவர்கள் பேசிக்கொண்டிருக்கையில், இயேசு தாமே அவர்கள் நடுவிலே நின்று உங்களுக்குச் சமாதானம் என்றார்.","JHN.20.19.19":"வாரத்தின் முதல்நாளாகிய அன்றையத்தினம் சாயங்காலவேளையிலே, சீஷர்கள் கூடியிருந்த இடத்தில், யூதர்களுக்குப் பயந்ததினால் கதவுகள் பூட்டியிருக்கையில், இயேசு வந்து நடுவே நின்று உங்களுக்குச் சமாதானம் என்றார்.","ACT.10.36.36":"எல்லாருக்கும் கர்த்தராயிருக்கிற இயேசுகிறிஸ்துவைக்கொண்டு அவர் சாமாதானத்தைச் சுவிசேஷமாய்க் கூறி, இஸ்ரவேல் புத்திரருக்கு அனுப்பின வார்த்தையை அறிந்திருக்கிறீர்களே.","ROM.1.7.7":"தமது நாமத்தினிமித்தம் விசுவாசித்துக்குக் கீழ்ப்படியப்பண்ணும்பொருட்டு, எங்களுக்குக் கிருபையையும் அப்போஸ்தல ஊழியத்தையும் அருளிச்செய்திருக்கிறார்.","ROM.14.17.17":"தேவனுடைய ராஜ்யம் புசிப்பும் குடிப்புமல்ல, அது நீதியும் சமாதானமும் பரிசுத்த ஆவியினாலுண்டாகும் சந்தோஷமுமாயிருக்கிறது.","ROM.14.19.19":"ஆனபடியால் சமாதானத்துக்கடுத்தவைகளையும், அந்நியோந்நிய பக்திவிருத்தி உண்டாக்கத்தக்கவைகளையும் நாடக்கடவோம்.","ROM.16.20.20":"சமாதானத்தின் தேவன் சீக்கிரமாய்ச் சாத்தானை உங்கள் கால்களின்கீழே நசுக்கிப்போடுவார். நம்முடைய கர்த்தராகிய இயேசுகிறிஸ்துவினுடைய கிருபை உங்களுடனேகூட இருப்பதாக ஆமென்.","1CO.14.33.33":"தேவன் கலகத்திற்குத் தேவனாயிராமல், சமாதானத்திற்குத் தேவனாயிருக்கிறார், பரிசுத்தவான்களுடைய சபைகளெல்லாவற்றிலேயும் அப்படியே இருக்கிறது.","2CO.13.11.11":"கடைசியாக, சகோதரரே, சந்தோஷமாயிருங்கள், நற்சீர் பொருந்துங்கள், ஆறுதலடையுங்கள்: ஏகசிந்தையாயிருங்கள், சமாதானமாயிருங்கள், அப்பொழுது அன்புக்கும் சமாதானத்துக்கும் காரணராகிய தேவன் உங்களோடேகூட இருப்பார்.","GAL.5.22.22":"ஆவியின் கனியோ, அன்பு, சந்தோஷம், சமாதானம், நீடியபொறுமை, தயவு, நற்குணம், விசுவாசம்,","EPH.2.14.14":"எப்படியெனில், அவரே நம்முடைய சமாதான காரணராகி, இருதிறத்தாரையும் ஒன்றாக்கி, பகையாக நின்ற பிரிவினையாகிய நடுச்சுவரைத் தகர்த்து,","EPH.2.17.17":"அல்லாமலும் அவர் வந்து, தூரமாயிருந்த உங்களுக்கும், சமீபமாயிருந்த அவர்களுக்கும், சமாதானத்தைச் சுவிசேஷமாக அறிவித்தார்.","HEB.12.11.11":"எந்தச் சிட்சையும் தற்காலத்தில் சந்தோஷமாய்க் காணாமல் துக்கமாய்க் காணும்: ஆகிலும் பிற்காலத்தில் அதில் பழகினவர்களுக்கு அது நீதியாகிய சமாதான பலனைத் தரும்.","JAS.3.18.18":"நீதியாகிய கனியானது சமாதானத்தை நடப்பிக்கிறவர்களாலே சமாதானத்திலே விதைக்கப்படுகிறது. யாக்கோபு","1PE.3.11.11":"பொல்லாப்பைவிட்டு நீங்கி, நன்மைசெய்து, சமாதானத்தைத் தேடி, அதைப் பின்தொடரக்கடவன்.","DEU.7.15.15":"காத்தர் சகல நோய்களையும் உன்னைவிட்டு விலக்குவார், உனக்குத் தெரிந்திருக்கிற எகிப்தியரின் கொடிய ரோகங்களில் ஒன்றும் உன்மேல் வரப்பண்ணாமல், உன்னைப் பகைக்கிற யாவர்மேலும் அவைகளை வரப்பண்ணுவார்.","DEU.32.39.39":"நான் நானே அவர், என்னோடே வேறே தேவன் இல்லை என்பதை இப்பொழுது பாருங்கள், நான் கொல்லுகிறேன், நான் உயிர்ப்பிக்கிறேன், நான் காயப்படுத்துகிறேன், என் கைக்குத் தப்புவிப்பார் இல்லை.","PRO.3.7.7":"நீ உன்னை ஞானியென்று எண்ணாதே: கர்த்தருக்குப் பயந்து, தீமையை விட்டு விலகு.","PRO.3.8.8":"அது உன் நாபிக்கு ஆரோக்கியமும், உன் எலும்புகளுக்கு ஊனுமாகும்.","PRO.12.18.18":"பட்டயக்குத்துகள்போல் பேசுகிறவர்களும் உண்டு: ஞானமுள்ளவர்களுடைய நாவோ ஔஷதம்.","PRO.16.24.24":"இனிய சொற்கள் தேன்கூடுபோல் ஆத்துமாவுக்கு மதுரமும், எலும்புகளுக்கு ஔஷதமுமாகும்.","ISA.19.22.22":"கர்த்தர் எகிப்தியரை வாதையினால் அடிப்பார், அடித்துக் குணமாக்குவார், அவர்கள் கர்த்தரிடத்தில் மனந்திரும்புவார்கள், அப்பொழுது அவர்கள் விண்ணப்பத்தைக் கேட்டு, அவர்களைக் குணமாக்குவார்.","ISA.30.26.26":"கர்த்தர் தமது ஜனத்தின் முறிவைக் கட்டி, அதின் அடிக்காயத்தைக் குணமாக்கும் நாளிலே, சந்திரனுடைய வெளிச்சம் சூரியனுடைய வெளிச்சத்தைப்போலவும், சூரியனுடைய வெளிச்சம் ஏழத்தனையாய் ஏழு பகலின் வெளிச்சத்தைப்போலவும் இருக்கும்.","ISA.57.18.18":"அவர்கள் வழிகளை நான் பார்த்து, அவர்களைக் குணமாக்குவேன், அவர்களை நடத்தி, திரும்பவும் அவர்களுக்கும் அவர்களிலே துக்கப்படுகிறவர்களுக்கும் ஆறுதல் அளிப்பேன்.","ISA.58.8.8":"அப்பொழுது விடியற்கால வெளுப்பைப்போல உன் வெளிச்சம் எழும்பி, உன் சுகவாழ்வு சீக்கிரத்தில் துளிர்த்து, உன் நீதி உனக்கு முன்னாலே செல்லும், கர்த்தருடைய மகிமை உன்னைப் பின்னாலே காக்கும்.","JER.33.6.6":"இதோ, நான் அவர்களுக்குச் சவுக்கியமும் ஆரோக்கியமும் வரப்பண்ணி, அவர்களைக் குணமாக்கி, அவர்களுக்குப் பரிபூரண சமாதானத்தையும் சத்தியத்தையும் வெளிப்படுத்துவேன்.","HOS.6.1.1":"கர்த்தரிடத்தில் திரும்புவோம் வாருங்கள்,நம்மைப் பீறினார், அவரே நம்மைக் குணமாக்குவார், நம்மை அடித்தார், அவரே நம்முடைய காயங்களைக் கட்டுவார்.","MAT.4.23.23":"பின்பு, இயேசு கலிலேயா எங்கும் சுற்றி நடந்து, அவர்களுடைய ஜெப ஆலயங்களில் உபதேசித்து, ராஜ்யத்தின் சுவிசேஷத்தைப் பிரசங்கித்து, ஜனங்களுக்கு உண்டாயிருந்த சகல வியாதிகளையும் சகல நோய்களையும் நீக்கிச் சொஸ்தமாக்கினார்.","MAT.9.35.35":"பின்பு, இயேசு சகல பட்டணங்களையும் கிராமங்களையும் சுற்றி நடந்து, ஜெப ஆலயங்களில் உபதேசித்து, ராஜ்யத்தின் சுவிசேஷத்தைப் பிரசங்கித்து, ஜனங்களுக்கு உண்டாயிருந்த சகல வியாதிகளையும் சகல நோய்களையும் நீக்கி, அவர்களைச் சொஸ்தமாக்கினார்.","MAT.15.30.30":"அப்பொழுது, சப்பாணிகள், குருடர், ஊமையர், ஊனர் முதலிய அநேகரை, திரளான ஜனங்கள் கூட்டிக்கொண்டு இயேசுவினிடத்தில் வந்து, அவர்களை அவர் பாதத்திலே வைத்தார்கள்: அவர்களை அவர் சொஸ்தப்படுத்தினார்.","MAT.10.8.8":"வியாதியுள்ளவர்களைச் சொஸ்தமாக்குங்கள், குஷ்டரோகிகளைச் சுத்தம்பண்ணுங்கள், மரித்தோரை எழுப்புங்கள், பிசாசுகளைத் துரத்துங்கள்: இலவசமாய்ப் பெற்றீர்கள், இலவசமாய்க் கொடுங்கள்.","MRK.16.18.18":"சர்ப்பங்களை எடுப்பார்கள்: சாவுக்கேதுவான யாதொன்றைக் குடித்தாலும் அது அவர்களைச் சேதப்படுத்தாது: வியாதிஸ்தர்மேல் கைகளை வைப்பார்கள், அப்பொழுது அவர்கள் சொஸ்தமாவார்கள் என்றார்.","LUK.9.2.2":"தேவனுடைய ராஜ்யத்தைக்குறித்துப் பிரசங்கிக்கவும், பிணியாளிகளைச் சொஸ்தமாக்கவும் அவர்களை அனுப்பினார்.","LUK.10.9.9":"அவ்விடத்திலுள்ள பிணியாளிகளைச் சொஸ்தமாக்கி தேவனுடைய ராஜ்யம் உங்களுக்குச் சமீபமாய் வந்திருக்கிறது என்று அவர்களுக்குச் சொல்லுங்கள்.","ACT.5.16.16":"சுற்றுப்பட்டணங்களிலுமிருந்து திரளான ஜனங்கள் பிணியாளிகளையும் அசுத்த ஆவிகளால் வாதிக்கப்பட்டவர்களையும் எருசலேமுக்குக் கொண்டுவந்தார்கள்: அவர்களெல்லாரும் குணமாக்கப்பட்டார்கள்.","1CO.12.9.9":"வேறொருவனுக்கு அந்த ஆவியினாலேயே விசுவாசமும், வேறொருவனுக்கு அந்த ஆவியினாலேயே குணமாக்கும் வரங்களும்,","REV.22.2.2":"நகரத்து வீதியின் மத்தியிலும், நதியின் இருகரையிலும், பன்னிரண்டுவிதமான கனிகளைத்தரும் ஜீவவிருட்சம் இருந்தது, அது மாதந்தோறும் தன் கனியைக் கொடுக்கும்: அந்த விருட்சத்தின் இலைகள் ஜனங்கள் ஆரோக்கியமடைகிறதற்கு ஏதுவானவைகள்.","EXO.23.20.20":"வழியில் உன்னைக் காக்கிறதற்கும், நான் ஆயத்தம்பண்ணின ஸ்தானத்துக்கு உன்னைக் கொண்டுபோய்ச் சேர்க்கிறதற்கும், இதோ, நான் ஒரு தூதனை உனக்கு முன்னே அனுப்புகிறேன்.","DEU.33.29.29":"இஸ்ரவேலே, நீ பாக்கியவான், கர்த்தரால் ரட்சிக்கப்பட்ட ஜனமே, உனக்கு ஒப்பானவன் யார்? உனக்குச் சகாயஞ்செய்யும் கேடகமும் உனக்கு மகிமைபொருந்திய பட்டயமும் அவரே, உன் சத்துருக்கள் உனக்கு இச்சகம் பேசி அடங்குவார்கள், அவர்கள் மேடுகளை மிதிப்பாய் என்று சொன்னான். உபாகமம்","2SA.22.31.31":"தேவனுடைய வழி உத்தமமானது. கர்த்தருடைய வசனம் புடமிடப்பட்டது. நம்மை நம்புகிற அனைவருக்கும் அவர் கேடகமாயிருக்கிறார்.","PSA.16.1.1":"தேவனே, என்னைக் காப்பாற்றும், உம்மை நம்பியிருக்கிறேன்.","PSA.18.30.30":"தேவனுடைய வழி உத்தமமானது: கர்த்தருடைய வசனம் புடமிடப்பட்டது: தம்மை நம்புகிற அனைவருக்கும் அவர் கேடகமாயிருக்கிறார்.","PSA.31.20.20":"மனுஷருடைய அகங்காரத்துக்கு அவர்களை உமது சமுகத்தின் மறைவிலே மறைத்து, நாவுகளின் சண்டைக்கு அவர்களை விலக்கி, உமது கூடாரத்திலே ஔித்துவைத்துக் காப்பாற்றுகிறீர்.","PSA.33.20.20":"நம்முடைய ஆத்துமா கர்த்தருக்குக் காத்திருக்கிறது: அவரே நமக்குத் துணையும் நமக்குக் கேடகமுமானவர்.","PSA.37.28.28":"கர்த்தர் நியாயத்தை விரும்புகிறவர்: அவர் தமது பரிசுத்தவான்களைக் கைவிடுவதில்லை: அவர்கள் என்றைக்கும் காக்கப்படுவார்கள்: துன்மார்க்கருடைய சந்ததியோ அறுப்புண்டுபோம்.","PSA.41.2.2":"கர்த்தர் அவனைப் பாதுகாத்து அவனை உயிரோடே வைப்பார்: பூமியில் அவன் பாக்கியவானாயிருப்பான்: அவன் சத்துருக்களின் இஷ்டத்திற்கு நீர் அவனை ஒப்புக்கொடீர்.","PSA.56.9.9":"நான் உம்மை நோக்கிக் கூப்பிடும் நாளில் என் சத்துருக்கள் பின்னிட்டுத் திரும்புவார்கள்: தேவன் என் பட்சத்தில் இருக்கிறார் என்பதை அறிவேன்.","PSA.62.2.2":"அவரே என் கன்மலையும், என் இரட்சிப்பும், என் உயர்ந்த அடைக்கலமுமானவர்: நான் அதிகமாய் அசைக்கப்படுவதில்லை.","PSA.62.6.6":"அவரே என் கன்மலையும், என் இரட்சிப்பும், என் உயர்ந்த அடைக்கலமுமானவர்: நான் அசைக்கப்படுவதில்லை.","PSA.97.10.10":"கர்த்தரில் அன்புகூருகிறவர்களே, தீமையை வெறுத்துவிடுங்கள்: அவர் தம்முடைய பரிசுத்தவான்களின் ஆத்துமாக்களைக் காப்பாற்றி, துன்மார்க்கரின் கைக்கு அவர்களைத் தப்புவிக்கிறார்.","PSA.140.4.4":"கர்த்தாவே, துன்மார்க்கனுடைய கைகளுக்கு என்னை நீங்கலாக்கி, கொடியவனுக்கு என்னை விலக்கி இரட்சியும்: அவர்கள் என் நடைகளைக் கவிழ்க்கப்பார்க்கிறார்கள்.","PSA.145.20.20":"கர்த்தர் தம்மில் அன்புகூருகிற யாவரையும் காப்பாற்றி, துன்மார்க்கர் யாவரையும் அழிப்பார்.","PRO.1.33.33":"எனக்குச் செவிகொடுக்கிறவன் எவனோ, அவன் வி்க்கினமின்றி வாசம்பண்ணி, ஆபத்திற்குப் பயப்படாமல் அமைதியாயிருப்பான். நீதிமொழிகள்","PRO.2.8.8":"அவர் நியாயத்தின் நெறிகளைத் தற்காத்து, தம்முடைய பரிசுத்தவான்களின் பாதையைக் காப்பாற்றுகிறார்.","PRO.2.11.11":"நல்யோசனை உன்னைக் காப்பாற்றும், புத்தி உன்னைப் பாதுகாக்கும்.","PRO.30.5.5":"தேவனுடைய வசனமெல்லாம் புடமிடப்பட்டவைகள்: தம்மை அண்டிக்கொள்ளுகிறவர்களுக்கு அவர் கேடகமானவர்.","ISA.4.6.6":"பகலிலே வெயிலுக்கு நிழலாகவும், பெருங்காற்றுக்கும் மழைக்கும் அடைக்கலமாகவும், மறைவிடமாகவும், ஒரு கூடாரம் உண்டாயிருக்கும். ஏசாயா","ISA.26.1.1":"அக்காலத்திலே யூதாதேசத்தில் பாடப்படும் பாட்டாவது பெலனான நகரம் நமக்கு உண்டு, இரட்சிப்பையே அதற்கு மதிலும் அரணுமாக ஏற்படுத்துவார்.","ISA.31.5.5":"பறந்து காக்கிற பட்சிகளைப்போல, சேனைகளின் கர்த்தர் எருசலேமின்மேல் ஆதரவாக இருப்பார், அவர் அதைக் காத்துக் தப்பப்பண்ணுவார், அவர் கடந்துவந்து அதை விடுவிப்பார்.","ISA.32.2.2":"அவர் காற்றுக்கு ஒதுக்காகவும், பெருவெள்ளத்துக்குப் புகலிடமாகவும், வறண்ட நிலத்துக்கு நீர்க்கால்களாகவும், விடாய்த்த பூமிக்குப் பெருங்கன்மலையின் நிழலாகவும் இருப்பார்.","ISA.54.15.15":"இதோ, உனக்கு விரோதமாய்க் கூட்டங்கூடினால், அது என்னாலே கூடுகிற கூட்டமல்ல, எவர்கள் உனக்கு விரோதமாய்க் கூடுகிறார்களோ, அவர்கள் உன் பட்சத்தில் வருவார்கள்.","ZEC.2.5.5":"நான் அதற்குச் சுற்றிலும் அக்கினிமதிலாயிருந்து, அதின் நடுவில் மகிமையாக இருப்பேன் என்று கர்த்தர் சொல்லுகிறார்.","LUK.21.18.18":"ஆனாலும் உங்கள் தலைமயிரில் ஒன்றாகிலும் அழியாது.","JHN.10.28.28":"நான் அவைகளுக்கு நித்தியஜீவனைக் கொடுக்கிறேன்: அவைகள் ஒருக்காலும் கெட்டுப்போவதில்லை, ஒருவனும் அவைகளை என் கையிலிருந்து பறித்துக்கொள்வதுமில்லை.","JHN.10.29.29":"அவைகளை எனக்குத் தந்த என் பிதா எல்லாரிலும் பெரியவராயிருக்கிறார்: அவைகளை என் பிதாவின் கையிலிருந்து பறித்துக்கொள்ள ஒருவனாலும் கூடாது.","2TI.4.18.18":"கர்த்தர் எல்லாத் தீமையினின்றும் என்னை இரட்சித்து, தம்முடைய பரம ராஜ்யத்தை அடையும்படி காப்பாற்றுவார்: அவருக்குச் சதாகாலங்களிலும் மகிமை உண்டாவதாக. ஆமென்.","1JN.5.18.18":"தேவனால் பிறந்த எவனும் பாவஞ்செய்யானென்று அறிந்திருக்கிறோம்: தேவனால் பிறந்தவன் தன்னைக் காக்கிறான், பொல்லாங்கன் அவனைத் தொடான்.","JUD.1.24.24":"வழுவாதபடி உங்களைக் காக்கவும், தமது மகிமையுள்ள சந்நிதானத்திலே மிகுந்த மகிழ்ச்சியோடே உங்களை மாசற்றவர்களாய் நிறுத்தவும் வல்லமையுள்ளவரும்,","1SA.2.9.9":"அவர் தமது பரிசுத்தவான்களின் பாதங்களைக் காப்பார். துன்மார்க்கர் இருளில் மெளனமாவார்கள். பெலத்தினால் ஒருவரும் மேற்கொள்ளுவதில்லை.","2SA.22.40.40":"யுத்தத்துக்கு நீர் என்னைப் பலத்தால் இடைகட்டி, என்மேல் எழும்பினவர்களை என்கீழ் மடங்கப்பண்ணினீர்.","1CH.29.12.12":"ஐசுவரியமும் கனமும் உம்மாலே வருகிறது, தேவரீர் எல்லாவற்றையும் ஆளுகிறவர், உம்முடைய கரத்திலே சத்துவமும் வல்லமையும் உண்டு, எவரையும் மேன்மைப்படுத்தவும் பலப்படுத்தவும் உம்முடைய கரத்தினால் ஆகும்.","PSA.18.1.1":"என் பெலனாகிய கர்த்தாவே, உம்மில் அன்புகூருவேன்.","PSA.18.39.39":"யுத்தத்திற்கு நீர் என்னைப் பலத்தால் இடைகட்டி, என்மேல் எழும்பினவர்களை என் கீழ் மடங்கப்பண்ணினீர்.","PSA.84.7.7":"அவர்கள் பலத்தின்மேல் பலம் அடைந்து, சீயோனிலே தேவசந்நிதியில் வந்து காணப்படுவார்கள்.","PSA.89.21.21":"என் கை அவனோடே உறுதியாயிருக்கும்: என் புயம் அவனைப் பலப்படுத்தும்.","PSA.118.14.14":"கர்த்தர் என் பெலனும், என் கீதமுமானவர்: அவர் எனக்கு இரட்சிப்புமானார்.","ISA.26.4.4":"கர்த்தரை என்றென்றைக்கும் நம்புங்கள், கர்த்தராகிய யேகோவா நித்திய கன்மலையாயிருக்கிறார்.","ISA.30.15.15":"நீங்கள் மனந்திரும்பி அமர்ந்திருந்தால் இரட்சிக்கப்படுவீர்கள், அமரிக்கையும் நம்பிக்கையுமே உங்கள் பெலனாயிருக்கும் என்று இஸ்ரவேலின் பரிசுத்தராயிருக்கிற கர்த்தராகிய தேவன் சொல்லுகிறார், நீங்களோ அப்படிச் செய்ய மனதாயிராமல்,","ISA.33.2.2":"கர்த்தாவே, எங்களுக்கு இரங்கும், உமக்குக் காத்திருக்கிறோம், தேவரீர் காலையில் அவர்கள் புயமும், இக்கட்டுக்காலத்தில் எங்கள் இரட்சிப்புமாயிருக்கும்.","ISA.45.24.24":"கர்த்தரிடத்தில்மாத்திரம் நீதியும் வல்லமையுமுண்டென்று அவனவன் சொல்லி அவரிடத்தில் வந்து சேருவான், அவருக்கு விரோதமாய் எரிச்சல்கொண்டிருக்கிற யாவரும் வெட்கப்படுவார்கள்.","JOL.3.16.16":"கர்த்தர் சீயோனிலிருந்து கெர்ச்சித்து, எருசலேமிலிருந்து சத்தமிடுவார், வானமும் பூமியும் அதிரும், ஆனாலும் கர்த்தர் தமது ஜனத்துக்கு அடைக்கலமும் இஸ்ரவேல் புத்திரருக்கு அரணான கோட்டையுமாயிருப்பார்.","ZEC.10.12.12":"நான் அவர்களைக் கர்த்தருக்குள் பலப்படுத்துவேன். அவர்கள் அவருடைய நாமத்தினாலே நடந்துகொள்வார்கள் என்று கர்த்தர் சொல்லுகிறார். சகரியா","2TI.2.1.1":"ஆதலால், என் குமாரனே, நீ கிறிஸ்து இயேசுவிலுள்ள கிருபையில் பலப்படு.","HEB.11.34.34":"அக்கினியின் உக்கிரத்தை அவித்தார்கள், பட்டயக்கருக்குக்குத் தப்பினார்கள், பலவீனத்தில் பலன்கொண்டார்கள்: யுத்தத்தில் வல்லவர்களானார்கள், அந்நியருடைய சேனைகளை முறியடித்தார்கள்.","DEU.8.7.7":"உன் தேவனாகிய கர்த்தர் உன்னை நல்ல தேசத்திலே பிரவேசிக்கப்பண்ணுகிறார், அது பள்ளத்தாக்குகளிலும் மலைகளிலுமிருந்து புறப்படுகிற ஆறுகளும் ஊற்றுகளும் ஏரிகளுமுள்ள தேசம்,","DEU.28.6.6":"நீ வருகையிலும் ஆசீர்வதிக்கப்பட்டிருப்பாய், நீ போகையிலும் ஆசீர்வதிக்கப்பட்டிருப்பாய்.","PSA.23.5.5":"என் சத்துருக்களுக்கு முன்பாக நீர் எனக்கு ஒரு பந்தியை ஆயத்தப்படுத்தி, என் தலையை எண்ணெயால் அபிஷேகம்பண்ணுகிறீர்: என் பாத்திரம் நிரம்பி வழிகிறது.","PSA.34.9.9":"கர்த்தருடைய பரிசுத்தவான்களே, அவருக்குப் பயந்திருங்கள்: அவருக்குப் பயந்தவர்களுக்குக் குறைவில்லை.","PSA.37.3.3":"கர்த்தரை நம்பி நன்மைசெய்: தேசத்தில் குடியிருந்து சத்தியத்தை மேய்ந்துகொள்.","PSA.37.19.19":"அவர்கள் ஆபத்துக்காலத்திலே வெட்கப்பட்டுப்போகாதிருந்து, பஞ்சகாலத்திலே திருப்தியடைவார்கள்.","PSA.65.11.11":"வருஷத்தை உம்முடைய நன்மையால் முடிசூட்டுகிறீர்: உமது பாதைகள் நெய்யாய்ப் பொழிகிறது.","PSA.111.5.5":"தமக்குப் பயந்தவர்களுக்கு ஆகாரம் கொடுத்தார்: தமது உடன்படிக்கையை என்றென்றைக்கும் நினைப்பார்.","PSA.132.15.15":"அதின் ஆகாரத்தை நான் ஆசீர்வதித்து வருவேன்: அதின் ஏழைகளை நான் அப்பத்தினால் திருப்தியாக்குவேன்.","PRO.10.3.3":"கர்த்தர் நீதிமான்களைப் பசியினால் வருந்தவிடார்: துன்மார்க்கருடைய பொருளையோ அகற்றிவிடுகிறார்.","PRO.13.25.25":"நீதிமான் தனக்குத் திருப்தியாகப் புசிக்கிறான்: துன்மார்க்கருடைய வயிறோ பசித்திருக்கும். நீதிமொழிகள்","PRO.28.27.27":"தரித்திரருக்குக் கொடுப்பவன் தாழ்ச்சியடையான்: தன் கண்களை ஏழைக்கு விலக்குகிறவனுக்கோ அநேக சாபங்கள் வரும்.","ISA.33.16.16":"அவன் உயர்ந்த இடங்களில் வாசம்பண்ணுவான், கன்மலைகளின் அரண்கள் அவனுடைய உயர்ந்த அடைக்கலமாகும், அவன் அப்பம் அவனுக்குக் கொடுக்கப்படும், அவன் தண்ணீர் அவனுக்கு நிச்சயமாய்க் கிடைக்கும்.","ISA.41.17.17":"சிறுமையும் எளிமையுமானவர்கள் தண்ணீரைத் தேடி, அது கிடையாமல், அவர்கள் நாவு தாகத்தால் வறளும்போது, கர்த்தராகிய நான் அவர்களுக்குச் செவிகொடுத்து, இஸ்ரவேலின் தேவனாகிய நான் அவர்களைக் கைவிடாதிருப்பேன்.","ISA.49.10.10":"அவர்கள் பசியாயிருப்பதுமில்லை, தாகமாயிருப்பதுமில்லை, உஷ்ணமாகிலும், வெயிலாகிலும் அவர்கள்மேல்படுவதுமில்லை, அவர்களுக்கு இரங்குகிறவர் அவர்களை நடத்தி, அவர்களை நீரூற்றுகளிடத்திற்குக் கொண்டுபோய்விடுவார்.","ISA.55.1.1":"ஓ, தாகமாயிருக்கிறவர்களே, நீங்கள் எல்லாரும் தண்ணீர்களண்டைக்கு வாருங்கள், பணமில்லாதவர்களே, நீங்கள் வந்து, வாங்கிச் சாப்பிடுங்கள், நீங்கள் வந்து, பணமுமின்றி விலையுமின்றித் திராட்சரசமும் பாலும் கொள்ளுங்கள்.","JOL.2.26.26":"நீங்கள் சம்பூரணமாகச் சாப்பிட்டு, திருப்தியடைந்து, உங்களை அதிசயமாய் நடத்தி வந்த உங்கள் தேவனாகிய கர்த்தருடைய நாமத்தைத் துதிப்பீர்கள். என் ஜனங்கள் ஒருபோதும் வெட்கப்பட்டுப் போவதில்லை.","MAT.6.8.8":"அவர்களைப்போல நீங்கள் செய்யாதிருங்கள்: உங்கள் பிதாவை நோக்கி நீங்கள் வேண்டிக் கொள்ளுகிறதற்கு முன்னமே உங்களுக்கு இன்னது தேவை என்று அவர் அறிந்திருக்கிறார்.","MAT.6.30.30":"அற்ப விசுவாசிகளே! இன்றைக்கு இருந்து நாளைக்கு அடுப்பிலே போடப்படும் காட்டுப் புல்லுக்குத் தேவன் இவ்விதமாக உடுத்துவித்தால், உங்களுக்கு உடுத்துவிப்பது அதிக நிச்சயமல்லவா?","MAT.7.11.11":"ஆகையால், பொல்லாதவர்களாகிய நீங்கள் உங்கள் பிள்ளைகளுக்கு நல்ல ஈவுகளைக் கொடுக்க அறிந்திருக்கும்போது, பரலோகத்திலிருக்கிற உங்கள் பிதா தம்மிடத்தில் வேண்டிக்கொள்ளுகிறவர்களுக்கு நன்மையானவைகளைக் கொடுப்பது அதிக நிச்சயம் அல்லவா?","LUK.12.28.28":"இப்படியிருக்க, அற்பவிசுவாசிகளே, இன்றைக்குக் காட்டிலிருந்து நாளைக்கு அடுப்பிலே போடப்படுகிற புல்லுக்குத் தேவன் இவ்விதமாக உடுத்துவித்தால், உங்களுக்கு உடுத்துவிப்பது அதிக நிச்சயமல்லவா?","LUK.12.31.31":"தேவனுடைய ராஜ்யத்தையே தேடுங்கள், அப்பொழுது இவைகளெல்லாம் உங்களுக்குக் கூடக் கொடுக்கப்படும்.","2CO.9.6.6":"பின்னும் நான் சொல்லுகிறதென்னவெனில், சிறுக விதைக்கிறவன் சிறுக அறுப்பான், பெருக விதைக்கிறவன் பெருக அறுப்பான்.","2CO.9.11.11":"தேவனுக்கு எங்களால் ஸ்தோத்திரமுண்டாவதற்கு ஏதுவாயிருக்கும் மிகுந்த உதாரகுணத்திலே நீங்கள் எவ்விதத்திலும் சம்பூரணமுள்ளவர்களாவீர்கள்.","JAS.1.17.17":"நன்மையான எந்த ஈவும் பூரணமான எந்த வரமும் பரத்திலிருந்துண்டாகி, சோதிகளின் பிதாவினிடத்திலிருந்து இறங்கிவருகிறது: அவரிடத்தில் யாதொரு மாறுதலும் யாதொரு வேற்றுமையின் நிழலுமில்லை.","EXO.31.3.3":"விநோதமான வேலைகளை அவன் யோசித்துச் செய்கிறதற்கும், பொன்னிலும் வெள்ளியிலும் வெண்கலத்திலும் வேலைசெய்கிறதற்கும்,","1KI.3.12.12":"உன் வார்த்தைகளின்படி செய்தேன், ஞானமும் உணர்வுமுள்ள இருதயத்தை உனக்குத் தந்தேன், இதிலே உனக்குச் சரியானவன் உனக்குமுன் இருந்ததுமில்லை, உனக்குச் சரியானவன் உனக்குப்பின் எழும்புவதுமில்லை.","JOB.12.12.12":"முதியோரிடத்தில் ஞானமும் வயது சென்றவர்களிடத்தில் புத்தியும் இருக்குமே.","JOB.32.8.8":"ஆனாலும் மனுஷரில் ஒரு ஆவியுண்டு. சர்வவல்லவருடைய சுவாசமே அவர்களை உணர்வுள்ளவர்களாக்கும்.","PSA.19.7.7":"கர்த்தருடைய வேதம் குறைவற்றதும், ஆத்துமாவை உயிர்ப்பிக்கிறதுமாயிருக்கிறது: கர்த்தருடைய சாட்சி சத்தியமும், பேதையை ஞானியாக்குகிறதுமாயிருக்கிறது.","PSA.25.12.12":"கர்த்தருக்குப் பயப்படுகிற மனுஷன் எவனோ அவனுக்குத் தாம் தெரிந்துகொள்ளும் வழியைப் போதிப்பார்.","PSA.51.6.6":"இதோ, உள்ளத்தில் உண்மையிருக்க விரும்புகிறீர்: அந்தக்கரணத்தில் ஞானத்தை எனக்குத் தெரியப்படுத்துவீர்.","PRO.1.5.5":"புத்திமான் இவைகளைக் கேட்டு, அறிவில் தேறுவான்: விவேகி நல்லாலோசனைகளை அடைந்து:","PRO.2.3.3":"ஞானத்தை வா என்று கூப்பிட்டு, புத்தியைச் சத்தமிட்டு அழைத்து,","PRO.2.4.4":"அதை வெள்ளியைப்போல் நாடி, புதையல்களைத் தேடுகிறதுபோல் தேடுவாயாகில்,","PRO.2.7.7":"அவர் நீதிமான்களுக்கென்று மெய்ஞ்ஞானத்தை வைத்துவைத்திருக்கிறார்: உத்தமமாய் நடக்கிறவர்களுக்கு அவர் கேடகமாயிருக்கிறார்.","PRO.2.10.10":"ஞானம் உன் இருதயத்தில் பிரவேசித்து, அறிவு உன் ஆத்துமாவுக்கு இன்பமாயிருக்கும்போது,","PRO.3.18.18":"அது தன்னை அடைந்தவர்களுக்கு ஜீவவிருட்சம், அதைப் பற்றிக்கொள்ளுகிற எவனும் பாக்கியவான்.","PRO.3.21.21":"என் மகனே, இவைகள் உன் கண்களை விட்டுப் பிரியாதிருப்பதாக: மெய்ஞ்ஞானத்தையும் நல்லாலோசனையையும் காத்துக்கொள்.","PRO.3.22.22":"அவைகள் உன் ஆத்துமாவுக்கு ஜீவனும், உன் கழுத்துக்கு அலங்காரமுமாயிருக்கும்.","PRO.4.6.6":"அதை விடாதே, அது உன்னைத் தற்காக்கும்: அதின்மேல் பிரியமாயிரு, அது உன்னைக் காத்துக்கொள்ளும்.","PRO.8.17.17":"என்னைச் சிநேகிக்கிறவர்களை நான் சிநேகிக்கிறேன்: அதிகாலையில் என்னைத் தேடுகிறவர்கள் என்னைக் கண்டடைவார்கள்.","PRO.8.35.35":"என்னைக் கண்டடைகிறவன் ஜீவனைக் கண்டடைகிறான்: கர்த்தரிடத்தில் தயவையும் பெறுவான்.","PRO.9.9.9":"ஞானமுள்ளவனுக்குப் போதகம் பண்ணு, அவன் ஞானத்தில் தேறுவான்: நீதிமானுக்கு உபதேசம்பண்ணு, அவன் அறிவில் விருத்தியடைவான்.","PRO.10.23.23":"தீவினைசெய்வது மூடனுக்கு விளையாட்டு: புத்திமானுக்கோ ஞானம் உண்டு.","PRO.11.2.2":"அகந்தை வந்தால் இலச்சையும் வரும்: தாழ்ந்த சிந்தையுள்ளவர்களிடத்தில் ஞானம் உண்டு.","PRO.13.14.14":"ஞானவான்களுடைய போதகம் ஜீவஊற்று: அதினால் மரணக்கண்ணிகளுக்குத் தப்பலாம்.","PRO.14.8.8":"தன் வழியைச் சிந்தித்துக்கொள்வது விவேகியின் ஞானம்: மூடர்களுடைய வஞ்சனையோ மூடத்தனம்.","PRO.15.33.33":"கர்த்தருக்குப் பயப்படுதல் ஞானத்தைப் போதிக்கும்: மேன்மைக்கு முன்னானது தாழ்மை. நீதிமொழிகள்","PRO.16.16.16":"பொன்னைச் சம்பாதிப்பதிலும் ஞானத்தைச் சம்பாதிப்பது எவ்வளவு உத்தமம்! வெள்ளியைச் சம்பாதிப்பதிலும் புத்தியைச் சம்பாதிப்பது எவ்வளவு மேன்மை!","PRO.18.15.15":"புத்திமானுடைய மனம் அறிவைச்சம்பாதிக்கும்: ஞானியின் செவி அறிவை நாடும்.","PRO.19.8.8":"ஞானத்தைப் பெற்றுக்கொள்ளுகிறவன் தன் ஆத்துமாவைச் சிநேகிக்கிறான்: புத்தியைக் காக்கிறவன் நன்மையடைவான்.","PRO.24.5.5":"ஞானமுள்ளவன் பெலமுள்ளவன்: அறிவுள்ளவன் தன் வல்லமையை அதிகரிக்கப்பண்ணுகிறான்.","PRO.29.3.3":"ஞானத்தில் பிரியப்படுகிறவன் தன் தகப்பனை மகிழப்பண்ணுகிறான்: வேசிகளோடே தொந்திப்பானவனோ ஆஸ்தியை அழிக்கிறான்.","ECC.8.1.1":"ஞானமுள்ளவனுக்கு ஒப்பானவன் யார்? காரியத்தின் தாற்பரியத்தை அறிந்தவன் யார்? மனுஷனுடைய ஞானம் அவன் முகத்தைப் பிரகாசிக்கப்பண்ணும், அவன் முகத்தின் மூர்க்கம் மாறும்.","ISA.11.2.2":"ஞானத்தையும் உணர்வையும் அருளும் ஆவியும், ஆலோசனையையும் பெலனையும் அருளும் ஆவியும், அறிவையும் கர்த்தருக்குப் பயப்படுகிற பயத்தையும் அருளும் ஆவியுமாகிய கர்த்தருடைய ஆவியானவர் அவர்மேல் தங்கியிருப்பார்.","ISA.33.6.6":"பூரணரட்சிப்பும் ஞானமும் அறிவும் உன் காலங்களுடைய உறுதியாயிருக்கும், கர்த்தருக்குப் பயப்படுதலே அதின் பொக்கிஷம்.","DAN.2.22.22":"அவரே ஆழமும் மறைபொருளுமானதை வெளிப்படுத்துகிறவர். இருளில் இருக்கிறதை அவர் அறிவார். வெளிச்சம் அவரிடத்தில் தங்கும்.","JAS.3.17.17":"பரத்திலிருந்து வருகிற ஞானமோ முதலாவது சுத்தமுள்ளதாயும், பின்பு சமாதானமும் சாந்தமும் இணக்கமுமுள்ளதாயும், இரக்கத்தாலும் நற்கனிகளாலும் நிறைந்ததாயும், பட்சபாதமில்லாததாயும், மாயமற்றதாயுமிருக்கிறது.","COL.1.9.9":"இதினிமித்தம், நாங்கள் அதைக் கேட்ட நாள்முதல் உங்களுக்காக இடைவிடாமல் ஜெபம்பண்ணுகிறோம்: நீங்கள் எல்லா ஞானத்தோடும், ஆவிக்குரிய விவேகத்தோடும் அவருடைய சித்தத்தை அறிகிற அறிவினாலே நிரப்பப்படவும்,","1CO.1.24.24":"ஆகிலும் யூதரானாலும் கிரேக்கரானாலும் எவர்கள் அழைக்கப்பட்டிருக்கிறார்களோ, அவர்களுக்குக் கிறிஸ்து தேவபெலனும் தேவஞானமுமாயிருக்கிறார்.","LUK.21.15.15":"உங்களை விரோதிக்கிறவர்கள் ஒருவரும் எதிர்பேசவும் எதிர்நிற்கவும் கூடாத வாக்கையும் ஞானத்தையும் நான் உங்களுக்குக் கொடுப்பேன்.","GEN.15.6.6":"அவன் கர்த்தரை விசுவாசித்தான், அதை அவர் அவனுக்கு நீதியாக எண்ணினார்.","JOS.23.14.14":"இதோ, இன்று நான் பூலோகத்தார் எல்லாரும் போகிறவழியே போகிறேன். உங்கள் தேவனாகிய கர்த்தர் உங்களுக்காகச் சொன்ன நல்வார்த்தைகளிலெல்லாம் ஒரு வார்த்தையும் தவறிப்போகவில்லை என்பதை உங்கள் முழு இருதயத்தாலும் உங்கள் முழு ஆத்துமாவாலும் அறிந்திருக்கிறீர்கள். அவைகளெல்லாம் உங்களுக்கு நிறைவேறிற்று. அவைகளில் ஒரு வார்த்தையும் தவறிப்போகவில்லை.","1KI.8.56.56":"தாம் வாக்குத்தத்தம் பண்ணினபடியெல்லாம் தம்முடைய ஜனமாகிய இஸ்ரவேலுக்கு இளைப்பாறுதலை அருளின கர்த்தருக்கு ஸ்தோத்திரம், அவர் தம்முடைய தாசனாகிய மோசேயைக்கொண்டு சொன்ன அவருடைய நல்வார்த்தைகளில் எல்லாம் ஒரு வார்த்தையானாலும் தவறிப்போகவில்லை.","PSA.9.10.10":"கர்த்தாவே, உம்மைத் தேடுகிறவர்களை நீர் கைவிடுகிறதில்லை: ஆதலால், உமது நாமத்தை அறிந்தவர்கள் உம்மை நம்பியிருப்பார்கள்.","PSA.25.3.3":"உம்மை நோக்கிக் காத்திருக்கிற ஒருவரும் வெட்கப்பட்டுப் போகாதபடி செய்யும்: முகாந்தரமில்லாமல் துரோகம்பண்ணுகிறவர்களே வெட்கப்பட்டுப் போவார்களாக.","PSA.118.8.8":"மனுஷனை நம்புவதைப்பார்க்கிலும், கர்த்தர் பேரில் பற்றுதலாயிருப்பதே நலம்.","PSA.125.1.1":"கர்த்தரை நம்புகிறவர்கள் என்றென்றைக்கும் அசையாமல் நிலைத்திருக்கும் சீயோன் பர்வதத்தைப்போல் இருப்பார்கள்.","PSA.146.5.5":"யாக்கோபின் தேவனைத் தன் துணையாகக் கொண்டிருந்து, தன் தேவனாகிய கர்த்தர்மேல் நம்பிக்கையை வைக்கிறவன் பாக்கியவான்.","ISA.7.9.9":"எப்பிராயீமின் தலை சமாரியா, சமாரியாவின் தலை ரெமலியாவின் மகன், நீங்கள், விசுவாசியாவிட்டால் நிலைபெறமாட்டீர்கள் என்று சொல் என்றார்.","ISA.28.16.16":"ஆதலால் கர்த்தராகிய ஆண்டவர் உரைக்கிறதாவது இதோ, அஸ்திபாரமாக ஒரு கல்லை நான் சீயோனிலே வைக்கிறேன், அது பரீட்சிக்கப்பட்டதும், விலையேறப்பெற்றதும், திட அஸ்திபாரமுள்ளதுமான மூலைக்கல்லாயிருக்கும், விசுவாசிக்கிறவன் பதறான்.","JER.32.17.17":"ஆ, கர்த்தராகிய ஆண்டவரே, இதோ, தேவரீர் உம்முடைய மகா பலத்தினாலும், நீட்டப்பட்ட உம்முடைய புயத்தினாலும், வானத்தையம் பூமியையும் உண்டாக்கினீர், உம்மாலே செய்யக்கூடாத அதிசயமான காரியம் ஒன்றுமில்லை.","MAT.8.13.13":"பின்பு இயேசு நூற்றுக்கு அதிபதியை நோக்கி நீ போகலாம், நீ விசுவாசித்தபடியே உனக்கு ஆகக்கடவது என்றார். அந்த நாழிகையிலே அவன் வேலைக்காரன் சொஸ்தமானான்.","MAT.9.22.22":"இயேசு திரும்பி, அவளைப் பார்த்து மகளே, திடன்கொள், உன் விசுவாசம் உன்னை இரட்சித்தது என்றார். அந்நேரம் முதல் அந்த ஸ்திரீ சொஸ்தமானாள்.","MAT.15.28.28":"இயேசு அவளுக்குப் பிரதியுத்தரமாக ஸ்திரீயே, உன் விசுவாசம் பெரிது: நீ விரும்புகிறபடி உனக்கு ஆகக்கடவது என்றார். அந்நேரமே அவள் மகள் ஆரோக்கியமானாள்.","MAT.21.21.21":"இயேசு அவர்களை நோக்கி நீங்கள் சந்தேகப்படாமல் விசுவாசமுள்ளவர்களாயிருந்தால், இந்த அத்திமரத்திற்குச் செய்ததை நீங்கள் செய்வதுமல்லாமல், இந்த மலையைப்பார்த்து நீ பெயர்ந்து சமுத்திரத்திலே தள்ளுண்டுபோ என்று சொன்னாலும் அப்படியாகும் என்று, மெய்யாகவே உங்களுக்குச் சொல்லுகிறேன்.","MRK.10.52.52":"இயேசு அவனை நோக்கி நீ போகலாம், உன் விசுவாசம் உன்னை இரட்சித்தது என்றார். உடனே அவன் பார்வையடைந்து, வழியிலே இயேசுவுக்குப் பின்சென்றான். மாற்கு","LUK.1.45.45":"விசுவாசித்தவளே பாக்கியவதி, கர்த்தராலே அவளுக்குச் சொல்லப்பட்டவைகள் நிறைவேறும் என்றாள்.","LUK.18.42.42":"இயேசு அவனை நோக்கி நீ பார்வையடைவாயாக, உன் விசுவாசம் உன்னை இரட்சித்தது என்றார்.","JHN.3.36.36":"குமாரனிடத்தில் விசுவாசமாயிருக்கிறவன் நித்தியஜீவனை உடையவனாயிருக்கிறான்: குமாரனை விசுவாசியாதவனோ ஜீவனைக் காண்பதில்லை, தேவனுடைய கோபம் அவன்மேல் நிலைநிற்கும் என்றான். யோவான்","JHN.5.24.24":"என் வசனத்தைக் கேட்டு, என்னை அனுப்பினவரை விசுவாசிக்கிறவனுக்கு நித்தியஜீவன் உண்டு: அவன் ஆக்கினைத் தீர்ப்புக்குட்படாமல், மரணத்தைவிட்டுநீங்கி, ஜீவனுக்குட்பட்டிருக்கிறான் என்று மெய்யாகவே மெய்யாகவே உங்களுக்குச் சொல்லுகிறேன்.","JHN.6.40.40":"குமாரனைக் கண்டு, அவரிடத்தில் விசுவாசமாயிருக்கிறவன் எவனோ, அவன் நித்தியஜீவனை அடைவதும், நான் அவனைக் கடைசிநாளில் எழுப்புவதும், என்னை அனுப்பினவருடைய சித்தமாயிருக்கிறது என்றார்","JHN.7.38.38":"வேதவாக்கியம் சொல்லுகிறபடி என்னிடத்தில் விசுவாசமாயிருக்கிறவன் எவனோ, அவன் உள்ளத்திலிருந்து ஜீவத்தண்ணீருள்ள நதிகள் ஓடும் என்றார்.","JHN.11.25.25":"இயேசு அவளை நோக்கி நானே உயிர்த்தெழுதலும் ஜீவனுமாயிருக்கிறேன், என்னை விசுவாசிக்கிறவன் மரித்தாலும் பிழைப்பான்:","JHN.11.26.26":"உயிரோடிருந்து என்னை விசுவாசிக்கிறவனெவனும் என்றென்றைக்கும் மரியாமலும் இருப்பான்: இதை விசுவாசிக்கிறாயா என்றார்.","JHN.14.12.12":"மெய்யாகவே மெய்யாகவே நான் உங்களுக்குச் சொல்லுகிறேன்: நான் என் பிதாவினிடத்திற்குப் போகிறபடியினால், என்னை விசுவாசிக்கிறவன் நான் செய்கிற கிரியைகளைத் தானும் செய்வான், இவைகளைப்பார்க்கிலும் பெரிய கிரியைகளையும் செய்வான்.","ROM.3.22.22":"அது இயேசுகிறிஸ்துவைப்பற்றும் விசுவாசத்தினாலே பலிக்கும் தேவநீதியே: விசுவாசிக்கிற எவர்களுக்குள்ளும் எவர்கள்மேலும் அது பலிக்கும், வித்தியாசமேஇல்லை.","ROM.10.9.9":"என்னவென்றால், கர்த்தராகிய இயேசுவை நீ உன் வாயினாலே அறிக்கையிட்டு, தேவன் அவரை மரித்தோரிலிருந்து எழுப்பினாரென்று உன் இருதயத்திலே விசுவாசித்தால் இரட்சிக்கப்படுவாய்.","ROM.10.10.10":"நீதியுண்டாக இருதயத்திலே விசுவாசிக்கப்படும், இரட்சிப்புண்டாக வாயினாலே அறிக்கைபண்ணப்படும்.","ROM.10.11.11":"அவரை விசுவாசிக்கிறவன் எவனோ அவன் வெட்கப்படுவதில்லையென்று வேதம் சொல்லுகிறது.","ROM.10.13.13":"ஆதலால் கர்த்தருடைய நாமத்தைத் தொழுதுகொள்ளுகிற எவனும் இரட்சிக்கப்படுவான்.","GAL.3.26.26":"நீங்களெல்லாரும் கிறிஸ்து இயேசுவைப்பற்றும் விசுவாசத்தினால் தேவனுடைய புத்திரராயிருக்கிறீர்களே.","HEB.6.12.12":"உங்களுக்கு நம்பிக்கையின் பூரண நிச்சயமுண்டாகும்படி நீங்கள் யாவரும் முடிவுபரியந்தம் அப்படியே ஜாக்கிரதையைக் காண்பிக்கவேண்டுமென்று ஆசையாயிருக்கிறோம்.","HEB.10.35.35":"ஆகையால், மிகுந்த பலனுக்கேதுவான உங்கள் தைரியத்தை விட்டுவிடாதிருங்கள்.","HEB.10.36.36":"நீங்கள் தேவனுடைய சித்தத்தின்படி செய்து, வாக்குத்தத்தம்பண்ணப்பட்டதைப் பெறும்படிக்குப் பொறுமை உங்களுக்கு வேண்டியதாயிருக்கிறது.","JOB.11.18.18":"நம்பிக்கை உண்டாயிருக்கிறதினால் திடனாயிருப்பீர். தோண்டி ஆராய்ந்து சுகமாய்ப் படுத்துக்கொள்வீர்.","JOB.19.25.25":"என் மீட்பர் உயிரோடிருக்கிறார் என்றும், அவர் கடைசிநாளில் பூமியின்மேல் நிற்பார் என்றும் நான் அறிந்திருக்கிறேன்.","PSA.9.18.18":"எளியவன் என்றைக்கும் மறக்கப்படுவதில்லை: சிறுமைப்பட்டவர்களுடைய நம்பிக்கை ஒருபோதும் கெட்டுப் போவதில்லை.","PSA.16.9.9":"ஆகையால் என் இருதயம் பூரித்தது, என் மகிமை களிகூர்ந்தது: என் மாம்சமும் நம்பிக்கையோடே தங்கியிருக்கும்.","PSA.25.21.21":"உத்தமமும் நேர்மையும் என்னைக் காக்கக்கடவது: நான் உமக்குக் காத்திருக்கிறேன்.","PSA.27.13.13":"நானோ, ஜீவனுள்ளோர் தேசத்திலே கர்த்தருடைய நன்மையைக் காண்பேன் என்று விசுவாசியாதிருந்தால் கெட்டுப்போயிருப்பேன்.","PSA.42.5.5":"என் ஆத்துமாவே, நீ ஏன் கலங்குகிறாய்? ஏன் எனக்குள் தியங்குகிறாய்? தேவனை நோக்கிக் காத்திரு: அவர் சமுகத்து இரட்சிப்பினிமித்தம் நான் இன்னும் அவரைத் துதிப்பேன்.","PSA.71.5.5":"கர்த்தராகிய ஆண்டவரே, நீரே என் நோக்கமும், என் சிறுவயதுதொடங்கி என் நம்பிக்கையுமாயிருக்கிறீர்.","PSA.130.7.7":"இஸ்ரவேல் கர்த்தரை நம்பியிருப்பதாக: கர்த்தரிடத்தில் கிருபையும், அவரிடத்தில் திரளான மீட்பும் உண்டு.","PRO.10.28.28":"நீதிமான்களின் நம்பிக்கை மகிழ்ச்சியாகும்: துன்மார்க்கருடைய அபேட்சையோ அழியும்.","PRO.13.12.12":"நெடுங்காலமாய்க் காத்திருக்குதல் இருதயத்தை இளைக்கப்பண்ணும்: விரும்பினது வரும்போதோ ஜீவவிருட்சம்போல் இருக்கும்.","PRO.14.32.32":"துன்மார்க்கன் தன் தீமையிலே வாரிக்கொள்ளப்படுவான்: நீதிமானோ தன் மரணத்திலே நம்பிக்கையுள்ளவன்.","ISA.25.9.9":"அக்காலத்திலே, இதோ, இவரே நம்முடைய தேவன், இவருக்காகக் காத்திருந்தோம், இவர் நம்மை இரட்சிப்பார், இவரே கர்த்தர், இவருக்காகக் காத்திருந்தோம், இவருடைய இரட்சிப்பினால் களிகூர்ந்து மகிழுவோம் என்று சொல்லப்படும்.","ISA.49.23.23":"ராஜாக்கள் உன்னை வளர்க்கும் தந்தைகளும், அவர்களுடைய நாயகிகள் உன் கைத்தாய்களுமாயிருப்பார்கள், தரையிலே முகங்குப்புற விழுந்து உன்னைப் பணிந்து, உன் கால்களின் தூளை நக்குவார்கள், நான் கர்த்தர் எனக்குக் காத்திருக்கிறவர்கள் வெட்கப்படுவதில்லை என்பதை அப்பொழுது அறிந்துகொள்வாய்","JER.14.22.22":"புறஜாதிகளுடைய வீணான தேவர்களுக்குள் மழை வருஷிக்கப்பண்ணத்தக்கவர்கள் உண்டோ? அல்லது, வானங்கள் தானாய் மழைகளைக் கொடுக்குமோ? எங்கள் தேவனாகிய கர்த்தராயிருக்கிற நீரல்லவோ அதைச் செய்கிறவர், ஆகையால், உமக்குக் காத்திருக்கிறோம், தேவரீர் இவைகளையெல்லாம் உண்டுபண்ணினீர். எரேமியா","LAM.3.24.24":"கர்த்தர் என் பங்கு என்று என் ஆத்துமா சொல்லும், ஆகையால் அவரிடத்தில் நம்பிக்கைகொண்டிருப்பேன்.","HOS.2.15.15":"அவ்விடத்திலிருந்து அவளுக்கு அவளுடைய திராட்சத்தோட்டங்களையும், நம்பிக்கையின் வாசலாக ஆகோரின் பள்ளத் தாக்கையும் கொடுப்பேன், அப்பொழுது அவள் அங்கே, தன் இளவயதின் நாட்களிலும் தான் எகிப்துதேசத்திலிருந்து வந்த நாளிலும் பாடினதுபோல் பாடுவாள்.","MIC.7.7.7":"நானோவென்றால் கர்த்தரை நோக்கிக் கொண்டு, என் இரட்சிப்பின் தேவனுக்குக் காத்திருப்பேன். என் தேவன் என்னைக் கேட்டருளுவார்.","ROM.5.2.2":"அவர்மூலமாய் நாம் இந்தக் கிருபையில் பிரவேசிக்கும் சிலாக்கியத்தை விசுவாசத்தினால் பெற்று நிலைகொண்டிருந்து, தேவமகிமையை அடைவோமென்கிற நம்பிக்கையினாலே மேன்மைபாராட்டுகிறோம்.","ROM.15.4.4":"தேவவசனத்தினால் உண்டாகும் பொறுமையினாலும் ஆறுதலினாலும் நாம் நம்பிக்கையுள்ளவர்களாகும்படிக்கு, முன்பு எழுதியிருக்கிறவைகளெல்லாம் நமக்குப் போதனையாக எழுதியிருக்கிறது.","2CO.3.12.12":"நாங்கள் இப்படிப்பட்ட நம்பிக்கையை உடையவர்களாதலால், மிகவும் தாராளமாய்ப் பேசுகிறோம்.","GAL.5.5.5":"நாங்களோ நீதிகிடைக்குமென்று ஆவியைக்கொண்டு விசுவாசத்தினால் நம்பிக்கையோடே காத்திருக்கிறோம்.","EPH.1.18.18":"தாம் நம்மை அழைத்ததினாலே நமக்கு உண்டாயிருக்கிற நம்பிக்கை இன்னதென்றும், பரிசுத்தவான்களிடத்தில் தமக்கு உண்டாயிருக்கிற சுதந்தரத்தினுடைய மகிமையின் ஐசுவரியம் இன்னதென்றும்,","COL.1.5.5":"நம்முடைய கர்த்தராகிய இயேசுகிறிஸ்துவின் பிதாவாகிய தேவனுக்கு ஸ்தோத்திரஞ்செலுத்தி, எப்பொழுதும் உங்களுக்காக வேண்டுதல் செய்கிறோம்.","1TH.5.8.8":"பகலுக்குரியவர்களாகிய நாமோ தெளிந்தவர்களாயிருந்து, விசுவாசம் அன்பு என்னும் மார்க்கவசத்தையும், இரட்சிப்பின் நம்பிக்கையென்னும் தலைச்சீராவையும் தரித்துக்கொண்டிருக்கக்கடவோம்.","1TI.4.10.10":"இதினிமித்தம் பிரயாசப்படுகிறோம், நிந்தையும் அடைகிறோம்: ஏனெனில் எல்லா மனுஷருக்கும், விசேஷமாக விசுவாசிகளுக்கும் இரட்சகராகிய ஜீவனுள்ள தேவன்மேல் நம்பிக்கை வைத்திருக்கிறோம்.","TIT.1.2.2":"பிதாவாகிய தேவனாலும், நம்முடைய இரட்சகராயிருக்கிற கர்த்தராகிய இயேசுகிறிஸ்துவினாலும், கிருபையும் இரக்கமும் சமாதானமும் உண்டாவதாக.","TIT.3.7.7":"அவர் தமது இரட்சகராகிய இயேசுகிறிஸ்து மூலமாய், அந்தப் பரிசுத்த ஆவியை நம்மேல் சம்பூரணமாய்ப் பொழிந்தருளினார்.","HEB.6.18.18":"நமக்கு முன் வைக்கப்பட்ட நம்பிக்கையைப் பற்றிக்கொள்ளும்படி அடைக்கலமாய் ஓடிவந்த நமக்கு இரண்டு மாறாத விசேஷங்களினால் நிறைந்த ஆறுதலுண்டாகும்படிக்கு எவ்வளவேனும் பொய்யுரையாத தேவன் அப்படிச் செய்தார்.","1PE.1.21.21":"உங்கள் விசுவாசமும் நம்பிக்கையும் தேவன்மேலிருக்கும்படி, அவரை மரித்தோரிலிருந்து எழுப்பி, அவருக்கு மகிமையைக் கொடுத்தார்.","1PE.3.15.15":"கர்த்தராகிய தேவனை உங்கள் இருதயங்களில் பரிசுத்தம்பண்ணுங்கள்: உங்களிலிருக்கிற நம்பிக்கையைக்குறித்து உங்களிடத்தில் விசாரித்துக் கேட்கிற யாவருக்கும் சாந்தத்தோடும் வணக்கத்தோடும் உத்தரவுசொல்ல எப்பொழுதும் ஆயத்தமாயிருங்கள்.","1JN.3.3.3":"அவர்மேல் இப்படிப்பட்ட நம்பிக்கை வைத்திருக்கிறவனெவனும், அவர் சுத்தமுள்ளவராயிருக்கிறதுபோல தன்னையும் சுத்திகரித்துக்கொள்ளுகிறான்.","EXO.34.6.6":"கர்த்தர் அவனுக்கு முன்பாகக் கடந்துபோகிறபோது, அவர் கர்த்தர், கர்த்தர். இரக்கமும், கிருபையும், நீடிய சாந்தமும், மகா தயையும், சத்தியமுமுள்ள தேவன்.","DEU.7.13.13":"உன்மேல் அன்புவைத்து, உன்னை ஆசீர்வதித்து, உனக்குக் கொடுப்பேன் என்று உன் பிதாக்களுக்கு ஆணையிட்டுக்கொடுத்த தேசத்தில் உன்னைப் பெருகப்பண்ணி, உன் கர்ப்பக்கனியையும், உன் நிலத்தின் கனிகளாகிய உன் தானியத்தையும், உன் திராட்சரசத்தையும், உன் எண்ணெயையும், உன் மாடுகளின் பலனையும், உன் ஆட்டுமந்தைகளையும் ஆசீர்வதிப்பார்.","DEU.33.3.3":"மெய்யாகவே அவர் ஜனங்களைச் சிநேகிக்கிறார், அவருடைய பரிசுத்தவான்கள் எல்லாரும் உம்முடைய கையில் இருக்கிறார்கள், அவர்கள் உம்முடைய வார்த்தைகளினால் போதனையடைவார்கள்.","2CH.5.13.13":"அவர்கள் ஒருமிக்கப் பூரிகைகளை ஊதி, ஏகசத்தமாய் கர்த்தரைத் துதித்து ஸ்தோத்திரித்துப் பாடினார்கள், ஆசாரியர் பரிசுத்த ஸ்தலத்திலிருந்து புறப்படுகையிலும், பாடகர் பூரிகைகள் தாளங்கள் கீதவாத்தியங்களுடைய சத்தத்தை தொனிக்கப்பண்ணி, கர்த்தர் நல்லவர், அவர் கிருபை என்றுமுள்ளது என்று அவரை ஸ்தோத்திரிக்கையிலும், கர்த்தருடைய வீடாகிய தேவாலயம் மேகத்தினால் நிறையப்பட்டது.","NEH.9.17.17":"அவர்கள் செவிகொடுக்க மனதில்லாமலும், அவர்களிடத்திலே நீர் செய்த உம்முடைய அற்புதங்களை நினையாமலும் போய், தங்கள் கழுத்தைக் கடினப்படுத்தி, தங்கள் அடிமைத்தனத்துக்குத் திரும்பும்படிக்கு அவர்கள் கலகம்பண்ணி, ஒரு தலைவனை ஏற்படுத்தினார்கள். ஆகிலும் வெகுவாய் மன்னிக்கிறவரும், இரக்கமும், மனஉருக்கமும், நீடிய சாந்தமும், மகா கிருபையுமுள்ளவருமான தேவனாகிய நீர் அவர்களைக் கைவிடவில்லை.","PSA.5.7.7":"நானோ உமது மிகுந்த கிருபையினாலே உமது ஆலயத்துக்குள் பிரவேசித்து. உமது பரிசுத்த சந்நிதிக்கு நேரே பயபக்தியுடன் பணிந்து கொள்ளுவேன்.","PSA.13.5.5":"நான் உம்முடைய கிருபையின்மேல் நம்பிக்கையாயிருக்கிறேன்: உம்முடைய இரட்சிப்பினால் என் இருதயம் களிகூரும்.","PSA.17.7.7":"உம்மை நம்புகிறவர்களை அவர்களுக்கு விரோதமாய் எழும்புகிறவர்களினின்று உமது வலதுகரத்தினால் தப்புவித்து இரட்சிக்கிறவரே! உம்முடைய அதிசயமான கிருபையை விளங்கப்பண்ணும்.","PSA.25.6.6":"கர்த்தாவே, உம்முடைய இரக்கங்களையும் உம்முடைய காருணியங்களையும் நினைத்தருளும், அவைகள் அநாதிகாலமுதல் இருக்கிறதே.","PSA.31.7.7":"உமது கிருபையிலே களிகூர்ந்து மகிழுவேன்: நீர் என் உபத்திரவத்தைப் பார்த்து, என் ஆத்துமவியாகுலங்களை அறிந்திருக்கிறீர்.","PSA.32.10.10":"துன்மார்க்கனுக்கு அநேக வேதனைகளுண்டு: கர்த்தரை நம்பியிருக்கிறவனையோ கிருபை சூழ்ந்துகொள்ளும்.","PSA.33.5.5":"அவர் நீதியிலும் நியாயத்திலும் பிரியப்படுகிறார்: பூமி கர்த்தருடைய காருணியத்தினால் நிறைந்திருக்கிறது.","PSA.36.5.5":"கர்த்தாவே, உமது கிருபை வானங்களில் விளங்குகிறது: உமது சத்தியம் மேகமண்டலங்கள் பரியந்தம் எட்டுகிறது.","PSA.40.11.11":"கர்த்தாவே நீர் உம்முடைய இரக்கங்களை எனக்குக் கிடையாமற் போகப்பண்ணாதேயும்: உமது கிருபையும் உமது உண்மையும் எப்பொழுதும் என்னைக் காக்கக்கடவது.","PSA.42.8.8":"ஆகிலும் கர்த்தர் பகற்காலத்திலே தமது கிருபையைக் கட்டளையிடுகிறார்: இராக்காலத்திலே அவரைப் பாடும் பாட்டு என் வாயிலிருக்கிறது: என் ஜீவனுடைய தேவனை நோக்கி விண்ணப்பஞ்செய்கிறேன்.","PSA.52.8.8":"நானோ தேவனுடைய ஆலயத்தில் பச்சையான ஒலிவமரத்தைப்போலிருக்கிறேன், தேவனுடைய கிருபையை என்றென்றைக்கும் நம்பியிருக்கிறேன்.","PSA.57.10.10":"உமது கிருபை வானபரியந்தமும், உமது சத்தியம் மேகமண்டலங்கள்பரியந்தமும் எட்டுகிறது.","PSA.86.5.5":"ஆண்டவரே, நீர் நல்லவரும், மன்னிக்கிறவரும், உம்மை நோக்கிக் கூப்பிடுகிற யாவர்மேலும் கிருபை மிகுந்தவருமாயிருக்கிறீர்.","PSA.86.13.13":"நீர் எனக்குப் பாராட்டின உமது கிருபை பெரியது: என் ஆத்துமாவைத்தாழ்ந்த பாதாளத்திற்குத் தப்புவித்தீர்.","PSA.89.2.2":"கிருபை என்றென்றைக்கும் ஸ்திரப்பட்டிருக்கும்: உமது உண்மையை வானங்களிலே ஸ்தாபிப்பீர் என்றேன்.","PSA.89.33.33":"ஆனாலும் என் கிருபையை அவனை விட்டு விலக்காமலும், என் உண்மையில் பிசகாமலும் இருப்பேன்.","PSA.103.4.4":"உன் பிராணனை அழிவுக்கு விலக்கி மீட்டு, உன்னைக் கிருபையினாலும் இரக்கங்களினாலும் முடிசூட்டி,","PSA.103.13.13":"தகப்பன் தன் பிள்ளைகளுக்கு இரங்குகிறதுபோல, கர்த்தர் தமக்குப் பயந்தவர்களுக்கு இரங்குகிறார்.","PSA.106.1.1":"அல்லேலூயா, கர்த்தரைத் துதியுங்கள்: அவர் நல்லவர், அவர் கிருபை என்றுமுள்ளது.","PSA.107.1.1":"கர்த்தரைத் துதியுங்கள்: அவர் நல்லவர், அவர் கிருபை என்றுமுள்ளது.","PSA.118.1.1":"கர்த்தரைத் துதியுங்கள், அவர் நல்லவர்: அவர் கிருபை என்றுமுள்ளது.","PSA.138.2.2":"உமது பரிசுத்த ஆலுயத்திற்கு நேராக நான் பணிந்து, உமது கிருபையினிமித்தமும் உமது உண்மையினிமித்தமும் உமது நாமத்தைத் துதிப்பேன்: உமது சகல பிரஸ்தாபத்தைப்பார்க்கிலும் உமது வார்த்தையை நீர் மகிமைப்படுத்தியிருக்கிறீர்.","PSA.145.8.8":"கர்த்தர் இரக்கமும் மன உருக்கமும், நீடிய சாந்தமும் மிகுந்த கிருபையும் உள்ளவர்.","PSA.145.9.9":"கர்த்தர் எல்லார்மேலும் தயவுள்ளவர்: அவர் இரக்கங்கள் அவருடைய எல்லாக் கிரியைகளின்மேலுமுள்ளது.","PSA.146.8.8":"குருடரின் கண்களைக் கர்த்தர் திறக்கிறார்: மடங்கடிக்கப்பட்டவர்களைக் கர்த்தர் தூக்கிவிடுகிறார்: நீதிமான்களைக் கர்த்தர் சிநேகிக்கிறார்.","ISA.43.4.4":"நீ என் பார்வைக்கு அருமையானபடியினால் கனம்பெற்றாய், நானும் உன்னைச் சிநேகித்தேன், ஆதலால் உனக்குப் பதிலாக மனுஷர்களையும் உன் ஜீவனுக்குஈடாக ஜாதிகளையும் கொடுப்பேன்.","ISA.54.8.8":"அற்பகாலம் மூண்ட கோபத்தினால் என் முகத்தை இமைப்பொழுது உனக்கு மறைத்தேன், ஆனாலும் நித்திய கிருபையுடன் உனக்கு இரங்குவேன் என்று கர்த்தராகிய உன் மீட்பர் சொல்லுகிறார்.","ISA.63.9.9":"அவர்களுடைய எல்லா நெருக்கத்திலும் அவர் நெருக்கப்பட்டார், அவருடைய சமுகத்தின் தூதனானவர் அவர்களை இரட்சித்தார், அவர் தமது அன்பினிமித்தமும், தமது பரிதாபத்தினிமித்தமும் அவர்களை மீட்டு, பூர்வநாட்களிலெல்லாம் அவர்களைத் தூக்கிச்சுமந்துவந்தார்.","JER.32.41.41":"அவர்களுக்கு நன்மைசெய்யும்படி அவர்கள்மேல் சந்தோஷமாயிருந்து, என் முழு இருதயத்தோடும் என் முழு ஆத்துமாவோடும் அவர்களை இந்தத் தேசத்திலே நிச்சயமாய் நாட்டுவேன்.","JHN.14.21.21":"என் கற்பனைகளைப் பெற்றுக்கொண்டு அவைகளைக் கைக்கொள்ளுகிறவனே என்னிடத்தில் அன்பாயிருக்கிறான், என்னிடத்தில் அன்பாயிருக்கிறவன் என் பிதாவுக்கு அன்பாயிருப்பான்: நானும் அவனில் அன்பாயிருந்து, அவனுக்கு என்னை வெளிப்படுத்துவேன் என்றார்.","JHN.14.23.23":"இயேசு அவனுக்குப் பிரதியுத்தரமாக ஒருவன் என்னில் அன்பாயிருந்தால், அவன் என் வசனத்தைக் கைக்கொள்ளுவான், அவனில் என் பிதா அன்பாயிருப்பார்: நாங்கள் அவனிடத்தில் வந்து அவனோடே வாசம்பண்ணுவோம்.","JHN.15.10.10":"நான் என் பிதாவின் கற்பனைகளைக் கைக்கொண்டு அவருடைய அன்பிலே நிலைத்திருக்கிறதுபோல, நீங்களும் என் கற்பனைகளைக் கைக்கொண்டிருந்தால், என்னுடைய அன்பிலே நிலைத்திருப்பீர்கள்.","ROM.8.37.37":"இவையெல்லாவற்றிலேயும் நாம் நம்மில் அன்புகூறுகிறவராலே முற்றும் ஜெயங்கொள்ளுகிறவர்களாயிருக்கிறோமே.","2TH.3.5.5":"கர்த்தர் உங்கள் இருதயங்களைத் தேவனைப்பற்றும் அன்புக்கும் கிறிஸ்துவின் பொறுமைக்கும் நேராய் நடத்துவாராக.","1JN.4.7.7":"பிரியமானவர்களே, ஒருவரிலொருவர் அன்பாயிருக்கக்கடவோம்: ஏனெனில் அன்பு தேவனால் உண்டாயிருக்கிறது: அன்புள்ள எவனும் தேவனால் பிறந்து, அவரை அறிந்திருக்கிறான்.","1JN.4.8.8":"அன்பில்லாதவன் தேவனை அறியான்: தேவன் அன்பாகவே இருக்கிறார்.","1JN.4.11.11":"பிரியமானவர்களே, தேவன் இவ்விதமாய் நம்மிடத்தில் அன்புகூர்ந்திருக்க, நாமும் ஒருவரிடத்தில் ஒருவர் அன்புகூரக் கடனாளிகளாயிருக்கிறோம்.","REV.1.5.5":"உண்மையுள்ள சாட்சியும், மரித்தோரிலிருந்து முதற்பிறந்தவரும், பூமியின்ராஜாக்களுக்கு அதிபதியுமாகிய இயேசுகிறிஸ்துவினாலும் உங்களுக்குக் கிருபையும் சமாதானமும் உண்டாவதாக.","EXO.34.7.7":"ஆயிரம் தலைமுறைகளுக்கு இரக்கத்தைக் காக்கிறவர். அக்கிரமத்தையும் மீறுதலையும் பாவத்தையும் மன்னிக்கிறவர். குற்றவாளியைக் குற்றமற்றவனாக விடாமல், பிதாக்கள் செய்த அக்கிரமத்தைப் பிள்ளைகளிடத்திலும், பிள்ளைகளுடைய பிள்ளைகளிடத்திலும் மூன்றாம் நான்காம் தலைமுறைமட்டும் விசாரிக்கிறவர் என்று கூறினார்.","NUM.14.18.18":"என் ஆண்டவருடைய வல்லமை பெரிதாய் விளங்குவதாக.","2CH.30.9.9":"நீங்கள் கர்த்தரிடத்திற்குத் திரும்பினால், உங்கள் சகோதரரும் உங்கள் பிள்ளைகளும் தங்களைச் சிறைப்பிடித்தவர்களுக்கு முன்பாக இரக்கம் பெறுகிறதற்கும், இந்த தேசத்திற்குத் திரும்புகிறதற்கும் அது ஏதுவாகும், உங்கள் தேவனாகிய கர்த்தர் கிருபையும் இரக்கமுமுள்ளவர், நீங்கள் அவரிடத்திற்குத் திரும்பினால், அவர் தம்முடைய முகத்தை உங்களைவிட்டு விலக்குவதில்லை என்றார்கள்.","PSA.25.11.11":"கர்த்தாவே, என் அக்கிரமம் பெரிது: உம்முடைய நாமத்தினிமித்தம் அதை மன்னித்தருளும்.","PSA.32.5.5":"நான் என் அக்கிரமத்தை மறைக்காமல், என் பாவத்தை உமக்கு அறிவித்தேன்: என் மீறுதல்களைக் கர்த்தருக்கு அறிக்கையிடுவேன் என்றேன்: தேவரீர் என் பாவத்தின் தோஷத்தை மன்னித்தீர். (சேலா.)","PSA.51.1.1":"தேவனே, உமது கிருபையின்படி எனக்கு இரங்கும், உமது மிகுந்த இரக்கங்களின்படி என் மீறுதல்கள் நீங்க என்னைச் சுத்திகரியும்.","PSA.51.2.2":"என் அக்கிரமம் நீங்க என்னை முற்றிலும் கழுவி, என் பாவமற என்னைச் சுத்திகரியும்.","PSA.51.7.7":"நீர் என்னை ஈசோப்பினால் சுத்திகரியும், அப்பொழுது நான் சுத்தமாவேன்: என்னைக் கழுவியருளும், அப்பொழுது நான் உறைந்த மழையிலும் வெண்மையாவேன்.","PSA.65.3.3":"அக்கிரம விஷயங்கள் என்மேல்மிஞ்சி வல்லமைகொண்டது: தேவரீரோ எங்கள் மீறுதல்களை நிவிர்த்தியாக்குகிறீர்.","PSA.78.38.38":"அவரோ அவர்களை அழிக்காமல், இரக்கமுள்ளவராய் அவர்கள் அக்கிரமத்தை மன்னித்தார்: அவர் தமது உக்கிரம் முழுவதையும் எழுப்பாமல், அநேகந்தரம் தமது கோபத்தை விலக்கிவிட்டார்.","PSA.85.2.2":"உமது ஜனத்தின் அக்கிரமத்தை மன்னித்து, அவர்கள் பாவத்தையெல்லாம் மூடினீர். (சேலா.)","PSA.99.8.8":"எங்கள் தேவனாகிய கர்த்தாவே, நீர் அவர்களுக்கு உத்தரவு அருளினீர்: நீர் அவர்கள் கிரியைகளினிமித்தம் நீதி சரிக்கட்டினபோதிலும், அவர்களுக்கு மன்னிக்கிற தேவனாயிருந்தீர்.","ISA.55.7.7":"துன்மார்க்கன் தன் வழியையும், அக்கிரமக்காரன் தன் நினைவுகளையும் விட்டு, கர்த்தரிடத்தில் திரும்பக்கடவன், அவர் அவன்மேல் மனதுருகுவார், நம்முடைய தேவனிடத்திற்கே திரும்பக்கடவன், அவர் மன்னிக்கிறதற்குத் தயை பெருத்திருக்கிறார்.","JER.33.8.8":"அவர்கள் எனக்கு விரோதமாய்க் குற்றஞ்செய்த அவர்களுடைய எல்லா அக்கிரமங்களுக்கும் அவர்களை நீங்கலாக்கிச் சுத்திகரித்து, அவர்கள் எனக்கு விரோதமாய்க் குற்றஞ்செய்து, எனக்கு விரோதமாய்த் துரோகம்பண்ணின அவர்களுடைய எல்லா அக்கிரமங்களையும் மன்னிப்பேன்.","EZK.18.22.22":"அவன் செய்த எல்லா மீறுதல்களும் நினைக்கப்படுவதில்லை, அவன் தான் செய்த நீதியிலே பிழைப்பான்.","EZK.18.27.27":"துன்மார்க்கன் தான் செய்த துன்மார்க்கத்தைவிட்டு விலகி, நியாயத்தையும் நீதியையும் செய்வானேயாகில், அவன் தன் ஆத்துமாவைப் பிழைக்கப்பண்ணுவான்.","EZK.36.25.25":"அப்பொழுது நான் உங்கள்மேல் சுத்தமான ஜலம் தெளிப்பேன், நான் உங்களுடைய எல்லா அசுத்தங்களையும் உங்களுடைய எல்லா நரகலான விக்கிரகங்களையும் நீக்கி உங்களைச் சுத்தமாக்குவேன், நீங்கள் சுத்தமாவீர்கள்.","MAT.6.12.12":"எங்கள் கடனாளிகளுக்கு நாங்கள் மன்னிக்கிறதுபோல எங்கள் கடன்களை எங்களுக்கு மன்னியும்.","MAT.9.6.6":"பூமியிலே பாவங்களை மன்னிக்க மனுஷகுமாரனுக்கு உண்டென்பதை நீங்கள் அறியவேண்டும் என்று சொல்லி, திமிர்வாதக்காரனை நோக்கி நீ எழுந்து, உன் படுக்கையை எடுத்துக்கொண்டு, உன் வீட்டுக்குப் போ என்றார்.","MAT.12.31.31":"ஆதலால், நான் உங்களுக்குச் சொல்லுகிறேன் எந்தப் பாவமும் எந்தச் தூஷணமும் மனுஷருக்கு மன்னிக்கப்படும்: ஆவியானவருக்கு விரோதமான தூஷணமோ மனுஷருக்கு மன்னிக்கப்படுவதில்லை.","MAT.18.21.21":"அப்பொழுது, பேதுரு அவரிடத்தில் வந்து ஆண்டவரே, என் சகோதரன் எனக்கு விரோதமாய்க் குற்றஞ்செய்து வந்தால், நான் எத்தனைதரம் மன்னிக்கவேண்டும்? ஏழுதரமட்டுமோ என்று கேட்டான்.","MAT.18.22.22":"அதற்கு இயேசு ஏழுதரமாத்திரம் அல்ல, ஏழெழுபதுதரமட்டும் என்று உனக்குச் சொல்லுகிறேன்.","MRK.11.25.25":"நீங்கள் நின்று ஜெபம் பண்ணும்போது, ஒருவன் பேரில் உங்களுக்கு யாதொரு குறை உண்டாயிருக்குமானால், பரலோகத்திலிருக்கிற உங்கள் பிதா உங்கள் தப்பிதங்களை உங்களுக்கு மன்னிக்கும்படி, அந்தக் குறையை அவனுக்கு மன்னியுங்கள்.","LUK.5.24.24":"பூமியிலே பாவங்களை மன்னிக்க மனுஷகுமாரனுக்கு உண்டென்பதை நீங்கள் அறியவேண்டுமென்று சொல்லி, திமிர்வாதக்காரனை நோக்கி நீ எழுந்து உன் படுக்கையை எடுத்துக் கொண்டு, உன் வீட்டுக்குப் போ என்று உனக்குச் சொல்லுகிறேன் என்றார்.","LUK.7.47.47":"ஆதலால் நான் எனக்குச் சொல்லுகிறேன் இவள் செய்த அநேக பாவங்கள் மன்னிக்கப்பட்டது: இவள் மிகவும் அன்பு கூர்ந்தாளே. எவனுக்குக் கொஞ்சம் மன்னிக்கப்படுகிறதோ, அவன் கொஞ்சமாய் அன்புகூருவான் என்ற சொல்லி:","LUK.17.3.3":"உங்களைக்குறித்து எச்சரிக்கையாயிருங்கள். உன் சகோதரன் உனக்கு விரோதமாய்க் குற்றஞ்செய்தால், அவனைக் கடிந்துகொள்: அவன் மனஸ்தாபப்பட்டால், அவனுக்கு மன்னிப்பாயாக.","LUK.23.34.34":"அப்பொழுது இயேசு பிதாவே, இவர்களுக்கு மன்னியும், தாங்கள் செய்கிறது இன்னதென்று அறியாதிருக்கிறார்களே என்றார். அவருடைய வஸ்திரங்களை அவர்கள் பங்கிட்டுச் சீட்டுப்போட்டார்கள்.","LUK.24.47.47":"அன்றியும் மனந்திரும்புதலும் பாவமன்னிப்பும் எருசலேம் தொடங்கிச் சகல தேசத்தாருக்கும் அவருடைய நாமத்தினாலே பிரசங்கிக்கப்படவும் வேண்டியது.","JHN.8.11.11":"அதற்கு அவள் இல்லை, ஆண்டவரே, என்றாள். இயேசு அவளை நோக்கி நானும் உன்னை ஆக்கினைக்குள்ளாகத் தீர்க்கிறதில்லை: நீ போ, இனிப் பாவஞ்செய்யாதே என்றார்.","ACT.2.38.38":"பேதுரு அவர்களை நோக்கி நீங்கள் மனந்திரும்பி, ஒவ்வொருவரும் பாவமன்னிப்புக்கென்று இயேசுகிறிஸ்துவின் நாமத்தினாலே ஞானஸ்நானம் பெற்றுக்கொள்ளுங்கள், அப்பொழுது பரிசுத்தஆவியின் வரத்தைப் பெறுவீர்கள்.","ACT.5.31.31":"இஸ்ரவேலுக்கு மனந்திரும்புதலையும் பாவமன்னிப்பையும் அருளுகிறதற்காக, அவரை அதிபதியாகவும் இரட்சகராகவும் தமது வலதுகரத்தினாலே உயர்த்தினார்.","ACT.13.38.38":"ஆதலால் சகோதரரே, இவர் மூலமாய் உங்களுக்குப் பாவமன்னிப்பு உண்டாகும் என்று அறிவிக்கப்படுகிறதென்றும்,","ACT.26.18.18":"அவர்கள் என்னைப் பற்றும் விசுவாசத்தினாலே பாவமன்னிப்பையும் பரிசுத்தமாக்கப்பட்டவர்களுக்குரிய சுதந்தரத்தையும் பெற்றுக்கொள்ளும்படியாக, அவர்கள் இருளைவிட்டு ஔியினிடத்திற்கும், சாத்தானுடைய அதிகாரத்தைவிட்டுத் தேவனிடத்திற்கும் திரும்பும்படிக்கு நீ அவர்களுடைய கண்களைத் திறக்கும்பொருட்டு, இப்பொழுது உன்னை அவர்களிடத்திற்கு அனுப்புகிறேன் என்றார்.","ROM.3.24.24":"இலவசமாய் அவருடைய கிருபையினாலே கிறிஸ்து இயேசுவிலுள்ள மீட்பைக்கொண்டு நீதிமான்களாக்கப்படுகிறார்கள்:","2CO.5.19.19":"அதென்னவெனில், தேவன் உலகத்தாருடைய பாவங்களை எண்ணாமல், கிறிஸ்துவுக்குள் அவர்களைத் தமக்கு ஒப்புரவாக்கி, ஒப்புரவாக்குதலின் உபதேசத்தை எங்களிடத்தில் ஓப்புவித்தார்.","HEB.9.14.14":"நித்திய ஆவியினாலே தம்மைத்தாமே பழுதற்ற பலியாகத் தேவனுக்கு ஒப்புக்கொடுத்த கிறிஸ்துவினுடைய இரத்தம் ஜீவனுள்ள தேவனுக்கு ஊழியஞ்செய்வதற்கு உங்கள் மனச்சாட்சியைச் செத்த கிரியைகளறச் சுத்திகரிப்பது எவ்வளவு நிச்சயம்!","1JN.1.7.7":"அவர் ஔியிலிருக்கிறதுபோல நாமும் ஔியிலே நடந்தால் ஒருவரோடொருவர் ஐக்கியப்பட்டிருப்போம்: அவருடைய குமாரனாகிய இயேசுகிறிஸ்துவின் இரத்தம் சகல பாவங்களையும் நீக்கி, நம்மைச் சுத்திகரிக்கும்.","1JN.2.1.1":"என் பிள்ளைகளே, நீங்கள் பாவஞ்செய்யாதபடிக்கு இவைகளை உங்களுக்கு எழுதுகிறேன்: ஒருவன் பாவஞ்செய்வானானால் நீதிபரராயிருக்கிற இயேசுகிறிஸ்து நமக்காகப் பிதாவினிடத்தில் பரிந்து பேசுகிறவராயிருக்கிறார்.","1JN.2.2.2":"நம்முடைய பாவங்களை நிவிர்த்தி செய்கிற கிருபாதாரபலி அவரே: நம்முடைய பாவங்களை மாத்திரம் அல்ல, சர்வலோகத்தின் பாவங்களையும் நிவிர்த்தி செய்கிற பலியாயிருக்கிறார்.","1JN.2.12.12":"பிள்ளைகளே, அவருடைய நாமத்தினிமித்தம் உங்கள் பாவங்கள் மன்னிக்கப்பட்டிருக்கிறதினால் உங்களுக்கு எழுதுகிறேன்.","1KI.8.57.57":"நம்முடைய தேவனாகிய கர்த்தர் நம்மைக் கைவிடாமலும், நம்மை நெகிழவிடாமலும், அவர் நம்முடைய பிதாக்களோடு இருந்ததுபோல, நம்மோடும் இருந்து,","PSA.10.14.14":"அதைப் பார்த்திருக்கிறீரே! உபத்திரவத்தையும் குரோதத்தையும் கவனித்திருக்கிறீரே: நீர் பதிலளிப்பீர்: ஏழையானவன் தன்னை உமக்கு ஒப்புவிக்கிறான்: திக்கற்ற பிள்ளைகளுக்குச் சகாயர் நீரே.","PSA.22.24.24":"உபத்திரவப்பட்டவனுடைய உபத்திரவத்தை அவர் அற்பமாயெண்ணாமலும் அருவருக்காமலும், தம்முடைய முகத்தை அவனுக்கு மறைக்காமலுமிருந்து, தம்மைநோக்கி அவன் கூப்பிடுகையில் அவனைக் கேட்டருளினார்.","PSA.25.16.16":"என்மேல் நோக்கமாகி, எனக்கு இரங்கும்: நான் தனித்தவனும் சிறுமைப்படுகிறவனுமாயிருக்கிறேன்.","PSA.34.15.15":"கர்த்தருடைய கண்கள் நீதிமான்கள்மேல் நோக்கமாயிருக்கிறது: அவருடைய செவிகள் அவர்கள் கூப்பிடுதலுக்குத் திறந்திருக்கிறது.","PSA.38.15.15":"கர்த்தாவே, உமக்குக் காத்திருக்கிறேன்: என் தேவனாகிய ஆண்டவரே, நீர் மறுஉத்தரவு கொடுப்பீர்.","PSA.40.1.1":"கர்த்தருக்காகப் பொறுமையுடன் காத்திருந்தேன்: அவர் என்னிடமாய்ச் சாய்ந்து, என் கூப்பிடுதலைக் கேட்டார்.","PSA.71.9.9":"முதிர்ந்தவயதில் என்னைத் தள்ளிவிடாமலும், என் பெலன் ஒடுங்கும்போது என்னைக் கைவிடாமலும் இரும்.","PSA.94.14.14":"கர்த்தர் தம்முடைய ஜனத்தை நெகிழவிடாமலும், தம்முடைய சுதந்தரத்தைக் கைவிடாமலும் இருப்பார்.","PSA.102.17.17":"அப்பொழுது ஜாதிகள் கர்த்தருடைய நாமத்துக்கும், பூமியிலுள்ள ராஜாக்களெல்லாரும் உம்முடைய மகிமைக்கும் பயப்படுவார்கள்.","PSA.146.9.9":"பரதேசிகளைக் கர்த்தர் காப்பாற்றுகிறார்: அவர் திக்கற்ற பிள்ளையையும் விதவையையும் ஆதரிக்கிறார்: துன்மார்க்கரின் வழியையோ கவிழ்த்துப்போடுகிறார்.","ISA.41.18.18":"உயர்ந்த மேடுகளில் ஆறுகளையும், பள்ளத்தாக்குகளின் நடுவே ஊற்றுகளையும் திறந்து, வனாந்தரத்தைத் தண்ணீர்த் தடாகமும், வறண்ட பூமியை நீர்க்கேணிகளுமாக்கி,","ISA.49.14.14":"சீயோனோ கர்த்தர் என்னைக் கைவிட்டார், ஆண்டவர் என்னை மறந்தார் என்று சொல்லுகிறாள்.","ISA.54.5.5":"உன் சிருஷ்டிகரே உன் நாயகர், சேனைகளின் கர்த்தர் என்பது அவருடைய நாமம், இஸ்ரவேலின் பரிசுத்தர் உன் மீட்பர், அவர் சர்வபூமியின் தேவன் என்னப்படுவார்.","ISA.58.9.9":"அப்பொழுது நீ கூப்பிடுவாய், கர்த்தர் மறுஉத்தரவு கொடுப்பார், நீ சத்தமிடுவாய் இதோ, நான் இருக்கிறேன் என்று சொல்லுவார். நுகத்தடியையும், விரல் நீட்டுதலையும், நிபச்சொல்லையும், நீ உன் நடுவிலிருந்து அகற்றி,","LAM.3.31.31":"ஆண்டவர் என்றென்றைக்கும் கை விடமாட்டார்.","REV.3.20.20":"இதோ, வாசற்படியிலே நின்று தட்டுகிறேன்: ஒருவன் என் சத்தத்தைக்கேட்டு, கதவைத் திறந்தால், அவனிடத்தில் நான் பிரவேசித்து, அவனோடே போஜனம்பண்ணுவேன், அவனும் என்னோடே போஜனம்பண்ணுவான்.","GEN.12.3.3":"உன்னை ஆசீர்வதிக்கிறவர்களை ஆசீர்வதிப்பேன், உன்னைச் சபிக்கிறவனைச் சபிப்பேன். பூமியிலுள்ள வம்சங்களெல்லாம் உனக்குள் ஆசீர்வதிக்கப்படும் என்றார்.","GEN.18.19.19":"கர்த்தர் ஆபிரகாமுக்குச் சொன்னதை நிறைவேற்றும்படியாய் அவன் தன் பிள்ளைகளுக்கும், தனக்குப் பின்வரும் தன் வீட்டாருக்கும் நீங்கள் நீதியையும் நியாயத்தையும் செய்து, கர்த்தருடைய வழியைக் காத்து நடவுங்கள் என்று கட்டளையிடுவான் என்பதை அறிந்திருக்கிறேன் என்றான்.","DEU.11.19.19":"நீங்கள் என் வார்த்தைகளை உங்கள் இருதயத்திலும் உங்கள் ஆத்துமாவிலும் பதித்து, அவைகளை உங்கள் கையின்மேல் அடையாளமாகக் கட்டி, உங்கள் கண்களின் நடுவே ஞாபகக்குறியாக வைத்து,","DEU.30.19.19":"நான் ஜீவனையும் மரணத்தையும், ஆசீர்வாதத்தையும் சாபத்தையும் உனக்குமுன் வைத்தேன் என்று உங்கள்மேல் வானத்தையும் பூமியையும் இன்று சாட்சி வைக்கிறேன், ஆகையால், நீயும் உன் சந்ததியும் பிழைக்கும்படிக்கு, நீ ஜீவனைத் தெரிந்துகொண்டு,","1SA.2.30.30":"ஆகையால் இஸ்ரவேலின் தேவனாகிய கர்த்தர் சொல்லுகிறதாவது உன் வீட்டாரும் உன் பிதாவின் வீட்டாரும் என்றைக்கும் என் சந்நிதியில் நடந்து கொள்வார்கள் என்று நான் நிச்சயமாய்ச் சொல்லியிருந்தும், இனி அது எனக்குத் துாரமாயிருப்பதாக. என்னைக் கனம்பண்ணுகிறவர்களை நான் கனம் பண்ணுவேன். என்னை அசட்டைபண்ணுகிறவர்கள் கனஈனப்படுவார்கள் எனறு கர்த்தர் சொல்லுகிறார்.","PSA.115.14.14":"கர்த்தர் உங்களையும் உங்கள் பிள்ளைகளையும் வர்த்திக்கப்பண்ணுவார்.","PSA.115.15.15":"வானத்தையும் பூமியையும் படைத்த கர்த்தராலே நீங்கள் ஆசீர்வதிக்கப்பட்டவர்கள்.","PSA.127.4.4":"வாலவயதின் குமாரர் பலவான் கையிலுள்ள அம்புகளுக்கு ஒப்பாயிருக்கிறார்கள்.","PSA.144.12.12":"அப்பொழுது எங்கள் குமாரர் இளமையில் ஓங்கிவளருகிற விருட்சக்கன்றுகளைப்போலவும், எங்கள் குமாரத்திகள் சித்திரந்தீர்ந்த அரமனை மூலைக்கற்களைப்போலவும் இருப்பார்கள்.","PRO.20.7.7":"நீதிமான் தன் உத்தமத்திலே நடக்கிறான்: அவனுக்குப்பிறகு அவன் பிள்ளைகளும் பாக்கியவான்களாயிருப்பார்கள்.","PRO.23.24.24":"நீதிமானுடைய தகப்பன் மிகவும் களிகூருவான்: ஞானமுள்ள பிள்ளையைப் பெற்றவன் அவனால் மகிழுவான்.","PRO.29.17.17":"உன் மகனைச் சிட்சைசெய், அவன் உனக்கு ஆறதல்செய்வான், உன் ஆத்துமாவுக்கு ஆனந்தத்தையும் உண்டாக்குவான்.","ISA.59.21.21":"உன்மேலிருக்கிற என் ஆவியும், நான் உன் வாயில் அருளிய என் வார்த்தைகளும், இதுமுதல் என்றென்றைக்கும் உன் வாயிலிருந்தும், உன் சந்ததியின் வாயிலிருந்தும், உன் சந்ததியினுடைய சந்ததியின் வாயிலிருந்தும் நீங்குவதில்லையென்று கர்த்தர் சொல்லுகிறார், இது எனக்கு அவர்களோடிருக்கும் என் உடன்படிக்கையென்று கர்த்தர் சொல்லுகிறார். ஏசாயா","MAT.19.14.14":"இயோசுவோ சிறு பிள்ளைகள் என்னிடத்தில் வருகிறதற்கு இடங்கொடுங்கள்: அவர்களைத் தடைபண்ணாதிருங்கள்: பரலோகராஜ்யம் அப்படிப்பட்டவர்களுடையது என்று சொல்லி,","MAT.19.6.6":"இப்படி இருக்கிறபடியினால், அவர்கள் இருவராயிராமல், ஒரே மாம்சமாயிருக்கிறார்கள்: ஆகையால், தேவன் இணைத்ததை மனுஷன் பிரிக்காதிருக்கக்கடவன் என்றார்.","ACT.2.39.39":"வாக்குத்தத்தமானது உங்களுக்கும், உங்கள் பிள்ளைகளுக்கும் நம்முடைய தேவனாகிய கர்த்தர் வரவழைக்கும் தூரத்திலுள்ள யாவருக்கும் உண்டாயிருக்கிறது என்று சொல்லி:","EPH.6.4.4":"பிதாக்களே, நீங்களும் உங்கள் பிள்ளைகளைக் கோபப்படுத்தாமல், கர்த்தருக்கேற்ற சிட்சையிலும் போதனையிலும் அவர்களை வளர்ப்பீர்களாக.","COL.3.21.21":"பிதாக்களே, உங்கள் பிள்ளைகள் திடனற்றுப்போகாதபடி, அவர்களுக்குக் கோபமூட்டாதிருங்கள்.","3JN.1.4.4":"என் பிள்ளைகள் சத்தியத்திலே நடக்கிறார்கள் என்று நான் கேள்விப்படுகிற சந்தோஷத்திலும் அதிகமான சந்தோஷம் எனக்கு இல்லை.","GEN.24.27.27":"என் எஜமானாகிய ஆபிரகாமின் தேவனாயிருக்கிற கர்த்தருக்கு ஸ்தோத்திரம். அவர் தம்முடைய கிருபையையும், தம்முடைய உண்மையையும் என் எஜமானை விட்டு நீக்கவில்லை. நான் பிரயாணம்பண்ணிவருகையில், கர்த்தர் என் எஜமானுடைய சகோதரர் வீட்டுக்கு என்னை அழைத்துக்கொண்டுவந்தார் என்றான்.","EXO.15.13.13":"நீர் மீட்டுக்கொண்ட இந்த ஜனங்களை உமது கிருபையினாலே அழைத்து வந்தீர். உம்முடைய பரிசுத்த வாசஸ்தலத்துக்கு நேராக அவர்களை உமது பலத்தினால் வழிநடத்தினீர்.","PSA.5.8.8":"கர்த்தாவே, என் சத்துருக்களினிமித்தம் என்னை உம்முடைய நீதியிலே நடத்தி, எனக்குமுன்பாக உம்முடைய வழியைச் செவ்வைப்படுத்தும்.","PSA.25.8.8":"கர்த்தர் நல்லவரும் உத்தமருமாயிருக்கிறார்: ஆகையால் பாவிகளுக்கு வழியைத் தெரிவிக்கிறார்.","PSA.27.11.11":"கர்த்தாவே, உமது வழியை எனக்குப் போதித்து, என் எதிராளிகளினிமித்தம் செவ்வையான பாதையில் என்னை நடத்தும்.","PSA.61.2.2":"என் இருதயம் தொய்யும்போது பூமியின் கடையாந்தரத்திலிருந்து உம்மை நோக்கிக் கூப்பிடுவேன்: எனக்கு எட்டாத உயரமான கன்மலையில் என்னைக் கொண்டுபோய்விடும்.","PSA.78.52.52":"தம்முடைய ஜனங்களை ஆடுகளைப்போல் புறப்படப்பண்ணி, அவர்களை வனாந்தரத்திலே மந்தையைப்போல் கூட்டிக்கொண்டுபோய்:","PRO.4.11.11":"ஞானமார்க்கத்தை நான் உனக்குப் போதித்தேன்: செவ்வையான பாதைகளிலே உன்னை நடத்தினேன்.","PRO.11.3.3":"செம்மையானவர்களுடைய உத்தமம் அவர்களை நடத்தும்: துரோகிகளின் மாறுபாடோ அவர்களைப் பாழாக்கும்.","PRO.20.24.24":"கர்த்தராலே மனுஷருடைய நடைகள் வாய்க்கும்: ஆகையால் மனுஷன் தன் வழியை அறிந்துகொள்வதெப்படி?","ISA.40.11.11":"மேய்ப்பனைப்போலத் தமது மந்தையை மேய்ப்பார், ஆட்டுக்குட்டிகளைத் தமது புயத்தினால் சேர்த்து, தமது மடியிலே சுமந்து, கறவலாடுகளை மெதுவாய் நடத்துவார்.","JER.10.23.23":"கர்த்தாவே, மனுஷனுடைய வழி அவனாலே ஆகிறதல்லவென்றும், தன் நடைகளை நடத்துவது நடக்கிறவனாலே ஆகிறதல்லவென்றும் அறிவேன்.","JHN.10.3.3":"வாசலைக் காக்கிறவன் அவனுக்குத் திறக்கிறான்: ஆடுகளும் அவன் சத்தத்துக்குச் செவிகொடுக்கிறது. அவன் தன்னுடைய ஆடுகளைப் பேர்சொல்லிக் கூப்பிட்டு, அவைகளை வெளியே நடத்திக் கொண்டுபோகிறான்.","JHN.10.4.4":"அவன் தன்னுடைய ஆடுகளை வெளியே விட்டபின்பு, அவைகளுக்கு முன்பாக நடந்துபோகிறான், ஆடுகள் அவன் சத்தத்தை அறிந்திருக்கிறபடியினால் அவனுக்குப் பின்செல்லுகிறது.","GAL.5.16.16":"பின்னும் நான் சொல்லுகிறதென்னவென்றால், ஆவிக்கேற்படி நடந்துகொள்ளுங்கள், அப்பொழுது மாம்ச இச்சையை நிறைவேற்றாதிருப்பீர்கள்.","GAL.5.18.18":"ஆவியினால் நடத்தப்படுவீர்களானால், நீங்கள் நியாயப்்பிரமாணத்திற்குக் கீழ்ப்பட்டவர்களல்ல.","GAL.5.25.25":"நாம் ஆவியினாலே பிழைத்திருந்தால், ஆவிக்கேற்றபடி நடக்கவும் கடவோம்.","JOB.8.7.7":"உம்முடைய துவக்கம் அற்பமாயிருந்தாலும், உம்முடைய முடிவு சம்பூரனமாயிருக்கும்.","JOB.42.12.12":"கர்த்தர் யோபின் முன்னிலைமையைப் பார்க்கிலும் அவன் பின்னிலைமையை ஆசீர்வதித்தார். பதினாலாயிரம் ஆடுகளும், ஆறாயிரம் ஒட்டகங்களும், ஆயிரம் ஏர்களும், ஆயிரம் கழுதைகளும் அவனுக்கு உண்டாயின.","PSA.37.18.18":"உத்தமர்களின் நாட்களைக் கர்த்தர் அறிந்திருக்கிறார்: அவர்கள் சுதந்தரம் என்றென்றைக்கும் இருக்கும்.","PSA.57.2.2":"எனக்காக யாவையும் செய்து முடிக்கப்போகிற தேவனாகிய உன்னதமான தேவனை நோக்கிக் கூப்பிடுவேன்.","PSA.92.12.12":"நீதிமான் பனையைப்போல் செழித்து, லீபனோனிலுள்ள கேதுருவைப்போல் வளருவான்.","ECC.11.1.1":"உன் ஆகாரத்தைத் தண்ணீர்கள்மேல் போடு, அநேக நாட்களுக்குப் பின்பு அதின் பலனைக் காண்பாய்.","ISA.65.17.17":"இதோ, நான் புதிய வானத்தையும் புதிய பூமியையும் சிருஷ்டிக்கிறேன், முந்தினவைகள் இனி நினைக்கப்படுவதுமில்லை, மனதிலே தோன்றுவதுமில்லை.","MAT.6.34.34":"ஆகையால், நாளைக்காகக் கவலைப்படாதிருங்கள்: நாளையத்தினம் தன்னுடையவைகளுக்காகக் கவலைப்படும். அந்தந்த நாளுக்கு அதினதின் பாடுபோதும். மத்தேயு","JAS.4.15.15":"ஆதலால் ஆண்டவருக்குச் சித்தமானால், நாங்களும் உயிரோடிருந்தால், இன்னின்னதைச் செய்வோம் என்று சொல்லவேண்டும்.","1PE.1.4.4":"அவர், இயேசுகிறிஸ்து மரித்தோரிலிருந்து எழுந்ததினாலே, அழியாததும் மாசற்றதும் வாடாததுமாகிய சுதந்தரத்திற்கேதுவாக, ஜீவனுள்ள நம்பிக்கை உண்டாகும்படி, தமது மிகுந்த இரக்கத்தின்படியே நம்மை மறுபடியும் ஜெநிப்பித்தார்.","PHP.3.13.13":"சகோதரரே, அதைப் பிடித்துக்கொண்டேனென்று நான் எண்ணுகிறதில்லை: ஒன்று செய்கிறேன், பின்னானவைகளை மறந்து, முன்னானவைகளை நாடி,","PHP.3.14.14":"கிறிஸ்து இயேசுவுக்குள் தேவன் அழைத்த பரம அழைப்பின் பந்தயப்பொருளுக்காக இலக்கை நோக்கித் தொடருகிறேன்.","JOB.5.19.19":"ஆறு இக்கட்டுகளுக்கு உம்மை நீங்கலாக்குவார். ஏழாவதிலும் பொல்லாப்பு உம்மைத் தொடாது.","JOB.23.10.10":"ஆனாலும் நான் போகும் வழியை அவர் அறிவார். அவர் என்னைச் சோதித்தபின் பொன்னாக விளங்குவேன்.","PSA.9.9.9":"சிறுமைப்பட்டவனுக்குக் கர்த்தர் அடைக்கலமானவர்: நெருக்கப்படுகிறகாலங்களில் அவரே தஞ்சமானவர்.","PSA.37.39.39":"நீதிமான்களுடைய இரட்சிப்பு கர்த்தரால் வரும்: இக்கட்டுக்காலத்தில் அவரே அவர்கள் அடைக்கலம்.","PSA.56.8.8":"என் அலைச்சல்களை தேவரீர் எண்ணியிருக்கிறீர்: என் கண்ணீரை உம்முடைய துருத்தியில் வையும்: அவைகள் உம்முடைய கணக்கில் அல்லவோ இருக்கிறது?","PSA.66.12.12":"மனுஷரை எங்கள் தலையின்மேல் ஏறிப்போகப்பண்ணினீர்: தீயையும் தண்ணீரையும் கடந்துவந்தோம்: செழிப்பான இடத்தில் எங்களைக் கொண்டுவந்து விட்டீர்.","PSA.71.20.20":"அநேக இக்கட்டுகளையும் ஆபத்துகளையும் காணும்படி செய்த என்னை நீர் திரும்பவும் உயிர்ப்பித்து, திரும்பவும் என்னைப் பூமியின் பாதாளங்களிலிருந்து ஏறப்பண்ணுவீர்.","PSA.86.7.7":"நான் துயரப்படுகிற நாளில் உம்மை நோக்கிக் கூப்பிடுவேன்: நீர் என்னைக் கேட்டருளுவீர்.","PSA.116.7.7":"என் ஆத்துமாவே, கர்த்தர் உனக்கு நன்மை செய்தபடியால், நீ உன் இளைப்பாறுதலுக்குத் திரும்பு.","PSA.118.5.5":"நெருக்கத்திலிருந்து கர்த்தரை நோக்கிக் கூப்பிட்டேன், கர்த்தர் என்னைக் கேட்டருளி விசாலத்திலே வைத்தார்.","PSA.145.14.14":"கர்த்தர் விழுகிற யாவரையும் தாங்கி, மடங்கடிக்கப்பட்ட யாவரையும் தூக்கிவிடுகிறார்.","PRO.24.10.10":"ஆபத்துக்காலத்தில் நீ சோர்ந்து போவாயானால், உன் பெலன் குறுகினது.","MAT.5.4.4":"துயரப்படுகிறவர்கள் பாக்கியவான்கள்: அவர்கள் ஆறுதலடைவார்கள்.","JHN.16.20.20":"மெய்யாகவே மெய்யாகவே நான் உங்களுக்குச் சொல்லுகிறேன் நீங்கள் அழுது புலம்புவீர்கள், உலகமோ சந்தோஷப்படும்: நீங்கள் துக்கப்படுவீர்கள், ஆனாலும் உங்கள் துக்கம் சந்தோஷமாக மாறும்.","GEN.26.12.12":"ஈசாக்கு அந்தத் தேசத்தில் விதை விதைத்தான். கர்த்தர் அவனை ஆசீர்வதித்ததினால் அந்த வருஷத்தில் நூறுமடங்கு பலன் அடைந்தான்.","GEN.39.2.2":"கர்த்தர் யோசேப்போடே இருந்தார், அவன் காரியசித்தியுள்ளவனானான். அவன் எகிப்தியனாகிய தன் எஜமானுடைய வீட்டிலே இருந்தான்.","DEU.28.1.1":"இன்று நான் உனக்கு விதிக்கிற உன் தேவனாகிய கர்த்தருடைய கட்டளைகளின்படியெல்லாம் செய்ய நீ கவனமாயிருக்கும்படிக்கு, அவர் சத்தத்திற்கு உண்மையாய்ச் செவிகொடுப்பாயானால், உன் தேவனாகிய கர்த்தர் பூமியிலுள்ள சகல ஜாதிகளிலும் உன்னை மேன்மையாக வைப்பார்.","DEU.28.2.2":"நீ உன் தேவனாகிய கர்த்தரின் சத்தத்துக்குச் செவிகொடுக்கும்போது, இப்பொழுது சொல்லப்படும் ஆசீர்வாதங்களெல்லாம் உன்மேல் வந்து உனக்குப் பலிக்கும்.","DEU.30.9.9":"அப்பொழுது உனக்கு நன்மை உண்டாகும்படி உன் தேவனாகிய கர்த்தர் உன் கைகள் செய்யும் எல்லா வேலைகளிலும், உன் கர்ப்பத்தின் கனியிலும், உன் மிருக ஜீவனின் பலனிலும், உன் நிலத்தின் கனியிலும் உனக்குப் பரிபூரணமுண்டாகச் செய்வார்.","JOS.1.7.7":"என் தாசனாகிய மோசே உனக்குக் கற்பித்த நியாயப்பிரமாணத்தின்படியெல்லாம் செய்யக் கவனமாயிருக்கமாத்திரம் மிகவும் பலங்கொண்டு திடமனதாயிரு. நீ போகும் இடமெல்லாம் புத்திமானாய் நடந்துகொள்ளும்படிக்கு, அதை விட்டு வலது இடதுபுறம் விலகாதிருப்பாயாக.","1KI.2.3.3":"நீ என்ன செய்தாலும், நீ எங்கே போனாலும், எல்லாவற்றிலும் புத்திமானாயிருக்கிறதற்கும், கர்த்தர் என்னைக்குறித்து உன் பிள்ளைகள் தங்கள் முழு இருதயத்தோடும் தங்கள் முழு ஆத்துமாவோடும் எனக்கு முன்பாக உண்மையாய் நடக்கும்படிக்குத் தங்கள் வழியைக் காத்துக்கொண்டால், இஸ்ரவேலின் சிங்காசனத்தின்மேல் வீற்றிருக்கத்தக்க புருஷன் உனக்கு இல்லாமற்போவதில்லை என்று சொன்ன வார்த்தையைத் திடப்படுத்துகிறதற்கும்,","JOB.22.28.28":"நீர் ஒரு காரியத்தை நிருணயம்பண்ணினால், அது உமக்கு நிலைவரப்படும். உம்முடைய பாதைகளில் வெளிச்சம் பிரகாசிக்கும்.","PSA.1.1.1":"துன்மார்க்கருடைய ஆலோசனையில் நடவாமலும், பாவிகளுடைய வழியில் நில்லாமலும், பரியாசக்காரர் உட்காரும் இடத்தில் உட்காராமலும்,","PSA.112.3.3":"ஆஸ்தியும் ஐசுவரியமும் அவன் வீட்டிலிருக்கும்: அவனுடைய நீதி என்றைக்கும் நிற்கும்.","PRO.3.4.4":"அதினால் தேவனுடைய பார்வையிலும் மனுஷருடைய பார்வையிலும் தயையும் நற்புத்தியும் பெறுவாய்.","PRO.22.4.4":"தாழ்மைக்கும் கர்த்தருக்குப் பயப்படுதலுக்கும் வரும் பலன் ஐசுவரியமும் மகிமையும் ஜீவனுமாம்.","PRO.28.25.25":"பெருநெஞ்சன் வழக்கைக் கொளுவுகிறான்: கர்த்தரை நம்புகிறவனோ செழிப்பான்.","ISA.54.2.2":"உன் கூடாரத்தின் இடத்தை விசாலமாக்கு, உன் வாசஸ்தலங்களின் திரைகள் விரிவாகட்டும், தடைசெய்யாதே, உன் கயிறுகளை நீளமாக்கி, உன் முளைகளை உறுதிப்படுத்து.","MAT.25.21.21":"அவனுடைய எஜமான் அவனை நோக்கி நல்லது, உத்தமமும் உண்மையுமுள்ள ஊழியக்காரனே, கொஞ்சத்திலே உண்மையாயிருந்தாய், அநேகத்தின்மேல் உன்னை அதிகாரியாக வைப்பேன், உன் எஜமானுடைய சந்தோஷத்திற்குள் பிரவேசி என்றான்.","LUK.16.10.10":"கொஞ்சத்திலே உண்மையுள்ளவன் அநேகத்திலும் உண்மையுள்ளவனாயிருக்கிறான். கொஞ்சத்திலே அநீதியுள்ளவன் அநேகத்திலும் அநீதியுள்ளவனாயிருக்கிறான்.","JHN.15.5.5":"நானே திராட்சச்செடி, நீங்கள் கொடிகள். ஒருவன் என்னிலும் நான் அவனிலும் நிலைத்திருந்தால், அவன் மிகுந்த கனிகளைக் கொடுப்பான்: என்னையல்லாமல் உங்களால் ஒன்றும் செய்யக்கூடாது.","JHN.15.7.7":"நீங்கள் என்னிலும், என் வார்த்தைகள் உங்களிலும் நிலைத்திருந்தால், நீங்கள் கேட்டுக்கொள்வதெதுவோ அது உங்களுக்குச் செய்யப்படும்.","JHN.15.8.8":"நீங்கள் மிகுந்த கனிகளைக் கொடுப்பதனால் என் பிதா மகிமைப்படுவார், எனக்கும் சீஷராயிருப்பீர்கள்."};

[1,'fear','ISA',41,10,10,['God Is With You','தேவன் உன்னுடன் இருக்கிறார்'],['God promises His presence, strength and help when you feel afraid.','நீங்கள் பயப்படும்போது தேவன் தம் பிரசன்னத்தையும் பெலனையும் உதவியையும் வாக்குப்பண்ணுகிறார்.'],['God is with me. I will not fear. He strengthens me, helps me, and holds me with His righteous hand. I am not alone.','தேவன் என்னுடன் இருக்கிறார். நான் பயப்படமாட்டேன். அவர் என்னைப் பெலப்படுத்துகிறார், உதவி செய்கிறார், தம் நீதியின் வலக்கரத்தால் தாங்குகிறார். நான் தனியாக இல்லை.'],['Dear Heavenly Father, thank You for being with me. Help me trust You when I am afraid. Give me strength today. Amen.','பரலோகப் பிதாவே, என்னுடன் இருப்பதற்காக நன்றி. நான் பயப்படும்போது உம்மை நம்ப உதவும். இன்று எனக்குப் பெலன் தாரும். ஆமென்.']],
[2,'peace','PHP',4,6,7,['Peace Beyond Understanding','புரிந்துகொள்ள முடியாத சமாதானம்'],['Bring every worry to God in prayer, and His peace will guard your heart.','ஒவ்வொரு கவலையையும் ஜெபத்தில் தேவனிடம் கொண்டுவாருங்கள்; அவருடைய சமாதானம் உங்கள் இருதயத்தைக் காக்கும்.'],['I will not worry about anything. I bring everything to God with thanks, and His peace guards my heart and mind.','நான் எதற்கும் கவலைப்படமாட்டேன். எல்லாவற்றையும் நன்றியுடன் தேவனிடம் ஒப்படைக்கிறேன்; அவருடைய சமாதானம் என் இருதயத்தையும் சிந்தையையும் காக்கிறது.'],['Father, I give You my worries. Thank You for all You have done. Fill my heart with Your peace. Amen.','பிதாவே, என் கவலைகளை உம்மிடம் ஒப்படைக்கிறேன். நீர் செய்த யாவற்றுக்கும் நன்றி. உமது சமாதானத்தால் என் இருதயத்தை நிரப்பும். ஆமென்.']],
[3,'strength','PHP',4,13,13,['Strength in Christ','கிறிஸ்துவில் பெலன்'],['Christ gives you the strength for what is in front of you today.','இன்று உங்கள் முன் இருப்பதைச் செய்ய கிறிஸ்து பெலன் தருகிறார்.'],['Christ gives me strength. I can face this day, and I will not give up.','கிறிஸ்து எனக்குப் பெலன் தருகிறார். இந்த நாளை எதிர்கொள்ள என்னால் முடியும்; நான் விட்டுவிடமாட்டேன்.'],['Lord Jesus, I feel weak, but You are strong. Strengthen me for today. Amen.','ஆண்டவராகிய இயேசுவே, நான் பலவீனமாக உணர்கிறேன்; நீர் பெலமுள்ளவர். இன்றைக்கு என்னைப் பெலப்படுத்தும். ஆமென்.']],
[4,'protection','PSA',91,1,2,['Safe in God','தேவனுக்குள் பாதுகாப்பு'],['Those who live close to God find shelter and rest in Him.','தேவனுக்கு அருகில் வாழ்பவர்கள் அவரில் அடைக்கலமும் இளைப்பாறுதலும் காண்கிறார்கள்.'],['God is my refuge and my fortress. I rest in His shadow, and I trust Him.','தேவன் என் அடைக்கலமும் கோட்டையுமானவர். அவருடைய நிழலில் இளைப்பாறுகிறேன்; அவரை நம்புகிறேன்.'],['Lord, You are my shelter. Keep me and my family safe today, and help me rest in You. Amen.','ஆண்டவரே, நீரே என் புகலிடம். இன்று என்னையும் என் குடும்பத்தையும் காத்தருளும்; உம்மில் இளைப்பாற உதவும். ஆமென்.']],
[5,'provision','PHP',4,19,19,['God Supplies Every Need','தேவன் தேவைகளைச் சந்திக்கிறார்'],['God cares about your needs and promises to provide.','தேவன் உங்கள் தேவைகளைக் குறித்து அக்கறை கொள்கிறார்; வழங்குவதாக வாக்குப்பண்ணுகிறார்.'],['My God will supply every need I have. I trust Him to provide.','என் தேவன் என் தேவைகள் யாவையும் சந்திப்பார். அவர் வழங்குவார் என்று நம்புகிறேன்.'],['Father, thank You for caring for me. I trust You with my needs. Give me a thankful heart. Amen.','பிதாவே, என்னைக் கவனிப்பதற்கு நன்றி. என் தேவைகளை உம்மிடம் ஒப்படைக்கிறேன். நன்றியுள்ள இருதயத்தைத் தாரும். ஆமென்.']],
[6,'guidance','PRO',3,5,6,['Trust and Be Guided','நம்பு, வழிநடத்தப்படு'],['When you trust God and not only your own understanding, He directs your path.','உங்கள் சொந்த புத்தியை மட்டும் சாராமல் தேவனை நம்பும்போது, அவர் உங்கள் பாதையை நேராக்குகிறார்.'],['I trust the Lord with all my heart. I acknowledge Him in everything, and He directs my path.','முழு இருதயத்தோடு கர்த்தரை நம்புகிறேன். எல்லாவற்றிலும் அவரை நினைக்கிறேன்; அவர் என் பாதையை நேராக்குகிறார்.'],['Lord, guide my decisions today. Help me trust You even when I do not understand. Amen.','ஆண்டவரே, இன்று என் முடிவுகளில் வழிநடத்தும். புரியாதபோதும் உம்மை நம்ப உதவும். ஆமென்.']],
[7,'future','JER',29,11,11,['A Future and a Hope','எதிர்காலமும் நம்பிக்கையும்'],['God has good plans for you, even when the road is unclear.','வழி தெளிவாக இல்லாதபோதும் தேவனுக்கு உங்களுக்காக நல்ல திட்டங்கள் உண்டு.'],['God has good plans for my life. My future is in His hands, and I have hope.','என் வாழ்க்கைக்கு தேவனுடைய நல்ல திட்டங்கள் உண்டு. என் எதிர்காலம் அவர் கையில் இருக்கிறது; எனக்கு நம்பிக்கை உண்டு.'],['Father, I place my future in Your hands. Fill me with hope and show me Your way. Amen.','பிதாவே, என் எதிர்காலத்தை உம் கையில் ஒப்படைக்கிறேன். நம்பிக்கையால் என்னை நிரப்பி உமது வழியைக் காட்டும். ஆமென்.']],
[8,'love','ROM',8,38,39,['Nothing Can Separate Us','எதுவும் பிரிக்க முடியாது'],["God's love in Christ is constant. Nothing can take it from you.",'கிறிஸ்துவில் தேவனுடைய அன்பு மாறாதது; அதை எதுவும் உங்களிடமிருந்து பிரிக்க முடியாது.'],['God loves me. Nothing can separate me from His love in Christ Jesus.','தேவன் என்னை நேசிக்கிறார். கிறிஸ்து இயேசுவிலுள்ள அவருடைய அன்பிலிருந்து எதுவும் என்னைப் பிரிக்க முடியாது.'],['Father, thank You for loving me always. Help me rest in Your love today. Amen.','பிதாவே, என்னை எப்போதும் நேசிப்பதற்கு நன்றி. இன்று உம் அன்பில் இளைப்பாற உதவும். ஆமென்.']]
