<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bible Promises</title><meta name="theme-color" content="#14213d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✝️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+Tamil:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6ea;--card:#fffdf7;--ink:#14213d;--mut:#5b6580;--gold:#c9a24a;--line:#eadfc4;--fs:20px}
:root[data-t=dark]{--bg:#0e1730;--card:#16213f;--ink:#f4ecd8;--mut:#a9b3cc;--line:#2a3860}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:linear-gradient(180deg,var(--bg),color-mix(in srgb,var(--bg) 85%,var(--gold)));color:var(--ink);font-family:'Cormorant Garamond','Noto Serif Tamil','Latha','Nirmala UI',Georgia,serif;font-size:18px;line-height:1.55;padding:env(safe-area-inset-top) 0 0}
main{max-width:720px;margin:0 auto;padding:16px 18px 110px;animation:f .4s ease}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:30px;margin:6px 0;font-weight:600}h2{font-size:22px;margin:18px 0 8px}
.brand{color:var(--gold);letter-spacing:.14em;text-transform:uppercase;font-size:13px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin:14px 0;box-shadow:0 6px 24px #14213d14;position:relative}
.card.hero:before{content:"✝";position:absolute;right:16px;top:8px;font-size:44px;color:var(--gold);opacity:.18}
.tag{display:inline-block;font-size:13px;color:var(--gold);border:1px solid var(--gold);border-radius:99px;padding:1px 10px;margin-bottom:6px;font-weight:600}
.verse{font-size:var(--fs);margin:10px 0;padding-left:12px;border-left:3px solid var(--gold)}
.verse small{display:block;color:var(--mut);font-size:14px;margin-top:4px}
.big{font-size:calc(var(--fs) + 2px);line-height:1.7}
.mut{color:var(--mut);font-size:15px}.note{font-size:13px;color:var(--mut);font-style:italic}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:9px 18px}
button.p{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}:root[data-t=dark] button.p{background:var(--gold);color:#14213d;border-color:var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.row .sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cat{text-align:center;padding:16px 8px;border-radius:18px;font-size:17px;border:1px solid var(--line);background:var(--card);width:100%}.cat b{display:block;font-size:28px}
input[type=search],select{width:100%;font:inherit;padding:11px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.item{cursor:pointer}.item h3{margin:0;font-size:20px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{border:0;background:none;border-radius:12px;font-size:12px;padding:4px 8px;color:var(--mut);display:flex;flex-direction:column;align-items:center;min-width:56px}nav button b{font-size:22px;font-weight:400}nav button.on{color:var(--gold);font-weight:600}
.steps{display:flex;gap:6px;margin:8px 0}.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}.steps i.on{background:var(--gold)}
#off{background:#c9a24a;color:#14213d;text-align:center;font-size:14px;padding:3px;display:none}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
label{display:block;margin:14px 0 4px;font-weight:600}
body{background:radial-gradient(circle at 0 0,#ffe3b3 0,transparent 38%),radial-gradient(circle at 100% 15%,#cfe3ff 0,transparent 40%),radial-gradient(circle at 50% 100%,#ffd6e7 0,transparent 45%),var(--bg)}
:root[data-t=dark] body{background:radial-gradient(circle at 0 0,#3a2a63 0,transparent 40%),radial-gradient(circle at 100% 20%,#0f3b5c 0,transparent 40%),var(--bg)}
.hero{border:0;background:linear-gradient(160deg,var(--card) 50%,color-mix(in srgb,var(--a) 24%,var(--card)));box-shadow:0 10px 34px color-mix(in srgb,var(--a) 35%,transparent)}
.hero:before{color:var(--a);opacity:.28}.tag{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border:0;padding:2px 12px}
.verse{border-left-color:var(--a)}.steps i.on{background:linear-gradient(90deg,var(--a,#c9a24a),var(--b,#e9c46a))}
.item{border-left:7px solid var(--a)}.cat{color:#fff;border:0;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 6px 16px color-mix(in srgb,var(--a) 40%,transparent);text-shadow:0 1px 2px #0003;font-weight:600}
button.p{background:linear-gradient(135deg,#14213d,#355c7d);border:0}:root[data-t=dark] button.p{background:linear-gradient(135deg,#c9a24a,#f5c542)}
h1{background:linear-gradient(90deg,var(--ink),var(--a,var(--ink)));-webkit-background-clip:text;background-clip:text;color:transparent}
</style></head><body>
<div id="off"></div><main id="app"></main><nav id="nav"></nav>
<script>
/* Scripture: Tamil Holy Bible text extracted from the supplied PDF (converted from its legacy font encoding to Unicode). */
const TV={"1CH.16.11.11":"கர்த்தரையும் அவர் வல்லமையையும் நாடுங்கள், அவர் சமுகத்தை நித்தமும் தேடுங்கள்.","1CH.22.13.13":"கர்த்தர் இஸ்ரவேலுக்காக மோசேக்குக் கற்பித்த நியமங்களையும் நியாயங்களையும் செய்ய நீ கவனமாயிருந்தால் பாக்கியவானாயிருப்பாய், நீ பலங்கொண்டு தைரியமாயிரு, பயப்படாமலும் கலங்காமலும் இரு.","1CO.1.30.30":"அந்தப்படி, நீங்கள் அவராலே கிறிஸ்து இயேசுவுக்குட்பட்டிருக்கிறீர்கள். எழுதியிருக்கிறபடி மேன்மை பாராட்டுகிறவன் கர்த்தரைக்குறித்தே மேன்மைபாராட்டத்தக்கதாக,","1CO.2.9.9":"எழுதியிருக்கிறபடி தேவன் தம்மில் அன்புகூருகிறவர்களுக்கு ஆயத்தம்பண்ணினவைகளைக் கண் காணவுமில்லை, காது கேட்கவுமில்லை, அவைகள் மனுஷருடைய இருதயத்தில் தோன்றவுமில்லை:","1CO.13.4.8":"அன்பு நீடிய சாந்தமும் தயவுமுள்ளது: அன்புக்குப் பொறாமையில்லை: அன்பு தன்னைப் புகழாது, இறுமாப்பாயிராது, அயோக்கியமானதைச் செய்யாது, தற்பொழிவை நாடாது, சினமடையாது, தீங்கு நினையாது, அநியாயத்தில் சந்தோஷப்படாமல், சத்தியத்தில் சந்தோஷப்படும். சகலத்தையும் தாங்கும், சகலத்தையும் விசுவாசிக்கும், சகலத்தையும் நம்பும், சகலத்தையும் சகிக்கும். அன்பு ஒருக்காலும் ஒழியாது. தீர்க்கதரிசனங்களானாலும் ஒழிந்துபோம், அந்நிய பாஷைகளானாலும் ஓய்ந்துபோம், அறிவானாலும் ஒழிந்துபோம்.","1CO.16.13.13":"விழித்திருங்கள், விசுவாசத்திலே நிலைத்திருங்கள், புருஷராயிருங்கள், திடன்கொள்ளுங்கள்.","1JN.1.9.9":"நம்முடைய பாவங்களை நாம் அறிக்கையிட்டால், பாவங்களை நமக்கு மன்னித்து எல்லா அநியாயத்தையும் நீக்கி நம்மைச் சுத்திகரிப்பதற்கு அவர் உண்மையும் நீதியும் உள்ளவராயிருக்கிறார்.","1JN.3.1.1":"நாம் தேவனுடைய பிள்ளைகளென்று அழைக்கப்படுவதினாலே பிதாவானவர் நமக்குப் பாராட்டின அன்பு எவ்வளவு பெரிதென்று பாருங்கள்: உலகம் அவரை அறியாதபடியினாலே நம்மையும் அறியவில்லை.","1JN.4.9.10":"தம்முடைய ஒரேபேறான குமாரனாலே நாம் பிழைக்கும்படிக்குத் தேவன் அவரை இவ்வுலகத்திலே அனுப்பினதினால் தேவன் நம்மேல் வைத்த அன்பு வெளிப்பட்டது. நாம் தேவனிடத்தில் அன்புகூர்ந்ததினால் அல்ல, அவர் நம்மிடத்தில் அன்புகூர்ந்து, நம்முடைய பாவங்களை நிவிர்த்தி செய்கிற கிருபாதாரபலியாகத் தம்முடைய குமாரனை அனுப்பினதினாலே அன்பு உண்டாயிருக்கிறது.","1JN.4.16.16":"தேவன் நம்மேல் வைத்திருக்கிற அன்பை நாம் அறிந்து விசுவாசித்திருக்கிறோம். தேவன் அன்பாகவே இருக்கிறார்: அன்பில் நிலைத்திருக்கிறவன் தேவனில் நிலைத்திருக்கிறான், தேவனும் அவனில் நிலைத்திருக்கிறார்.","1JN.4.18.18":"அன்பிலே பயமில்லை: பூரண அன்பு பயத்தைப் புறம்பே தள்ளும்: பயமானது வேதனையுள்ளது, பயப்படுகிறவன் அன்பில் பூரணப்பட்டவன் அல்ல.","1JN.4.19.19":"அவர் முந்தி நம்மிடத்தில் அன்பு கூர்ந்தபடியால் நாமும் அவரிடத்தில் அன்புகூருகிறோம்.","1JN.5.4.4":"தேவனால் பிறப்பதெல்லாம் உலகத்தை ஜெயிக்கும்: நம்முடைய விசுவாசமே உலகத்தை ஜெயிக்கிற ஜெயம்.","1JN.5.14.15":"நாம் எதையாகிலும் அவருடைய சித்தத்தின்படி கேட்டால், அவர் நமக்குச் செவிகொடுக்கிறாரென்பதே அவரைப் பற்றி நாம் கொண்டிருக்கிற தைரியம். நாம் எதைக் கேட்டாலும், அவர் நமக்குச் செவிகொடுக்கிறாரென்று நாம் அறிந்திருந்தோமானால், அவரிடத்தில் நாம் கேட்டவைகளைப் பெற்றுக்கொண்டோமென்றும் அறிந்திருக்கிறோம்.","1PE.1.3.3":"நம்முடைய கர்த்தராகிய இயேசுகிறிஸ்துவின் பிதாவாகிய தேவனுக்கு ஸ்தோத்திரம் உண்டாவதாக:","1PE.1.6.7":"இதிலே நீங்கள் மிகவும் சந்தோஷப்படுகிறீர்கள்: என்றாலும், துன்பப்படவேண்டியது அவசியமானதால், இப்பொழுது கொஞ்சக்காலம் பலவிதமான சோதனைகளினாலே துக்கப்படுகிறீர்கள். அழிந்துபோகிற பொன் அக்கினியினாலே சோதிக்கப்படும்: அதைப்பார்க்கிலும் அதிக விலையேறப்பெற்றதாயிருக்கிற உங்கள் விசுவாசம் சோதிக்கப்பட்டு, இயேசுகிறிஸ்து வெளிப்படும்போது உங்களுக்குப் புகழ்ச்சியும் கனமும் மகிமையுமுண்டாகக் காணப்படும்.","1PE.1.13.13":"ஆகையால், நீங்கள் உங்கள் மனதின் அரையைக் கட்டிக்கொண்டு, தெளிந்த புத்தியுள்ளவர்களாயிருந்து: இயேசுகிறிஸ்து வெளிப்படும்போது உங்களுக்கு அளிக்கப்படுங் கிருபையின்மேல் பூரண நம்பிக்கையுள்ளவர்களாயிருங்கள்.","1PE.2.24.24":"நாம் பாவங்களுக்குச் செத்து, நீதிக்குப் பிழைத்திருக்கும்படிக்கு, அவர்தாமே தமது சரீரத்திலே நம்முடைய பாவங்களைச் சிலுவையின்மேல் சுமந்தார்: அவருடைய தழும்புகளால் குணமானீர்கள்.","1PE.3.7.7":"அந்தப்படியே புருஷர்களே, மனைவியானவள் பெலவீன பாண்டமாயிருக்கிறபடியினால், உங்கள் ஜெபங்களுக்குத் தடை வராதபடிக்கு, நீங்கள் விவேகத்தோடு அவர்களுடனே வாழ்ந்து, உங்களுடனேகூட அவர்களும் நித்திய ஜீவனாகிய கிருபையைச் சுதந்தரித்துக்கொள்ளுகிறவர்களானபடியினால், அவர்களுக்குச் செய்யவேண்டிய கனத்தைச் செய்யுங்கள்.","1PE.4.12.13":"பிரியமானவர்களே, உங்களைச் சோதிக்கும்படி உங்கள் நடுவில் பற்றியெரிகிற அக்கினியைக்குறித்து ஏதோ புதுமையென்று திகையாமல், கிறிஸ்துவின் மகிமை வெளிப்படும்போது நீங்கள் களிகூர்ந்து மகிழும்படியாக அவருடைய பாடுகளுக்கு நீங்கள் பங்காளிகளானதால் சந்தோஷப்படுங்கள்.","1PE.5.7.7":"அவர் உங்களை விசாரிக்கிறவரானபடியால், உங்கள் கவலைகளையெல்லாம் அவர்மேல் வைத்துவிடுங்கள்.","1PE.5.10.10":"கிறிஸ்து இயேசுவுக்குள் நம்மைத் தமது நித்திய மகிமைக்கு அழைத்தவராயிருக்கிற சகல கிருபையும் பொருந்திய தேவன்தாமே கொஞ்சக்காலம் பாடநுபவிக்கிற உங்களைச் சீர்ப்படுத்தி, ஸ்திரப்படுத்தி, பலப்படுத்தி, நிலைநிறுத்துவராக:","1SA.12.22.22":"கர்த்தர் உங்களைத் தமக்கு ஜனமாக்கிக் கொள்ளப் பிரியமானபடியால், கர்த்தர் தம்முடைய மகத்துவமான நாமத்தினிமித்தம் தமது ஜனங்களைக் கைவிடமாட்டார்.","1TH.4.13.13":"அன்றியும், சகோதரரே, நித்திரையடைந்தவர்களினிமித்தம் நீங்கள் நம்பிக்கையற்றவர்களான மற்றவர்களைப்போலத் துக்கித்து, அறிவில்லாதிருக்க எனக்கு மனதில்லை.","1TI.5.8.8":"ஒருவன் தன் சொந்த ஜனங்களையும் விசேஷமாகத் தன் வீட்டாரையும் விசாரியாமற்போனால், அவன் விசுவாசத்தை மறுதலித்தவனும், அவிசுவாசியிலும் கெட்டவனுமாயிருப்பான்.","1TI.6.17.17":"இவ்வுலகத்திலே ஐசுவரியமுள்ளவர்கள் இறுமாப்பான சிந்தையுள்ளவர்களாயிராமலும், நிலையற்ற ஐசுவரியத்தின் மேல் நம்பிக்கை வையாமலும், நாம் அனுபவிக்கிறதற்குச் சகலவித நன்மைகளையும் நமக்குச் சம்பூரணமாய்க் கொடுக்கிற ஜீவனுள்ள தேவன்மேல் நம்பிக்கை வைக்கவும்,","2CH.7.14.14":"என் நாமம் தரிக்கப்பட்ட என் ஜனங்கள் தங்களைத் தாழ்த்தி, ஜெபம்பண்ணி, என் முகத்தைத் தேடி, தங்கள் பொல்லாத வழிகளைவிட்டுத் திரும்பினால், அப்பொழுது பரலோகத்திலிருக்கிற நான் கேட்டு, அவர்கள் பாவத்தை மன்னித்து, அவர்கள் தேசத்துக்கு ஷேமத்தைக்கொடுப்பேன்.","2CH.20.15.15":"சகல யூதா கோத்திரத்தாரே, எருசலேமின் குடிகளே, ராஜாவாகிய யோசபாத்தே, கேளுங்கள், நீங்கள் அந்த ஏராளமான கூட்டத்திற்குப் பயப்படாமலும் கலங்காமலும் இருங்கள் என்று கர்த்தர் உங்களுக்குச் சொல்லுகிறார், இந்த யுத்ததம் உங்களுடையதல்ல, தேவனுடையது.","2CH.20.20.20":"அவர்கள் அதிகாலமே எழுந்திருந்து தெக்கொவாவின் வனாந்தரத்திற்குப் போகப்புறப்பட்டாாகள், புறப்படுகையில் யோசபாத் நின்று யூதாவே, எருசலேமின் குடிகளை கேளுங்கள், உங்கள் தேவனாகிய கர்த்தரை நம்புங்கள், அவ்பொழுது நிலைப்படுவீர்கள், அவருடைய தீர்க்கதரிசிகளை நம்புங்கள் அப்பொழுது சித்திபெறுவீர்கள் என்றான்.","2CH.26.5.5":"தேவனுடைய தரிசனங்களில் புத்திமானாயிருந்த சகரியாவின் நாட்களிலே தேவனைத் தேட மனதிணங்கியிருந்தான், அவன் கர்த்தரைத் தேடின நாட்களில் தேவன் அவன் காரியங்களை வாய்க்கச்செய்தார்.","2CO.1.3.4":"நமது கர்த்தராகிய இயேசுகிறிஸ்துவின் பிதாவாகிய தேவனும், இரக்கங்களின் பிதாவும், சகலவிதமான ஆறுதலின் தேவனுமாயிருக்கிறவருக்கு ஸ்தோத்திரம். தேவனால் எங்களுக்கு அருளப்படுகிற ஆறுதலினாலே, எந்த உபத்திரவத்திலாகிலும் அகப்படுகிறவர்களுக்கு நாங்கள் ஆறுதல்செய்யத் திராணியுள்ளவர்களாகும்படி, எங்களுக்கு வரும் சகல உபத்திரவங்களிலேயும் அவரே எங்களுக்கு ஆறுதல்செய்கிறவர்.","2CO.1.20.20":"எங்களால் தேவனுக்கு மகிமையுண்டாகும்படி, தேவனுடைய வாக்குத்தத்தங்களெல்லாம் இயேசுகிறிஸ்துவுக்குள் ஆம் என்றும், அவருக்குள் ஆமென் என்றும் இருக்கிறதே.","2CO.4.8.9":"நாங்கள் எப்பக்கத்திலும் நெருக்கப்பட்டும் ஒடுங்கிப்போகிறதில்லை் கலக்கமடைந்தும் மனமுறிவடைகிறதில்லை் துன்பப்படுத்தப்பட்டும் கைவிடப்படுகிறதில்லை் கீழே தள்ளப்பட்டும் மடிந்து போகிறதில்லை.","2CO.4.16.16":"ஆனபடியினாலே நாங்கள் சோர்ந்து போகிறதில்லை் எங்கள் புறம்பான மனுஷனானது அழிந்தும், உள்ளான மனுஷனானது நாளுக்குநாள் புதிதாக்கப்படுகிறது.","2CO.4.17.17":"மேலும் காணப்படுகிறவைகளையல்ல, காணப்படாதவைகைள நோக்கியிருக்கிற நமக்கு, அதிசீக்கிரத்தில் நீங்கும் இலேசான நம்முடைய உபத்திரவம் மிகவும் அதிகமான நித்திய கனமகிமையை உண்டாக்குகிறது.","2CO.5.7.7":"இந்தத் தேகத்தில் குடியிருக்கையில் கர்த்தரிடத்தில் குடியிராதவர்களாயிருக்கிறோமென்று அறிந்தும், எப்பொழுதும் தைரியமாயிருக்கிறோம்.","2CO.5.17.17":"இப்படியிருக்க, ஒருவன் கிறிஸ்துவுக்குள்ளிருந்தால் புதுச்சிருஷ்டியாயிருக்கிறான் பழையவைகள் ஒழிந்துபோயின, எல்லாம் புதிதாயின.","2CO.9.8.8":"மேலும், நீங்கள் எல்லாவற்றிலும் எப்பொழுதும் சம்பூரணமுடையவர்களாயும், சகலவித நற்கிரியைகளிலும் பெருகுகிறவர்களாயுமிருக்கும்படியாக, தேவன் உங்களிடத்தில் சகலவித கிருபையையும் பெருகச்செய்ய வல்லவராயிருக்கிறார்.","2CO.9.10.10":"விதைக்கிறவனுக்கு விதையையும், புசிக்கிறதற்கு ஆகாரத்தையும் அளிக்கிறவர் உங்களுக்கு விதையை அளித்து, அதைப் பெருகப்பண்ணி, உங்கள் நீதியின் விளைச்சலை வர்த்திக்கச்செய்வார்.","2CO.12.9.9":"அதற்கு அவர் என் கிருபை உனக்குப்போதும்: பலவீனத்திலே என் பலம் பூரணமாய் விளங்கும் என்றார் ஆகையால், கிறிஸ்துவின் வல்லமை என்மேல் தங்கும்படி, என் பலவீனங்களைக்குறித்து நான் மிகவும் சந்தோஷமாய் மேன்மைபாராட்டுவேன்.","2KI.20.5.5":"நீ திரும்பிப்போய், என் ஜனத்தின் அதிபதியாகிய எசேக்கியாவை நோக்கி உன் தகப்பனாகிய தாவீதின் தேவனாயிருக்கிற கர்த்தர் சொல்லுகிறது என்னவென்றால் உன் விண்ணப்பத்தைக் கேட்டேன், உன் கண்ணீரைக் கண்டேன், இதோ, நான் உன்னைக் குணமாக்குவேன், மூன்றாம் நாளிலே நீ கர்த்தருடைய ஆலயத்துக்குப் போவாய்.","2SA.22.3.3":"தேவன் நான் நம்பியிருக்கிற துருக்கமும், என் கேடகமும், என் ரட்சணியக் கொம்பும், என் உயர்ந்த அடைக்கலமும், என் புகலிடமும், என் ரட்சகருமானவர். என்னை வல்லடிக்கு நீங்கலாக்கி ரட்சிக்கிறவர் அவரே.","2SA.22.33.33":"தேவன் எனக்குப் பலத்த அரணானவர். அவர் என் வழியைச் செவ்வைப் பண்ணுகிறவர்.","2TH.3.3.3":"கர்த்தரோ உண்மையுள்ளவர், அவர் உங்களை ஸ்திரப்படுத்தி, தீமையினின்று விலக்கிக் காத்துக்கொள்ளுவார்.","2TH.3.16.16":"சமாதானத்தின் கர்த்தர்தாமே எப்பொழுதும் சகலவிதத்திலும் உங்களுக்குச் சமாதானத்தைத் தந்தருளுவாராக. கர்த்தர் உங்களனைவரோடுங்கூட இருப்பாராக.","2TI.1.7.7":"தேவன் நமக்குப் பயமுள்ள ஆவியைக் கொடாமல், பலமும் அன்பும் தெளிந்த புத்தியுள்ள ஆவியையே கொடுத்திருக்கிறார்.","2TI.4.16.17":"நான் முதல்விசை உத்தரவுசொல்ல நிற்கையில் ஒருவனும் என்னோடேகூட இருக்கவில்லை, எல்லாரும் என்னைக் கைவிட்டார்கள்: அந்தக் குற்றம் அவர்கள்மேல் சுமராதிருப்பதாக. கர்த்தரோ எனக்குத் துணையாகநின்று, என்னாலே பிரசங்கம் நிறைவேறுகிறதற்காகவும், புறஜாதியாரெல்லாரும் கேட்கிறதற்காகவும், என்னைப் பலப்படுத்தினார்: சிங்கத்தின் வாயிலிருந்தும் நான் இரட்சிக்கப்பட்டேன்.","2TI.4.17.17":"கர்த்தரோ எனக்குத் துணையாகநின்று, என்னாலே பிரசங்கம் நிறைவேறுகிறதற்காகவும், புறஜாதியாரெல்லாரும் கேட்கிறதற்காகவும், என்னைப் பலப்படுத்தினார்: சிங்கத்தின் வாயிலிருந்தும் நான் இரட்சிக்கப்பட்டேன்.","3JN.1.2.2":"பிரியமானவனே, உன் ஆத்துமா வாழ்கிறதுபோல நீ எல்லாவற்றிலும் வாழ்ந்து சுகமாயிருக்கும்படி வேண்டுகிறேன்.","ACT.3.19.19":"ஆனபடியினாலே கர்த்தருடைய சந்நிதானத்திலிருந்து இளைப்பாறுதலின் காலங்கள் வரும்படிக்கும், முன்னே குறிக்கப்பட்ட இயேசுகிறிஸ்துவை அவர் உங்களிடத்தில் அனுப்பும்படிக்கும்,","ACT.10.38.38":"நசரேயனாகிய இயேசுவைத் தேவன் பரிசுத்தஆவியினாலும் வல்லமையினாலும் அபிஷேகம்பண்ணினார்: தேவன் அவருடனேகூட இருந்தபடியினாலே அவர் நன்மைசெய்கிறவராயும் பிசாசின் வல்லமையில் அகப்பட்ட யாவரையும் குணமாக்குகிறவராயும் சுற்றித்திரிந்தார்.","ACT.10.43.43":"அவரை விசுவாசிக்கிறவன் எவனோ அவன் அவருடைய நாமத்தினாலே பாவமன்னிப்பைப் பெறுவானென்று தீர்க்கதரிசிகளெல்லாரும் அவரைக்குறித்தே சாட்சிகொடுக்கிறார்கள் என்றான்.","ACT.16.31.31":"அதற்கு அவர்கள் கர்த்தராகிய இயேசுகிறிஸ்துவை விசுவாசி, அப்பொழுது நீயும் உன் வீட்டாரும் இரட்சிக்கப்படுவீர்கள் என்று சொல்லி,","COL.1.11.11":"சந்தோஷத்தோடே கூடிய எல்லாப் பொறுமையும் நீடியசாந்தமும் உண்டாவதற்கு, மகிமையான அவருடைய வல்லமையின்படி, எல்லா வல்லமையாலும் பலப்படுத்தப்படவும், உங்களுக்காகவேண்டுதல்செய்கிறோம்.","COL.1.13.14":"இருளின் அதிகாரத்தினின்று நம்மை விடுதலையாக்கி, தமது அன்பின் குமாரனுடைய ராஜ்யத்திற்கு உட்படுத்தினவருமாயிருக்கிற பிதாவை ஸ்தோத்திரிக்கிறோம். (குமாரனாகிய) அவருக்குள், அவருடைய இரத்தத்தினாலே, பாவமன்னிப்பாகிய மீட்பு நமக்கு உண்டாயிருக்கிறது.","COL.1.27.27":"புறஜாதிகளுக்குள்ளே விளங்கிய இந்த இரகசியத்திலுள்ள மகிமையின் ஐசுவரியம் இன்னதென்று, தேவன் தம்முடைய பரிசுத்தவான்களுக்குத் தெரியப்படுத்தச் சித்தமானார்: கிறிஸ்துவானவர் மகிமையின் நம்பிக்கையாக உங்களுக்குள் இருப்பதே அந்த இரகசியம்.","COL.2.3.3":"அவருக்குள் ஞானம் அறிவு என்பவைகளாகிய பொக்கிஷங்களெல்லாம் அடங்கியிருக்கிறது.","COL.2.13.14":"உங்கள் பாவங்களினாலேயும், உங்கள் மாம்ச விருத்தசேதனமில்லாமையினாலேயும் மரித்தவர்களாயிருந்த உங்களையும் அவரோடே உயிர்ப்பித்து, அக்கிரமங்களெல்லாவற்றையும் உங்களுக்கு மன்னித்து: நமக்கு எதிரிடையாகவும் கட்டளைகளால் நமக்கு விரோதமாகவும் இருந்த கையெழுத்தைக் குலைத்து, அதை நடுவிலிராதபடிக்கு எடுத்து, சிலுவையின்மேல் ஆணியடித்து:","COL.3.13.13":"ஒருவரையொருவர் தாங்கி, ஒருவர்பேரில் ஒருவருக்குக் குறைபாடு உண்டானால், கிறிஸ்து உங்களுக்கு மன்னித்ததுபோல, ஒருவருக்கொருவர் மன்னியுங்கள்.","COL.3.15.15":"தேவசமாதானம் உங்கள் இருதயங்களில் ஆளக்கடவது, இதற்கென்றே நீங்கள் ஒரே சரீரமாக அழைக்கப்பட்டீர்கள்: நன்றியறிதலுள்ளவர்களாயுமிருங்கள்.","COL.3.16.16":"கிறிஸ்துவின் வசனம் உங்களுக்குள்ளே சகல ஞானத்தோடும் பரிபூரணமாக வாசமாயிருப்பதாக: சங்கீதங்களினாலும் கீர்த்தனைகளினாலும் ஞானப்பாட்டுகளினாலும் ஒருவருக்கொருவர் போதித்துப் புத்திசொல்லிக்கொண்டு, உங்கள் இருதயத்திலே கர்த்தரைப் பக்தியுடன் பாடி:","COL.3.18.19":"மனைவிகளே, கர்த்தருக்கேற்கும்படி, உங்கள் புருஷருக்குக் கீழ்ப்படியுங்கள். புருஷர்களே, உங்கள் மனைவிகளில் அன்புகூருங்கள், அவர்கள்மேல் கசந்துகொள்ளாதிருங்கள்.","COL.3.20.20":"பிள்ளைகளே, உங்களைப் பெற்றாருக்கு எல்லாக் காரியத்திலேயும் கீழ்ப்படியுங்கள்: இது கர்த்தருக்குப் பிரியமானது.","COL.3.23.23":"நீங்கள் கர்த்தராகிய கிறிஸ்துவைச் சேவிக்கிறதினாலே, சுதந்தரமாகிய பலனைக் கர்த்தராலே பெறுவீர்களென்று அறிந்து,","DAN.2.21.21":"அவர் காலங்களையும் சமயங்களையும் மாற்றுகிறவர். ராஜாக்களைத் தள்ளி, ராஜாக்களை ஏற்படுத்துகிறவர். ஞானிகளுக்கு ஞானத்தையும், அறிவாளிகளுக்கு அறிவையும் கொடுக்கிறவர்.","DAN.12.3.3":"ஞானவான்கள் ஆகாயமண்டலத்தின் ஔியைப்போலவும், அநேகரை நீதிக்குட்படுத்துகிறவர்கள் நட்சத்திரங்களைப்போலவும் என்றென்றைக்குமுள்ள சதாகாலங்களிலும் பிரகாசிப்பார்கள்.","DEU.6.6.7":"இன்று நான் உனக்குக் கட்டளையிடுகிற இந்த வார்த்தைகள் உன் இருதயத்தில் இருக்கக்கடவது. நீ அவைகளை உன் பிள்ளைளுக்குக் கருத்தாய்ப் போதித்து, நீ உன் வீட்டில் உட்கார்ந்திருக்கிறபோதும், வழியில் நடக்கிறபோதும், படுத்துக்கொள்ளுகிறபோதும், எழுந்திருக்கிறபோதும் அவைகளைக்குறித்துப் பேசி,","DEU.7.9.9":"ஆயைால் உன் தேவனாகிய கர்த்தரே தேவன் என்றும், தம்மில் அன்புகூர்ந்து, தமது கற்பனைகளைக் கைக்கொள்ளுகிறர்களுக்கு அவர் ஆயிரம் தலைமுறைமட்டும் உடன்படிக்கையையும் தயவையும் காக்கிற உண்மையுள்ள தேவன் என்றும்,","DEU.8.18.18":"உன் தேவனாகிய கர்த்தரை நினைப்பாயாக, அவரே உன் பிதாக்களுக்கு ஆணையிட்டுக்கொடுத்த தம்முடைய உடன்படிக்கையை உறுதிப்படுத்தும்படி, இந்நாளில் உனக்கு உண்டாயிருக்கிறதுபோல, ஐசுவரியத்தைச சம்பாதிக்கிறதற்கான பெலனை உனக்குக் கொடுக்கிறவர்.","DEU.20.4.4":"உங்களுக்காக உங்கள் சத்துருக்களோடே யுத்தம்பண்ணவும் உங்களை இரட்சிக்கவும் உங்களோடேகூடப் போகிறவர் உங்கள் தேவனாகிய கர்த்தர் என்று சொல்லவேண்டும்.","DEU.28.8.8":"கர்த்தர் உன் களஞ்சியங்களிலும், நீ கையிடும் எல்லா வேலையிலும் உனக்கு ஆசீர்வாதம் கட்டளையிடுவார், உன் தேவனாகிய கர்த்தர் உனக்குக் கொடுக்கும் தேசத்திலே உன்னை ஆசீர்வதிப்பார்.","DEU.28.12.12":"ஏற்றகாலத்தில் உன் தேசத்திலே மழை பெய்யவும், நீ கையிட்டுச்செய்யும் வேலைகளையெல்லாம் ஆசீர்வதிக்கவும், கர்த்தர் உனக்குத் தமது நல்ல பொக்கிஷசாலையாகிய வானத்தைத் திறப்பார், நீ அநேகம் ஜாதிகளுக்குக் கடன்கொடுப்பாய், நீயோ கடன் வாங்காதிருப்பாய்.","DEU.28.13.13":"இன்று நான் உங்களுக்கு விதிக்கிற வார்த்தைகள் யாவையும் விட்டு விலகி வேறே தேவர்களைச் சேவிக்கும்படி, நீ வலதுபுறம் இடதுபுறம் சாயாமல்,","DEU.29.9.9":"இப்பொழுதும் நீங்கள் செய்வதெல்லாம் உங்களுக்கு வாய்க்கும்படிக்கு, இந்த உடன்படிக்கையின் வார்த்தைகளைக் கைக்கொண்டு, அவைகளின்படி செய்வீர்களாக.","DEU.31.6.6":"நீங்கள் பலங்கொண்டு திடமனதாயிருங்கள், அவர்களுக்குப் பயப்படவும் திகைக்கவும் வேண்டாம், உன் தேவனாகிய கர்த்தர்தாமே உன்னோடேகூட வருகிறார், அவர் உன்னைக் விட்டு விலகுவதும் இல்லை, உன்னைக் கைவிடுவதும் இல்லை என்று சொன்னான்.","DEU.33.12.12":"பென்யமீனைக்குறித்து கர்த்தருக்குப் பிரியமானவன், அவரோடே சுகமாய்த் தங்கியிருப்பான், அவனை எந்நாளும் அவர் காப்பாற்றி, அவன் எல்லைக்குள்ளே வாசமாயிருப்பார் என்றான்.","DEU.33.25.25":"இரும்பும் வெண்கலமும் உன் பாதரட்சையின் கீழிருக்கும், உன் நாட்களுக்குத்தக்கதாய் உன் பெலனும் இருக்கும் என்றான்.","DEU.33.27.27":"அநாதி தேவனே உனக்கு அடைக்கலம், அவருடைய நித்திய புயங்கள் உனக்கு ஆதாரம், அவர் உனக்கு முன்னின்று சத்துருக்களைத் துரத்தி, அவர்களை அழித்துப்போடு என்று கட்டளையிடுவார்.","ECC.3.11.11":"அவர் சகலத்தையும் அதினதின் காலத்திலே நேர்த்தியாகச் செய்திருக்கிறார், உலகத்தையும் அவர்கள் உள்ளத்திலே வைத்திருக்கிறார், ஆதலால் தேவன் ஆதிமுதல் அந்தம்மட்டும், செய்துவரும் கிரியையை மனுஷன் கண்டுபிடியான்.","ECC.7.12.12":"ஞானம் கேடகம், திரவியமும் கேடகம், ஞானம் தன்னை உடையவர்களுக்கு ஜீவனைத் தரும், இதுவே அறிவின் மேன்மை.","ECC.9.10.10":"செய்யும்படி உன் கைக்கு நேரிடுகிறது எதுவோ, அதை உன் பெலத்தோடே செய், நீ போகிற பாதாளத்திலே செய்கையும் வித்தையும் அறிவும் ஞானமும் இல்லையே.","EPH.1.7.7":"அவருடைய கிருபையின் ஐசுவரியத்தின்படியே இவருடைய இரத்தத்தினாலே பாவமன்னிப்பாகிய மீட்பு இவருக்குள் நமக்கு உண்டாயிருக்கிறது.","EPH.1.17.17":"நம்முடைய கர்த்தராகிய இயேசுகிறிஸ்துவின் தேவனும் மகிமையின் பிதாவுமானவர் தம்மை நீங்கள் அறிந்துகொள்வதற்கான ஞானத்தையும் தெளிவையும் அளிக்கிற ஆவியை உங்களுக்குத் தந்தருளவேண்டுமென்றும்,","EPH.2.4.5":"தேவனோ இரக்கத்தில் ஐசுவரியமுள்ளவராய் நம்மில் அன்புகூர்ந்த தம்முடைய மிகுந்த அன்பினாலே, அக்கிரமங்களில் மரித்தவர்களாயிருந்த நம்மைக் கிறிஸ்துவுடனேகூட உயிர்ப்பித்தார்: கிருபையினாலே இரட்சிக்கப்பட்டீர்கள்","EPH.2.8.9":"கிருபையினாலே விசுவாசத்தைக்கொண்டு இரட்சிக்கப்பட்டீர்கள்: இது உங்களால் உண்டானதல்ல, இது தேவனுடைய ஈவு: ஒருவரும் பெருமைபாராட்டாதபடிக்கு இது கிரியைகளினால் உண்டானதல்ல:","EPH.2.10.10":"ஏனெனில், நற்கிரியைகளைச் செய்கிறதற்கு நாம் கிறிஸ்து இயேசுவுக்குள் சிருஷ்டிக்கப்பட்டு, தேவனுடைய செய்கையாயிருக்கிறோம்: அவைகளில் நாம் நடக்கும்படி அவர் முன்னதாக அவைகளை ஆயத்தம்பண்ணியிருக்கிறார்.","EPH.3.16.16":"நீங்கள் அவருடைய ஆவியினாலே உள்ளான மனுஷனில் வல்லமையாய்ப் பலப்படவும்,","EPH.3.17.19":"விசுவாசத்தினாலே கிறிஸ்து உங்கள் இருதயங்களில் வாசமாயிருக்கவும், நீங்கள் அன்பிலே வேரூன்றி, நிலைபெற்றவர்களாகி, சகல பரிசுத்தவான்களோடுங்கூடக் கிறிஸ்துவினுடைய அன்பின் அகலமும், நீளமும், ஆழமும், உயரமும் இன்னதென்று உணர்ந்து, அறிவுக்கெட்டாத அந்த அன்பை அறிந்துகொள்ள வல்லவர்களாகவும், தேவனுடைய சகல பரிபூரணத்தாலும் நிறையப்படவும், அவர் தமது மகிமையினுடைய ஐசுவரியத்தின்படியே, உங்களுக்கு அநுக்கிரகம் பண்ணவேண்டுமென்று வேண்டிக்கொள்ளுகிறேன்.","EPH.3.20.20":"நாம் வேண்டிக்கொள்ளுகிறதற்கும் நினைக்கிறதற்கும் மிகவும் அதிகமாய் நமக்குள்ளே கிரியைசெய்கிற வல்லமையின்படியே, நமக்குச் செய்ய வல்லவராகிய அவருக்கு,","EPH.4.32.32":"ஒருவருக்கொருவர் தயவாயும் மனஉருக்கமாயும் இருந்து, கிறிஸ்துவுக்குள் தேவன் உங்களுக்கு மன்னித்ததுபோல, நீங்களும் ஒருவருக்கொருவர் மன்னியுங்கள். எபேசியர்","EPH.5.25.25":"புருஷர்களே, உங்கள் மனைவிகளில் அன்புகூருங்கள் அப்படியே கிறிஸ்துவும் சபையில் அன்புகூர்ந்து,","EPH.6.1.3":"பிள்ளைகளே, உங்கள் பெற்றாருக்குக் கர்த்தருக்குள் கீழ்ப்படியுங்கள், இது நியாயம். உனக்கு நன்மை உண்டாயிருப்பதற்கும், பூமியிலே உன் வாழ்நாள் நீடித்திருப்பதற்கும் உன் தகப்பனையும் உன் தாயையும் கனம்பண்ணுவாயாக என்பதே வாக்குத்தத்தமுள்ள முதலாங் கற்பனையாயிருக்கிறது.","EPH.6.10.10":"கடைசியாக, என் சகோதரரே, கர்த்தரிலும் அவருடைய சத்துவத்தின் வல்லமையிலும் பலப்படுங்கள்.","EXO.13.21.21":"அவர்கள் இரவும் பகலும் வழிநடக்கக்கூடும்படிக்கு, கர்த்தர் பகலில் அவர்களை வழிநடத்த மேகஸ்தம்பத்திலும், இரவில் அவர்களுக்கு வெளிச்சங்காட்ட அக்கினிஸ்தப்பத்திலும் அவர்களுக்கு முன் சென்றார்.","EXO.14.14.14":"கர்த்தர் உங்களுக்காக யுத்தம்பண்ணுவார். நீங்கள் சும்மாயிருப்பீர்கள் என்றான்.","EXO.15.2.2":"கர்த்தர் என் பெலனும் என் கீதமுமானவர். அவர் எனக்கு இரட்சிப்புமானவர். அவரே என் தேவன், அவருக்கு வாசஸ்தலத்தை ஆயத்தம்பண்ணுவேன். அவரே என் தகப்பனுடைய தேவன், அவரை உயர்த்துவேன்.","EXO.15.26.26":"நீ உன் தேவனாகிய கர்த்தரின் சத்தத்தைக் கவனமாய்க் கேட்டு, அவர் பார்வைக்குச் செம்மையானவைகளைச் செய்து, அவர் கட்டளைகளுக்குச் செவிகொடுத்து, அவருடைய நியமங்கள் யாவையும் கைக்கொண்டால், நான் எகிப்தியருக்கு வரப்பண்ணின வியாதிகளில் ஒன்றையும் உனக்கு வரப்பண்ணேன். நானே உன் பரிகாரியாகிய கர்த்தர் என்றார்.","EXO.23.25.25":"உங்கள் தேவனாகிய கர்த்தரையே சேவிக்கக்கடவீர்கள். அவர் உன் அப்பத்தையும் உன் தண்ணீரையும் ஆசீர்வதிப்பார். வியாதியை உன்னிலிருந்து விலக்குவேன்.","EXO.33.14.14":"அதற்கு அவர் என் சமுகம் உனக்கு முன்பாகச் செல்லும், நான் உனக்கு இளைப்பாறுதல் தருவேன் என்றார்.","GAL.2.20.20":"கிறிஸ்துவுடனேகூடச் சிலுவையிலறையப்பட்டேன்: ஆயினும், பிழைத்திருக்கிறேன்: இனி நான் அல்ல, கிறிஸ்துவே எனக்குள் பிழைத்திருக்கிறார்: நான் இப்பொழுது மாம்சத்தில் பிழைத்திருக்கிறதோ, என்னில் அன்புகூர்ந்து எனக்காகத் தம்மைத்தாமே ஒப்புக்கொடுத்த தேவனுடைய குமாரனைப்பற்றும் விசவாசத்தினாலே பிழைத்திருக்கிறேன்.","GAL.6.9.9":"நன்மைசெய்கிறதில் சோர்ந்துபோகாமல் இருப்போமாக: நாம் தளர்ந்து போகாதிருந்தால் ஏற்றகாலத்தில் அறுப்போம்.","GEN.18.14.14":"கர்த்தரால் ஆகாத காரியம் உண்டோ? உற்பவகாலத்திட்டத்தில் உன்னிடத்திற்குத் திரும்ப வருவேன். அப்பொழுது சாராளுக்கு ஒரு குமாரன் இருப்பான் என்றார்.","GEN.22.14.14":"ஆபிரகாம் அந்த இடத்துக்கு யேகோவாயீரே என்று பேரிட்டான். அதினாலே கர்த்தருடைய பர்வதத்திலே பார்த்துக்கொள்ளப்படும் என்று இந்நாள்வரைக்கும் சொல்லப்பட்டு வருகிறது.","GEN.28.15.15":"நான் உன்னோடே இருந்து, நீ போகிற இடத்திலெல்லாம் உன்னைக் காத்து, இந்தத் தேசத்துக்கு உன்னைத் திரும்பிவரப்பண்ணுவேன். நான் உனக்குச் சொன்னதைச் செய்யுமளவும் உன்னைக் கைவிடுவதில்லை என்றார்.","GEN.39.3.3":"கர்த்தர் அவனோடே இருக்கிறார் என்றும், அவன் செய்கிற யாவையும் கர்த்தர் வாய்க்கப்பண்ணுகிறார் என்றும், அவன் எஜமான் கண்டு,","GEN.39.23.23":"கர்த்தர் அவனோடே இருந்தபடியினாலும், அவன் எதைச் செய்தானோ அதைக் கர்த்தர் வாய்க்கப்பண்ணினபடியினாலும், அவன் வசமாயிருந்த யாதொன்றையும் குறித்துச் சிறைச்சாலைத் தலைவன் விசாரிக்கவில்லை. ஆதியாகமம்","GEN.50.20.20":"நீங்கள் எனக்குத் தீமைசெய்ய நினைத்தீர்கள். தேவனோ, இப்பொழுது நடந்துவருகிறபடியே, வெகு ஜனங்களை உயிரோடே காக்கும்படிக்கு, அதை நன்மையாக முடியப்பண்ணினார்.","HAB.2.4.4":"இதோ,அகங்காரியாயிருக்கிறானே,அவனுடைய ஆத்துமா அவனுக்குள் செம்மையானதல்ல. தன் விசுவாசத்தினாலே நீதிமான் பிழைப்பான்.","HAG.2.9.9":"முந்தின ஆலயத்தின் மகிமையைப்பார்க்கிலும், இந்தப் பிந்தின ஆலயத்தின் மகிமை பெரியதாயிருக்கும் என்று சேனைகளின் கர்த்தர் சொல்லுகிறார். இவ்விடத்திலே சமாதானத்தைக் கட்டளையிடுவேன் என்று சேனைகளின் கர்த்தர் உரைக்கிறார் என்று சொல் என்றார்.","HEB.4.15.16":"நம்முடைய பலவீனங்களைக்குறித்துப் பரிதபிக்கக்கூடாத பிரதான ஆசாரியர் நமக்கிராமல், எல்லாவிதத்திலும் நம்மைப்போல் சோதிக்கப்பட்டும், பாவமில்லாதவராயிருக்கிற பிரதான ஆசாரியரே நமக்கிருக்கிறார். ஆதலால், நாம் இரக்கத்தைப் பெறவும், ஏற்ற சமயத்தில் சகாயஞ்செய்யுங் கிருபையை அடையவும், தைரியமாய்க் கிருபாசனத்தண்டையிலே சேரக்கடவோம். எபிரேயர்","HEB.6.10.10":"ஏனென்றால், உங்கள் கிரியையையும், நீங்கள் பரிசுத்தவான்களுக்கு ஊழியுஞ்செய்ததினாலும் செய்து வருகிறதினாலும் தமது நாமத்திற்காகக் காண்பித்த அன்புள்ள பிரயாசத்தையும் மறந்துவிடுகிறதற்குத் தேவன் அநீதியுள்ளவரல்லவே.","HEB.6.19.19":"அந்த நம்பிக்கை நமக்கு நிலையும் உறுதியும் திரைக்குள்ளாகப் போகிறதுமான ஆத்தும நங்கூரமாயிருக்கிறது.","HEB.8.12.12":"ஏனெனில் நான் அவர்கள் அநியாயங்களைக் கிருபையாய் மன்னித்து, அவர்கள் பாவங்களையும் அக்கிரமங்களையும் இனி நினையாமலிருப்பேன் என்று கர்த்தர் சொல்லுகிறார்.","HEB.10.17.17":"அவர்களுடைய பாவங்களையும் அவர்களுடைய அக்கிரமங்களையும் நான் இனி நினைப்பதில்லை என்பதைச் சொல்லுகிறார்.","HEB.10.23.23":"அல்லாமலும், நம்முடைய நம்பிக்கையை அறிக்கையிடுகிறதில் அசைவில்லாமல் உறுதியாயிருக்கக்கடவோம்: வாக்குத்தத்தம்பண்ணினவர் உண்மையுள்ளவராயிருக்கிறாரே.","HEB.11.1.1":"விசுவாசமானது நம்பப்படுகிறவைகளின் உறுதியும் காணப்படாதவைகளின் நிச்சயமுமாயிருக்கிறது.","HEB.11.6.6":"விசுவாசமில்லாமல் தேவனுக்குப் பிரியமாயிருப்பது கூடாதகாரியம்: ஏனென்றால், தேவனிடத்தில் சேருகிறவன் அவர் உண்டென்றும், அவர் தம்மைத் தேடுகிறவர்களுக்குப் பலன் அளிக்கிறவரென்றும் விசுவாசிக்கவேண்டும்.","HEB.12.2.2":"அவர் தமக்குமுன் வைத்திருந்த சந்தோஷத்தின்பொருட்டு, அவமானத்தை எண்ணாமல், சிலுவையைச் சகித்து, தேவனுடைய சிங்காசனத்தின் வலதுபாரிசத்தில் வீற்றிருக்கிறார்.","HEB.13.5.5":"நீங்கள் பணஆசையில்லாதவர்களாய் நடந்து, உங்களுக்கு இருக்கிறவைகள் போதுமென்று எண்ணுங்கள்: நான் உன்னைவிட்டு விலகுவதுமில்லை, உன்னைக் கைவிடுவதுமில்லை என்று அவர் சொல்லியிருக்கிறாரே.","HEB.13.5.6":"நீங்கள் பணஆசையில்லாதவர்களாய் நடந்து, உங்களுக்கு இருக்கிறவைகள் போதுமென்று எண்ணுங்கள்: நான் உன்னைவிட்டு விலகுவதுமில்லை, உன்னைக் கைவிடுவதுமில்லை என்று அவர் சொல்லியிருக்கிறாரே. அதினாலே நாம் தைரியங்கொண்டு கர்த்தர் எனக்குச் சகாயர், நான் பயப்படேன், மனுஷன் எனக்கு என்னசெய்வான் என்று சொல்லலாமே.","ISA.1.18.18":"வழக்காடுவோம் வாருங்கள் என்று கர்த்தர் சொல்லுகிறார், உங்கள் பாவங்கள் சிவேரென்றிருந்தாலும் உறைந்த மழையைப்போல் வெண்மையாகும், அவைகள் இரத்தாம்பரச்சிவப்பாயிருந்தாலும் பஞ்சைப்போலாகும்.","ISA.12.2.2":"இதோ, தேவனே என் இரட்சிப்பு, நான் பயப்படாமல் நம்பிக்கையாயிருப்பேன், கர்த்தராகிய யேகோவா என் பெலனும், என் கீதமுமானவர், அவரே எனக்கு இரட்சிப்புமானவர்.","ISA.25.8.8":"அவர் மரணத்தை ஜெயமாக விழுங்குவார், கர்த்தராகிய தேவன் எல்லா முகங்களிலுமிருந்து கண்ணீரைத் துடைத்து, தமது ஜனத்தின் நிந்தையைப் பூமியிலிராதபடிக்கு முற்றிலும் நீக்கிவிடுவார், கர்த்தரே இதைச் சொன்னார்.","ISA.26.3.3":"உம்மை உறுதியாய்ப் பற்றிக் கொண்ட மனதையுடையவன் உம்மையே நம்பியிருக்கிறபடியால், நீர் அவனைப் பூரண சமாதானத்துடன் காத்துக்கொள்வீர்.","ISA.26.12.12":"கர்த்தாவே, எங்களுக்குச் சமாதானத்தைக் கட்டளையிடுவீர், எங்கள் கிரியைகளையெல்லாம் எங்களுக்காக நடத்திவருகிறவர் நீரே.","ISA.30.21.21":"நீங்கள் வலதுபுறமாய்ச் சாயும்போதும், இடதுபுறமாய்ச் சாயும்போதும் வழி இதுவே, இதிலே நடவுங்கள் என்று உங்களுக்குப் பின்னாலே சொல்லும் வார்த்தையை உங்கள் காதுகள் கேட்கும்.","ISA.32.17.17":"நீதியின் கிரியை சமாதானமும், நீதியின் பலன் என்றுமுள்ள அமரிக்கையும் சுகமுமாம்.","ISA.35.4.4":"மனம் பதறுகிறவர்களைப் பார்த்து நீங்கள் பயப்படாதிருங்கள், திடன்கொள்ளுங்கள், இதோ, உங்கள் தேவன் நீதியைச் சரிக்கட்டவும், உங்கள் தேவன் பதிலளிக்கவும் வருவார், அவர் வந்து உங்களை இரட்சிப்பார் என்று சொல்லுங்கள்.","ISA.38.17.17":"இதோ, சமாதானத்துக்குப் பதிலாக மகா கசப்பு வந்திருந்தது, தேவரீரோ என் ஆத்துமாவை நேசித்து அழிவின் குழிக்கு விலக்கினீர், என் பாவங்களையெல்லாம் உமது முதுகுக்குப் பின்னாக எறிந்துவிட்டீர்.","ISA.40.29.29":"சோர்ந்துபோகிறவனுக்கு அவர்பெலன் கொடுத்து, சத்துவமில்லாதவனுக்குச் சத்துவத்தைப் பெருகப்பண்ணுகிறார்.","ISA.40.31.31":"கர்த்தருக்குக் காத்திருக்கிறவர்களோ புதுப்பெலன் அடைந்து, கழுகுகளைப்போலச் செட்டைகளை அடித்து எழும்புவார்கள், அவர்கள் ஓடினாலும் இளைப்படையார்கள், நடந்தாலும் சோர்ந்துபோகார்கள். ஏசாயா","ISA.41.10.10":"நீ பயப்படாதே, நான் உன்னுடனே இருக்கிறேன், திகையாதே, நான் உன் தேவன், நான் உன்னைப் பலப்படுத்தி உனக்குச் சகாயம்பண்ணுவேன், என் நீதியின் வலதுகரத்தினால் உன்னைத் தாங்குவேன்.","ISA.41.13.13":"உன் தேவனாயிருக்கிற கர்த்தராகிய நான் உன் வலதுகையைப் பிடித்து பயப்படாதே, நான் உனக்குத் துணைநிற்கிறேன் என்று சொல்லுகிறேன்.","ISA.42.16.16":"குருடரை அவர்கள் அறியாத வழியிலே நடத்தி, அவர்களுக்குத் தெரியாத பாதைகளில் அவர்களை அழைத்துக்கொண்டுவந்து, அவர்களுக்கு முன்பாக இருளை வெளிச்சமும், கோணலைச் செவ்வையுமாக்குவேன், இந்தக் காரியங்களை நான் அவர்களுக்குச் செய்து, அவர்களைக் கைவிடாதிருப்பேன்.","ISA.43.5.5":"பயப்படாதே, நான் உன்னோடே இருக்கிறேன், நான் உன் சந்ததியைப் கிழக்கிலிருந்து வரப்பண்ணி, உன்னை மேற்கிலும் இருந்து கூட்டிச்சேர்ப்பேன்.","ISA.43.18.19":"முந்தினவைகளை நினைக்கவேண்டாம், பூர்வமானவைகளைச் சிந்திக்கவேண்டாம். இதோ, நான் புதிய காரியத்தைச் செய்கிறேன், இப்பொழுதே அது தோன்றும், நீங்கள் அதை அறியீர்களா? நான் வனாந்தரத்திலே வழியையும், அவாந்தரவெளியிலே ஆறுகளையும் உண்டாக்குவேன்.","ISA.43.25.25":"நான், நானே உன் மீறுதல்களை என் நிமித்தமாகவே குலைத்துப்போடுகிறேன், உன் பாவங்களை நினையாமலும் இருப்பேன்.","ISA.44.3.3":"தாகமுள்ளவன்மேல் தண்ணீரையும், வறண்ட நிலத்தின்மேல் ஆறுகளையும் ஊற்றுவேன், உன் சந்ததியின்மேல் என் ஆவியையும், உன் சந்தானத்தின்மேல் என் ஆசீர்வாதத்தையும் ஊற்றுவேன்.","ISA.44.22.22":"உன் மீறுதல்களை மேகத்தைப்போலவும், உன் பாவங்களைக் கார்மேகத்தைப்போலவும் அகற்றிவிட்டேன், என்னிடத்தில் திரும்பு, உன்னை நான் மீட்டுக்கொண்டேன்.","ISA.46.4.4":"உங்கள் முதிர்வயதுவரைக்கும் நான் அப்படிச் செய்துவந்தேன், இனிமட்டும் நான் உங்களைத் தாங்குவேன், நான் அப்படிச் செய்துவந்தேன், இனிமேலும் நான் ஏந்துவேன், நான் சுமப்பேன், தப்புவிப்பேன்.","ISA.46.10.10":"அந்தத்திலுள்ளவைகளை ஆதிமுதற்கொண்டும், இன்னும் செய்யப்படாதவைகளைப் பூர்வகாலமுதற்கொண்டும் அறிவிக்கிறேன், என் ஆலோசனை நிலைநிற்கும், எனக்குச் சித்தமானவைகளையெல்லாம் செய்வேன் என்று சொல்லி,","ISA.48.15.15":"நான், நானே அதைச் சொன்னேன், நான் அவனை அழைத்தேன், நான் அவனை வரப்பண்ணினேன், அவன் வழி வாய்க்கும்.","ISA.48.17.17":"இஸ்ரவேலின் பரிசுத்தராயிருக்கிற உன் மீட்பரான கர்த்தர் சொல்லுகிறதாவது பிரயோஜனமாயிருக்கிறதை உனக்குப் போதித்து, நீ நடக்கவேண்டிய வழியிலே உன்னை நடத்துகிற உன் தேவனாகிய கர்த்தர் நானே.","ISA.48.18.18":"ஆ, என் கற்பனைகளைக் கவனித்தாயானால் நலமாயிருக்கும், அப்பொழுது உன் சமாதானம் நதியைப்போலும், உன் நீதி சமுத்திரத்தின் அலைகளைப்போலும் இருக்கும்.","ISA.49.15.16":"ஸ்திரீயானவள் தன் கர்ப்பத்தின் பிள்ளைக்கு இரங்காமல், தன் பாலகனை மறப்பாளோ? அவர்கள் மறந்தாலும், நான் உன்னை மறப்பதில்லை. இதோ, என் உள்ளங்கைகளில் உன்னை வரைந்திருக்கிறேன், உன் மதில்கள் எப்போதும் என்முன் இருக்கிறது.","ISA.53.5.5":"நம்முடைய மீறுதல்களினிமித்தம் அவர் காயப்பட்டு, நம்முடைய அக்கிரமங்களினிமித்தம் அவர் நொறுக்கப்பட்டார், நமக்குச் சமாதானத்தை உண்டுபண்ணும் ஆக்கினை அவர்மேல் வந்தது, அவருடைய தழும்புகளால் குணமாகிறோம்.","ISA.54.10.10":"மலைகள் விலகினாலும், பர்வதங்கள் நிலைபெயர்ந்தாலும், என் கிருபை உன்னைவிட்டு விலகாமலும், என் சமாதானத்தின் உடன்படிக்கை நிலைபெயராமலும் இருக்கும் என்று, உன்மேல் மனதுருகுகிற கர்த்தர் சொல்லுகிறார்.","ISA.54.13.13":"உன் பிள்ளைகளெல்லாரும் கர்த்தரால் போதிக்கப்பட்டிருப்பார்கள், உன் பிள்ளைகளுடைய சமாதானம் பெரிதாயிருக்கும்.","ISA.54.17.17":"உனக்கு விரோதமாய் உருவாக்கப்படும் எந்த ஆயுதமும் வாய்க்காதேபோம், உனக்கு விரோதமாய் நியாயத்தில் எழும்பும் எந்த நாவையும் நீ குற்றப்படுத்துவாய், இது கர்த்தருடைய ஊழியக்காரரின் சுதந்தரமும், என்னாலுண்டான அவர்களுடைய நீதியுமாயிருக்கிறதென்று கர்த்தர் சொல்லுகிறார். ஏசாயா","ISA.55.12.12":"நீங்கள் மகிழ்ச்சியாய்ப் புறப்பட்டு, சமாதானமாய்க் கொண்டுபோகப்படுவீர்கள், பர்வதங்களும் மலைகளும் உங்களுக்கு முன்பாகக் கெம்பீரமாய் முழங்கி, வெளியின் மரங்களெல்லாம் கைகொட்டும்.","ISA.58.11.11":"கர்த்தர் நித்தமும் உன்னை நடத்தி, மகா வறட்சியான காலங்களில் உன் ஆத்துமாவைத் திருப்தியாக்கி, உன் எலும்புகளை நிணமுள்ளதாக்குவார், நீ நீர்ப்பாய்ச்சலான தோட்டத்தைப்போலவும், வற்றாத நீரூற்றைப்போலவும் இருப்பாய்.","ISA.59.19.19":"அப்பொழுது சூரியன் அஸ்தமிக்குந்திசைதொடங்கி கர்த்தரின் நாமத்துக்கும், சூரியன் உதிக்குந்திசை தொடங்கி அவருடைய மகிமைக்கும் பயப்படுவார்கள், வெள்ளம்போல் சத்துரு வரும்போது, கர்த்தருடைய ஆவியானவர் அவனுக்கு விரோதமாய்க் கொடியேற்றுவார்.","ISA.60.1.1":"எழும்பிப் பிரகாசி, உன் ஔி வந்தது, கர்த்தருடைய மகிமை உன்மேல் உதித்தது.","ISA.61.1.1":"கர்த்தராகிய தேவனுடைய ஆவியானவர் என்மேல் இருக்கிறார், சிறுமைப்பட்டவர்களுக்குச் சுவிசேஷத்தை அறிவிக்கக் கர்த்தர் என்னை அபிஷேகம்பண்ணினார், இருதயம் நொறுங்குண்டவர்களுக்குக் காயங்கட்டுதலையும், சிறைப்பட்டவர்களுக்கு விடுதலையையும், கட்டுண்டவர்களுக்குக் கட்டவிழ்த்தலையும் கூறவும்,","ISA.61.3.3":"சீயோனிலே துயரப்பட்டவர்களைச் சீர்ப்படுத்தவும், அவர்களுக்குச் சாம்பலுக்குப் பதிலாகச் சிங்காரத்தையும், துயரத்துக்குப் பதிலாக ஆனந்த தைலத்தையும், ஒடுங்கின ஆவிக்குப் பதிலாகத் துதியின் உடையையும் கொடுக்கவும், அவர் என்னை அனுப்பினார், அவர்கள் கர்த்தர் தம்முடைய மகிமைக்கென்று நாட்டின நீதியின் விருட்சங்களென்னப்படுவார்கள்.","ISA.61.7.7":"உங்கள் வெட்கத்துக்குப் பதிலாக இரண்டத்தனையாய்ப் பலன் வரும், இலச்சைக்குப் பதிலாகத் தங்கள் பாகத்தில் சந்தோஷப்படுவார்கள், அதினிமித்தம் தங்கள் தேசத்தில் இரட்டிப்பான சுதந்தரம் அடைவார்கள், நித்திய மகிழ்ச்சி அவர்களுக்கு உண்டாகும்.","JAS.1.2.4":"என் சகோதரரே, நீங்கள் பலவிதமான சோதனைகளில் அகப்படும்போது, உங்கள் விசுவாசத்தின் பரீட்சையானது பொறுமையை உண்டாக்குமென்று அறிந்து, அதை மிகுந்த சந்தோஷமாக எண்ணுங்கள். நீங்கள் ஒன்றிலும் குறைவுள்ளவர்களாயிராமல், பூரணராயும் நிறைவுள்ளவர்களாயும் இருக்கும்படி, பொறுமையானது பூரண கிரியை செய்யக்கடவது.","JAS.1.5.5":"உங்களில் ஒருவன் ஞானத்தில் குறைவுள்ளவனாயிருந்தால், யாவருக்கும் சம்பூரணமாய்க் கொடுக்கிறவரும் ஒருவரையும் கடிந்துகொள்ளாதவருமாகிய தேவனிடத்தில் கேட்கக்கடவன், அப்பொழுது அவனுக்குக் கொடுக்கப்படும்.","JAS.1.6.6":"ஆனாலும் அவன் எவ்வளவாகிலும் சந்தேகப்படாமல் விசுவாசத்தோடே கேட்கக்கடவன்: சந்தேகப்படுகிறவன் காற்றினால் அடிபட்டு அலைகிற கடலின் அலைக்கு ஒப்பாயிருக்கிறான்.","JAS.1.12.12":"சோதனையைச் சகிக்கிற மனுஷன் பாக்கியவான்: அவன் உத்தமனென்று விளங்கினபின்பு கர்த்தர் தம்மிடத்தில் அன்புகூருகிறவர்களுக்கு வாக்குத்தத்தம் பண்ணின ஜீவகிரீடத்தைப் பெறுவான்.","JAS.5.14.15":"உங்களில் ஒருவன் வியாதிப்பட்டால், அவன் சபையின் மூப்பர்களை வரவழைப்பானாக: அவர்கள் கர்த்தருடைய நாமத்தினாலே அவனுக்கு எண்ணெய்பூசி, அவனுக்காக ஜெபம்பண்ணக்கடவர்கள். அப்பொழுது விசுவாசமுள்ள ஜெபம் பிணியாளியை இரட்சிக்கும்: கர்த்தர் அவனை எழுப்புவார்: அவன் பாவஞ்செய்தவனானால் அது அவனுக்கு மன்னிக்கப்படும்.","JER.15.20.20":"உன்னை இந்த ஜனத்துக்கு எதிரே அரணான வெண்கல அலங்கமாக்குவேன், அவர்கள் உனக்கு விரோதமாக யுத்தம்பண்ணுவார்கள், ஆனாலும் உன்னை மேற்கொள்ள மாட்டார்கள், உன்னை இரட்சிப்பதற்காகவும், உன்னைத்தப்புவிப்பதற்காகவும், நான் உன்னுடனே இருக்கிறேன் என்று கர்த்தர் சொல்லுகிறார்.","JER.17.7.7":"கர்த்தர்மேல் நம்பிக்கைவைத்து, கர்த்தரைத் தன் நம்பிக்கையாகக் கொண்டிருக்கிற மனுஷன் பாக்கியவான்.","JER.17.7.8":"கர்த்தர்மேல் நம்பிக்கைவைத்து, கர்த்தரைத் தன் நம்பிக்கையாகக் கொண்டிருக்கிற மனுஷன் பாக்கியவான். அவன் தண்ணீரண்டையிலே நாட்டப்பட்டதும், கால்வாய் ஓரமாகத்தன்வேர்களை விடுகிறதும், உஷ்ணம் வருகிறதைக் காணாமல் இலை பச்சையாயிருக்கிறதும், மழைத்தாழ்ச்சியான வருஷத்திலும் வருத்தமின்றித் தப்பாமல் கனிகொடுக்கிறதுமான மரத்தைப்போலிருப்பான்.","JER.17.14.14":"கர்த்தாவே, என்னைக் குணமாக்கும், அப்பொழுது குணமாவேன், என்னை இரட்சியும், அப்பொழுது இரட்சிக்கப்படுவேன், தேவரீரே என் துதி.","JER.29.11.11":"நீங்கள் எதிர்பார்த்திருக்கும் முடிவை உங்களுக்குக் கொடுக்கும்படிக்கு நான் உங்கள்பேரில் நினைத்திருக்கிற நினைவுகளை அறிவேன் என்று கர்த்தர் சொல்லுகிறார், அவைகள் தீமைக்கல்ல, சமாதானத்துக்கேதுவான நினைவுகளே.","JER.29.12.13":"அப்பொழுது நீங்கள் கூடிவந்து, என்னைத் தொழுதுகொண்டு, என்னை நோக்கி விண்ணப்பம்பண்ணுவீர்கள், நான் உங்களுக்குச் செவிகொடுப்பேன். உங்கள் முழு இருதயத்தோடும் என்னைத் தேடினீர்களானால், என்னைத் தேடுகையில் கண்டுபிடிப்பீர்கள்.","JER.30.17.17":"அவர்கள் உன்னை விசாரிப்பாரற்ற சீயோன் என்று சொல்லி, உனக்குத் தள்ளுண்டவள் என்று பேரிட்டபடியால், நான் உனக்கு ஆரோக்கியம் வரப்பண்ணி, உன் காயங்களை ஆற்றுவேன் என்று கர்த்தர் சொல்லுகிறார்.","JER.31.3.3":"பூர்வகாலமுதல் கர்த்தர் எனக்குத் தரிசனையானார் என்பாய், ஆம் அநாதி சிநேகத்தால் உன்னைச் சிநேகித்தேன், ஆதலால் காருணியத்தால் உன்னை இழுத்துக்கொள்ளுகிறேன்.","JER.31.16.17":"நீ அழாதபடிக்கு உன் சத்தத்தை அடக்கி, நீ கண்ணீர் விடாதபடிக்கு உன் கண்களைக் காத்துக்கொள் என்று கர்த்தர் சொல்லுகிறார், உன் கிரியைக்குப் பலனுண்டென்று கர்த்தர் சொல்லுகிறார், அவர்கள் சத்துருவின் தேசத்திலிருந்து திரும்பிவருவார்கள். உன் முடிவைப்பற்றி உனக்கு நம்பிக்கையுண்டு, உன் பிள்ளைகள் தங்கள் தேசத்துக்குத் திரும்பிவருவார்கள் என்று கர்த்தர் சொல்லுகிறார்.","JER.31.34.34":"இனி ஒருவன் தன் அயலானையும், ஒருவன் தன் சகோதரனையும் நோக்கி கர்த்தரை அறிந்துகொள் என்று போதிப்பதில்லை, அவர்களில் சிறியவன்முதல் பெரியவன்மட்டும், எல்லாரும் என்னை அறிந்துகொள்வார்கள் என்று கர்த்தர் சொல்லுகிறார், நான் அவர்கள் அக்கிரமத்தை மன்னித்து, அவர்கள் பாவங்களை இனி நினையாதிருப்பேன்.","JER.32.27.27":"இதோ, நான் மாம்சமான யாவருக்கும் தேவனாகிய கர்த்தர், என்னாலே செய்யக்கூடாத அதிசயமான காரியம் ஒன்றுண்டோ?","JER.33.3.3":"என்னை நோக்கிக் கூப்பிடு, அப்பொழுது நான் உனக்கு உத்தரவு கொடுத்து, நீ அறியாததும் உனக்கு எட்டாததுமான பெரிய காரியங்களை உனக்கு அறிவிப்பேன்.","JHN.3.16.16":"தேவன், தம்முடைய ஒரேபேறான குமாரனை விசுவாசிக்கிறவன் எவனோ அவன் கெட்டுப்போகாமல் நித்தியஜீவனை அடையும்படிக்கு, அவரைத் தந்தருளி, இவ்வளவாய் உலகத்தில் அன்புகூர்ந்தார்.","JHN.6.35.35":"இயேசு அவர்களை நோக்கி ஜீவஅப்பம் நானே, என்னிடத்தில் வருகிறவன் ஒருக்காலும் பசியடையான், என்னிடத்தில் விசுவாசமாயிருக்கிறவன் ஒருக்காலும் தாகமடையான்.","JHN.8.12.12":"மறுபடியும் இயேசு ஜனங்களை நோக்கி நான் உலகத்திற்கு ஔியாயிருக்கிறேன், என்னைப் பின்பற்றுகிறவன் இருளிலே நடவாமல் ஜீவஔியை அடைந்திருப்பான் என்றார்.","JHN.10.10.10":"திருடன் திருடவும் கொல்லவும் அழிக்கவும் வருகிறானேயன்றி வேறொன்றுக்கும் வரான். நானோ அவைகளுக்கு ஜீவன் உண்டாயிருக்கவும், அது பரிபூரணப்படவும் வந்தேன்.","JHN.10.27.27":"என் ஆடுகள் என் சத்தத்திற்குச் செவிகொடுக்கிறது: நான் அவைகளை அறிந்திருக்கிறேன், அவைகள் எனக்குப் பின்செல்லுகிறது.","JHN.11.40.40":"இயேசு அவளை நோக்கி நீ விசுவாசித்தால் தேவனுடைய மகிமையைக் காண்பாய் என்று நான் உனக்குச் சொல்லவில்லையா என்றார்.","JHN.13.34.34":"நீங்கள் ஒருவரிலொருவர் அன்பாயிருங்கள்: நான் உங்களில் அன்பாயிருந்ததுபோல நீங்களும் ஒருவரிலொருவர் அன்பாயிருங்கள் என்கிற புதிதான கட்டளையை உங்களுக்குக் கொடுக்கிறேன்.","JHN.14.16.18":"நான் பிதாவை வேண்டிக்கொள்ளுவேன், அப்பொழுது என்றென்றைக்கும் உங்களுடனேகூட இருக்கும்படிக்குச் சத்திய ஆவியாகிய வேறொரு தேற்றரவாளனை அவர் உங்களுக்குத் தந்தருளுவார். உலகம் அந்தச் சத்திய ஆவியானவரைக் காணாமலும் அறியாமலும். இருக்கிறபடியால் அவரைப் பெற்றுக்கொள்ளமாட்டாது: அவர் உங்களுடனே வாசம்பண்ணி உங்களுக்குள்ளே இருப்பதால், நீங்கள் அவரை அறிவீர்கள். நான் உங்களைத் திக்கற்றவர்களாகவிடேன், உங்களிடத்தில் வருவேன்.","JHN.14.27.27":"சமாதானத்தை உங்களுக்கு வைத்துப்போகிறேன், என்னுடைய சமாதானத்தையே உங்களுக்குக் கொடுக்கிறேன்: உலகம் கொடுக்கிறபிரகாரம் நான் உங்களுக்குக் கொடுக்கிறதில்லை. உங்கள் இருதயம் கலங்காமலும் பயப்படாமலும் இருப்பதாக.","JHN.15.9.9":"பிதா என்னில் அன்பாயிருக்கிறதுபோல நானும் உங்களில் அன்பாயிருக்கிறேன்: என்னுடைய அன்பிலே நிலைத்திருங்கள்.","JHN.15.13.13":"ஒருவன் தன் சிநேகிதருக்காகத் தன் ஜீவனைக் கொடுக்கிற அன்பிலும் அதிகமான அன்பு ஒருவரிடத்திலுமில்லை.","JHN.15.15.15":"இனி நான் உங்களை ஊழியக்காரரென்று சொல்லுகிறதில்லை, ஊழியக்காரன் தன் எஜமான் செய்கிறதை அறியமாட்டான். நான் உங்களைச் சிநேகிதர் என்றேன், ஏனெனில் என் பிதாவினிடத்தில் நான் கேள்விப்பட்ட எல்லாவற்றையும் உங்களுக்கு அறிவித்தேன்.","JHN.16.13.13":"சத்தியஆவியாகிய அவர் வரும்போது, சகல சத்தியத்திற்குள்ளும் உங்களை நடத்துவார்: அவர் தம்முடைய சுயமாய்ப் பேசாமல், தாம் கேள்விப்பட்டவைகள் யாவையுஞ்சொல்லி, வரப்போகிற காரியங்களை உங்களுக்கு அறிவிப்பார்.","JHN.16.32.32":"இதோ, நீங்கள் சிதறுண்டு, அவனவன் தன்தன் இடத்துக்குப் போய், என்னைத் தனியே விட்டுவிடுங்காலம் வரும்: அது இப்பொழுது வந்திருக்கிறது: ஆனாலும் நான் தனித்திரேன், பிதா என்னுடனேகூட இருக்கிறார்.","JHN.16.33.33":"என்னிடத்தில் உங்களுக்குச் சமாதானம் உண்டாயிருக்கும்பொருட்டு இவைகளை உங்களுக்குச் சொன்னேன். உலகத்தில் உங்களுக்கு உபத்திரவம் உண்டு, ஆனாலும் திடன்கொள்ளுங்கள்: நான் உலகத்தை ஜெயித்தேன் என்றார். யோவான்","JHN.17.23.23":"ஒருமைப்பாட்டில் அவர்கள் தேறினவர்களாயிருக்கும்படிக்கும், என்னை நீர் அனுப்பினதையும், நீர் என்னில் அன்பாயிருக்கிறதுபோல அவர்களிலும் அன்பாயிருக்கிறதையும் உலகம் அறியும்படிக்கும், நான் அவர்களிலும் நீர் என்னிலும் இருக்கும்படி வேண்டிக்கொள்ளுகிறேன்.","JHN.20.29.29":"அதற்கு இயேசு தோமாவே, நீ என்னைக் கண்டதினாலே விசுவாசித்தாய், காணாதிருந்தும் விசுவாசிக்கிறவர்கள் பாக்கியவான்கள் என்றார்.","JOB.22.21.21":"நீர் அவரோடே பழகிச் சமாதானமாயிரும். அதினால் உமக்கு நன்மை வரும்.","JOB.28.28.28":"மனுஷனை நோக்கி இதோ, ஆண்டவருக்குப் பயப்படுவதே ஞானம். பொல்லாப்பை விட்டு விலகுவதே புத்தி என்றார் என்று சொன்னான். யோபு","JOL.2.25.25":"நான் உங்களிடத்தில் அனுப்பின என் பெரிய சேனையாகிய வெட்டுக்கிளிகளும், பச்சைக்கிளிகளும், முசுக்கட்டைப்பூச்சிகளும், பச்சைப்புழுக்களும் பட்சித்த வருஷங்களின் விளைவை உங்களுக்குத் திரும்ப அளிப்பேன்.","JOL.2.28.28":"அதற்குப் பின்பு நான் மாம்சமான யாவர் மேலும் என் ஆவியை ஊற்றுவேன், அப்பொழுது உங்கள் குமாரரும் உங்கள் குமாரத்திகளும் தீர்க்கதரிசனஞ் சொல்லுவார்கள், உங்கள் மூப்பர் சொப்பனங்களையும், உங்கள் வாலிபர் தரிசனங்களையும் காண்பார்கள்.","JOS.1.5.5":"நீ உயிரோடிருக்கும் நாளெல்லாம் ஒருவனும் உனக்கு முன்பாக எதிர்த்து நிற்பதில்லை. நான் மோசேயோடே இருந்ததுபோல, உன்னோடும் இருப்பேன். நான் உன்னைவிட்டு விலகுவதுமில்லை, உன்னைக் கைவிடுவதுமில்லை.","JOS.1.8.8":"இந்த நியாயப்பிரமாண புஸ்தகம் உன் வாயைவிட்டுப் பிரியாதிருப்பதாக. இதில் எழுதியிருக்கிறவைகளின்படியெல்லாம் நீ செய்யக் கவனமாயிருக்கும்படி, இரவும் பகலும் அதைத் தியானித்துக்கொண்டிருப்பாயாக. அப்பொழுது நீ உன் வழியை வாய்க்கப்பண்ணுவாய், அப்பொழுது புத்திமானாயும் நடந்துகொள்ளுவாய்.","JOS.1.9.9":"நான் உனக்குக் கட்டளையிடவில்லையா? பலங்கொண்டு திடமனதாயிரு. திகையாதே, கலங்காதே, நீ போகும் இடமெல்லாம் உன் தேவனாகிய கர்த்தர் உன்னோடே இருக்கிறார் என்றார்.","JOS.21.45.45":"கர்த்தர் இஸ்ரவேல் குடும்பத்தாருக்குச் சொல்லியிருந்த நல்வார்த்தைகளிலெல்லாம் ஒரு வார்த்தையும் தவறிப்போகவில்லை. எல்லாம் நிறைவேறிற்று. யோசுவா","JOS.24.15.15":"கர்த்தரைச் சேவிக்கிறது உங்கள் பார்வைக்கு ஆகாததாய்க் கண்டால், பின்னை யாரைச் சேவிப்பீர்கள் என்று இன்று தெரிந்துகொள்ளுங்கள். நதிக்கு அப்புறத்தில் உங்கள் பிதாக்கள் சேவித்த தேவர்களைச் சேவிப்பீர்களோ? நீங்கள் வாசம்பண்ணுகிற தேசத்துக் குடிகளாகிய எமோரியரின் தேவர்களைச் சேவிப்பீர்களோ? நானும் என் வீட்டாருமோவென்றால் கர்த்தரையே சேவிப்போம் என்றான்.","LAM.3.21.23":"இதை என் மனதிலே வைத்து, நம்பிக்கைகொண்டிருப்பேன். நாம் நிர்மூலமாகாதிருக்கிறது கர்த்தருடைய கிருபையே, அவருடைய இரக்கங்களுக்கு முடிவில்லை. அவைகள் காலைதோறும் புதியவைகள், உமது உண்மை பெரியதாயிருக்கிறது.","LAM.3.25.25":"தமக்குக் காத்திருக்கிறவர்களுக்கும் தம்மைத் தேடுகிற ஆத்துமாவுக்கும் கர்த்தர் நல்லவர்.","LAM.3.32.32":"அவர் சஞ்சலப்படுத்தினாலும் தமது மிகுந்த கிருபையின்படி இரங்குவார்.","LUK.1.37.37":"தேவனாலே கூடாதகாரியம் ஒன்றுமில்லை என்றான்.","LUK.1.79.79":"நம்முடைய கால்களைச் சமாதானத்தின் வழியிலே நடத்தவும், அவ்விரக்கத்தினாலே உன்னதத்திலிருந்து தோன்றிய அருணோதயம் நம்மைச் சந்தித்திருக்கிறது என்றான்.","LUK.10.19.19":"இதோ, சர்ப்பங்களையும் தோள்களையும் மிதிக்கவும், சத்துருவினுடைய சகல வல்லமையையும் மேற்கொள்ளவும் உங்களுக்கு அதிகாரங்கொடுக்கிறேன்: ஒன்றும் உங்களைச் சேதப்படுத்தமாட்டாது.","LUK.11.9.10":"மேலும் நான் உங்களுக்குச் சொல்லுகிறதாவது கேளுங்கள், அப்பொழுது உங்களுக்குக் கொடுக்கப்படும்: தேடுங்கள், அப்பொழுது கண்டடைவீர்கள்: தட்டுங்கள், அப்பொழுது உங்களுக்குத் திறக்கப்படும். ஏனென்றால், கேட்கிறவன் எவனும் பெற்றுக்கொள்ளுகிறான்: தேடுகிறவன் கண்டடைகிறான்: தட்டுகிறவனுக்குத் திறக்கப்படும்.","LUK.12.24.24":"காகங்களைக் கவனித்துப்பாருங்கள், அவைகள் விதைக்கிறதுமில்லை அறுக்கிறதுமில்லை, அவைகளுக்குப் பண்டசாலையுமில்லை, களஞ்சியமுமில்லை, இல்லாவிட்டாலும் அவைகளையும் தேவன் பிழைப்பூட்டுகிறார்: பறவைகளைப்பார்க்கிலும் நீங்கள் எவ்வளவோ விசேஷித்தவர்களாயிருக்கிறீர்கள்.","LUK.12.32.32":"பயப்படாதே சிறுமந்தையே, உங்களுக்கு ராஜ்யத்தைக் கொடுக்க உங்கள் பிதா பிரியமாயிருக்கிறார்.","LUK.15.20.20":"எழுந்து புறப்பட்டு, தன் தகப்பனிடத்தில் வந்தான். அவன் தூரத்தில் வரும்போதே, அவனுடைய தகப்பன் அவனைக் கண்டு, மனதுருகி, ஓடி அவன் கழுத்தைக் கட்டிக்கொண்டு, அவனை முத்தஞ்செய்தான்.","LUK.17.6.6":"அதற்குக் கர்த்தர் கடுகுவிதையளவு விசுவாசம் உங்களுக்கு உண்டாயிருந்தால், நீங்கள் இந்தக் காட்டத்திமரத்தை நோக்கி நீ வேரோடே பிடுங்குண்டு கடலிலே நடப்படுவாயாக என்று சொல்ல, அது உங்களுக்குக் கீழ்ப்படியும்.","MAL.3.10.10":"என் ஆலயத்தில் ஆகாரம் உண்டாயிருக்கும்படித் தசமபாகங்களையெல்லாம் பண்டசாலையிலே கொண்டு வாருங்கள். அப்பொழுது நான் வானத்தின் பலகணிகளைத் திறந்து, இடங்கொள்ளாமற் போகுமட்டும் உங்கள்மேல் ஆசீர்வாதத்தை வருஷிக்கமாட்டேனோவென்று அதினால் என்னைச் சோதித்துப் பாருங்கள் என்று சேனைகளின் கர்த்தர் சொல்லுகிறார்.","MAL.4.2.2":"ஆனாலும் என் நாமத்துக்குப் பயந்திருக்கிற உங்கள்மேல் நீதியின் சூரியன் உதிக்கும். அதின் செட்டைகளின்கீழ் ஆரோக்கியம் இருக்கும். நீங்கள் வெளியே புறப்பட்டுப்போய், கொழுத்த கன்றுகளைப்போல வளருவீர்கள்.","MAT.6.14.15":"மனுஷருடைய தப்பிதங்களை நீங்கள் அவர்களுக்கு மன்னித்தால், உங்கள் பரமபிதா உங்களுக்கும் மன்னிப்பார். மனுஷருடைய தப்பிதங்களை நீங்கள் அவர்களுக்கு மன்னியாதிருந்தால், உங்கள் பிதா உங்கள் தப்பிதங்களையும் மன்னியாதிருப்பார்.","MAT.6.25.26":"ஆகையால், என்னத்தை உண்போம், என்னத்தைக் குடிப்போம் என்று உங்கள் ஜீவனுக்காகவும்: என்னத்தை உடுப்போம் என்று உங்கள் சரீரத்துக்காகவும் கவலைப்படாதிருங்கள் என்று, உங்களுக்குச் சொல்லுகிறேன்: ஆகாரத்தைப்பார்க்கிலும் ஜீவனும், உடையைப்பார்க்கிலும் சரீரமும் விசேஷித்தவைகள் அல்லவா? ஆகாயத்துப் பட்சிகளைக் கவனித்துப்பாருங்கள்: அவைகள் விதைக்கிறதுமில்லை, அறுக்கிறதுமில்லை, களஞ்சியங்களில் சேர்த்துவைக்கிறதுமில்லை: அவைகளையும் உங்கள் பரமபிதா பிழைப்பூட்டுகிறார்: அவைகளைப்பார்க்கிலும் நீங்கள் விசேஷித்தவர்கள் அல்லவா?","MAT.6.31.33":"ஆகையால், என்னத்தை உண்போம், என்னத்தைக் குடிப்போம், என்னத்தை உடுப்போம் என்று, கவலைப்படாதிருங்கள். இவைகளையெல்லாம் அஞ்ஞானிகள் நாடித்தேடுகிறார்கள்: இவைகளெல்லாம் உங்களுக்கு வேண்டியவைகள் என்று உங்கள் பரமபிதா அறிந்திருக்கிறார். முதலாவது தேவனுடைய ராஜ்யத்தையும் அவருடைய நீதியையும் தேடுங்கள், அப்பொழுது இவைகளெல்லாம் உங்களுக்குக்கூடக் கொடுக்கப்படும்.","MAT.6.33.33":"முதலாவது தேவனுடைய ராஜ்யத்தையும் அவருடைய நீதியையும் தேடுங்கள், அப்பொழுது இவைகளெல்லாம் உங்களுக்குக்கூடக் கொடுக்கப்படும்.","MAT.7.7.8":"கேளுங்கள், அப்பொழுது உங்களுக்குக் கொடுக்கப்படும்: தேடுங்கள், அப்பொழுது கண்டடைவீர்கள்: தட்டுங்கள், அப்பொழுது உங்களுக்குத் திறக்கப்படும்: ஏனென்றால், கேட்கிறவன் எவனும் பெற்றுக்கொள்ளுகிறான்: தேடுகிறவன் கண்டடைகிறான்: தட்டுகிறவனுக்குத் திறக்கப்படும்.","MAT.8.16.17":"அஸ்தமனமானபோது, பிசாசு பிடித்திருந்த அநேகரை அவரிடத்தில் கொண்டு வந்தார்கள்: அவர் அந்த ஆவிகளைத் தமது வார்த்தையினாலே துரத்தி, பிணியாளிகளெல்லாரையும் சொஸ்தமாக்கினார். அவர் தாமே நம்முடைய பெலவீனங்களை ஏற்றுக்கொண்டு, நம்முடைய நோய்களைச் சுமந்தார் என்று, ஏசாயா தீர்க்கதரிசியினால் உரைக்கப்பட்டது நிறைவேறும்படி இப்படி நடந்தது.","MAT.9.29.29":"அப்பொழுது, அவர்களுடைய கண்களை அவர் தொட்டு உங்கள் விசுவாசத்தின்படி உங்களுக்கு ஆகக்கடவது என்றார்.","MAT.10.29.31":"ஒரு காசுக்கு இரண்டு அடைக்கலான் குருவிகளை விற்கிறார்கள் அல்லவா? ஆயினும் உங்கள் பிதாவின் சித்தமில்லாமல், அவைகளில் ஒன்றாகிலும் தரையிலே விழாது. உங்கள் தலையிலுள்ள மயிரெல்லாம் எண்ணப்பட்டிருக்கிறது. ஆதலால், பயப்படாதிருங்கள்: அநேகம் அடைக்கலான் குருவிகளைப்பார்க்கிலும் நீங்கள் விசேஷித்தவர்களாயிருக்கிறீர்கள்.","MAT.11.28.28":"வருத்தப்பட்டுப் பாரஞ்சுமக்கிறவர்களே! நீங்கள் எல்லாரும் என்னிடத்தில் வாருங்கள்: நான் உங்களுக்கு இளைப்பாறுதல் தருவேன்.","MAT.11.28.29":"வருத்தப்பட்டுப் பாரஞ்சுமக்கிறவர்களே! நீங்கள் எல்லாரும் என்னிடத்தில் வாருங்கள்: நான் உங்களுக்கு இளைப்பாறுதல் தருவேன். நான் சாந்தமும் மனத்தாழ்மையுமாய் இருக்கிறேன்: என் நுகத்தை உங்கள் மேல் ஏற்றுக்கொண்டு, என்னிடத்தில் கற்றுக்கொள்ளுங்கள்: அப்பொழுது, உங்கள் ஆத்துமாக்களுக்கு இளைப்பாறுதல் கிடைக்கும்.","MAT.17.20.20":"அதற்கு இயேசு உங்கள் அவிசுவாசத்தினாலேதான்: கடுகுவிதையளவு விசுவாசம் உங்களுக்கு இருந்தால் நீங்கள் இந்த மலையைப் பார்த்து, இவ்விடம் விட்டு அப்புறம்போ என்று சொல்ல அது அப்புறம் போம்: உங்களால் கூடாத காரியம் ஒன்றுமிராது என்று, மெய்யாகவே உங்களுக்குச் சொல்லுகிறேன்.","MAT.18.20.20":"ஏனெனில், இரண்டுபேராவது மூன்றுபேராவது என் நாமத்தினாலே எங்கே கூடியிருக்கிறார்களோ, அங்கே அவர்கள் நடுவிலே இருக்கிறேன் என்றார்.","MAT.21.22.22":"மேலும், நீங்கள் விசுவாசமுள்ளவர்களாய் ஜெபத்திலே எவைகளைக் கேட்பீர்களோ அவைகளையெல்லாம் பெறுவீர்கள் என்றார்.","MAT.26.28.28":"இது பாவமன்னிப்புண்டாகும்படி அநேகருக்காகச் சிந்தப்படுகிற புது உடன்படிக்கைக்குரிய என்னுடைய இரத்தமாயிருக்கிறது.","MIC.7.18.19":"தமது சுதந்தரத்தில் மீதியானவர்களுடைய அக்கிரமத்தைப் பொறுத்து, மீறுதலை மன்னிக்கிற தேவரீருக்கு ஒப்பான தேவன் யார்? அவர் கிருபை செய்ய விரும்புகிறபடியால் அவர் என்றென்றைக்கும் கோபம் வையார். அவர் திரும்ப நம்மேல் இரங்குவார். நம்முடைய அக்கிரமங்களை அடக்கி, நம்முடைய பாவங்களையெல்லாம் சமுத்திரத்தின் ஆழங்களில் போட்டுவிடுவார்.","MRK.5.34.34":"அவர் அவளைப் பார்த்து மகளே, உன் விசுவாசம் உன்னை இரட்சித்தது, நீ சமாதானத்தோடேபோய், உன் வேதனை நீங்கி, சுகமாயிரு என்றார்.","MRK.9.23.23":"இயேசு அவனை நோக்கி நீ விசுவாசிக்கக்கூடுமானால் ஆகும், விசுவாசிக்கிறவனுக்கு எல்லாம் கூடும் என்றார்.","MRK.10.14.14":"இயேசு அதைக் கண்டு, விசனமடைந்து சிறு பிள்ளைகள் என்னிடத்தில் வருகிறதற்கு இடங்கொடுங்கள்: அவர்களைத் தடைபண்ணாதிருங்கள்: தேவனுடைய ராஜ்யம் அப்படிப்பட்டவர்களுடையது.","MRK.11.22.24":"இயேசு அவர்களை நோக்கி தேவனிடத்தில் விசுவாசமுள்ளவர்களாயிருங்கள். எவனாகிலும் இந்த மலையைப் பார்த்து நீ பெயர்ந்து, சமுத்திரத்திலே தள்ளுண்டுபோ என்று சொல்லி, தான் சொன்னபடியே நடக்கும் என்று தன் இருதயத்தில் சந்தேகப்படாமல் விசுவாசித்தால், அவன் சொன்னபடியே ஆகும் என்று மெய்யாகவே உங்களுக்குச் சொல்லுகிறேன். ஆதலால், நீங்கள் ஜெபம்பண்ணும் போது எவைகளைக் கேட்டுக்கொள்வீர்களோ, அவைகளைப் பெற்றுக்கொள்வோம் என்று விசுவாசியுங்கள், அப்பொழுது அவைகள் உங்களுக்கு உண்டாகும் என்று சொல்லுகிறேன்.","MRK.11.24.24":"ஆதலால், நீங்கள் ஜெபம்பண்ணும் போது எவைகளைக் கேட்டுக்கொள்வீர்களோ, அவைகளைப் பெற்றுக்கொள்வோம் என்று விசுவாசியுங்கள், அப்பொழுது அவைகள் உங்களுக்கு உண்டாகும் என்று சொல்லுகிறேன்.","NAM.1.7.7":"கர்த்தர் நல்லவர், இக்கட்டுநாளிலே அரணான கோட்டை. தம்மை நம்புகிறவர்களை அறிந்திருக்கிறார்.","NEH.2.20.20":"அதற்கு நான் மறுமொழியாக பரலோகத்தின் தேவனானவர் எங்களுக்குக் காரியத்தைக் கைகூடிவரப்பண்ணுவார். அவருடைய ஊழியக்காரராகிய நாங்கள் எழுந்து கட்டுவோம். உங்களுக்கோவென்றால் எருசலேமிலே பங்குமில்லை பாத்தியமுமில்லை. உங்கள் பேர் விளங்க ஒன்றும் இல்லையென்று அவர்களுடனே சொன்னேன். நெகேமியா","NEH.8.10.10":"பின்னும் அவன் அவர்களை நோக்கி நீங்கள் போய்க் கொழுமையானதைப் புசித்து, மதுரமானதைக் குடித்து, ஒன்றுமில்லாதவர்களுக்குப் பங்குகளை அனுப்புங்கள். இந்த நாள் நம்முடைய ஆண்டவருக்குப் பரிசுத்தமான நாள், விசாரப்படவேண்டாம். கர்த்தருக்குள் மகிழ்ச்சியாயிருப்பதே உங்களுடைய பெலன் என்றான்.","NUM.6.24.26":"கர்த்தர் உன்னை ஆசீர்வதித்து, உன்னைக் காக்கக்கடவர். கர்த்தர் தம்முடைய முகத்தை உன்மேல் பிரகாசிக்கப்பண்ணி, உன்மேல் கிருபையாயிருக்கக்கடவர். கர்த்தர் தம்முடைய முகத்தை உன்மேல் பிரசன்னமாக்கி, உனக்குச் சமாதானம் கட்டளையிடக்கடவர் என்பதே.","NUM.23.19.19":"பொய் சொல்ல தேவன் ஒரு மனிதன் அல்ல, மனம்மாற அவர் ஒரு மனுபுத்திரனும் அல்ல, அவர் சொல்லியும் செய்யாதிருப்பாரா? அவர் வசனித்தும் நிறைவேற்றாதிருப்பாரா?","PHP.1.6.6":"நான் உங்களை நினைக்கிறபொழுதெல்லாம் என் தேவனை ஸ்தோத்திரிக்கிறேன்.","PHP.4.6.7":"நீங்கள் ஒன்றுக்குங் கவலைப்படாமல், எல்லாவற்றையுங்குறித்து உங்கள் விண்ணப்பங்களை ஸ்தோத்திரத்தோடே கூடிய ஜெபத்தினாலும் வேண்டுதலினாலும் தெரியப்படுத்துங்கள். அப்பொழுது, எல்லாப் புத்திக்கும் மேலான தேவசமாதானம் உங்கள் இருதயங்களையும் உங்கள் சிந்தைகளையும் கிறிஸ்து இயேசுவுக்குள்ளாகக் காத்துக்கொள்ளும்.","PHP.4.13.13":"என்னைப் பெலப்படுத்துகிற கிறிஸ்துவினாலே எல்லாவற்றையுஞ்செய்ய எனக்குப் பெலனுண்டு.","PHP.4.19.19":"என் தேவன் தம்முடைய ஐசுவரியத்தின்படி உங்கள் குறைவையெல்லாம் கிறிஸ்து இயேசுவுக்குள் மகிமையிலே நிறைவாக்குவார்.","PRO.1.7.7":"கர்த்தருக்குப் பயப்படுதலே ஞானத்தின் ஆரம்பம்: மூடர் ஞானத்தையும் போதகத்தையும் அசட்டைபண்ணுகிறார்கள்.","PRO.2.6.6":"கர்த்தர் ஞானத்தைத் தருகிறார்: அவர் வாயினின்று அறிவும் புத்தியும் வரும்.","PRO.3.2.2":"அவைகள் உனக்கு நீடித்த நாட்களையும், தீர்க்காயுசையும், சமாதானத்தையும் பெருகப்பண்ணும்.","PRO.3.5.6":"உன் சுயபுத்தியின்மேல் சாயாமல், உன் முழு இருதயத்தோடும் கர்த்தரில் நம்பிக்கையாயிருந்து, உன் வழிகளிலெல்லாம் அவரை நினைத்துக்கொள்: அப்பொழுது அவர் உன் பாதைகளைச் செவ்வைப்படுத்துவார்.","PRO.3.9.10":"உன் பொருளாலும், உன் எல்லா விளைவின் முதற்பலனாலும் கர்த்தரைக் கனம்பண்ணு. அப்பொழுது உன் களஞ்சியங்கள் பூரணமாய் நிரம்பும்: உன் ஆலைகளில் திராட்சரசம் புரண்டோடும்.","PRO.3.13.13":"ஞானத்தைக் கண்டடைகிற மனுஷனும், புத்தியைச் சம்பாதிக்கிற மனுஷனும் பாக்கியவான்கள்.","PRO.3.24.24":"நீ படுக்கும்போது பயப்படாதிருப்பாய்: நீ படுத்துக்கொள்ளும்போது உன் நித்திரை இன்பமாயிருக்கும்.","PRO.3.33.33":"துன்மார்க்கனுடைய வீட்டில் கர்த்தரின் சாபம் இருக்கிறது, நீதிமான்களுடைய வாசஸ்தலத்தையோ அவர் ஆசீர்வதிக்கிறார்.","PRO.4.7.7":"ஞானமே முக்கியம், ஞானத்தைச் சம்பாதி: என்னத்தைச் சம்பாதித்தாலும் புத்தியைச் சம்பாதித்துக்கொள்.","PRO.4.18.18":"நீதிமான்களுடைய பாதை நடுப்பகல்வரைக்கும் அதிகமதிகமாய்ப் பிரகாசிக்கிற சூரியப்பிரகாசம்போலிருக்கும்.","PRO.4.20.22":"என் மகனே, என் வார்த்தைகளைக் கவனி: என் வசனங்களுக்கு உன் செவியைச் சாய். அவைகள் உன் கண்களை விட்டுப் பிரியாதிருப்பதாக: அவைகளை உன் இருதயத்துக்குள்ளே காத்துக்கொள். அவைகளைக் கண்டுபிடிக்கிறவர்களுக்கு அவைகள் ஜீவனும், அவர்கள் உடலுக்கெல்லாம் ஆரோக்கியமுமாம்.","PRO.8.11.11":"முத்துக்களைப்பார்க்கிலும் ஞானமே நல்லது: இச்சிக்கப்படத்தக்கவைகளெல்லாம் அதற்கு நிகரல்ல.","PRO.9.10.10":"கர்த்தருக்குப் பயப்படுதலே ஞானத்தில் ஆரம்பம்: பரிசுத்தரின் அறிவே அறிவு.","PRO.10.4.4":"சோம்பற்கையால் வேலைசெய்கிறவன் ஏழையாவான்: சுறுசுறுப்புள்ளவன் கையோ செல்வத்தை உண்டாக்கும்.","PRO.10.22.22":"கர்த்தரின் ஆசீர்வாதமே ஐசுவரியத்தைத் தரும்: அதனோடே அவர் வேதனையைக் கூட்டார்.","PRO.11.14.14":"ஆலோசனையில்லாத இடத்தில் ஜனங்கள் விழுந்துபோவார்கள்: அநேக ஆலோசனைக்காரர் உண்டானால் சுகம் உண்டாகும்.","PRO.11.25.25":"உதாரகுணமுள்ள ஆத்துமா செழிக்கும்: எவன் தண்ணீர் பாய்ச்சுகிறானோ அவனுக்குத் தண்ணீர் பாய்ச்சப்படும்.","PRO.12.15.15":"மதியீனனுடைய வழி அவன் பார்வைக்குச் செம்மையாயிருக்கும்: ஆலோசனைக்குச் செவிகொடுக்கிறவனோ ஞானமுள்ளவன்.","PRO.12.24.24":"ஜாக்கிரதையுள்ளவர்களுடைய கை ஆளுகைசெய்யும்: சோம்பேறியோ பகுதிகட்டுவான்.","PRO.13.4.4":"சோம்பேறியுடைய ஆத்துமா விரும்பியும் ஒன்றும் பெறாது: ஜாக்கிரதையுள்ளவர்களுடைய ஆத்துமாவோ புஷ்டியாகும்","PRO.13.20.20":"ஞானிகளோடே சஞ்சரிக்கிறவன் ஞானமடைவான்: மூடருக்குத் தோழனோ நாசமடைவான்.","PRO.14.26.26":"கர்த்தருக்குப் பயப்படுகிறவனுக்குத் திடநம்பிக்கை உண்டு: அவன் பிள்ளைகளுக்கும் அடைக்கலம் கிடைக்கும்.","PRO.15.22.22":"ஆலோசனையில்லாமையால் எண்ணங்கள் சித்தியாமற்போம்: ஆலோசனைக்காரர் அநேகர் இருந்தால் அவைகள் உறுதிப்படும்.","PRO.16.3.3":"உன் செய்கைகளைக் கர்த்தருக்கு ஒப்புவி: அப்பொழுது உன் யோசனைகள் உறுதிப்படும்.","PRO.16.7.7":"ஒருவனுடைய வழிகள் கர்த்தருக்குப் பிரியமாயிருந்தால், அவனுடைய சத்துருக்களும் அவனோடே சமாதானமாகும்படி செய்வார்.","PRO.16.9.9":"மனுஷருடைய இருதயம் அவனுடைய வழியை யோசிக்கும்: அவனுடைய நடைகளை உறுதிப்படுத்துகிறவரோ கர்த்தர்.","PRO.17.22.22":"மனமகிழ்ச்சி நல்ல ஔஷதம்: முறிந்த ஆவியோ எலும்புகளை உலரப்பண்ணும்.","PRO.18.10.10":"கர்த்தரின் நாமம் பலத்த துருகம்: நீதிமான் அதற்குள் ஓடிச் சுகமாயிருப்பான்.","PRO.19.20.20":"உன் அந்தியகாலத்தில் நீ ஞானமுள்ளவனாயிருக்கும்படி, ஆலோசனையைக்கேட்டு, புத்திமதியை ஏற்றுக்கொள்.","PRO.19.21.21":"மனுஷனுடைய இருதயத்தின் எண்ணங்கள் அநேகம்: ஆனாலும் கர்த்தருடைய யோசனையே நிலைநிற்கும்.","PRO.21.5.5":"ஜாக்கிரதையுள்ளவனுடைய நினைவுகள் செல்வத்துக்கும், பதறுகிறவனுடைய நினைவுகள் தரித்திரத்துக்கும் ஏதுவாகும்.","PRO.22.6.6":"பிள்ளையானவன் நடக்கவேண்டிய வழியிலே அவனை நடத்து: அவன் முதிர்வயதிலும் அதை விடாதிருப்பான்.","PRO.22.29.29":"தன் வேலையில் ஜாக்கிரதையாயிருக்கிறவனை நீ கண்டால், அவன் நீசருக்கு முன்பாக நில்லாமல், ராஜாக்களுக்கு முன்பாக நிற்பான். நீதிமொழிகள்","PRO.23.18.18":"நிச்சயமாகவே முடிவு உண்டு: உன் நம்பிக்கை வீண்போகாது.","PRO.24.3.4":"வீடு ஞானத்தினாலே கட்டப்பட்டு, விவேகத்தினாலே நிலைநிறுத்தப்படும். அறிவினாலே அறைகளில் அருமையும் இனிமையுமான சகலவிதப் பொருள்களும் நிறைந்திருக்கும்.","PRO.24.14.14":"அப்படியே ஞானத்தை அறிந்து கொள்வது உன் ஆத்துமாவுக்கு இன்பமாயிருக்கும்: அதைப் பெற்றுக்கொண்டால், அது முடிவில் உதவும், உன் நம்பிக்கை வீண்போகாது.","PRO.28.13.13":"தன் பாவங்களை மறைக்கிறவன் வாழ்வடையமாட்டான்: அவைகளை அறிக்கை செய்து விட்டுவிடுகிறவனோ இரக்கம் பெறுவான்.","PRO.29.25.25":"மனுஷனுக்குப் பயப்படும் பயம் கண்ணியை வருவிக்கும்: கர்த்தரை நம்புகிறவனோ உயர்ந்த அடைக்கலத்திலே வைக்கப்படுவான்.","PRO.31.25.25":"அவள் உடை பலமும் அலங்காரமுமாயிருக்கிறது: வருங்காலத்தைப்பற்றியும் மகிழுகிறாள்.","PRO.31.28.28":"அவள் பிள்ளைகள் எழும்பி, அவளைப் பாக்கியவதி என்கிறார்கள்: அவள் புருஷனும் அவளைப்பார்த்து","PSA.1.3.3":"அவன் நீர்க்கால்களின் ஓரமாய் நடப்பட்டு, தன் காலத்தில் தன் கனியைத் தந்து, இலையுதிராதிருக்கிற மரத்தைப் போலிருப்பான்: அவன் செய்வதெல்லாம் வாய்க்கும்.","PSA.3.5.5":"நான் படுத்து நித்திரை செய்தேன்: விழித்துக்கொண்டேன்: கர்த்தர் என்னைத் தாங்குகிறார்.","PSA.4.8.8":"சமாதானத்தோடே படுத்துக்கொண்டு நித்திரைசெய்வேன்: கர்த்தாவே, நீர் ஒருவரே என்னை சுகமாய்த் தங்கப்பண்ணுகிறீர். சங்கீதம்","PSA.5.11.12":"உம்மை நம்புகிறவர்கள் யாவரும் சந்தோஷித்து, எந்நாளும் கெம்பீரிப்பார்களாக: நீர் அவர்களைக் காப்பாற்றுவீர்: உம்முடைய நாமத்தை நேசிக்கிறவர்கள் உம்மில் களிகூருவார்களாக. கர்த்தாவே, நீர் நீதிமானை ஆசீர்வதித்து, காருணியம் என்னுங் கேடகத்தினால் அவனைச் சூழ்ந்துகொள்ளுவீர். சங்கீதம்","PSA.6.2.2":"என்மேல் இரக்கமாயிரும் கர்த்தாவே, நான் பெலனற்றுப்போனேன்: என்னைக் குணமாக்கும் கர்த்தாவே, என் எலும்புகள் நடுங்குகிறது.","PSA.10.17.17":"கர்த்தாவே, சிறுமைப்பட்டவர்களுடைய வேண்டுதலைக் கேட்டிருக்கிறீர்: அவர்கள் இருதயத்தை ஸ்திரப்படுத்துவீர்.","PSA.16.7.7":"எனக்கு ஆலோசனை தந்த கர்த்தரைத் துதிப்பேன்: இராக்காலங்களிலும் என் உள்ளிந்திரியங்கள் என்னை உணர்த்தும்.","PSA.16.11.11":"ஜீவமார்க்கத்தை எனக்குத் தெரியப்படுத்துவீர்: உம்முடைய சமுகத்தில் பரிபூரண ஆனந்தமும், உம்முடைய வலதுபாரிசத்தில் நித்தியபேரின்பமும் உண்டு. சங்கீதம்","PSA.18.2.2":"கர்த்தர் என் கன்மலையும், என் கோட்டையும், என் இரட்சகரும், என் தேவனும், நான் நம்பியிருக்கிற என் துருகமும், என் கேடகமும், என் இரட்சணியக் கொம்பும், என் உயர்ந்த அடைக்கலமுமாயிருக்கிறார்.","PSA.18.16.16":"உயரத்திலிருந்து அவர் கைநீட்டி, என்னைப் பிடித்து, ஜலப்பிரவாகத்திலிருக்கிற என்னைத் தூக்கிவிட்டார்.","PSA.18.32.32":"என்னைப் பலத்தால் இடைகட்டி, என் வழியைச் செவ்வைப்படுத்துகிறவர் தேவனே.","PSA.20.1.1":"ஆபத்துநாளிலே கர்த்தர் உமது ஜெபத்தைக் கேட்பாராக: யாக்கோபின் தேவனுடைய நாமம் உமக்கு உயர்ந்த அடைக்கலமாவதாக.","PSA.20.4.4":"அவர் உமது மனவிருப்பத்தின்படி உமக்குத் தந்தருளி, உமது ஆலோசனைகளையெல்லாம் நிறைவேற்றுவாராக.","PSA.23.1.1":"கர்த்தர் என் மேய்ப்பராயிருக்கிறார்: நான் தாழ்ச்சியடையேன்.","PSA.23.2.3":"அவர் என்னைப் புல்லுள்ள இடங்களில் மேய்த்து, அமர்ந்த தண்ணீர்கள் அண்டையில் என்னைக் கொண்டுபோய் விடுகிறார். அவர் என் ஆத்துமாவைத் தேற்றி, தம்முடைய நாமத்தினிமித்தம் என்னை நீதியின் பாதைகளில் நடத்துகிறார்.","PSA.23.4.4":"நான் மரண இருளின் பள்ளத்தாக்கிலே நடந்தாலும் பொல்லாப்புக்குப் பயப்படேன்: தேவரீர் என்னோடேகூட இருக்கிறீர்: உமது கோலும் உமது தடியும் என்னைத் தேற்றும்.","PSA.25.4.5":"கர்த்தாவே, உம்முடைய வழிகளை எனக்குத் தெரிவியும்: உம்முடைய பாதைகளை எனக்குப் போதித்தருளும். உம்முடைய சத்தியத்திலே என்னை நடத்தி, என்னைப் போதித்தருளும்: நீரே என் இரட்சிப்பின் தேவன், உம்மை நோக்கி நாள்முழுதும் காத்திருக்கிறேன்.","PSA.25.9.9":"சாந்தகுணமுள்ளவர்களை நியாயத்திலே நடத்தி, சாந்தகுணமுள்ளவர்களுக்குத் தமது வழியைப் போதிக்கிறார்.","PSA.27.1.1":"கர்த்தர் என் வெளிச்சமும் என் இரட்சிப்புமானவர், யாருக்குப் பயப்படுவேன்? கர்த்தர் என் ஜீவனின் பெலனானவர், யாருக்கு அஞ்சுவேன்?","PSA.27.5.5":"தீங்குநாளில் அவர் என்னைத் தம்முடைய கூடாரத்தில் மறைத்து, என்னைத் தமது கூடார மறைவிலே ஔித்துவைத்து, என்னைக் கன்மலையின்மேல் உயர்த்துவார்.","PSA.27.10.10":"என் தகப்பனும் என் தாயும் என்னைக் கைவிட்டாலும், கர்த்தர் என்னைச் சேர்த்துக்கொள்ளுவார்.","PSA.27.14.14":"கர்த்தருக்குக் காத்திரு: அவர் உன் இருதயத்தை ஸ்திரப்படுத்துவார்: திடமனதாயிருந்து, கர்த்தருக்கே காத்திரு. சங்கீதம்","PSA.28.7.7":"கர்த்தர் என் பெலனும் என் கேடகமுமாயிருக்கிறார்: என் இருதயம் அவரை நம்பியிருந்தது: நான் சகாயம் பெற்றேன்: ஆகையால் என் இருதயம் களிகூருகிறது: என் பாட்டினால் அவரைத் துதிப்பேன்.","PSA.29.11.11":"கர்த்தர் தமது ஜனத்திற்குப் பெலன்கொடுப்பார்: கர்த்தர் தமது ஜனத்திற்குச் சமாதானம் அருளி, அவர்களை ஆசீர்வதிப்பார். சங்கீதம்","PSA.30.2.2":"என் தேவனாகிய கர்த்தாவே, உம்மை நோக்கிக் கூப்பிட்டேன், என்னை நீர் குணமாக்கினீர்.","PSA.30.5.5":"அவருடைய கோபம் ஒரு நிமிஷம், அவருடைய தயவோ நீடிய வாழ்வு: சாயங்காலத்தில் அழுகை தங்கும், விடியற்காலத்திலே களிப்புண்டாகும்.","PSA.31.3.3":"என் கன்மலையும் என் கோட்டையும் நீரே: உமது நாமத்தினிமித்தம் எனக்கு வழிகாட்டி, என்னை நடத்தியருளும்.","PSA.31.15.15":"என் காலங்கள் உமது கரத்திலிருக்கிறது: என் சத்துருக்களின் கைக்கும் என்னைத் துன்பப்படுத்துகிறவர்களின் கைக்கும் என்னைத் தப்புவியும்.","PSA.31.24.24":"கர்த்தருக்குக் காத்திருக்கிறவர்களே, நீங்களெல்லாரும் திடமனதாயிருங்கள், அவர் உங்கள் இருதயத்தை ஸ்திரப்படுத்துவார். சங்கீதம்","PSA.32.1.2":"எவனுடைய மீறுதல் மன்னிக்கப்பட்டதோ, எவனுடைய பாவம் மூடப்பட்டதோ, அவன் பாக்கியவான். எவனுடைய அக்கிரமத்தைக் கர்த்தர் எண்ணாதிருக்கிறாரோ, எவனுடைய ஆவியில் கபடமில்லாதிருக்கிறதோ, அவன் பாக்கியவான்.","PSA.32.7.7":"நீர் எனக்கு மறைவிடமாயிருக்கிறீர்: என்னை நீர் இக்கட்டுக்கு விலக்கிக்காத்து, இரட்சணியப் பாடல்கள் என்னைச் சூழ்ந்துகொள்ளும்படி செய்வீர். (சேலா.)","PSA.32.8.8":"நான் உனக்குப் போதித்து, நீ நடக்கவேண்டிய வழியை உனக்குக் காட்டுவேன்: உன்மேல் என் கண்ணை வைத்து, உனக்கு ஆலோசனை சொல்லுவேன்.","PSA.33.11.11":"கர்த்தருடைய ஆலோசனை நித்தியகாலமாகவும், அவருடைய இருதயத்தின் நினைவுகள் தலைமுறை தலைமுறையாகவும் நிற்கும்.","PSA.33.18.18":"தமக்குப் பயந்து, தமது கிருபைக்குக் காத்திருக்கிறவர்களின் ஆத்துமாக்களை மரணத்திற்கு விலக்கிவிடுவிக்கவும்:","PSA.34.4.4":"நான் கர்த்தரைத் தேடினேன், அவர் எனக்குச் செவிகொடுத்து, என்னுடைய எல்லாப் பயத்துக்கும் என்னை நீங்கலாக்கிவிட்டார்.","PSA.34.7.7":"கர்த்தருடைய தூதன் அவருக்குப் பயந்தவர்களைச் சூழப் பாளயமிறங்கி அவர்களை விடுவிக்கிறார்.","PSA.34.10.10":"சிங்கக்குட்டிகள் தாழ்ச்சியடைந்து பட்டினியாயிருக்கும்: கர்த்தரைத் தேடுகிறவர்களுக்கோ ஒரு நன்மையுங் குறைவுபடாது.","PSA.34.17.19":"நீதிமான்கள் கூப்பிடும்போது கர்த்தர் கேட்டு, அவர்களை அவர்களுடைய எல்லா உபத்திரவங்களுக்கும் நீங்கலாக்கிவிடுகிறார். நொறுங்குண்ட இருதயமுள்ளவர்களுக்குக் கர்த்தர் சமீபமாயிருந்து, நருங்குண்ட ஆவியுள்ளவர்களை இரட்சிக்கிறார். நீதிமானுக்கு வரும் துன்பங்கள் அநேகமாயிருக்கும், கர்த்தர் அவைகளெல்லாவற்றிலும் நின்று அவனை விடுவிப்பார்.","PSA.34.18.18":"நொறுங்குண்ட இருதயமுள்ளவர்களுக்குக் கர்த்தர் சமீபமாயிருந்து, நருங்குண்ட ஆவியுள்ளவர்களை இரட்சிக்கிறார்.","PSA.36.7.7":"தேவனே, உம்முடைய கிருபை எவ்வளவு அருமையானது! அதினால் மனுபுத்திரர் உமது செட்டைகளின் நிழலிலே வந்தடைகிறார்கள்.","PSA.37.4.4":"கர்த்தரிடத்தில் மனமகிழ்ச்சியாயிரு: அவர் உன் இருதயத்தின் வேண்டுதல்களை உனக்கு அருள்செய்வார்.","PSA.37.5.5":"உன் வழியைக் கர்த்தருக்கு ஒப்புவித்து, அவர்மேல் நம்பிக்கையாயிரு: அவரே காரியத்தை வாய்க்கப்பண்ணுவார்.","PSA.37.11.11":"சாந்தகுணமுள்ளவர்கள் பூமியைச் சுதந்தரித்து, மிகுந்த சமாதானத்தினால் மனமகிழ்ச்சியாயிருப்பார்கள்.","PSA.37.23.24":"நல்ல மனுஷனுடைய நடைகள் கர்த்தரால் உறுதிப்படும், அவனுடைய வழியின்மேல் அவர் பிரியமாயிருக்கிறார். அவன் விழுந்தாலும் தள்ளுண்டு போவதில்லை: கர்த்தர் தமது கையினால் அவனைத் தாங்குகிறார்.","PSA.37.25.25":"நான் இளைஞனாயிருந்தேன், முதிர்வயதுள்ளவனுமானேன்: ஆனாலும் நீதிமான் கைவிடப்பட்டதையும், அவன் சந்ததி அப்பத்துக்கு இரந்து திரிகிறதையும் நான் காணவில்லை.","PSA.37.26.26":"அவன் நித்தம் இரங்கிக் கடன் கொடுக்கிறான், அவன் சந்ததி ஆசீர்வதிக்கப்படும்.","PSA.37.37.37":"நீ உத்தமனை நோக்கி, செம்மையானவனைப் பார்த்திரு: அந்த மனுஷனுடைய முடிவு சமாதானம்.","PSA.39.7.7":"இப்போதும் ஆண்டவரே, நான் எதற்கு எதிர்பார்த்திருக்கிறேன்? நீரே என் நம்பிக்கை.","PSA.41.3.3":"படுக்கையின்மேல் வியாதியாய்க்கிடக்கிற அவனைக் கர்த்தர் தாங்குவார்: அவனுடைய வியாதியிலே அவன் படுக்கை முழுவதையும் மாற்றிப்போடுவீர்.","PSA.42.11.11":"என் ஆத்துமாவே, நீ ஏன் கலங்குகிறாய்? ஏன் எனக்குள் தியங்குகிறாய்? தேவனை நோக்கிக் காத்திரு: என் முகத்திற்கு இரட்சிப்பும் என் தேவனுமாயிருக்கிறவரை நான் இன்னும் துதிப்பேன். சங்கீதம்","PSA.46.1.1":"தேவன் நமக்கு அடைக்கலமும் பெலனும், ஆபத்துக்காலத்தில் அநுகூலமான துணையுமானவர்.","PSA.46.1.3":"தேவன் நமக்கு அடைக்கலமும் பெலனும், ஆபத்துக்காலத்தில் அநுகூலமான துணையுமானவர். ஆகையால் பூமி நிலைமாறினாலும், மலைகள் நடுச்சமுத்திரத்தில் சாய்ந்து போனாலும், அதின் ஜலங்கள் கொந்தளித்துப் பொங்கி, அதின் பெருக்கினால் பர்வதங்கள் அதிர்ந்தாலும், நாம் பயப்படோம். (சேலா.)","PSA.46.7.7":"சேனைகளின் கர்த்தர் நம்மோடிருக்கிறார்: யாக்கோபின் தேவன் நமக்கு உயர்ந்த அடைக்கலமானவர். (சேலா.)","PSA.48.14.14":"இந்தத் தேவன் என்றென்றைக்குமுள்ள சதாகாலங்களிலும் நம்முடைய தேவன்: மரணபரியந்தம் நம்மை நடத்துவார். சங்கீதம்","PSA.50.15.15":"ஆபத்துக்காலத்தில் என்னை நோக்கிக் கூப்பிடு: நான் உன்னை விடுவிப்பேன், நீ என்னை மகிமைப்படுத்துவாய்.","PSA.51.10.10":"தேவனே, சுத்த இருதயத்தை என்னிலே சிருஷ்டியும், நிலைவரமான ஆவியை என் உள்ளத்திலே புதுப்பியும்.","PSA.55.22.22":"கர்த்தர்மேல் உன் பாரத்தை வைத்துவிடு, அவர் உன்னை ஆதரிப்பார், நீதிமானை ஒருபோதும் தள்ளாடவொட்டார்.","PSA.56.3.3":"நான் பயப்படுகிற நாளில் உம்மை நம்புவேன்.","PSA.59.16.16":"நானோ உம்முடைய வல்லமையைப் பாடி, காலையிலே உம்முடைய கிருபையை மகிழ்ச்சியோடு புகழுவேன்: எனக்கு நெருக்கமுண்டான நாளிலே நீர் எனக்குத் தஞ்சமும் உயர்ந்த அடைக்கலமுமானீர்.","PSA.61.3.3":"நீர் எனக்கு அடைக்கலமும்: சத்துருவுக்கு எதிரே பெலத்த துருகமுமாயிருந்தீர்.","PSA.62.5.5":"என் ஆத்துமாவே, தேவனையே நோக்கி அமர்ந்திரு: நான் நம்புகிறது அவராலே வரும்.","PSA.63.3.3":"ஜீவனைப்பார்க்கிலும் உமது கிருபை நல்லது: என் உதடுகள் உம்மைத் துதிக்கும்.","PSA.68.5.6":"தம்முடைய பரிசுத்த வாசஸ்தலத்திலிருக்கிற தேவன், திக்கற்ற பிள்ளைகளுக்குத் தகப்பனும், விதவைகளுக்கு நியாயம் விசாரிக்கிறவருமாயிருக்கிறார். தேவன் தனிமையானவர்களுக்கு வீடுவாசல் ஏற்படுத்தி, கட்டுண்டவர்களை விடுதலையாக்குகிறார்: துரோகிகளோ வறண்ட பூமியில் தங்குவார்கள்.","PSA.71.14.14":"நானோ எப்பொழுதும் நம்பிக்கைகொண்டிருந்து, மேன்மேலும் உம்மைத் துதிப்பேன்.","PSA.73.23.23":"ஆனாலும் நான் எப்பொழுதும் உம்மோடிருக்கிறேன்: என் வலதுகையைப் பிடித்துத் தாங்குகிறீர்.","PSA.73.24.24":"உம்முடைய ஆலோசனையின்படி நீர் என்னை நடத்தி, முடிவிலே என்னை மகிமையில் ஏற்றுக்கொள்வீர்.","PSA.73.26.26":"என் மாம்சமும் என் இருதயமும் மாண்டுபோகிறது: தேவன் என்றென்றைக்கும் என் இருதயத்தின் கன்மலையும் என் பங்குமாயிருக்கிறார்.","PSA.78.4.4":"பின்வரும் சந்ததியான பிள்ளைகளுக்கு நாங்கள் அவைகளை மறைக்காமல், கர்த்தரின் துதிகளையும் அவருடைய பலத்தையும், அவர் செய்த அவருடைய அதிசயங்களையும் விவரிப்போம்.","PSA.81.10.10":"உன்னை எகிப்துதேசத்திலிருந்து புறப்படப்பண்ணின உன் தேவனாகிய கர்த்தர் நானே: உன் வாயை விரிவாய்த்திற, நான் அதை நிரப்புவேன்.","PSA.84.5.5":"உம்மிலே பெலன்கொள்ளுகிறமனுஷனும், தங்கள் இருதயங்களில் செவ்வையான வழிகளைக் கொண்டிருக்கிறவர்களும் பாக்கியவான்கள்.","PSA.84.11.11":"தேவனாகிய கர்த்தர் சூரியனும் கேடகமுமானவர்: கர்த்தர் கிருபையையும் மகிமையையும் அருளுவார்: உத்தமமாய் நடக்கிறவர்களுக்கு நன்மையை வழங்காதிரார்.","PSA.85.8.8":"கர்த்தராகிய தேவன் விளம்புவதைக் கேட்பேன்: அவர் தம்முடைய ஜனங்களுக்கும் தம்முடைய பரிசுத்தவான்களுக்கும் சமாதானம் கூறுவார்: அவர்களோ மதிகேட்டுக்குத் திரும்பாதிருப்பார்களாக.","PSA.86.15.15":"ஆனாலும் ஆண்டவரே, நீர் மனவுருக்கமும், இரக்கமும், நீடிய பொறுமையும், பூரண கிருபையும், சத்தியமுமுள்ள தேவன்.","PSA.90.17.17":"எங்கள் தேவனாகிய ஆண்டவரின் பிரியம் எங்கள்மேல் இருப்பதாக: எங்கள் கைகளின் கிரியையை எங்களிடத்தில் உறுதிப்படுத்தும்: ஆம், எங்கள் கைகளின் கிரியையை எங்களிடத்தில் உறுதிப்படுத்தியருளும். சங்கீதம்","PSA.91.1.2":"உன்னதமானவரின் மறைவிலிருக்கிறவன் சர்வவல்லவருடைய நிழலில் தங்குவான். நான் கர்த்தரை நோக்கி நீர் என் அடைக்கலம், என் கோட்டை, என் தேவன், நான் நம்பியிருக்கிறவர் என்று சொல்லுவேன்.","PSA.91.3.4":"அவர் உன்னை வேடனுடைய கண்ணிக்கும், பாழாக்கும் கொள்ளைநோய்க்கும் தப்புவிப்பார். அவர் தமது சிறகுகளாலே உன்னை மூடுவார்: அவர் செட்டைகளின் கீழே அடைக்கலம் புகுவாய்: அவருடைய சத்தியம் உனக்குப் பரிசையும் கேடகமுமாகும்.","PSA.91.7.7":"உன் பக்கத்தில் ஆயிரம்பேரும், உன் வலதுபுறத்தில் பதினாயிரம்பேரும் விழுந்தாலும், அது உன்னை அணுகாது.","PSA.91.9.11":"எனக்கு அடைக்கலமாயிருக்கிற உன்னதமான கர்த்தரை உனக்குத் தாபரமாகக்கொண்டாய். ஆகையால் பொல்லாப்பு உனக்கு நேரிடாது, வாதை உன் கூடாரத்தை அணுகாது. உன் வழிகளிலெல்லாம் உன்னைக் காக்கும்படி, உனக்காகத் தம்முடைய தூதர்களுக்குக் கட்டளையிடுவார்.","PSA.91.14.16":"அவன் என்னிடத்தில் வாஞ்சையாயிருக்கிறபடியால் அவனை விடுவிப்பேன்: என் நாமத்தை அவன் அறிந்திருக்கிறபடியால் அவனை உயர்ந்த அடைக்கலத்திலே வைப்பேன். அவன் என்னை நோக்கிக் கூப்பிடுவான், நான் அவனுக்கு மறுஉத்தரவு அருளிச்செய்வேன்: ஆபத்தில் நானே அவனோடிருந்து, அவனைத் தப்புவித்து, அவனைக் கனப்படுத்துவேன். நீடித்த நாட்களால் அவனைத் திருப்தியாக்கி, என் இரட்சிப்பை அவனுக்குக் காண்பிப்பேன். சங்கீதம்","PSA.94.19.19":"என் உள்ளத்தில் விசாரங்கள் பெருகுகையில், உம்முடைய ஆறுதல்கள் என் ஆத்துமாவைத் தேற்றுகிறது.","PSA.103.2.3":"என் ஆத்துமாவே, கர்த்தரை ஸ்தோத்திரி: அவர் செய்த சகல உபகாரங்களையும் மறவாதே. அவர் உன் அக்கிரமங்களையெல்லாம் மன்னித்து, உன் நோய்களையெல்லாம் குணமாக்கி,","PSA.103.8.10":"கர்த்தர் உருக்கமும், இரக்கமும், நீடிய சாந்தமும், மிகுந்த கிருபையுமுள்ளவர். அவர் எப்பொழுதும் கடிந்துகொள்ளார்: என்றைக்கும் கோபங்கொண்டிரார். அவர் நம்முடைய பாவங்களுக்குத்தக்கதாக நமக்குச் செய்யாமலும், நம்முடைய அக்கிரமங்களுக்குத் தக்கதாக நமக்குச் சரிக்கட்டாமலும் இருக்கிறார்.","PSA.103.11.11":"பூமிக்கு வானம் எவ்வளவு உயரமாயிருக்கிறதோ, அவருக்குப் பயப்படுகிறவர்கள்மேல் அவருடைய கிருபையும் அவ்வளவு பெரிதாயிருக்கிறது.","PSA.103.12.12":"மேற்குக்கும் கிழக்குக்கும் எவ்வளவு தூரமோ, அவ்வளவு தூரமாய் அவர் நம்முடைய பாவங்களை நம்மை விட்டு விலக்கினார்.","PSA.103.17.17":"கர்த்தருடைய கிருபையோ அவருக்குப் பயந்தவர்கள்மேலும், அவருடைய நீதி அவர்கள் பிள்ளைகளுடைய பிள்ளைகள்மேலும் அநாதியாய் என்றென்றைக்கும் உள்ளது.","PSA.103.17.18":"கர்த்தருடைய கிருபையோ அவருக்குப் பயந்தவர்கள்மேலும், அவருடைய நீதி அவர்கள் பிள்ளைகளுடைய பிள்ளைகள்மேலும் அநாதியாய் என்றென்றைக்கும் உள்ளது. அவருடைய உடன்படிக்கையைக்கைக்கொண்டு, அவருடைய கட்டளைகளின்படி செய்ய நினைக்கிறவர்கள் மேலேயே உள்ளது.","PSA.107.8.8":"தவனமுள்ள ஆத்துமாவைக் கர்த்தர் திருப்தியாக்கி, பசியுள்ள ஆத்துமாவை நன்மையினால் நிரப்புகிறாரென்று,","PSA.107.9.9":"அவருடைய கிருபையினிமித்தமும், மனுபுத்திரருக்கு அவர் செய்கிற அதிசயங்களினிமித்தமும் அவரைத் துதிப்பார்களாக.","PSA.107.20.20":"அவர் தமது வசனத்தை அனுப்பி அவர்களைக் குணமாக்கி, அவர்களை அழிவுக்குத் தப்புவிக்கிறார்.","PSA.111.10.10":"கர்த்தருக்குப் பயப்படுதலே ஞானத்தின் ஆரம்பம்: அவருடைய கற்பனைகளின்படி செய்கிற யாவருக்கும் நற்புத்தியுண்டு: அவர் புகழ்ச்சி என்றைக்கும் நிற்கும். சங்கீதம்","PSA.112.1.2":"அல்லேலூயா, கர்த்தருக்குப் பயந்து, அவருடைய கட்டளைகளில் மிகவும் பிரியமாயிருக்கிற மனுஷன் பாக்கியவான். அவன் சந்ததிபூமியில் பலத்திருக்கும், செம்மையானவர்களின் வம்சம் ஆசீர்வதிக்கப்படும்.","PSA.112.7.7":"துர்ச்செய்தியைக் கேட்கிறதினால் பயப்படான்: அவன் இருதயம் கர்த்தரை நம்பித் திடனாயிருக்கும்.","PSA.118.6.6":"கர்த்தர் என் பட்சத்தில் இருக்கிறார், நான் பயப்படேன்: மனுஷன் எனக்கு என்னசெய்வான்?","PSA.118.25.25":"கர்த்தாவே, இரட்சியும்: கர்த்தாவே, காரியத்தை வாய்க்கப்பண்ணும்.","PSA.121.2.2":"வானத்தையும் பூமியையும் உண்டாக்கின கர்த்தரிடத்திலிருந்து எனக்கு ஒத்தாசை வரும்.","PSA.121.3.3":"உன் காலைத் தள்ளாடவொட்டார்: உன்னைக் காக்கிறவர் உறங்கார்.","PSA.121.5.5":"கர்த்தர் உன்னைக் காக்கிறவர்: கர்த்தர் உன் வலதுபக்கத்திலே உனக்கு நிழலாயிருக்கிறார்.","PSA.121.7.8":"கர்த்தர் உன்னை எல்லாத் தீங்குக்கும் விலக்கிக் காப்பார்: அவர் உன் ஆத்துமாவைக் காப்பார். கர்த்தர் உன் போக்கையும் உன்வரத்தையும் இதுமுதற்கொண்டு என்றைக்குங் காப்பார். சங்கீதம்","PSA.125.2.2":"பர்வதங்கள் எருசலேமைச் சுற்றிலும் இருக்குமாப்போல், கர்த்தர் இதுமுதல் என்றென்றைக்கும் தம்முடைய ஜனத்தைச் சுற்றிலும் இருக்கிறார்.","PSA.126.5.5":"கண்ணீரோடே விதைக்கிறவர்கள் கெம்பீரத்தோடே அறுப்பார்கள்.","PSA.127.1.1":"கர்த்தர் வீட்டைக் கட்டாராகில், அதைக் கட்டுகிறவர்களின் பிரயாசம் விருதா: கர்த்தர் நகரத்தைக் காவாராகில் காவலாளர் விழித்திருக்கிறது விருதா.","PSA.127.3.3":"இதோ, பிள்ளைகள் கர்த்தரால் வரும் சுதந்தரம், கர்ப்பத்தின் கனி அவரால் கிடைக்கும் பலன்.","PSA.128.1.4":"கர்த்தருக்குப் பயந்து, அவர் வழிகளில் நடக்கிறவன் எவனோ, அவன் பாக்கியவான். உன் கைகளின் பிரயாசத்தை நீ சாப்பிடுவாய்: உனக்குப் பாக்கியமும் நன்மையும் உண்டாயிருக்கும். உன் மனைவி உன் வீட்டோரங்களில் கனிதரும் திராட்சக்கொடியைப்போல் இருப்பாள்: உன் பிள்ளைகள் உன் பந்தியைச் சுற்றிலும் ஒலிவமரக் கன்றுகளைப்போல் இருப்பார்கள். இதோ, கர்த்தருக்குப் பயப்படுகிற மனுஷன் இவ்விதமாய் ஆசீர்வதிக்கப்படுவான்.","PSA.130.3.4":"கர்த்தாவே, நீர் அக்கிரமங்களைக் கவனித்திருப்பீரானால், யார் நிலைநிற்பான், ஆண்டவரே. உமக்குப் பயப்படும்படிக்கு உம்மிடத்தில் மன்னிப்பு உண்டு.","PSA.130.5.5":"கர்த்தருக்குக் காத்திருக்கிறேன்: என் ஆத்துமா காத்திருக்கிறது: அவருடைய வார்த்தையை நம்பியிருக்கிறேன்.","PSA.133.1.1":"இதோ, சகோதரர் ஒருமித்து வாசம்பண்ணுகிறது எத்தனை நன்மையும் எத்தனை இன்பமுமானது?","PSA.136.1.1":"கர்த்தரைத் துதியுங்கள்: அவர் நல்லவர், அவர் கிருபை என்றுமுள்ளது.","PSA.138.3.3":"நான் கூப்பிட்ட நாளிலே எனக்கு மறுஉத்தரவு அருளினீர்: என் ஆத்துமாவிலே பெலன்தந்து என்னைத் தைரியப்படுத்தினீர்:","PSA.138.7.7":"நான் துன்பத்தின் நடுவில் நடந்தாலும் நீர் என்னை உயிர்ப்பிப்பீர்: என் சத்துருக்களின் கோபத்துக்கு விரோதமாக உமது கையை நீட்டுவீர்: உமது வலதுகரம் என்னை இரட்சிக்கும்.","PSA.138.8.8":"கர்த்தர் எனக்காக யாவையும் செய்து முடிப்பார்: கர்த்தாவே, உமது கிருபை என்றுமுள்ளது: உமது கரத்தின் கிரியைகளை நெகிழவிடாதிருப்பீராக. சங்கீதம்","PSA.139.7.10":"உம்முடைய ஆவிக்கு மறைவாக எங்கே போவேன்? உம்முடைய சமுகத்தைவிட்டு எங்கே ஓடுவேன்? நான் வானத்திற்கு ஏறினாலும், நீர் அங்கே இருக்கிறீர்: நான் பாதாளத்தில் படுக்கை போட்டாலும், நீர் அங்கேயும் இருக்கிறீர். நான் விடியற்காலத்துச் செட்டைகளை எடுத்து, சமுத்திரத்தின் கடையாந்தரங்களிலே போய்த் தங்கினாலும், அங்கேயும் உமது கை என்னை நடத்தும், உமது வலதுகரம் என்னைப் பிடிக்கும்.","PSA.142.3.3":"என் ஆவி என்னில் தியங்கும்போது, நீர் என் பாதையை அறிந்திருக்கிறீர்: நான் நடக்கிற வழியில் மறைவாக எனக்குக் கண்ணிவைத்தார்கள்.","PSA.143.8.8":"அதிகாலையில் உமது கிருபையைக் கேட்கப்பண்ணும், உம்மை நம்பியிருக்கிறேன், நான் நடக்கவேண்டிய வழியை எனக்குக் காண்பியும்: உம்மிடத்தில் என் ஆத்துமாவை உயர்த்துகிறேன்.","PSA.143.10.10":"உமக்குப் பிரியமானதைச் செய்ய எனக்குப் போதித்தருளும், நீரே என் தேவன்: உம்முடைய நல்ல ஆவி என்னைச் செம்மையான வழியிலே நடத்துவாராக.","PSA.145.15.16":"எல்லா ஜீவன்களின் கண்களும் உம்மை நோக்கிக்கொண்டிருக்கிறது: ஏற்ற வேளையிலே நீர் அவைகளுக்கு ஆகாரங்கொடுக்கிறீர். நீர் உமது கையைத் திறந்து, சகல பிராணிகளின் வாஞ்சையையும் திருப்தியாக்குகிறீர்.","PSA.145.18.18":"தம்மை நோக்கிக் கூப்பிடுகிற யாவருக்கும், உண்மையாய்த் தம்மை நோக்கிக் கூப்பிடுகிற யாவருக்கும், கர்த்தர் சமீபமாயிருக்கிறார்.","PSA.147.3.3":"இருதயம் நொறுங்குண்டவர்களைக் குணமாக்குகிறார், அவர்களுடைய காயங்களைக் கட்டுகிறார்.","REV.7.17.17":"சிங்காசனத்தின் மத்தியிலிருக்கிற ஆட்டுக்குட்டியானவரே இவர்களை மேய்த்து, இவர்களை ஜீவத்தண்ணீருள்ள ஊற்றுகளண்டைக்கு நடத்துவார்: தேவன்தாமே இவர்களுடைய கண்ணீர்யாவையும் துடைப்பார் என்றான். வெளி","REV.21.4.4":"அவர்களுடைய கண்ணீர் யாவையும் தேவன் துடைப்பார்: இனி மரணமுமில்லை, துக்கமுமில்லை, அலறுதலுமில்லை, வருத்தமுமில்லை, முந்தினவைகள் ஒழிந்துபோயின என்று விளம்பினது.","REV.21.5.5":"சிங்காசனத்தின்மேல் வீற்றிருந்தவர் இதோ, நான் சகலத்தையும் புதிதாக்குகிறேன் என்றார். பின்னும், அவர் இந்த வசனங்கள் சத்தியமும் உண்மையுமானவைகள், இவைகளை எழுது என்றார்.","ROM.1.17.17":"விசுவாசத்தினாலே நீதிமான் பிழைப்பான் என்று எழுதியிருக்கிறபடி, விசுவாசத்தினால் உண்டாகும் தேவநீதி விசுவாசத்திற்கென்று அந்தச் சுவிசேஷத்தினால் வெளிப்படுத்தப்படுகிறது.","ROM.4.7.8":"எவர்களுடைய அக்கிரமங்கள் மன்னிக்கப்பட்டதோ, எவர்களுடைய பாவங்கள் மூடப்பட்டதோ, அவர்கள் பாக்கியவான்கள். எவனுடைய பாவத்தைக் கர்த்தர் எண்ணாதிருக்கிறாரோ, அவன் பாக்கியவான் என்று தாவீது சொல்லியிருக்கிறான்.","ROM.4.20.21":"தேவனுடைய வாக்குத்தத்தத்தைக்குறித்து அவன் அவிசுவாசமாய்ச் சந்தேகப்படாமல், தேவன் வாக்குத்தத்தம்பண்ணினதை நிறைவேற்ற வல்லவராயிருக்கிறாரென்று முழு நிச்சயமாய் நம்பி, தேவனைமகிமைப்படுத்தி, விசுவாசத்தில் வல்லவனானான்.","ROM.5.1.1":"இவ்விதமாக, நாம் விசுவாசத்தினாலே நீதிமான்களாக்கப்பட்டிருக்கிறபடியால், நம்முடைய கர்த்தராகிய இயேசுகிறிஸ்துமூலமாய் தேவனிடத்தில் சமாதானம் பெற்றிருக்கிறோம்.","ROM.5.3.5":"அதுமாத்திரமல்ல, உபத்திரவம் பொறுமையையும், பொறுமை பரீட்சையையும், பரீட்சை நம்பிக்கையையும, உண்டாக்குகிறதென்று நாங்கள் அறிந்து, உபத்திரவங்களிலேயும் மேன்மை பாராட்டுகிறோம். மேலும் நமக்கு அருளப்பட்ட பரிசுத்தஆவியினாலே தேவஅன்பு நம்முடைய இருதயங்களில் ஊற்றப்பட்டிருக்கிறபடியால், அந்த நம்பிக்கை நம்மை வெட்கப்படுத்தாது.","ROM.5.8.8":"நாம் பாவிகளாயிருக்கையில் கிறிஸ்து நமக்காக மரித்ததினாலே, தேவன் நம்மேல்வைத்த தமது அன்பை விளங்கப்பண்ணுகிறார்.","ROM.8.1.1":"ஆனபடியால், கிறிஸ்து இயேசுவுக்குட்பட்டவர்களாயிருந்து, மாம்சத்தின்படி நடவாமல் ஆவியின்படியே நடக்கிறவர்களுக்கு ஆக்கினைத்தீர்ப்பில்லை.","ROM.8.6.6":"மாம்சசிந்தை மரணம் ஆவியின் சிந்தையோ ஜீவனும் சமாதானமுமாம்.","ROM.8.14.14":"மேலும் எவர்கள் தேவனுடைய ஆவியினாலே நடத்தப்படுகிறார்களோ, அவர்கள் தேவனுடைய புத்திரராயிருக்கிறார்கள்.","ROM.8.18.18":"ஆதலால் இக்காலத்துப் பாடுகள் இனி நம்மிடத்தில் வெளிப்படும் மகிமைக்கு ஒப்பிடத்தக்கவைகள் அல்லவென்று எண்ணுகிறேன்.","ROM.8.24.25":"அந்த நம்பிக்கையினாலே நாம் இரட்சிக்கப்பட்டிருக்கிறோம். காணப்படுகிறதை நம்புகிறது நம்பிக்கையல்ல: ஒருவன் தான் காண்கிறதை நம்பவேண்டுவதென்ன? நாம் காணாததை நம்பினோமாகில், அது வருகிறதற்குப் பொறுமையோடே காத்திருப்போம்.","ROM.8.28.28":"அன்றியும், அவருடைய தீர்மானத்தின்படி அழைக்கப்பட்டவர்களாய்த்தேவனிடத்தில் அன்புகூருகிறவர்களுக்குச் சகலமும் நன்மைக்கு ஏதுவாக நடக்கிறதென்று அறிந்திருக்கிறோம்.","ROM.8.32.32":"தம்முடைய சொந்தக்குமாரனென்றும் பாராமல் நம்மெல்லாருக்காகவும் அவரை ஒப்புக்கொடுத்தவர், அவரோடேகூட மற்ற எல்லாவற்றையும் நமக்கு அருளாதிருப்பதெப்படி?","ROM.8.35.35":"உமதுநிமித்தம் எந்நேரமும் கொல்லப்படுகிறோம், அடிக்கப்படும் ஆடுகளைப்போல எண்ணப்படுகிறோம் என்று எழுதியிருக்கிறபடி நேரிட்டாலும்,","ROM.8.38.39":"மரணமானாலும், ஜீவனானாலும், தேவதூதர்களானாலும், அதிகாரங்களானாலும், வல்லமைகளானாலும், நிகழ்காரியங்களானாலும், வருங்காரியங்களானாலும், உயர்வானாலும், தாழ்வானாலும், வேறொந்தச் சிருஷ்டியானாலும் நம்முடைய கர்த்தராகிய கிறிஸ்து இயேசுவிலுள்ள தேவனுடைய அன்பைவிட்டு நம்மைப் பிரிக்கமாட்டாதென்று நிச்சயித்திருக்கிறேன். ரோமர்","ROM.10.17.17":"ஆதலால் விசுவாசம் கேள்வியினாலேவரும், கேள்வி தேவனுடைய வசனத்தினாலே வரும்.","ROM.12.12.12":"நம்பிக்கையிலே சந்தோஷமாயிருங்கள்: உபத்திரவத்திலே பொறுமையாயிருங்கள்: ஜெபத்திலே உறுதியாய்த்தரித்திருங்கள்.","ROM.15.13.13":"பரிசுத்தஆவியின் பலத்தினாலே உங்களுக்கு நம்பிக்கை பெருகும்படிக்கு, நம்பிக்கையின் தேவன் விசுவாசத்தினால் உண்டாகும் எல்லாவித சந்தோஷத்தினாலும் சமாதானத்தினாலும் உங்களை நிரப்புவாராக.","TIT.2.13.13":"நாம் நம்பியிருக்கிற ஆனந்த பாக்கியத்துக்கும், மகா தேவனும் நமது இரட்சகருமாகிய இயேசுகிறிஸ்துவினுடைய மகிமையின் பிரசன்னமாகுதலுக்கும் எதிர்பார்த்துக்கொண்டிருக்கும்படி நமக்குப்போதிக்கிறது.","TIT.3.4.5":"நம்முடைய இரட்சகராகிய தேவனுடைய தயையும் மனுஷர்மேலுள்ள அன்பும் பிரசன்னமானபோது, நாம் செய்த நீதியின் கிரியைகளினிமித்தம் அவர் நம்மை இரட்சியாமல், தமது இரக்கத்தின்படியே, மறுஜென்ம முழுக்கினாலும், பரிசுத்த ஆவியினுடைய புதிதாக்குதலினாலும் நம்மை இரட்சித்தார்.","ZEC.4.6.6":"அப்பொழுது அவர் செருபாபேலுக்குச் சொல்லப்படுகிற கர்த்தருடைய வார்த்தை என்னவென்றால், பலத்தினாலும் அல்ல, பராக்கிரமத்தினாலும் அல்ல, என்னுடைய ஆவியினாலேயே ஆகும் என்று சேனைகளின் கர்த்தர் சொல்லுகிறார்.","ZEC.9.12.12":"நம்பிக்கையுடைய சிறைகளே, அரணுக்குத் திரும்புங்கள். இரட்டிப்பான நன்மையைத் தருவேன், இன்றைக்கே தருவேன்.","ZEP.3.17.17":"உன் தேவனாகிய கர்த்தர் உன் நடுவில் இருக்கிறார். அவர் வல்லமையுள்ளவர். அவர் இரட்சிப்பார். அவர் உன்பேரில் சந்தோஷமாய் மகிழ்ந்து, தம்முடைய அன்பினிமித்தம் அமர்ந்திருப்பார். அவர் உன்பேரில் கெம்பீரமாய்க் களிகூருவார்.","DEU.1.21.21":"இதோ, உன் தேவனாகிய கர்த்தர் அந்த தேசத்தை உனக்கு முன்பாக வைத்திருக்கிறார், உன் பிதாக்களுடைய தேவனாகிய கர்த்தர் உனக்குச் சொன்னபடியே, நீ போய் அதைச் சுதந்தரித்துக்கொள், பயப்படாமலும் கலங்காமலும் இரு என்றேன்.","DEU.3.22.22":"அவர்களுக்குப் பயப்படீர்களாக, உங்கள் தேவனாகிய கர்த்தர் தாமே உங்களுக்காக யுத்தம்பண்ணுவார் என்று சொன்னேன்.","DEU.31.8.8":"கர்த்தர்தாமே உனக்கு முன்பாகப் போகிறவர், அவர் உன்னோடே இருப்பார், அவர் உன்னை விட்டு விலகுவதுமில்லை, உன்னைக் கைவிடுவதுமில்லை, நீ பயப்படவும் கலங்கவும் வேண்டாம் என்றான்.","JOS.8.1.1":"அப்பொழுது கர்த்தர் யோசுவாவை நோக்கி நீ பயப்படாமலும் கலங்காமலும் இரு. நீ யுத்த ஜனங்கள் யாவரையும் கூட்டிக்கொண்டு எழுந்து, ஆயிபட்டணத்தின்மேல் போ, இதோ, ஆயியின் ராஜாவையும் அவன் ஜனத்தையும் அவன் பட்டணத்தையும் அவன் ந
